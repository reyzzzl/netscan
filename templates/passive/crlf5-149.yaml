id: crlf5-149
name: 'CRLF into next'
severity: medium
type: active
tags:
  - crlf
  - injection
  - headers
description: 'CRLF header injection via next'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      next:
        - 'y%0d%0aLocation: /'
    matchers:
      - type: word
        part: headers
        words:
          - 'x-test'
