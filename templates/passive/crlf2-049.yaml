id: crlf2-049
name: 'CRLF2 injection via msg'
severity: medium
type: active
tags:
  - crlf
  - injection
  - headers
description: 'CRLF header injection via msg'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      msg:
        - '%0d%0aX-Test: crlf2'
    matchers:
      - type: word
        part: headers
        words:
          - 'x-test'
