id: crlf2-011
name: 'CRLF2 injection via comment'
severity: medium
type: active
tags:
  - crlf
  - injection
  - headers
description: 'CRLF header injection via comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - 'x%0d%0aX-Test: crlf2'
    matchers:
      - type: word
        part: headers
        words:
          - 'x-test'
