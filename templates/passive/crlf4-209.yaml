id: crlf4-209
name: 'CRLF into next'
severity: medium
type: active
tags:
  - crlf
  - injection
  - headers
description: 'CRLF header injection via next'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      next:
        - '%0d%00%0aX-Test: t'
    matchers:
      - type: word
        part: headers
        words:
          - 'x-test'
