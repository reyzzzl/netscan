id: crlf5-261
name: 'CRLF into name'
severity: medium
type: active
tags:
  - crlf
  - injection
  - headers
description: 'CRLF header injection via name'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - 'y%0d%0aX-Test: u'
    matchers:
      - type: word
        part: headers
        words:
          - 'x-test'
