id: crlf2-065
name: 'CRLF2 injection via msg'
severity: medium
type: active
tags:
  - crlf
  - injection
  - headers
description: 'CRLF header injection via msg'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      msg:
        - 'x%250d%250aX-Test: crlf2'
    matchers:
      - type: word
        part: headers
        words:
          - 'x-test'
