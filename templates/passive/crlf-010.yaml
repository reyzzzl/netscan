id: crlf-010
name: 'CRLF injection via q'
severity: medium
type: active
tags:
  - crlf
  - injection
  - headers
description: 'CRLF header injection via q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - 'test%0aX-Test: netscan'
    matchers:
      - type: word
        part: headers
        words:
          - 'x-test'
