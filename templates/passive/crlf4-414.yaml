id: crlf4-414
name: 'CRLF into review'
severity: medium
type: active
tags:
  - crlf
  - injection
  - headers
description: 'CRLF header injection via review'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      review:
        - '%0dX-Test: t'
    matchers:
      - type: word
        part: headers
        words:
          - 'x-test'
