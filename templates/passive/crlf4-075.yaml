id: crlf4-075
name: 'CRLF into title'
severity: medium
type: active
tags:
  - crlf
  - injection
  - headers
description: 'CRLF header injection via title'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      title:
        - '%0a%20X-Test: t'
    matchers:
      - type: word
        part: headers
        words:
          - 'x-test'
