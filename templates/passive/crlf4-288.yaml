id: crlf4-288
name: 'CRLF into input'
severity: medium
type: active
tags:
  - crlf
  - injection
  - headers
description: 'CRLF header injection via input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - 'x%CRLF%X-Test: t'
    matchers:
      - type: word
        part: headers
        words:
          - 'x-test'
