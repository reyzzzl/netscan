id: crlf4-140
name: 'CRLF into desc'
severity: medium
type: active
tags:
  - crlf
  - injection
  - headers
description: 'CRLF header injection via desc'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      desc:
        - '%0D%0AX-Test: t'
    matchers:
      - type: word
        part: headers
        words:
          - 'x-test'
