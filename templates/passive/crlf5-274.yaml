id: crlf5-274
name: 'CRLF into review'
severity: medium
type: active
tags:
  - crlf
  - injection
  - headers
description: 'CRLF header injection via review'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      review:
        - '%0d%0a%20X-Test: u'
    matchers:
      - type: word
        part: headers
        words:
          - 'x-test'
