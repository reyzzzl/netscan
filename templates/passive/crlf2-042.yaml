id: crlf2-042
name: 'CRLF2 injection via text'
severity: medium
type: active
tags:
  - crlf
  - injection
  - headers
description: 'CRLF header injection via text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - 'x%0aX-Test: crlf2'
    matchers:
      - type: word
        part: headers
        words:
          - 'x-test'
