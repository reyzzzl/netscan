id: crlf4-037
name: 'CRLF into subject'
severity: medium
type: active
tags:
  - crlf
  - injection
  - headers
description: 'CRLF header injection via subject'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      subject:
        - 'x%250d%250aX-Test: t'
    matchers:
      - type: word
        part: headers
        words:
          - 'x-test'
