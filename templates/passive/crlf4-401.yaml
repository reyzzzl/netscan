id: crlf4-401
name: 'CRLF into name'
severity: medium
type: active
tags:
  - crlf
  - injection
  - headers
description: 'CRLF header injection via name'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - 'x%0d%0aX-Forwarded-For: 1'
    matchers:
      - type: word
        part: headers
        words:
          - 'x-test'
