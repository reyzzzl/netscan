id: crlf3-076
name: 'CRLF into text'
severity: medium
type: active
tags:
  - crlf
  - injection
  - headers
description: 'CRLF header injection via text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '%0d%0aSet-Cookie: s2=1'
    matchers:
      - type: word
        part: headers
        words:
          - 'x-test'
