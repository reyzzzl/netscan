id: crlf5-303
name: 'CRLF into redirect'
severity: medium
type: active
tags:
  - crlf
  - injection
  - headers
description: 'CRLF header injection via redirect'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      redirect:
        - 'y%0dX-Test: u'
    matchers:
      - type: word
        part: headers
        words:
          - 'x-test'
