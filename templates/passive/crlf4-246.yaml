id: crlf4-246
name: 'CRLF into text'
severity: medium
type: active
tags:
  - crlf
  - injection
  - headers
description: 'CRLF header injection via text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '%0dX-Test: t'
    matchers:
      - type: word
        part: headers
        words:
          - 'x-test'
