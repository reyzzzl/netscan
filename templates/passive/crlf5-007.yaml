id: crlf5-007
name: 'CRLF into comment'
severity: medium
type: active
tags:
  - crlf
  - injection
  - headers
description: 'CRLF header injection via comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - 'y%250d%250aX-Test: u'
    matchers:
      - type: word
        part: headers
        words:
          - 'x-test'
