id: crlf4-353
name: 'CRLF into reply'
severity: medium
type: active
tags:
  - crlf
  - injection
  - headers
description: 'CRLF header injection via reply'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      reply:
        - 'X%0d%0aX-Test: t'
    matchers:
      - type: word
        part: headers
        words:
          - 'x-test'
