id: crlf4-144
name: 'CRLF into url'
severity: medium
type: active
tags:
  - crlf
  - injection
  - headers
description: 'CRLF header injection via url'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      url:
        - '%0dX-Test: t'
    matchers:
      - type: word
        part: headers
        words:
          - 'x-test'
