id: crlf5-036
name: 'CRLF into body'
severity: medium
type: active
tags:
  - crlf
  - injection
  - headers
description: 'CRLF header injection via body'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      body:
        - '%0d%20X-Test: u'
    matchers:
      - type: word
        part: headers
        words:
          - 'x-test'
