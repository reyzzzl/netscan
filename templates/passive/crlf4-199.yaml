id: crlf4-199
name: 'CRLF into info'
severity: medium
type: active
tags:
  - crlf
  - injection
  - headers
description: 'CRLF header injection via info'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      info:
        - '%u000d%u000aX-Test: t'
    matchers:
      - type: word
        part: headers
        words:
          - 'x-test'
