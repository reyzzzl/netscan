id: crlf4-511
name: 'CRLF into note'
severity: medium
type: active
tags:
  - crlf
  - injection
  - headers
description: 'CRLF header injection via note'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      note:
        - 'x%0d%0aX-Test: t'
    matchers:
      - type: word
        part: headers
        words:
          - 'x-test'
