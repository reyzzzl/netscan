id: cve3-drupal-token-05
name: 'Drupal token token.module'
severity: info
type: active
tags:
  - cve
  - fingerprint
  - version
description: 'Drupal token at /modules/contrib/token/token.module — match version manually'
requests:
  - method: GET
    path: '{{BaseURL}}/modules/contrib/token/token.module'
    matchers:
      - type: status
        status: [200]
