id: cve3-wp-yoast-03
name: 'WP yoast CHANGELOG.md'
severity: info
type: active
tags:
  - cve
  - fingerprint
  - version
description: 'WP yoast at /wp-content/plugins/yoast/CHANGELOG.md — match version manually'
requests:
  - method: GET
    path: '{{BaseURL}}/wp-content/plugins/yoast/CHANGELOG.md'
    matchers:
