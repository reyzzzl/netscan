id: cve3-joomla-content-02
name: 'Joomla content changelog.xml'
severity: info
type: active
tags:
  - cve
  - fingerprint
  - version
description: 'Joomla content at /components/com_content/changelog.xml — match version manually'
requests:
  - method: GET
    path: '{{BaseURL}}/components/com_content/changelog.xml'
    matchers:
      - type: status
        status: [200]
