id: cve3-wp-woocommerce-08
name: 'WP woocommerce '
severity: info
type: active
tags:
  - cve
  - fingerprint
  - version
description: 'WP woocommerce at /wp-content/plugins/woocommerce/assets/ — match version manually'
requests:
  - method: GET
    path: '{{BaseURL}}/wp-content/plugins/woocommerce/assets/'
    matchers:
      - type: status
        status: [200]
