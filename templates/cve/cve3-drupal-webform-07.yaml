id: cve3-drupal-webform-07
name: 'Drupal webform '
severity: info
type: active
tags:
  - cve
  - fingerprint
  - version
description: 'Drupal webform at /modules/contrib/webform/templates/ — match version manually'
requests:
  - method: GET
    path: '{{BaseURL}}/modules/contrib/webform/templates/'
    matchers:
      - type: status
        status: [200]
