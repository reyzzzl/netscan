id: cve3-wp-yoast-04
name: 'WP yoast LICENSE'
severity: info
type: active
tags:
  - cve
  - fingerprint
  - version
description: 'WP yoast at /wp-content/plugins/yoast/LICENSE — match version manually'
requests:
  - method: GET
    path: '{{BaseURL}}/wp-content/plugins/yoast/LICENSE'
    matchers:
      - type: status
        status: [200]
