id: cve3-wp-wordfence-09
name: 'WP wordfence '
severity: info
type: active
tags:
  - cve
  - fingerprint
  - version
description: 'WP wordfence at /wp-content/plugins/wordfence/languages/ — match version manually'
requests:
  - method: GET
    path: '{{BaseURL}}/wp-content/plugins/wordfence/languages/'
    matchers:
      - type: status
        status: [200]
