id: cve3-wpt-twentytwenty-03
name: 'Theme twentytwenty readme.txt'
severity: info
type: active
tags:
  - cve
  - fingerprint
  - version
description: 'Theme twentytwenty at /wp-content/themes/twentytwenty/readme.txt — match version manually'
requests:
  - method: GET
    path: '{{BaseURL}}/wp-content/themes/twentytwenty/readme.txt'
    match-all: true
    matchers:
      - type: status
        status: [200]
      - type: word
        part: body
        words:
          - 'Stable tag'
