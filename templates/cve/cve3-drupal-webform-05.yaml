id: cve3-drupal-webform-05
name: 'Drupal webform webform.module'
severity: info
type: active
tags:
  - cve
  - fingerprint
  - version
description: 'Drupal webform at /modules/contrib/webform/webform.module — match version manually'
requests:
  - method: GET
    path: '{{BaseURL}}/modules/contrib/webform/webform.module'
    matchers:
      - type: status
        status: [200]
