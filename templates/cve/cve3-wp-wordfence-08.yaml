id: cve3-wp-wordfence-08
name: 'WP wordfence '
severity: info
type: active
tags:
  - cve
  - fingerprint
  - version
description: 'WP wordfence at /wp-content/plugins/wordfence/assets/ — match version manually'
requests:
  - method: GET
    path: '{{BaseURL}}/wp-content/plugins/wordfence/assets/'
    matchers:
      - type: status
        status: [200]
