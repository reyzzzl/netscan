id: cve3-joomla-contact-02
name: 'Joomla contact changelog.xml'
severity: info
type: active
tags:
  - cve
  - fingerprint
  - version
description: 'Joomla contact at /components/com_contact/changelog.xml — match version manually'
requests:
  - method: GET
    path: '{{BaseURL}}/components/com_contact/changelog.xml'
    matchers:
      - type: status
        status: [200]
