id: cve3-joomla-newsfeeds-01
name: 'Joomla newsfeeds readme.txt'
severity: info
type: active
tags:
  - cve
  - fingerprint
  - version
description: 'Joomla newsfeeds at /components/com_newsfeeds/readme.txt — match version manually'
requests:
  - method: GET
    path: '{{BaseURL}}/components/com_newsfeeds/readme.txt'
    match-all: true
    matchers:
      - type: status
        status: [200]
      - type: word
        part: body
        words:
          - 'Stable tag'
