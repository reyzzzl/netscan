id: spring2-01
name: 'Spring sessions sessions'
severity: info
type: active
tags:
  - cve
  - fingerprint
  - version
description: 'Spring sessions at /actuator/sessions — match version manually'
requests:
  - method: GET
    path: '{{BaseURL}}/actuator/sessions'
    match-all: true
    matchers:
      - type: status
        status: [200]
      - type: word
        part: body
        words:
          - 'sessions'
