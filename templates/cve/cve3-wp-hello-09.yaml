id: cve3-wp-hello-09
name: 'WP hello '
severity: info
type: active
tags:
  - cve
  - fingerprint
  - version
description: 'WP hello at /wp-content/plugins/hello/languages/ — match version manually'
requests:
  - method: GET
    path: '{{BaseURL}}/wp-content/plugins/hello/languages/'
    matchers:
      - type: status
        status: [200]
