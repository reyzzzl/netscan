id: cve2-wordpress2-01
name: 'WP JSON fingerprint /wp-json/ v1'
severity: info
type: active
tags:
  - cve
  - fingerprint
  - version
description: 'WP JSON at /wp-json/ — match version manually'
requests:
  - method: GET
    path: '{{BaseURL}}/wp-json/'
    matchers:
      - type: status
        status: [200]
