id: cve3-wp-contact-form-7-01
name: 'WP contact-form-7 readme.txt'
severity: info
type: active
tags:
  - cve
  - fingerprint
  - version
description: 'WP contact-form-7 at /wp-content/plugins/contact-form-7/readme.txt — match version manually'
requests:
  - method: GET
    path: '{{BaseURL}}/wp-content/plugins/contact-form-7/readme.txt'
    match-all: true
    matchers:
      - type: status
        status: [200]
      - type: word
        part: body
        words:
          - 'Stable tag'
