id: cve3-wp-elementor-04
name: 'WP elementor LICENSE'
severity: info
type: active
tags:
  - cve
  - fingerprint
  - version
description: 'WP elementor at /wp-content/plugins/elementor/LICENSE — match version manually'
requests:
  - method: GET
    path: '{{BaseURL}}/wp-content/plugins/elementor/LICENSE'
    matchers:
      - type: status
        status: [200]
