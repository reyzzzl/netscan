id: cve3-wpt-twentytwentyone-03
name: 'Theme twentytwentyone readme.txt'
severity: info
type: active
tags:
  - cve
  - fingerprint
  - version
description: 'Theme twentytwentyone at /wp-content/themes/twentytwentyone/readme.txt — match version manually'
requests:
  - method: GET
    path: '{{BaseURL}}/wp-content/themes/twentytwentyone/readme.txt'
    match-all: true
    matchers:
      - type: status
        status: [200]
      - type: word
        part: body
        words:
          - 'Stable tag'
