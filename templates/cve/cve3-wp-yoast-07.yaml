id: cve3-wp-yoast-07
name: 'WP yoast '
severity: info
type: active
tags:
  - cve
  - fingerprint
  - version
description: 'WP yoast at /wp-content/plugins/yoast/includes/ — match version manually'
requests:
  - method: GET
    path: '{{BaseURL}}/wp-content/plugins/yoast/includes/'
    matchers:
      - type: status
        status: [200]
