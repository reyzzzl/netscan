id: cve3-wpt-oceanwp-03
name: 'Theme oceanwp readme.txt'
severity: info
type: active
tags:
  - cve
  - fingerprint
  - version
description: 'Theme oceanwp at /wp-content/themes/oceanwp/readme.txt — match version manually'
requests:
  - method: GET
    path: '{{BaseURL}}/wp-content/themes/oceanwp/readme.txt'
    match-all: true
    matchers:
      - type: status
        status: [200]
      - type: word
        part: body
        words:
          - 'Stable tag'
