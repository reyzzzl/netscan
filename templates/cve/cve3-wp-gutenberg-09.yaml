id: cve3-wp-gutenberg-09
name: 'WP gutenberg '
severity: info
type: active
tags:
  - cve
  - fingerprint
  - version
description: 'WP gutenberg at /wp-content/plugins/gutenberg/languages/ — match version manually'
requests:
  - method: GET
    path: '{{BaseURL}}/wp-content/plugins/gutenberg/languages/'
    matchers:
      - type: status
        status: [200]
