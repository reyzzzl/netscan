id: cve3-wpt-astra-03
name: 'Theme astra readme.txt'
severity: info
type: active
tags:
  - cve
  - fingerprint
  - version
description: 'Theme astra at /wp-content/themes/astra/readme.txt — match version manually'
requests:
  - method: GET
    path: '{{BaseURL}}/wp-content/themes/astra/readme.txt'
    match-all: true
    matchers:
      - type: status
        status: [200]
      - type: word
        part: body
        words:
          - 'Stable tag'
