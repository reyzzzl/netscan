id: cve3-drupal-views-04
name: 'Drupal views views.info.yml'
severity: info
type: active
tags:
  - cve
  - fingerprint
  - version
description: 'Drupal views at /modules/contrib/views/views.info.yml — match version manually'
requests:
  - method: GET
    path: '{{BaseURL}}/modules/contrib/views/views.info.yml'
    matchers:
      - type: status
        status: [200]
