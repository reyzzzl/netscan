id: cve3-wp-woocommerce-04
name: 'WP woocommerce LICENSE'
severity: info
type: active
tags:
  - cve
  - fingerprint
  - version
description: 'WP woocommerce at /wp-content/plugins/woocommerce/LICENSE — match version manually'
requests:
  - method: GET
    path: '{{BaseURL}}/wp-content/plugins/woocommerce/LICENSE'
    matchers:
      - type: status
        status: [200]
