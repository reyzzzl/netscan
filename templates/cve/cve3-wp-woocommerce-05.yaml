id: cve3-wp-woocommerce-05
name: 'WP woocommerce woocommerce.php'
severity: info
type: active
tags:
  - cve
  - fingerprint
  - version
description: 'WP woocommerce at /wp-content/plugins/woocommerce/woocommerce.php — match version manually'
requests:
