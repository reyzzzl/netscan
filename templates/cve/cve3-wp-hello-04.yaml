id: cve3-wp-hello-04
name: 'WP hello LICENSE'
severity: info
type: active
tags:
  - cve
  - fingerprint
  - version
description: 'WP hello at /wp-content/plugins/hello/LICENSE — match version manually'
requests:
  - method: GET
    path: '{{BaseURL}}/wp-content/plugins/hello/LICENSE'
    matchers:
      - type: status
        status: [200]
