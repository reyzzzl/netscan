id: cve3-drupal-token-01
name: 'Drupal token CHANGELOG.txt'
severity: info
type: active
tags:
  - cve
  - fingerprint
  - version
description: 'Drupal token at /modules/contrib/token/CHANGELOG.txt — match version manually'
requests:
  - method: GET
    path: '{{BaseURL}}/modules/contrib/token/CHANGELOG.txt'
    matchers:
      - type: status
        status: [200]
