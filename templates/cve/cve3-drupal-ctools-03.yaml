id: cve3-drupal-ctools-03
name: 'Drupal ctools LICENSE.txt'
severity: info
type: active
tags:
  - cve
  - fingerprint
  - version
description: 'Drupal ctools at /modules/contrib/ctools/LICENSE.txt — match version manually'
requests:
  - method: GET
    path: '{{BaseURL}}/modules/contrib/ctools/LICENSE.txt'
    matchers:
      - type: status
        status: [200]
