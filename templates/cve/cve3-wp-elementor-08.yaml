id: cve3-wp-elementor-08
name: 'WP elementor '
severity: info
type: active
tags:
  - cve
  - fingerprint
  - version
description: 'WP elementor at /wp-content/plugins/elementor/assets/ — match version manually'
requests:
  - method: GET
    path: '{{BaseURL}}/wp-content/plugins/elementor/assets/'
    matchers:
      - type: status
        status: [200]
