id: cve3-drupal-token-08
name: 'Drupal token '
severity: info
type: active
tags:
  - cve
  - fingerprint
  - version
description: 'Drupal token at /modules/contrib/token/css/ — match version manually'
requests:
  - method: GET
    path: '{{BaseURL}}/modules/contrib/token/css/'
    matchers:
      - type: status
        status: [200]
