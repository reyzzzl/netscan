id: cve3-drupal-views-07
name: 'Drupal views '
severity: info
type: active
tags:
  - cve
  - fingerprint
  - version
description: 'Drupal views at /modules/contrib/views/templates/ — match version manually'
requests:
  - method: GET
    path: '{{BaseURL}}/modules/contrib/views/templates/'
    matchers:
      - type: status
        status: [200]
