id: cmdi6-0238
name: 'Shell injection in action'
severity: critical
type: active
tags:
  - cmdi
  - injection
  - rce
description: 'OS command runs via action'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      action:
        - ';echo${IFS}NX'
    matchers:
      - type: word
        part: body
        words:
          - 'uid='
          - 'gid='
          - 'root:x:0:0'
          - 'www-data'
