id: cmdi6-0250
name: 'Shell injection in proc'
severity: critical
type: active
tags:
  - cmdi
  - injection
  - rce
description: 'OS command runs via proc'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      proc:
        - '%0did'
    matchers:
      - type: word
        part: body
        words:
          - 'uid='
          - 'gid='
          - 'root:x:0:0'
          - 'www-data'
