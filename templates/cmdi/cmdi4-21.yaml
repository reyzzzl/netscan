id: cmdi4-21
name: 'PowerShell injection in input'
severity: critical
type: active
tags:
  - cmdi
  - injection
  - powershell
description: 'OS command runs via input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - ';whoami.exe'
    matchers:
      - type: word
        part: body
        words:
          - 'uid='
          - 'gid='
          - 'root:x:0:0'
          - 'www-data'
