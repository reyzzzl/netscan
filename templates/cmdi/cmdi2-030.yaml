id: cmdi2-030
name: 'OS command injection2 via cmd2'
severity: critical
type: active
tags:
  - cmdi
  - injection
  - rce
description: 'OS command runs via cmd2'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cmd2:
        - 'id%3bwhoami'
    matchers:
      - type: word
        part: body
        words:
          - 'uid='
          - 'gid='
          - 'root:x:0:0'
          - 'www-data'
