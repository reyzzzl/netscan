id: cmdi4-10
name: 'PowerShell injection in data'
severity: critical
type: active
tags:
  - cmdi
  - injection
  - powershell
description: 'OS command runs via data'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      data:
        - ';hostname'
    matchers:
      - type: word
        part: body
        words:
          - 'uid='
          - 'gid='
          - 'root:x:0:0'
          - 'www-data'
