id: cmdi6-0908
name: 'Shell injection in query'
severity: critical
type: active
tags:
  - cmdi
  - injection
  - rce
description: 'OS command runs via query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '%0a%0d'
    matchers:
      - type: word
        part: body
        words:
          - 'uid='
          - 'gid='
          - 'root:x:0:0'
          - 'www-data'
