id: cmdi3-022
name: 'Command injection in data'
severity: critical
type: active
tags:
  - cmdi
  - injection
  - rce
description: 'OS command runs via data'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      data:
        - 'id%7c'
    matchers:
      - type: word
        part: body
        words:
          - 'uid='
          - 'gid='
          - 'root:x:0:0'
          - 'www-data'
