id: cmdi6-0515
name: 'Shell injection in command'
severity: critical
type: active
tags:
  - cmdi
  - injection
  - rce
description: 'OS command runs via command'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      command:
        - '%3b%3bid'
    matchers:
      - type: word
        part: body
        words:
          - 'uid='
          - 'gid='
          - 'root:x:0:0'
          - 'www-data'
