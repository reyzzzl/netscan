id: cmdi2-012
name: 'OS command injection2 via cmd2'
severity: critical
type: active
tags:
  - cmdi
  - injection
  - rce
description: 'OS command runs via cmd2'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cmd2:
        - 'a|id'
    matchers:
      - type: word
        part: body
        words:
          - 'uid='
          - 'gid='
          - 'root:x:0:0'
          - 'www-data'
