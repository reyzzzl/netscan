id: cmdi6-0345
name: 'Shell injection in bash'
severity: critical
type: active
tags:
  - cmdi
  - injection
  - rce
description: 'OS command runs via bash'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      bash:
        - '%09 whoami'
    matchers:
      - type: word
        part: body
        words:
          - 'uid='
          - 'gid='
          - 'root:x:0:0'
          - 'www-data'
