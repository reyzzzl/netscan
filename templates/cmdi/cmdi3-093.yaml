id: cmdi3-093
name: 'Command injection in input'
severity: critical
type: active
tags:
  - cmdi
  - injection
  - rce
description: 'OS command runs via input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '%0aid%00'
    matchers:
      - type: word
        part: body
        words:
          - 'uid='
          - 'gid='
          - 'root:x:0:0'
          - 'www-data'
