id: cmdi6-0714
name: 'Shell injection in operation'
severity: critical
type: active
tags:
  - cmdi
  - injection
  - rce
description: 'OS command runs via operation'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      operation:
        - ';id&&id'
    matchers:
      - type: word
        part: body
        words:
          - 'uid='
          - 'gid='
          - 'root:x:0:0'
          - 'www-data'
