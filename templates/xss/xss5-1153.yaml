id: xss5-1153
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<xss%0astyle=x%0aonpointerover=nx51152>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51152'
