id: xss5-3321
name: 'Raw XSS5 in q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - 'mhtml%3ahttp://x!nx53320'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53320'
