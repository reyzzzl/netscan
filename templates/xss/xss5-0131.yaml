id: xss5-0131
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<object%0adata=data:text/html,nx50130>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50130'
