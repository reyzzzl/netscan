id: xss-181
name: 'Reflected XSS ctx-6 via q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '''-alert(nx180c)-'''
    matchers:
      - type: word
        part: body
        words:
          - 'nx180c'
