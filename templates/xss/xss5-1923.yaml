id: xss5-1923
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<svg%0d%0aonload=nx51922>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51922'
