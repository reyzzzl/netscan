id: xss5-1815
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<!--#exec cmd="echo nx51814"-->'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51814'
