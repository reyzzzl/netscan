id: xss5-0908
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '<esi:include%09src=nx50907>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50907'
