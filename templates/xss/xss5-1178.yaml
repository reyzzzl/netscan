id: xss5-1178
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<applet%0acode=javascript:nx51177>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51177'
