id: xss5-3719
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<mi%0ahref=javascript:nx53718>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53718'
