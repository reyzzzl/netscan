id: xss5-1005
name: 'Raw XSS5 in name'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in name'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - '<div style="-moz-binding:url(''javascript:nx51004'')">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51004'
