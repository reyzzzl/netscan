id: xss5-0473
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<frameset%0aonload=nx50472>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50472'
