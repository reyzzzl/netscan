id: xss5-2378
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '${nx52377}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52377'
