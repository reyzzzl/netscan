id: xss5-3831
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<style>@import ''javascript:nx53830'';</style>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53830'
