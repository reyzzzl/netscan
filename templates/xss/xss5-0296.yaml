id: xss5-0296
name: 'Raw XSS5 in firstname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in firstname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      firstname:
        - '<style>@import ''javascript:nx50295'';</style>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50295'
