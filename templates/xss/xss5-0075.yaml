id: xss5-0075
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<p%0aoncut=nx50074>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50074'
