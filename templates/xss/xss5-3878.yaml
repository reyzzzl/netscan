id: xss5-3878
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<math><mtext%0ahref=javascript:nx53877>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53877'
