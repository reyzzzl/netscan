id: xss5-2281
name: 'Raw XSS5 in q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '{{{nx52280}}}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52280'
