id: xss5-3697
name: 'Raw XSS5 in lastname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in lastname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      lastname:
        - '<wbr%09onmouseover=nx53696>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53696'
