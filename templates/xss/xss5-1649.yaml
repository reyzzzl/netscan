id: xss5-1649
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<form><button%09formaction=javascript:nx51648>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51648'
