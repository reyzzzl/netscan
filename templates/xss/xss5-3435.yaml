id: xss5-3435
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<svg%0aonload=nx53434>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53434'
