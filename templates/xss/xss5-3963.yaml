id: xss5-3963
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<body%0d%0aonload=nx53962>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53962'
