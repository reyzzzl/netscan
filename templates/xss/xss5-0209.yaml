id: xss5-0209
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<image src=x onerror=nx50208>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50208'
