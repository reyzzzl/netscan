id: xss5-1317
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<svg%0d%0aonload=nx51316>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51316'
