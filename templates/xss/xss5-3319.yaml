id: xss5-3319
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - 'data%3atext/html,nx53318'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53318'
