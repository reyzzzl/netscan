id: xss5-1838
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '</textarea><svg%0aonload=nx51837>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51837'
