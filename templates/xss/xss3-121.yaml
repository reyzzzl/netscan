id: xss3-121
name: 'Raw XSS3 #0 in q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<svg%0aonload=nx3120>'
