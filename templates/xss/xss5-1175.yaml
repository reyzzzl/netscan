id: xss5-1175
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<link%09rel=stylesheet%09href=javascript:nx51174>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51174'
