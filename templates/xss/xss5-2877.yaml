id: xss5-2877
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<select%09autofocus%09onfocus=nx52876>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52876'
