id: xss5-1115
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<svg%0d%0aonload=nx51114>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51114'
