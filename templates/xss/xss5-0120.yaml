id: xss5-0120
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '''><img%0asrc=x%0aonerror=nx50119>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50119'
