id: xss8-1279
name: 'Raw XSS8 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<input autofocus onfocus=nx81278%20>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx81278'
