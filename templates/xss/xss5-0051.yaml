id: xss5-0051
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<textarea%0aautofocus%0aonfocus=nx50050>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50050'
