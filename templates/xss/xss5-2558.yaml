id: xss5-2558
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<form><button%09formaction=javascript:nx52557>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52557'
