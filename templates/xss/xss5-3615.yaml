id: xss5-3615
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<svg><animate%09onbegin=nx53614 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53614'
