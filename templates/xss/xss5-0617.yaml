id: xss5-0617
name: 'Raw XSS5 in lastname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in lastname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      lastname:
        - '<ScRiPt%0a>alert(nx50616)</ScRiPt>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50616'
