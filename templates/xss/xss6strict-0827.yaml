id: xss6strict-0827
name: 'Strict raw XSS in subject'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      subject:
        - '<video><source onerror=sx60826>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx60826'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx60826'
