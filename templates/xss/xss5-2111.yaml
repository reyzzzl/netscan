id: xss5-2111
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<a%0ahref=data:text/html,nx52110>click'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52110'
