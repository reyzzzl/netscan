id: xss5-3826
name: 'Raw XSS5 in website'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in website'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      website:
        - 'mhtml%3ahttp://x!nx53825'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53825'
