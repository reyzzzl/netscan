id: xss5-0410
name: 'Raw XSS5 in text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '<img%0asrc=x%0aonerror=nx50409>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50409'
