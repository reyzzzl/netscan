id: xss5-3757
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '</textarea><svg%0aonload=nx53756>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53756'
