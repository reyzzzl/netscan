id: xss5-1580
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<meta%09http-equiv=refresh%09content="0;javascript:nx51579">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51579'
