id: xss5-3374
name: 'Raw XSS5 in data'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in data'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      data:
        - '<xss%09style=x%09onauxclick=nx53373>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53373'
