id: xss5-0835
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<marquee%0aloop=1%0aonstart=nx50834>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50834'
