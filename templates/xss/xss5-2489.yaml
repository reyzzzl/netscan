id: xss5-2489
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<meta%09http-equiv=refresh%09content="0;javascript:nx52488">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52488'
