id: xss-198
name: 'Reflected XSS ctx-23 via title'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in title'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      title:
        - '#{nx197c}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx197c'
