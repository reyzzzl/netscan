id: xss-015
name: 'Reflected XSS ctx-14 via name'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in name'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - '"><a href=javascript:nx014c>click'
