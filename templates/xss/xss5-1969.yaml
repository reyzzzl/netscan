id: xss5-1969
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<keygen%09autofocus%09onfocus=nx51968>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51968'
