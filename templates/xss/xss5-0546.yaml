id: xss5-0546
name: 'Raw XSS5 in website'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in website'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      website:
        - '<xss%09style=x%09onauxclick=nx50545>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50545'
