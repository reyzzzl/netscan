id: xss5-2008
name: 'Raw XSS5 in title'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in title'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      title:
        - 'mhtml%3ahttp://x!nx52007'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52007'
