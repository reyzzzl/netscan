id: xss5-3509
name: 'Raw XSS5 in summary'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in summary'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      summary:
        - '<p%0aoncut=nx53508>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53508'
