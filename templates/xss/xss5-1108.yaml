id: xss5-1108
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '<!--#exec cmd="echo nx51107"-->'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51107'
