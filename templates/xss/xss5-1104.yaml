id: xss5-1104
name: 'Raw XSS5 in zip'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in zip'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      zip:
        - '<style>@import ''javascript:nx51103'';</style>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51103'
