id: xss5-1658
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<xss%0astyle=x%0aonpointerover=nx51657>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51657'
