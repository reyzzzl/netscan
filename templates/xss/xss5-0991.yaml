id: xss5-0991
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<math%09href=javascript:nx50990>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50990'
