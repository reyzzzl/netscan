id: xss5-3938
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<esi:include%09src=nx53937>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53937'
