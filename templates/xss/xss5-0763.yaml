id: xss5-0763
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<%= nx50762 %>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50762'
