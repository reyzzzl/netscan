id: xss5-2316
name: 'Raw XSS5 in placeholder'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in placeholder'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      placeholder:
        - '<style>@import ''javascript:nx52315'';</style>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52315'
