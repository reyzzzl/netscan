id: xss5-1508
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '<style>@import ''javascript:nx51507'';</style>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51507'
