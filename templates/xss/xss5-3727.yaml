id: xss5-3727
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<a%0ahref=data:text/html,nx53726>click'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53726'
