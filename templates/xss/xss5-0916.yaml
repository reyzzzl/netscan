id: xss5-0916
name: 'Raw XSS5 in placeholder'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in placeholder'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      placeholder:
        - '<image src=x onerror=nx50915>'
