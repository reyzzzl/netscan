id: xss5-0568
name: 'Raw XSS5 in title'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in title'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      title:
        - '<bgsound%0asrc=javascript:nx50567>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50567'
