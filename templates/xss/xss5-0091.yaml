id: xss5-0091
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<a%0ahref=data:text/html,nx50090>click'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50090'
