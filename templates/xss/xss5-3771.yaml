id: xss5-3771
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<form%0aaction=javascript:nx53770><input type=submit>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53770'
