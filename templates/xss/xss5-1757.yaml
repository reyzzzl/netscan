id: xss5-1757
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<math><mtext%0ahref=javascript:nx51756>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51756'
