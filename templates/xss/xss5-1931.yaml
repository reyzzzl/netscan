id: xss5-1931
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<sCrIpT%09>alert(nx51930)</sCrIpT>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51930'
