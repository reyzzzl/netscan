id: xss5-2686
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<wbr%0aonmouseover=nx52685>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52685'
