id: xss-121
name: 'Reflected XSS ctx-4 via q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<svg onload=alert(nx120c)>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx120c'
