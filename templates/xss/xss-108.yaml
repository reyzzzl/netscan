id: xss-108
name: 'Reflected XSS ctx-20 via title'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in title'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      title:
        - '{{nx107c}}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx107c'
