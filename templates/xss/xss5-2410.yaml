id: xss5-2410
name: 'Raw XSS5 in text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - 'data%3atext/html,nx52409'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52409'
