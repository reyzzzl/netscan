id: xss5-3097
name: 'Raw XSS5 in lastname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in lastname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      lastname:
        - '<applet%0acode=javascript:nx53096>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53096'
