id: xss5-3078
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<select%0aautofocus%0aonfocus=nx53077>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53077'
