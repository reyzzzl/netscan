id: xss5-2404
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<svg><animate%0aonbegin=nx52403 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52403'
