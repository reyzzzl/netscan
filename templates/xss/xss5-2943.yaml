id: xss5-2943
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '<script>alert(String.fromCharCode(nx52942))</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52942'
