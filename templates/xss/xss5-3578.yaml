id: xss5-3578
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<xss%0d%0astyle=x%0d%0aonfocusin=nx53577 tabindex=1>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53577'
