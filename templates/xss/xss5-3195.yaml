id: xss5-3195
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<link%09rel=stylesheet%09href=javascript:nx53194>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53194'
