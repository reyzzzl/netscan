id: xss5-0988
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '<td%0abackground=data:text/html,nx50987>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50987'
