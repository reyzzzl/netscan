id: xss5-2021
name: 'Raw XSS5 in city'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in city'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      city:
        - '<svg%0aonload=nx52020>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52020'
