id: xss5-2498
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<p%09oncopy=nx52497>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52497'
