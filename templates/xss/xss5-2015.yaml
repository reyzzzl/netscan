id: xss5-2015
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<div style="-moz-binding:url(''javascript:nx52014'')">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52014'
