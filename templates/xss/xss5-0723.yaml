id: xss5-0723
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '"><svg%0aonload=nx50722>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50722'
