id: xss5-0574
name: 'Raw XSS5 in data'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in data'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      data:
        - '<frameset%0aonload=nx50573>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50573'
