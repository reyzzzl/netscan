id: xss6strict-1723
name: 'Strict raw XSS in search'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      search:
        - '<script>sx61722>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx61722'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx61722'
