id: xss5-0798
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<a%0ahref=data:text/html,nx50797>click'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50797'
