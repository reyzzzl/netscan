id: xss5-0214
name: 'Raw XSS5 in data'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in data'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      data:
        - '<sCrIpT%09>alert(nx50213)</sCrIpT>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50213'
