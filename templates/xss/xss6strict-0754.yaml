id: xss6strict-0754
name: 'Strict raw XSS in label'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      label:
        - '<details open ontoggle=sx60753>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx60753'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx60753'
