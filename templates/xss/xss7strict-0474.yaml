id: xss7strict-0474
name: 'Strict breakout XSS in label'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      label:
        - '<a href=javascript:sx70473>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx70473'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx70473'
