id: xss5-3283
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<textarea%0aautofocus%0aonfocus=nx53282>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53282'
