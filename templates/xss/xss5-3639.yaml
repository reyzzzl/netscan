id: xss5-3639
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<svg/onload=nx53638>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53638'
