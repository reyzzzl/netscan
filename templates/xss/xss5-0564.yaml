id: xss5-0564
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '{{{nx50563}}}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50563'
