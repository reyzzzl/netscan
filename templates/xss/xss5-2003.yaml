id: xss5-2003
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - 'jaVasCript%3anx52002'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52002'
