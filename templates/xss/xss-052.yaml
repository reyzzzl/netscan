id: xss-052
name: 'Reflected XSS ctx-22 via s'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in s'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      s:
        - '<%= nx051c %>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx051c'
