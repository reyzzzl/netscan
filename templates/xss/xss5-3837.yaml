id: xss5-3837
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<esi:include%09src=nx53836>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53836'
