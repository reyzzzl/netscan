id: xss7strict-1556
name: 'Strict breakout XSS in placeholder'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      placeholder:
        - '<button formaction=javascript:sx71555>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx71555'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx71555'
