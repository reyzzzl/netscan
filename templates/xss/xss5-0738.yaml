id: xss5-0738
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<embed%09src=javascript:nx50737>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50737'
