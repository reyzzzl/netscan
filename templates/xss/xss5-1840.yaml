id: xss5-1840
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '<body%0aonload=nx51839>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51839'
