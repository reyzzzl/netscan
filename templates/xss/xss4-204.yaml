id: xss4-204
name: 'Raw XSS4 #3 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<script src=data:,alert(nx4203)></script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx4203'
