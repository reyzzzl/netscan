id: xss5-2113
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<map><area%0ahref=javascript:nx52112></map>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52112'
