id: xss5-1186
name: 'Raw XSS5 in website'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in website'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      website:
        - '<p%0aoncut=nx51185>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51185'
