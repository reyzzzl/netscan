id: xss5-1167
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<%= nx51166 %>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51166'
