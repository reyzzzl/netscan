id: xss5-1029
name: 'Raw XSS5 in summary'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in summary'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      summary:
        - '''><img%0asrc=x%0aonerror=nx51028>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51028'
