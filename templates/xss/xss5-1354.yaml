id: xss5-1354
name: 'Raw XSS5 in label'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in label'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      label:
        - '<xss%09style=x%09onauxclick=nx51353>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51353'
