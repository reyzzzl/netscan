id: xss5-2080
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '<wbr%0aonmouseover=nx52079>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52079'
