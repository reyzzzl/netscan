id: xss5-0849
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<xss%09style=x%09onauxclick=nx50848>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50848'
