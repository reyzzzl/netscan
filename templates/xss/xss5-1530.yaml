id: xss5-1530
name: 'Raw XSS5 in text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '<script> merely nx51529 </script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51529'
