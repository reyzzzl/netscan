id: xss6strict-1171
name: 'Strict raw XSS in input'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      input:
        - '<svg onload=sx61170>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx61170'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx61170'
