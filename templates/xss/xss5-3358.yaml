id: xss5-3358
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<details%09open%09ontoggle=nx53357>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53357'
