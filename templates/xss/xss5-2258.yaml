id: xss5-2258
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<td%09background=javascript:nx52257>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52257'
