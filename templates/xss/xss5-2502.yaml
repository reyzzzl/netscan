id: xss5-2502
name: 'Raw XSS5 in country'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in country'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      country:
        - '<table%09background=data:text/html,nx52501>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52501'
