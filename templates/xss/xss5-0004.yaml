id: xss5-0004
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<svg%0d%0aonload=nx50003>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50003'
