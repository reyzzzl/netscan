id: xss-011
name: 'Reflected XSS ctx-10 via q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<details open ontoggle=nx010c>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx010c'
