id: xss5-1123
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<sCrIpT%09>alert(nx51122)</sCrIpT>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51122'
