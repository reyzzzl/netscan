id: xss5-2434
name: 'Raw XSS5 in label'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in label'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      label:
        - '<script%0d>alert(nx52433)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52433'
