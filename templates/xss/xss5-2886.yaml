id: xss5-2886
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '{{&nx52885}}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52885'
