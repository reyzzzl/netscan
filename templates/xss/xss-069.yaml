id: xss-069
name: 'Reflected XSS ctx-10 via query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<details open ontoggle=nx068c>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx068c'
