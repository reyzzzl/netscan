id: xss5-0936
name: 'Raw XSS5 in firstname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in firstname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      firstname:
        - '<marquee%0aloop=1%0aonstart=nx50935>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50935'
