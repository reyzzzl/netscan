id: xss3-203
name: 'Raw XSS3 #22 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<select%0aautofocus%0aonfocus=nx3202>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx3202'
