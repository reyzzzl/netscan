id: xss5-3324
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<area%09href=javascript:nx53323>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53323'
