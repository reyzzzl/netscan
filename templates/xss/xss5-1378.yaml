id: xss5-1378
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<meta%09http-equiv=refresh%09content="0;javascript:nx51377">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51377'
