id: xss5-0749
name: 'Raw XSS5 in summary'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in summary'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      summary:
        - '<xss%0astyle=x%0aonpointerover=nx50748>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50748'
