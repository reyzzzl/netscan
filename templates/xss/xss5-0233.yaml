id: xss5-0233
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<embed%09src=javascript:nx50232>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50232'
