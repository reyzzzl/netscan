id: xss5-1593
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<table%09background=data:text/html,nx51592>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51592'
