id: xss5-3731
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<div style="width:expression(nx53730)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53730'
