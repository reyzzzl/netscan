id: xss5-3577
name: 'Raw XSS5 in lastname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in lastname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      lastname:
        - '<xss%0astyle=x%0aonpointerover=nx53576>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53576'
