id: xss-050
name: 'Reflected XSS ctx-20 via text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '{{nx049c}}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx049c'
