id: xss5-2499
name: 'Raw XSS5 in phone'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in phone'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      phone:
        - '<p%0aoncut=nx52498>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52498'
