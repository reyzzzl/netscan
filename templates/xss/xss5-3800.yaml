id: xss5-3800
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '<bgsound%0asrc=javascript:nx53799>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53799'
