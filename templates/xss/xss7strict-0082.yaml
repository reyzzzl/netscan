id: xss7strict-0082
name: 'Strict breakout XSS in s'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      s:
        - '''><img src=x onerror=sx70081>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx70081'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx70081'
