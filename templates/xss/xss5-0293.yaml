id: xss5-0293
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<a%0ahref=data:text/html,nx50292>click'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50292'
