id: xss5-2118
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<!--#exec cmd="echo nx52117"-->'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52117'
