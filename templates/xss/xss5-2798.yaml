id: xss5-2798
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<input%09type=image%09formaction=javascript:nx52797>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52797'
