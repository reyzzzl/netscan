id: xss3-129
name: 'Raw XSS3 #8 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '</textarea><svg%0aonload=nx3128>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx3128'
