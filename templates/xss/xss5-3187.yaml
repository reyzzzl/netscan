id: xss5-3187
name: 'Raw XSS5 in subject'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in subject'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      subject:
        - '<%= nx53186 %>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53186'
