id: xss5-3343
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '<script%0d>alert(nx53342)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53342'
