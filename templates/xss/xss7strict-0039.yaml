id: xss7strict-0039
name: 'Strict breakout XSS in author'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      author:
        - '<embed src=javascript:sx70038>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx70038'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx70038'
