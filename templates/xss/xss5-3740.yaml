id: xss5-3740
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<svg/onload=nx53739>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53739'
