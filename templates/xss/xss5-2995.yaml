id: xss5-2995
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<base%09href=javascript:nx52994>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52994'
