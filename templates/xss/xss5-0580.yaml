id: xss5-0580
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<p%0aoncut=nx50579>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50579'
