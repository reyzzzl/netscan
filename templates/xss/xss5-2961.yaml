id: xss5-2961
name: 'Raw XSS5 in q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<embed%0asrc=data:text/html,nx52960>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52960'
