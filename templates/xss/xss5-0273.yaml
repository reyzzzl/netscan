id: xss5-0273
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<input%09type=image%09formaction=javascript:nx50272>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50272'
