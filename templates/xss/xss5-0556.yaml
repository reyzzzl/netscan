id: xss5-0556
name: 'Raw XSS5 in placeholder'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in placeholder'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      placeholder:
        - '<textarea%0aautofocus%0aonfocus=nx50555>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50555'
