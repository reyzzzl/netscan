id: xss5-1206
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<div style="width:expression(nx51205)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51205'
