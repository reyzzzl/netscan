id: xss5-0237
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<table%0abackground=javascript:nx50236>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50236'
