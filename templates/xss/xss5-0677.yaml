id: xss5-0677
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<input%09type=image%09formaction=javascript:nx50676>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50676'
