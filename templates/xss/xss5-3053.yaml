id: xss5-3053
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<body%09onload=nx53052>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53052'
