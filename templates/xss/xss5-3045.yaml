id: xss5-3045
name: 'Raw XSS5 in name'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in name'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - '<script> merely nx53044 </script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53044'
