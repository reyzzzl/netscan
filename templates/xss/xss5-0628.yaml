id: xss5-0628
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '<body%0aonload=nx50627>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50627'
