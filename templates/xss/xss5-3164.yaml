id: xss5-3164
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<form><button%09formaction=javascript:nx53163>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53163'
