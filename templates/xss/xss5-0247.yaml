id: xss5-0247
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<video%09><source%09onerror=nx50246>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50246'
