id: xss5-3953
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<script>alert(String.fromCharCode(nx53952))</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53952'
