id: xss8-0675
name: 'Raw XSS8 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<marquee onstart=nx80674%0a>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx80674'
