id: xss5-3148
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '''><svg%09onload=nx53147>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53147'
