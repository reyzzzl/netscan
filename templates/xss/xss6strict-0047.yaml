id: xss6strict-0047
name: 'Strict raw XSS in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      comment:
        - '<video><source onerror=sx60046>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx60046'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx60046'
