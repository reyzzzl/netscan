id: xss5-1529
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<script>alert(String.fromCharCode(nx51528))</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51528'
