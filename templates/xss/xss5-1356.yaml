id: xss5-1356
name: 'Raw XSS5 in placeholder'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in placeholder'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      placeholder:
        - '<xss%0d%0astyle=x%0d%0aonfocusin=nx51355 tabindex=1>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51355'
