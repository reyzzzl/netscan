id: xss3-324
name: 'Raw XSS3 #23 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<keygen%09autofocus%09onfocus=nx3323>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx3323'
