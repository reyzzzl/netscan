id: xss5-0751
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<video%0a><source%0aonerror=nx50750>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50750'
