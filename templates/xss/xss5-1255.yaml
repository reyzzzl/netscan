id: xss5-1255
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<xss%0d%0astyle=x%0d%0aonfocusin=nx51254 tabindex=1>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51254'
