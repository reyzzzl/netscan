id: xss5-3080
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '<keygen%09autofocus%09onfocus=nx53079>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53079'
