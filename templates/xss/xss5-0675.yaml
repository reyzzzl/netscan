id: xss5-0675
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<frameset%0aonload=nx50674>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50674'
