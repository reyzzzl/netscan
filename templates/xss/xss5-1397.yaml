id: xss5-1397
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - 'jaVasCript%3anx51396'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51396'
