id: xss5-2427
name: 'Raw XSS5 in subject'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in subject'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      subject:
        - '<svg/onload=nx52426>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52426'
