id: xss5-0194
name: 'Raw XSS5 in label'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in label'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      label:
        - '<map><area%0ahref=javascript:nx50193></map>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50193'
