id: xss8-0737
name: 'Raw XSS8 in lastname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in lastname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      lastname:
        - '<audio src=x onerror=nx80736>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx80736'
