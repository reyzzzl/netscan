id: xss5-2952
name: 'Raw XSS5 in subtext'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in subtext'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      subtext:
        - '<body%09onload=nx52951>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52951'
