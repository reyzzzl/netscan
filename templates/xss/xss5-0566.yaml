id: xss5-0566
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<wbr%09onmouseover=nx50565>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50565'
