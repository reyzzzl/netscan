id: xss5-1961
name: 'Raw XSS5 in q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<xss%0astyle=x%0aonpointerover=nx51960>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51960'
