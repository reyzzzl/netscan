id: xss5-3033
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<svg/onload=nx53032>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53032'
