id: xss5-3659
name: 'Raw XSS5 in phone'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in phone'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      phone:
        - '<body%09onload=nx53658>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53658'
