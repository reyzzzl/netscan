id: xss5-2963
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<form%0aaction=javascript:nx52962><input type=submit>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52962'
