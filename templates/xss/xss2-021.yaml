id: xss2-021
name: 'Reflected XSS2 ctx-20 via message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '</style><script>alert(nx2020)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx2020'
