id: xss5-2068
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '<select%0aautofocus%0aonfocus=nx52067>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52067'
