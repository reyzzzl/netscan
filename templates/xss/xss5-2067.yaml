id: xss5-2067
name: 'Raw XSS5 in subject'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in subject'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      subject:
        - '<audio%0asrc=x%0aonerror=nx52066>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52066'
