id: xss5-2124
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<svg/onload=nx52123>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52123'
