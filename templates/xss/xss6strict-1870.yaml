id: xss6strict-1870
name: 'Strict raw XSS in details'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      details:
        - '<input autofocus onfocus=sx61869>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx61869'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx61869'
