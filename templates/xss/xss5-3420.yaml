id: xss5-3420
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - 'data%3atext/html,nx53419'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53419'
