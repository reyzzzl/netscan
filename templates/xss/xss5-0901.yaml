id: xss5-0901
name: 'Raw XSS5 in city'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in city'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      city:
        - '<map><area%0ahref=javascript:nx50900></map>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50900'
