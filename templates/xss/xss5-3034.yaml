id: xss5-3034
name: 'Raw XSS5 in label'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in label'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      label:
        - '<svg%0d%0aonload=nx53033>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53033'
