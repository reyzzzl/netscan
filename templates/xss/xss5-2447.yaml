id: xss5-2447
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<body%09onload=nx52446>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52446'
