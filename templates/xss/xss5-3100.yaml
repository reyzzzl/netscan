id: xss5-3100
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<isindex%09formaction=javascript:nx53099>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53099'
