id: xss7strict-1420
name: 'Strict breakout XSS in address'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      address:
        - '<table background=javascript:sx71419>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx71419'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx71419'
