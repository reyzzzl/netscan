id: xss5-2229
name: 'Raw XSS5 in summary'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in summary'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      summary:
        - '<image src=x onerror=nx52228>'
