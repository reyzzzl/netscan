id: xss5-3243
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<ScRiPt%0a>alert(nx53242)</ScRiPt>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53242'
