id: xss5-1758
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<xss%09style=x%09onauxclick=nx51757>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51757'
