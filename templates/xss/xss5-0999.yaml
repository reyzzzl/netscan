id: xss5-0999
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<a%09href=javascript:nx50998>click'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50998'
