id: xss5-0959
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<keygen%09autofocus%09onfocus=nx50958>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50958'
