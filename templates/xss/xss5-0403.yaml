id: xss5-0403
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<esi:include%09src=nx50402>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50402'
