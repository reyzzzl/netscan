id: xss5-3180
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<select%09autofocus%09onfocus=nx53179>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53179'
