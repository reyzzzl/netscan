id: xss5-0100
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<esi:include%09src=nx50099>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50099'
