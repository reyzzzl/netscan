id: xss-079
name: 'Reflected XSS ctx-20 via query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '{{nx078c}}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx078c'
