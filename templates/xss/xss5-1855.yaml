id: xss5-1855
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<iframe%09src=javascript:nx51854>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51854'
