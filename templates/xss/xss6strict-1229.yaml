id: xss6strict-1229
name: 'Strict raw XSS in summary'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      summary:
        - '<select autofocus onfocus=sx61228>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx61228'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx61228'
