id: xss5-0355
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<input%09autofocus%09onfocus=nx50354>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50354'
