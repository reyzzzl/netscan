id: xss5-1060
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<keygen%09autofocus%09onfocus=nx51059>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51059'
