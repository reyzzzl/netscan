id: xss5-1477
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<bgsound%0asrc=javascript:nx51476>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51476'
