id: xss5-3607
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<div%09onpointerenter=nx53606>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53606'
