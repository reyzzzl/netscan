id: xss5-0127
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<details%0aopen%0aontoggle=nx50126>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50126'
