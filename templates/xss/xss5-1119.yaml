id: xss5-1119
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<script%0a>alert(nx51118)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51118'
