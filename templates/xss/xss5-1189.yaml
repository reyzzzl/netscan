id: xss5-1189
name: 'Raw XSS5 in summary'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in summary'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      summary:
        - '<table%09background=data:text/html,nx51188>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51188'
