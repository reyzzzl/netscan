id: xss5-1278
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<base%09href=javascript:nx51277>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51277'
