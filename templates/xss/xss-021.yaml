id: xss-021
name: 'Reflected XSS ctx-20 via q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '{{nx020c}}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx020c'
