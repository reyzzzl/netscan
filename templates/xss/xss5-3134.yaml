id: xss5-3134
name: 'Raw XSS5 in data'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in data'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      data:
        - '<svg/onload=nx53133>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53133'
