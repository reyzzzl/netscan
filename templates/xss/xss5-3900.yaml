id: xss5-3900
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<bgsound%09src=javascript:nx53899>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53899'
