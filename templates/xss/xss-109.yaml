id: xss-109
name: 'Reflected XSS ctx-21 via query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '${nx108c}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx108c'
