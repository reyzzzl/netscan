id: xss5-0436
name: 'Raw XSS5 in placeholder'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in placeholder'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      placeholder:
        - '<embed%0asrc=data:text/html,nx50435>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50435'
