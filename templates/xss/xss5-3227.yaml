id: xss5-3227
name: 'Raw XSS5 in subject'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in subject'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      subject:
        - '<div style="-moz-binding:url(''javascript:nx53226'')">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53226'
