id: xss5-2449
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<details%09open%09ontoggle=nx52448>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52448'
