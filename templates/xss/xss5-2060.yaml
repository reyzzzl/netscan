id: xss5-2060
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<math><mtext%0ahref=javascript:nx52059>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52059'
