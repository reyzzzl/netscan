id: xss5-2677
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<textarea%0aautofocus%0aonfocus=nx52676>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52676'
