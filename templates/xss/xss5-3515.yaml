id: xss5-3515
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<svg><animate%0aonbegin=nx53514 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53514'
