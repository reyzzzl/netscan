id: xss5-3687
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<textarea%0aautofocus%0aonfocus=nx53686>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53686'
