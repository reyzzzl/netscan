id: xss-116
name: 'Reflected XSS ctx-28 via message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<video><source onerror=nx115c>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx115c'
