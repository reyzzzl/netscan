id: xss5-2365
name: 'Raw XSS5 in name'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in name'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - '<xss%0astyle=x%0aonpointerover=nx52364>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52364'
