id: xss5-0975
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<base%09href=javascript:nx50974>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50974'
