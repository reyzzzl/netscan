id: xss5-2329
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<img%0asrc=x%0aonerror=nx52328>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52328'
