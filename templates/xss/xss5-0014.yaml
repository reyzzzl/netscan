id: xss5-0014
name: 'Raw XSS5 in data'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in data'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      data:
        - '<script>alert(String.fromCharCode(nx50013))</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50013'
