id: xss5-3000
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '<input%09type=image%09formaction=javascript:nx52999>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52999'
