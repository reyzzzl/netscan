id: xss5-2006
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - 'data%3atext/html,nx52005'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52005'
