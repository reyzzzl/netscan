id: xss5-0164
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<bgsound%0asrc=javascript:nx50163>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50163'
