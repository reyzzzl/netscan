id: xss4-285
name: 'Raw XSS4 #4 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<script>prompt(nx4284)</script>'
    matchers:
