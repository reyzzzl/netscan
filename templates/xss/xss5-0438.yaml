id: xss5-0438
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<form%0aaction=javascript:nx50437><input type=submit>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50437'
