id: xss5-3631
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<div style="-moz-binding:url(''javascript:nx53630'')">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53630'
