id: xss5-2998
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<frameset%0aonload=nx52997>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52997'
