id: xss5-3112
name: 'Raw XSS5 in subtext'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in subtext'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      subtext:
        - '<math%09href=javascript:nx53111>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53111'
