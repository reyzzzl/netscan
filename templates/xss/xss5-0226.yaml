id: xss5-0226
name: 'Raw XSS5 in website'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in website'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      website:
        - '<body%0d%0aonload=nx50225>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50225'
