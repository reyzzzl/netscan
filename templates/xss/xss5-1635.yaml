id: xss5-1635
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '''><img%0asrc=x%0aonerror=nx51634>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51634'
