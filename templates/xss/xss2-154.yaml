id: xss2-154
name: 'Reflected XSS2 ctx-3 via keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<body onpageshow=alert(nx2153)>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx2153'
