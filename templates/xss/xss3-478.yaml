id: xss3-478
name: 'Raw XSS3 #27 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '#{nx3477}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx3477'
