id: xss5-0080
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '<svg><animate%09onbegin=nx50079 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50079'
