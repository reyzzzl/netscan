id: xss5-1596
name: 'Raw XSS5 in placeholder'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in placeholder'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      placeholder:
        - '<svg><animate%0aonbegin=nx51595 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51595'
