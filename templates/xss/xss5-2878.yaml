id: xss5-2878
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<keygen%09autofocus%09onfocus=nx52877>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52877'
