id: xss5-0543
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '<iframe%0asrcdoc=<script>nx50542</script>>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50542'
