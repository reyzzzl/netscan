id: xss5-3041
name: 'Raw XSS5 in q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<ScRiPt%0a>alert(nx53040)</ScRiPt>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53040'
