id: xss5-2538
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<script%00>alert(nx52537)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52537'
