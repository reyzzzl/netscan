id: xss5-3838
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<xsl:value-of%09select=nx53837>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53837'
