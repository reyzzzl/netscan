id: xss6strict-0810
name: 'Strict raw XSS in text'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      text:
        - '<input autofocus onfocus=sx60809>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx60809'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx60809'
