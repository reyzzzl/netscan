id: xss5-0519
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<script>alert(String.fromCharCode(nx50518))</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50518'
