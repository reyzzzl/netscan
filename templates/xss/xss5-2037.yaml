id: xss5-2037
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '''><svg%09onload=nx52036>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52036'
