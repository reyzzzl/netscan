id: xss5-1673
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '#{nx51672}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51672'
