id: xss5-3013
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - 'jaVasCript%3anx53012'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53012'
