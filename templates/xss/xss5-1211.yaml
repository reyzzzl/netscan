id: xss5-1211
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<esi:include%09src=nx51210>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51210'
