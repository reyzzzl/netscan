id: xss-004
name: 'Reflected XSS ctx-3 via keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<img src=x onerror=nx003c>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx003c'
