id: xss6strict-1221
name: 'Strict raw XSS in city'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      city:
        - '<svg onload=sx61220>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx61220'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx61220'
