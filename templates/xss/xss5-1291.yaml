id: xss5-1291
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<td%0abackground=data:text/html,nx51290>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51290'
