id: xss5-2016
name: 'Raw XSS5 in firstname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in firstname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      firstname:
        - '<svg style="behavior:url(nx52015)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52015'
