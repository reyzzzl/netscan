id: xss5-2046
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<details%0aopen%0aontoggle=nx52045>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52045'
