id: xss5-3677
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<xss%09style=x%09onauxclick=nx53676>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53676'
