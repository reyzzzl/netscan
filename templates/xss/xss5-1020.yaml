id: xss5-1020
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<script%0d>alert(nx51019)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51019'
