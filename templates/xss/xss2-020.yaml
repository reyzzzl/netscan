id: xss2-020
name: 'Reflected XSS2 ctx-19 via name'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in name'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - '</title><script>alert(nx2019)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx2019'
