id: xss5-2767
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<math><mtext%0ahref=javascript:nx52766>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52766'
