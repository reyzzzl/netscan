id: xss5-0133
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<embed%0asrc=data:text/html,nx50132>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50132'
