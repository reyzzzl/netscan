id: xss5-2663
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '<iframe%09src=javascript:nx52662>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52662'
