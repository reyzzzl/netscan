id: xss5-2085
name: 'Raw XSS5 in name'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in name'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - '<meta%09http-equiv=refresh%09content="0;javascript:nx52084">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52084'
