id: xss5-2263
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '<xss%09style=x%09onauxclick=nx52262>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52262'
