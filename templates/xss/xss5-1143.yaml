id: xss5-1143
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '<embed%0asrc=data:text/html,nx51142>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51142'
