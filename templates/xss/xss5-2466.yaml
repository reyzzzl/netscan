id: xss5-2466
name: 'Raw XSS5 in website'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in website'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      website:
        - '<xss%0astyle=x%0aonpointerover=nx52465>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52465'
