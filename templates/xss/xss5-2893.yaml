id: xss5-2893
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<meta%09http-equiv=refresh%09content="0;javascript:nx52892">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52892'
