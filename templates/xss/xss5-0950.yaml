id: xss5-0950
name: 'Raw XSS5 in details'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in details'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      details:
        - '<xss%09style=x%09onauxclick=nx50949>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50949'
