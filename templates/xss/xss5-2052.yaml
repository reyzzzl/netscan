id: xss5-2052
name: 'Raw XSS5 in term'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in term'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      term:
        - '<embed%0asrc=data:text/html,nx52051>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52051'
