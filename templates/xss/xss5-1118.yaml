id: xss5-1118
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<image src=x onerror=nx51117>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51117'
