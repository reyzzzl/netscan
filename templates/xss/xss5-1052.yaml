id: xss5-1052
name: 'Raw XSS5 in term'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in term'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      term:
        - '<xss%0astyle=x%0aonpointerover=nx51051>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51051'
