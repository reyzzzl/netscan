id: xss5-2748
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '</title><svg%09onload=nx52747>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52747'
