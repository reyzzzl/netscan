id: xss-135
name: 'Reflected XSS ctx-18 via name'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in name'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - '<object data=javascript:nx134c>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx134c'
