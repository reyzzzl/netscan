id: xss5-3008
name: 'Raw XSS5 in title'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in title'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      title:
        - '<td%0abackground=data:text/html,nx53007>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53007'
