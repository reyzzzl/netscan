id: xss5-0921
name: 'Raw XSS5 in q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<sCrIpT%09>alert(nx50920)</sCrIpT>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50920'
