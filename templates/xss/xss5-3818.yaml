id: xss5-3818
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<svg><animate%0aonbegin=nx53817 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53817'
