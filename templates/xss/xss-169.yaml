id: xss-169
name: 'Reflected XSS ctx-23 via query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '#{nx168c}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx168c'
