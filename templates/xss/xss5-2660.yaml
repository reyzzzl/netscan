id: xss5-2660
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<form%0aaction=javascript:nx52659><input type=submit>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52659'
