id: xss5-0660
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '{{nx50659}}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50659'
