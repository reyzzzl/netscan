id: xss5-0918
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<script%09>alert(nx50917)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50917'
