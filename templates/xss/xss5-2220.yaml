id: xss5-2220
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<!--#include virtual="nx52219"-->'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52219'
