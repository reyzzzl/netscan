id: xss-187
name: 'Reflected XSS ctx-12 via comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - 'javascript:nx186c'
    matchers:
      - type: word
        part: body
        words:
          - 'nx186c'
