id: xss5-1818
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<xsl:value-of%09select=nx51817>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51817'
