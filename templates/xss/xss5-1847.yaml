id: xss5-1847
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<object%09data=javascript:nx51846>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51846'
