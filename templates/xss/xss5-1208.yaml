id: xss5-1208
name: 'Raw XSS5 in title'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in title'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      title:
        - '<svg style="behavior:url(nx51207)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51207'
