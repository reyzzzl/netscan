id: xss5-2335
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<sCrIpT%09>alert(nx52334)</sCrIpT>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52334'
