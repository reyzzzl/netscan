id: xss5-1526
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<ScRiPt%0a>alert(nx51525)</ScRiPt>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51525'
