id: xss6strict-1204
name: 'Strict raw XSS in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      keyword:
        - '<details open ontoggle=sx61203>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx61203'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx61203'
