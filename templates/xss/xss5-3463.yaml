id: xss5-3463
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '<object%09data=javascript:nx53462>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53462'
