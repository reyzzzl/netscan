id: xss5-3437
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<svg/onload=nx53436>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53436'
