id: xss6strict-1066
name: 'Strict raw XSS in website'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      website:
        - '<marquee onstart=sx61065>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx61065'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx61065'
