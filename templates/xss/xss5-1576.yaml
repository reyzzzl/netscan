id: xss5-1576
name: 'Raw XSS5 in firstname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in firstname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      firstname:
        - '<wbr%09onmouseover=nx51575>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51575'
