id: xss5-0753
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<audio%09src=x%09onerror=nx50752>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50752'
