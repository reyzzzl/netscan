id: xss5-3604
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<frameset%0aonload=nx53603>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53603'
