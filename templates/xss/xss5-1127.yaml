id: xss5-1127
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '"><svg%0aonload=nx51126>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51126'
