id: xss5-1871
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<button%0aautofocus%0aonfocus=nx51870>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51870'
