id: xss5-2645
name: 'Raw XSS5 in name'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in name'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - '''><img%0asrc=x%0aonerror=nx52644>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52644'
