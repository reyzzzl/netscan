id: xss5-0517
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<sCrIpT%09>alert(nx50516)</sCrIpT>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50516'
