id: xss5-0235
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<form><button%09formaction=javascript:nx50234>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50234'
