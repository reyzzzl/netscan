id: xss5-2369
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<audio%09src=x%09onerror=nx52368>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52368'
