id: xss5-1100
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<a%09href=javascript:nx51099>click'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51099'
