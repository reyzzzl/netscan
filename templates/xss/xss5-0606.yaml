id: xss5-0606
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<xsl:value-of%09select=nx50605>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50605'
