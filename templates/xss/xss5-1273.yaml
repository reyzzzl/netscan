id: xss5-1273
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<wbr%09onmouseover=nx51272>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51272'
