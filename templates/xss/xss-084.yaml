id: xss-084
name: 'Reflected XSS ctx-25 via keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - ''';alert(nx083c);//'
    matchers:
      - type: word
        part: body
        words:
          - 'nx083c'
