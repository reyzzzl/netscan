id: xss5-0873
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<meta%09http-equiv=refresh%09content="0;javascript:nx50872">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50872'
