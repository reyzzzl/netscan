id: xss5-3246
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<script>alert(String.fromCharCode(nx53245))</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53245'
