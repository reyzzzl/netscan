id: xss5-3123
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<map><area%0ahref=javascript:nx53122></map>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53122'
