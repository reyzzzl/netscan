id: xss5-3018
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - 'mhtml%3ahttp://x!nx53017'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53017'
