id: xss5-2076
name: 'Raw XSS5 in placeholder'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in placeholder'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      placeholder:
        - '<%= nx52075 %>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52075'
