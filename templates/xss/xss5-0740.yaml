id: xss5-0740
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<form><button%09formaction=javascript:nx50739>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50739'
