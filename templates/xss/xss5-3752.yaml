id: xss5-3752
name: 'Raw XSS5 in subtext'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in subtext'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      subtext:
        - '<script> merely nx53751 </script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53751'
