id: xss5-2010
name: 'Raw XSS5 in text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '<a%0ahref=data:text/html,nx52009>click'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52009'
