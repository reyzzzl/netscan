id: xss5-3124
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<style>@import ''javascript:nx53123'';</style>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53123'
