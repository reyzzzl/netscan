id: xss5-0032
name: 'Raw XSS5 in subtext'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in subtext'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      subtext:
        - '<embed%0asrc=data:text/html,nx50031>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50031'
