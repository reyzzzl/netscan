id: xss5-1627
name: 'Raw XSS5 in subject'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in subject'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      subject:
        - '<ScRiPt%0a>alert(nx51626)</ScRiPt>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51626'
