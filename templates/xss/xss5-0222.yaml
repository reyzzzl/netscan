id: xss5-0222
name: 'Raw XSS5 in country'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in country'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      country:
        - '</textarea><svg%0aonload=nx50221>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50221'
