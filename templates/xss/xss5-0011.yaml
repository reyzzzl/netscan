id: xss5-0011
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<ScRiPt%0a>alert(nx50010)</ScRiPt>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50010'
