id: xss5-1959
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<math><mtext%0ahref=javascript:nx51958>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51958'
