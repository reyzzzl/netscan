id: strict-011
name: 'Strict raw XSS via search'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      search:
        - '<svg onload=sx010>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx010'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx010'
