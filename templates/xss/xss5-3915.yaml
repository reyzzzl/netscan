id: xss5-3915
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<details%0aontoggle=nx53914>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53914'
