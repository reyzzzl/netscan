id: xss5-3110
name: 'Raw XSS5 in details'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in details'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      details:
        - '<svg><animate%09onbegin=nx53109 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53109'
