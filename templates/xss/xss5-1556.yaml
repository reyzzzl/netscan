id: xss5-1556
name: 'Raw XSS5 in placeholder'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in placeholder'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      placeholder:
        - '<xss%09style=x%09onauxclick=nx51555>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51555'
