id: xss5-2001
name: 'Raw XSS5 in q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<math%09href=javascript:nx52000>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52000'
