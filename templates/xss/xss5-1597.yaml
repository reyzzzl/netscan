id: xss5-1597
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<math%09href=javascript:nx51596>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51596'
