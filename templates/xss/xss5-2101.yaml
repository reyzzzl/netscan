id: xss5-2101
name: 'Raw XSS5 in city'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in city'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      city:
        - '<svg><animate%0aonbegin=nx52100 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52100'
