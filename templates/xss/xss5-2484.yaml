id: xss5-2484
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<wbr%0aonmouseover=nx52483>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52483'
