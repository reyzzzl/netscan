id: xss5-1942
name: 'Raw XSS5 in country'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in country'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      country:
        - '<body%09onload=nx51941>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51941'
