id: xss5-3380
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<audio%0asrc=x%0aonerror=nx53379>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53379'
