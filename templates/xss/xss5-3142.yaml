id: xss5-3142
name: 'Raw XSS5 in country'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in country'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      country:
        - '<ScRiPt%0a>alert(nx53141)</ScRiPt>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53141'
