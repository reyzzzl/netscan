id: xss8-1581
name: 'Raw XSS8 in city'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in city'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      city:
        - '<svg onload=nx81580/>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx81580'
