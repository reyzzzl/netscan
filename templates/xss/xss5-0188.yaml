id: xss5-0188
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - 'data%3atext/html,nx50187'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50187'
