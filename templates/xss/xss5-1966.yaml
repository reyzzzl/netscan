id: xss5-1966
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<audio%0asrc=x%0aonerror=nx51965>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51965'
