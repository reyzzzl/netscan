id: xss5-0236
name: 'Raw XSS5 in placeholder'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in placeholder'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      placeholder:
        - '<form%0aaction=javascript:nx50235><input type=submit>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50235'
