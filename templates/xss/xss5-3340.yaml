id: xss5-3340
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<image src=x onerror=nx53339>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53339'
