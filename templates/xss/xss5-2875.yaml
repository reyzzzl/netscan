id: xss5-2875
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<audio%0asrc=x%0aonerror=nx52874>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52874'
