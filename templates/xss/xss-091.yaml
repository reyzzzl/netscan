id: xss-091
name: 'Reflected XSS ctx-3 via q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<img src=x onerror=nx090c>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx090c'
