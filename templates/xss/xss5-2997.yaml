id: xss5-2997
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<frame%09src=javascript:nx52996>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52996'
