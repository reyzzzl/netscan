id: xss5-1982
name: 'Raw XSS5 in country'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in country'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      country:
        - '<bgsound%0asrc=javascript:nx51981>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51981'
