id: xss5-2700
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<p%09oncopy=nx52699>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52699'
