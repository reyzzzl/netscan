id: xss7strict-1501
name: 'Strict breakout XSS in city'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      city:
        - '"><svg onload=sx71500>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx71500'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx71500'
