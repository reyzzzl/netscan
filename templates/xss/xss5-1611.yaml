id: xss5-1611
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<div style="-moz-binding:url(''javascript:nx51610'')">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51610'
