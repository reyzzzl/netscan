id: xss5-1913
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<div style="width:expression(nx51912)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51912'
