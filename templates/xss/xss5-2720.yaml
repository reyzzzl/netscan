id: xss5-2720
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '<style>@import ''javascript:nx52719'';</style>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52719'
