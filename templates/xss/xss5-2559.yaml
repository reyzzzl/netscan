id: xss5-2559
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<form%0aaction=javascript:nx52558><input type=submit>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52558'
