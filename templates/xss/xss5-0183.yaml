id: xss5-0183
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '<math%09href=javascript:nx50182>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50182'
