id: xss5-0351
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<select%0aautofocus%0aonfocus=nx50350>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50350'
