id: xss5-1320
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '<image src=x onerror=nx51319>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51319'
