id: xss5-1523
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<script%0a>alert(nx51522)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51522'
