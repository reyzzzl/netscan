id: xss5-1813
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<div style="-moz-binding:url(''javascript:nx51812'')">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51812'
