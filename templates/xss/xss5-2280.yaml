id: xss5-2280
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '{{&nx52279}}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52279'
