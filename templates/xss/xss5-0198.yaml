id: xss5-0198
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<svg style="behavior:url(nx50197)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50197'
