id: xss5-0818
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<script%0d>alert(nx50817)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50817'
