id: xss5-1281
name: 'Raw XSS5 in q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<frameset%0aonload=nx51280>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51280'
