id: xss5-3044
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<script>alert(String.fromCharCode(nx53043))</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53043'
