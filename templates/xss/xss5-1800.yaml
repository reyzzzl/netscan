id: xss5-1800
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '<mi%0ahref=javascript:nx51799>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51799'
