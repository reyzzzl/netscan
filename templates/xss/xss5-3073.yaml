id: xss5-3073
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<xss%0d%0astyle=x%0d%0aonfocusin=nx53072 tabindex=1>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53072'
