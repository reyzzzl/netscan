id: xss4-295
name: 'Raw XSS4 #14 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<summary onfocus=alert(nx4294)>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx4294'
