id: xss5-2127
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<img%0asrc=x%0aonerror=nx52126>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52126'
