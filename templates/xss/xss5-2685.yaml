id: xss5-2685
name: 'Raw XSS5 in name'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in name'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - '{{{nx52684}}}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52684'
