id: xss5-3109
name: 'Raw XSS5 in summary'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in summary'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      summary:
        - '<td%0abackground=data:text/html,nx53108>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53108'
