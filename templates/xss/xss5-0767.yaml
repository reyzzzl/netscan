id: xss5-0767
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<wbr%0aonmouseover=nx50766>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50766'
