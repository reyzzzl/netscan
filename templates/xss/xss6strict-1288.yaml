id: xss6strict-1288
name: 'Strict raw XSS in title'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      title:
        - '<audio src=x onerror=sx61287>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx61287'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx61287'
