id: xss5-1388
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '<p%0aoncut=nx51387>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51387'
