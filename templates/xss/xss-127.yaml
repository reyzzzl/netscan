id: xss-127
name: 'Reflected XSS ctx-10 via comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<details open ontoggle=nx126c>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx126c'
