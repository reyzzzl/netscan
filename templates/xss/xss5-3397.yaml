id: xss5-3397
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<link%09rel=stylesheet%09href=javascript:nx53396>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53396'
