id: xss5-0115
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<script>alert(String.fromCharCode(nx50114))</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50114'
