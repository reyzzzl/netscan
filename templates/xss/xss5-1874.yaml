id: xss5-1874
name: 'Raw XSS5 in label'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in label'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      label:
        - '<%= nx51873 %>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51873'
