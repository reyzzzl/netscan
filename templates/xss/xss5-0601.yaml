id: xss5-0601
name: 'Raw XSS5 in q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<div style="-moz-binding:url(''javascript:nx50600'')">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50600'
