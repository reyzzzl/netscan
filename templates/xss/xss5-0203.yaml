id: xss5-0203
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<svg%0aonload=nx50202>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50202'
