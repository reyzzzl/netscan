id: xss5-3879
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<xss%09style=x%09onauxclick=nx53878>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53878'
