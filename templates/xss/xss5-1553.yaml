id: xss5-1553
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<iframe%0asrcdoc=<script>nx51552</script>>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51552'
