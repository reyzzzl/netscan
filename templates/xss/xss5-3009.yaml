id: xss5-3009
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<svg><animate%09onbegin=nx53008 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53008'
