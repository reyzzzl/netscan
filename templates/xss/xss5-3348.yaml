id: xss5-3348
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '<script> merely nx53347 </script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53347'
