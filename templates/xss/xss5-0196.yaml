id: xss5-0196
name: 'Raw XSS5 in placeholder'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in placeholder'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      placeholder:
        - '<div style="width:expression(nx50195)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50195'
