id: xss5-2117
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<svg style="behavior:url(nx52116)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52116'
