id: xss5-2017
name: 'Raw XSS5 in lastname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in lastname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      lastname:
        - '<!--#exec cmd="echo nx52016"-->'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52016'
