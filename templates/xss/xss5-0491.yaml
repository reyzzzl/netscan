id: xss5-0491
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - 'data%3atext/html,nx50490'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50490'
