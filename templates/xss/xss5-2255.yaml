id: xss5-2255
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<form><button%09formaction=javascript:nx52254>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52254'
