id: xss5-1220
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<script%0a>alert(nx51219)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51219'
