id: xss7strict-0737
name: 'Strict breakout XSS in lastname'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      lastname:
        - '<iframe srcdoc=<script>sx70736</script>>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx70736'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx70736'
