id: xss5-3433
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<esi:include%09src=nx53432>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53432'
