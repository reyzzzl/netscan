id: xss7strict-0048
name: 'Strict breakout XSS in title'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      title:
        - '<object data=javascript:sx70047>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx70047'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx70047'
