id: xss5-2535
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<script%0d>alert(nx52534)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52534'
