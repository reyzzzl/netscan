id: xss5-1566
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<textarea%0aautofocus%0aonfocus=nx51565>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51565'
