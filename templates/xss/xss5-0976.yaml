id: xss5-0976
name: 'Raw XSS5 in firstname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in firstname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      firstname:
        - '<applet%0acode=javascript:nx50975>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50975'
