id: xss7strict-1390
name: 'Strict breakout XSS in details'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      details:
        - '<table background=javascript:sx71389>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx71389'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx71389'
