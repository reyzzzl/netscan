id: xss5-1234
name: 'Raw XSS5 in label'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in label'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      label:
        - '<body%0aonload=nx51233>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51233'
