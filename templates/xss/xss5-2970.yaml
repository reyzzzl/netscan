id: xss5-2970
name: 'Raw XSS5 in text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '<xss%09style=x%09onauxclick=nx52969>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52969'
