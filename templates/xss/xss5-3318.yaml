id: xss5-3318
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - 'JaVaScRiPt%3anx53317'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53317'
