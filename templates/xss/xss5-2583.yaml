id: xss5-2583
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '{{&nx52582}}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52582'
