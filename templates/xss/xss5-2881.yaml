id: xss5-2881
name: 'Raw XSS5 in q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<button%0aautofocus%0aonfocus=nx52880>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52880'
