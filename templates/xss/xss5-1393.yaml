id: xss5-1393
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<svg><animate%09onbegin=nx51392 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51392'
