id: xss5-1124
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<script%00>alert(nx51123)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51123'
