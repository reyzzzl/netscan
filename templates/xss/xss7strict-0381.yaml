id: xss7strict-0381
name: 'Strict breakout XSS in city'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      city:
        - '"><svg onload=sx70380>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx70380'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx70380'
