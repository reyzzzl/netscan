id: xss5-3028
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '<!--#include virtual="nx53027"-->'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53027'
