id: xss5-0713
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<img%0asrc=x%0aonerror=nx50712>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50712'
