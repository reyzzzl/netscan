id: xss5-3274
name: 'Raw XSS5 in label'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in label'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      label:
        - '<xss%0astyle=x%0aonpointerover=nx53273>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53273'
