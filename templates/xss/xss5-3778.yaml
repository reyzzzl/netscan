id: xss5-3778
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<xss%09style=x%09onauxclick=nx53777>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53777'
