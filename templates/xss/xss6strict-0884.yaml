id: xss6strict-0884
name: 'Strict raw XSS in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      keyword:
        - '<details open ontoggle=sx60883>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx60883'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx60883'
