id: xss5-1540
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<details%09open%09ontoggle=nx51539>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51539'
