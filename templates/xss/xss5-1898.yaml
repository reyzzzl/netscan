id: xss5-1898
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<svg><animate%09onbegin=nx51897 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51897'
