id: xss5-3428
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '<div style="width:expression(nx53427)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53427'
