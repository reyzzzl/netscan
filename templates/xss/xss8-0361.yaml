id: xss8-0361
name: 'Raw XSS8 in q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<svg onload=nx80360>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx80360'
