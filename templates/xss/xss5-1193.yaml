id: xss5-1193
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<math%09href=javascript:nx51192>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51192'
