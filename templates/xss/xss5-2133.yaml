id: xss5-2133
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<sCrIpT%09>alert(nx52132)</sCrIpT>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52132'
