id: xss5-1935
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '"><svg%0aonload=nx51934>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51934'
