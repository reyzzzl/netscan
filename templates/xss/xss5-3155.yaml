id: xss5-3155
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<body%0d%0aonload=nx53154>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53154'
