id: xss5-1079
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<frameset%0aonload=nx51078>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51078'
