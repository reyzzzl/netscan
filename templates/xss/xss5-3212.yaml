id: xss5-3212
name: 'Raw XSS5 in term'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in term'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      term:
        - '<svg><animate%0aonbegin=nx53211 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53211'
