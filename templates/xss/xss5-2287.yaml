id: xss5-2287
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<meta%09http-equiv=refresh%09content="0;javascript:nx52286">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52286'
