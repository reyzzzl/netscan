id: xss5-2238
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '"><svg%0aonload=nx52237>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52237'
