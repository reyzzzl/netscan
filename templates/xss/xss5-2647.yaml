id: xss5-2647
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '</title><svg%09onload=nx52646>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52646'
