id: xss5-3458
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<body%0d%0aonload=nx53457>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53457'
