id: xss4-224
name: 'Raw XSS4 #23 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<frameset onload=alert(nx4223)>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx4223'
