id: xss5-3128
name: 'Raw XSS5 in title'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in title'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      title:
        - '<!--#exec cmd="echo nx53127"-->'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53127'
