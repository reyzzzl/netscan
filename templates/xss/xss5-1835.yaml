id: xss5-1835
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '''><svg%09onload=nx51834>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51834'
