id: xss5-1479
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<meta%09http-equiv=refresh%09content="0;javascript:nx51478">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51478'
