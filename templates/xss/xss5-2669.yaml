id: xss5-2669
name: 'Raw XSS5 in summary'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in summary'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      summary:
        - '<xss%0d%0astyle=x%0d%0aonfocusin=nx52668 tabindex=1>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52668'
