id: xss5-3835
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<!--#exec cmd="echo nx53834"-->'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53834'
