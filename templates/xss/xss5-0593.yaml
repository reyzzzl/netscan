id: xss5-0593
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - 'vbscript%3amsgbox(nx50592)'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50592'
