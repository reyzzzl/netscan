id: xss5-2128
name: 'Raw XSS5 in title'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in title'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      title:
        - '<image src=x onerror=nx52127>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52127'
