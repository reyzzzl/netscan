id: xss5-3527
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<map><area%0ahref=javascript:nx53526></map>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53526'
