id: xss5-2957
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<marquee%09behavior=slide%09onstart=nx52956>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52956'
