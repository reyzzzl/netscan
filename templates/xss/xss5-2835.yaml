id: xss5-2835
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<image src=x onerror=nx52834>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52834'
