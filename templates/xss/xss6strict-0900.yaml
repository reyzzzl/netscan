id: xss6strict-0900
name: 'Strict raw XSS in address'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      address:
        - '<input autofocus onfocus=sx60899>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx60899'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx60899'
