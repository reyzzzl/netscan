id: xss5-1055
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<video%09><source%09onerror=nx51054>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51054'
