id: xss5-1646
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<object%0adata=data:text/html,nx51645>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51645'
