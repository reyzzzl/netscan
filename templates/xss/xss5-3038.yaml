id: xss5-3038
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<script%0a>alert(nx53037)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53037'
