id: xss5-3508
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '<p%09oncopy=nx53507>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53507'
