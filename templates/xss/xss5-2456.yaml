id: xss5-2456
name: 'Raw XSS5 in firstname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in firstname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      firstname:
        - '<embed%0asrc=data:text/html,nx52455>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52455'
