id: xss5-0780
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<div%0aonpointerleave=nx50779>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50779'
