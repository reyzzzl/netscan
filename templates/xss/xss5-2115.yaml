id: xss5-2115
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<div style="width:expression(nx52114)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52114'
