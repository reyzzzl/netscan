id: xss5-2868
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '<math><mtext%0ahref=javascript:nx52867>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52867'
