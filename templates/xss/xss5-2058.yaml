id: xss5-2058
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<iframe%0asrcdoc=<script>nx52057</script>>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52057'
