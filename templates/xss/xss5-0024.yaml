id: xss5-0024
name: 'Raw XSS5 in zip'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in zip'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      zip:
        - '<body%0d%0aonload=nx50023>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50023'
