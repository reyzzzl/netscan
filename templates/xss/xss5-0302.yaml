id: xss5-0302
name: 'Raw XSS5 in country'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in country'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      country:
        - '<esi:include%09src=nx50301>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50301'
