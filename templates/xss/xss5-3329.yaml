id: xss5-3329
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<svg style="behavior:url(nx53328)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53328'
