id: xss5-1983
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '<link%09rel=stylesheet%09href=javascript:nx51982>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51982'
