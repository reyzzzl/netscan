id: xss5-3173
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<xss%0astyle=x%0aonpointerover=nx53172>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53172'
