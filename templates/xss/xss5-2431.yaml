id: xss5-2431
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<image src=x onerror=nx52430>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52430'
