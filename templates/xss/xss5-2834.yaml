id: xss5-2834
name: 'Raw XSS5 in label'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in label'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      label:
        - '<img%0asrc=x%0aonerror=nx52833>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52833'
