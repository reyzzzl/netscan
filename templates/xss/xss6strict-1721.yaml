id: xss6strict-1721
name: 'Strict raw XSS in q'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      q:
        - '<svg onload=sx61720>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx61720'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx61720'
