id: xss5-3272
name: 'Raw XSS5 in subtext'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in subtext'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      subtext:
        - '<math><mtext%0ahref=javascript:nx53271>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53271'
