id: xss5-1809
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<area%09href=javascript:nx51808>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51808'
