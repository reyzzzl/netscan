id: xss5-3117
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - 'data%3atext/html,nx53116'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53116'
