id: xss5-2100
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<svg><animate%09onbegin=nx52099 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52099'
