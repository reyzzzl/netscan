id: xss5-1438
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<body%0d%0aonload=nx51437>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51437'
