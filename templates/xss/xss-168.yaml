id: xss-168
name: 'Reflected XSS ctx-22 via title'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in title'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      title:
        - '<%= nx167c %>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx167c'
