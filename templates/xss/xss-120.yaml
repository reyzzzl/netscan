id: xss-120
name: 'Reflected XSS ctx-3 via text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '<img src=x onerror=nx119c>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx119c'
