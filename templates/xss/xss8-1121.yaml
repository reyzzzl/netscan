id: xss8-1121
name: 'Raw XSS8 in q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<svg onload=nx81120>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx81120'
