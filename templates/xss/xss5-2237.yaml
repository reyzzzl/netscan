id: xss5-2237
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<script> merely nx52236 </script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52236'
