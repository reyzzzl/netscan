id: xss6strict-0012
name: 'Strict raw XSS in term'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      term:
        - '<img src=x onerror=sx60011>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx60011'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx60011'
