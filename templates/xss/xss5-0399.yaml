id: xss5-0399
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<div style="-moz-binding:url(''javascript:nx50398'')">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50398'
