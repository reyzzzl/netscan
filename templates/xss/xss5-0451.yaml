id: xss5-0451
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<audio%0asrc=x%0aonerror=nx50450>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50450'
