id: xss5-3576
name: 'Raw XSS5 in firstname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in firstname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      firstname:
        - '<xss%09style=x%09onauxclick=nx53575>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53575'
