id: xss5-2668
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '<xss%0astyle=x%0aonpointerover=nx52667>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52667'
