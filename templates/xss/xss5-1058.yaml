id: xss5-1058
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<select%0aautofocus%0aonfocus=nx51057>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51057'
