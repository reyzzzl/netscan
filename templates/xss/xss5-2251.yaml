id: xss5-2251
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<object%09data=javascript:nx52250>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52250'
