id: xss5-1259
name: 'Raw XSS5 in phone'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in phone'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      phone:
        - '<audio%0asrc=x%0aonerror=nx51258>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51258'
