id: xss5-0060
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<wbr%0aonmouseover=nx50059>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50059'
