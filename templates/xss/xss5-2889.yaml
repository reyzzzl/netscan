id: xss5-2889
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<wbr%09onmouseover=nx52888>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52888'
