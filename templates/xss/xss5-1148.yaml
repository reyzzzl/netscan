id: xss5-1148
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '<iframe%09src=javascript:nx51147>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51147'
