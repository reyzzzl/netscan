id: xss5-3075
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<video%09><source%09onerror=nx53074>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53074'
