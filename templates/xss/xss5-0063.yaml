id: xss5-0063
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '<bgsound%0asrc=javascript:nx50062>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50062'
