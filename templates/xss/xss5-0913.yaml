id: xss5-0913
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<svg%0d%0aonload=nx50912>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50912'
