id: xss5-0495
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<a%0ahref=data:text/html,nx50494>click'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50494'
