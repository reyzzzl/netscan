id: xss-147
name: 'Reflected XSS ctx-1 via comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '"><script>nx146c</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx146c'
