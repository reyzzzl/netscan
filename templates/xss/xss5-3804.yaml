id: xss5-3804
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<applet%0acode=javascript:nx53803>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53803'
