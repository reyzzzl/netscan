id: xss-098
name: 'Reflected XSS ctx-10 via title'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in title'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      title:
        - '<details open ontoggle=nx097c>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx097c'
