id: xss5-2555
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<object%0adata=data:text/html,nx52554>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52554'
