id: xss5-0483
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<td%0abackground=data:text/html,nx50482>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50482'
