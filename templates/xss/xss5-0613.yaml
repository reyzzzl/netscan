id: xss5-0613
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<image src=x onerror=nx50612>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50612'
