id: xss5-2155
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<form%0aaction=javascript:nx52154><input type=submit>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52154'
