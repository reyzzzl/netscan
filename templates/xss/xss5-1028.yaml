id: xss5-1028
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '"><img%09src=x%09onerror=nx51027>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51027'
