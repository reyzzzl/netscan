id: xss5-2340
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '''><svg%09onload=nx52339>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52339'
