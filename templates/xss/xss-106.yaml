id: xss-106
name: 'Reflected XSS ctx-18 via message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<object data=javascript:nx105c>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx105c'
