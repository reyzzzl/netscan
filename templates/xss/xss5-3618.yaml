id: xss5-3618
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<mi%0ahref=javascript:nx53617>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53617'
