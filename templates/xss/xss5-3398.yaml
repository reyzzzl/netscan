id: xss5-3398
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<meta%09http-equiv=refresh%09content="0;javascript:nx53397">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53397'
