id: xss5-2256
name: 'Raw XSS5 in firstname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in firstname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      firstname:
        - '<form%0aaction=javascript:nx52255><input type=submit>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52255'
