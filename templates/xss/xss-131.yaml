id: xss-131
name: 'Reflected XSS ctx-14 via q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '"><a href=javascript:nx130c>click'
    matchers:
      - type: word
        part: body
        words:
          - 'nx130c'
