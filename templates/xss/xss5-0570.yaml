id: xss5-0570
name: 'Raw XSS5 in text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '<meta%09http-equiv=refresh%09content="0;javascript:nx50569">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50569'
