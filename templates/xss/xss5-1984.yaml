id: xss5-1984
name: 'Raw XSS5 in zip'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in zip'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      zip:
        - '<meta%09http-equiv=refresh%09content="0;javascript:nx51983">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51983'
