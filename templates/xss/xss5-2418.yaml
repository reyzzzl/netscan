id: xss5-2418
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<div style="width:expression(nx52417)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52417'
