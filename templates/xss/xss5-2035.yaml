id: xss5-2035
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<script> merely nx52034 </script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52034'
