id: xss5-0021
name: 'Raw XSS5 in city'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in city'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      city:
        - '</title><svg%09onload=nx50020>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50020'
