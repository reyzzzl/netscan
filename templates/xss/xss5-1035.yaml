id: xss5-1035
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<details%09open%09ontoggle=nx51034>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51034'
