id: xss5-0647
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<xss%09style=x%09onauxclick=nx50646>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50646'
