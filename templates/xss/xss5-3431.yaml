id: xss5-3431
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<!--#exec cmd="echo nx53430"-->'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53430'
