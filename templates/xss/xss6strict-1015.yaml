id: xss6strict-1015
name: 'Strict raw XSS in word'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      word:
        - '<body onload=sx61014>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx61014'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx61014'
