id: xss5-3413
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<svg><animate%09onbegin=nx53412 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53412'
