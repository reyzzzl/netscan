id: xss5-0213
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<ScRiPt%0a>alert(nx50212)</ScRiPt>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50212'
