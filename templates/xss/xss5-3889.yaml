id: xss5-3889
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<textarea%0aautofocus%0aonfocus=nx53888>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53888'
