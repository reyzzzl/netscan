id: xss5-3855
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '''><svg%09onload=nx53854>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53854'
