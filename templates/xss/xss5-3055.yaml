id: xss5-3055
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<details%09open%09ontoggle=nx53054>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53054'
