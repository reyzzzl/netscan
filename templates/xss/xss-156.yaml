id: xss-156
name: 'Reflected XSS ctx-10 via message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<details open ontoggle=nx155c>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx155c'
