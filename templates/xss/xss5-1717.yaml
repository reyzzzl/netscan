id: xss5-1717
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<xsl:value-of%09select=nx51716>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51716'
