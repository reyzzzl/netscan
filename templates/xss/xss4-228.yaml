id: xss4-228
name: 'Raw XSS4 #27 in text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '<xsl:stylesheet xmlns:xsl="x"><xsl:template>alert(nx4227)</xsl:template></xsl:stylesheet>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx4227'
