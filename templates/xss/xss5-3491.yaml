id: xss5-3491
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '#{nx53490}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53490'
