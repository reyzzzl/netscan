id: xss5-2201
name: 'Raw XSS5 in q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<svg><animate%09onbegin=nx52200 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52200'
