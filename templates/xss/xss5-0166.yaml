id: xss5-0166
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<meta%09http-equiv=refresh%09content="0;javascript:nx50165">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50165'
