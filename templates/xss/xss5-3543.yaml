id: xss5-3543
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '<script%0a>alert(nx53542)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53542'
