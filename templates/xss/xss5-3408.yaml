id: xss5-3408
name: 'Raw XSS5 in title'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in title'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      title:
        - '<p%0aoncut=nx53407>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53407'
