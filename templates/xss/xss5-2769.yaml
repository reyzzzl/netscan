id: xss5-2769
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<xss%0astyle=x%0aonpointerover=nx52768>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52768'
