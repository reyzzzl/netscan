id: xss5-0369
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<base%09href=javascript:nx50368>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50368'
