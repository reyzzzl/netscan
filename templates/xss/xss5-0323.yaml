id: xss5-0323
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '</textarea><svg%0aonload=nx50322>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50322'
