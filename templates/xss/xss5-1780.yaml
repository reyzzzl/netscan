id: xss5-1780
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<bgsound%0asrc=javascript:nx51779>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51779'
