id: xss5-3716
name: 'Raw XSS5 in placeholder'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in placeholder'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      placeholder:
        - '<svg><animate%09onbegin=nx53715 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53715'
