id: xss5-2215
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<style>@import ''javascript:nx52214'';</style>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52214'
