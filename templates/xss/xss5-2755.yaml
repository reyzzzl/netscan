id: xss5-2755
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<marquee%09behavior=slide%09onstart=nx52754>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52754'
