id: xss8-0003
name: 'Raw XSS8 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<body onload=nx80002%0a>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx80002'
