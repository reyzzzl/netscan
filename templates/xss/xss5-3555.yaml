id: xss5-3555
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '</textarea><svg%0aonload=nx53554>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53554'
