id: xss5-3300
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<frame%09src=javascript:nx53299>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53299'
