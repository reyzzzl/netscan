id: xss5-2999
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<isindex%09formaction=javascript:nx52998>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52998'
