id: xss-019
name: 'Reflected XSS ctx-18 via query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<object data=javascript:nx018c>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx018c'
