id: xss5-0769
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<bgsound%09src=javascript:nx50768>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50768'
