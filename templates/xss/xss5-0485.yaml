id: xss5-0485
name: 'Raw XSS5 in name'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in name'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - '<svg><animate%0aonbegin=nx50484 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50484'
