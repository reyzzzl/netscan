id: xss5-0686
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<svg><animate%09onbegin=nx50685 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50685'
