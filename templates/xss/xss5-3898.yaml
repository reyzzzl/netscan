id: xss5-3898
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<wbr%0aonmouseover=nx53897>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53897'
