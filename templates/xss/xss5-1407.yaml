id: xss5-1407
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<style>@import ''javascript:nx51406'';</style>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51406'
