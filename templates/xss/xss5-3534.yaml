id: xss5-3534
name: 'Raw XSS5 in data'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in data'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      data:
        - '<esi:include%09src=nx53533>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53533'
