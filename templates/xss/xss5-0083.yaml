id: xss5-0083
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<mi%0ahref=javascript:nx50082>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50082'
