id: xss5-0223
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '</title><svg%09onload=nx50222>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50222'
