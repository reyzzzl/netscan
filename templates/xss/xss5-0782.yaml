id: xss5-0782
name: 'Raw XSS5 in country'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in country'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      country:
        - '<p%0aoncut=nx50781>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50781'
