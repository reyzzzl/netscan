id: xss5-1878
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<wbr%0aonmouseover=nx51877>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51877'
