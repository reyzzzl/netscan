id: xss5-3535
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<xsl:value-of%09select=nx53534>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53534'
