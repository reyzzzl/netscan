id: xss5-0860
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<input%09autofocus%09onfocus=nx50859>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50859'
