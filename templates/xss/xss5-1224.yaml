id: xss5-1224
name: 'Raw XSS5 in zip'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in zip'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      zip:
        - '<sCrIpT%09>alert(nx51223)</sCrIpT>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51223'
