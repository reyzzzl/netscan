id: xss6strict-0009
name: 'Strict raw XSS in query'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      query:
        - '<select autofocus onfocus=sx60008>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx60008'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx60008'
