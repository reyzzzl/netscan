id: xss-154
name: 'Reflected XSS ctx-8 via keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '</script><script>nx153c</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx153c'
