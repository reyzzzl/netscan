id: xss5-1515
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<xsl:value-of%09select=nx51514>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51514'
