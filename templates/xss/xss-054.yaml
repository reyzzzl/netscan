id: xss-054
name: 'Reflected XSS ctx-24 via keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '\";alert(nx053c);//'
    matchers:
      - type: word
        part: body
        words:
          - 'nx053c'
