id: xss6strict-0736
name: 'Strict raw XSS in firstname'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      firstname:
        - '<marquee onstart=sx60735>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx60735'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx60735'
