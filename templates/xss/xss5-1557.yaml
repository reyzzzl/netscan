id: xss5-1557
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<xss%0astyle=x%0aonpointerover=nx51556>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51556'
