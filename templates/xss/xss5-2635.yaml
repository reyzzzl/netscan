id: xss5-2635
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<script%09>alert(nx52634)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52634'
