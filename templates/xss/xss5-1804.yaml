id: xss5-1804
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - 'data%3atext/html,nx51803'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51803'
