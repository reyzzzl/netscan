id: xss5-1828
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '<script%0d>alert(nx51827)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51827'
