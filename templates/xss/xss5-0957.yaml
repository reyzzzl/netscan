id: xss5-0957
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<select%0aautofocus%0aonfocus=nx50956>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50956'
