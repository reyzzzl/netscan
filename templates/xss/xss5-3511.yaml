id: xss5-3511
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<details%0aontoggle=nx53510>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53510'
