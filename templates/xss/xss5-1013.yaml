id: xss5-1013
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<svg/onload=nx51012>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51012'
