id: xss5-2918
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<a%09href=javascript:nx52917>click'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52917'
