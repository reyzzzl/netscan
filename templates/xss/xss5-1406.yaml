id: xss5-1406
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<map><area%0ahref=javascript:nx51405></map>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51405'
