id: xss5-1764
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<audio%0asrc=x%0aonerror=nx51763>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51763'
