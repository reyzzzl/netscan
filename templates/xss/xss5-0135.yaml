id: xss5-0135
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<form%0aaction=javascript:nx50134><input type=submit>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50134'
