id: xss5-0806
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<!--#include virtual="nx50805"-->'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50805'
