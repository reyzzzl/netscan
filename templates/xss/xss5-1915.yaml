id: xss5-1915
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<svg style="behavior:url(nx51914)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51914'
