id: xss5-3062
name: 'Raw XSS5 in country'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in country'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      country:
        - '<embed%0asrc=data:text/html,nx53061>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53061'
