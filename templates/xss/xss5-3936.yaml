id: xss5-3936
name: 'Raw XSS5 in firstname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in firstname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      firstname:
        - '<!--#exec cmd="echo nx53935"-->'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53935'
