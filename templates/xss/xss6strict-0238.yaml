id: xss6strict-0238
name: 'Strict raw XSS in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      suffix:
        - '<audio src=x onerror=sx60237>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx60237'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx60237'
