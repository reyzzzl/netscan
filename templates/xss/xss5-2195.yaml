id: xss5-2195
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<p%09oncopy=nx52194>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52194'
