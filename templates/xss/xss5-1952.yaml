id: xss5-1952
name: 'Raw XSS5 in subtext'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in subtext'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      subtext:
        - '<form><button%09formaction=javascript:nx51951>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51951'
