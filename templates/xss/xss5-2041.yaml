id: xss5-2041
name: 'Raw XSS5 in q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '</title><svg%09onload=nx52040>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52040'
