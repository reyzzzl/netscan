id: xss-199
name: 'Reflected XSS ctx-24 via query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '\";alert(nx198c);//'
    matchers:
      - type: word
        part: body
        words:
          - 'nx198c'
