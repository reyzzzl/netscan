id: xss5-0680
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '<p%09oncopy=nx50679>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50679'
