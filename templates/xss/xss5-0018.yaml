id: xss5-0018
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '"><img%09src=x%09onerror=nx50017>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50017'
