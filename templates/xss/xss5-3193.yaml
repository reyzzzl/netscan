id: xss5-3193
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<bgsound%09src=javascript:nx53192>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53192'
