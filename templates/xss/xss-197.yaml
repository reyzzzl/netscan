id: xss-197
name: 'Reflected XSS ctx-22 via comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<%= nx196c %>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx196c'
