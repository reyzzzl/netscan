id: xss5-3210
name: 'Raw XSS5 in text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '<td%0abackground=data:text/html,nx53209>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53209'
