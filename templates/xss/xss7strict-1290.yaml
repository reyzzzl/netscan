id: xss7strict-1290
name: 'Strict breakout XSS in text'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      text:
        - '<table background=javascript:sx71289>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx71289'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx71289'
