id: xss5-1050
name: 'Raw XSS5 in text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '<math><mtext%0ahref=javascript:nx51049>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51049'
