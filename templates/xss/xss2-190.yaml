id: xss2-190
name: 'Reflected XSS2 ctx-9 via text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '<video><source onerror=alert(nx2189)>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx2189'
