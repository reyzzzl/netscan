id: xss7strict-0373
name: 'Strict breakout XSS in value'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      value:
        - '</div><svg onload=sx70372>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx70372'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx70372'
