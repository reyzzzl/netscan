id: xss5-2597
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<div%09onpointerenter=nx52596>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52596'
