id: xss6strict-0323
name: 'Strict raw XSS in search'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      search:
        - '<script>sx60322>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx60322'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx60322'
