id: xss5-0603
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<!--#exec cmd="echo nx50602"-->'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50602'
