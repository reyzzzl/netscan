id: xss5-1069
name: 'Raw XSS5 in summary'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in summary'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      summary:
        - '{{{nx51068}}}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51068'
