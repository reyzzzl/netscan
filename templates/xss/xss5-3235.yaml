id: xss5-3235
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<svg/onload=nx53234>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53234'
