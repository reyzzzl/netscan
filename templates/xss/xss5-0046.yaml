id: xss5-0046
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<audio%09src=x%09onerror=nx50045>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50045'
