id: xss8-0023
name: 'Raw XSS8 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '<body onload=nx80022%20>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx80022'
