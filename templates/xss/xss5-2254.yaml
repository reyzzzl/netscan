id: xss5-2254
name: 'Raw XSS5 in data'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in data'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      data:
        - '<embed%0asrc=data:text/html,nx52253>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52253'
