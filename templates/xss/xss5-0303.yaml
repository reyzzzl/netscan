id: xss5-0303
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '<xsl:value-of%09select=nx50302>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50302'
