id: xss5-3323
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<a%0ahref=data:text/html,nx53322>click'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53322'
