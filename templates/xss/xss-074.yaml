id: xss-074
name: 'Reflected XSS ctx-15 via keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '''><script>nx073c</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx073c'
