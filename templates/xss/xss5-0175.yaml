id: xss5-0175
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<p%09oncopy=nx50174>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50174'
