id: xss5-2971
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<xss%0astyle=x%0aonpointerover=nx52970>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52970'
