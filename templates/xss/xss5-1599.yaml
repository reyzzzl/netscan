id: xss5-1599
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - 'jaVasCript%3anx51598'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51598'
