id: xss5-3991
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<input%09autofocus%09onfocus=nx53990>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53990'
