id: xss-128
name: 'Reflected XSS ctx-11 via title'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in title'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      title:
        - '<marquee onstart=nx127c>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx127c'
