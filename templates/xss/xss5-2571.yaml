id: xss5-2571
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<audio%09src=x%09onerror=nx52570>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52570'
