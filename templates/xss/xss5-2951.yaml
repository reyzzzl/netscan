id: xss5-2951
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<body%0aonload=nx52950>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52950'
