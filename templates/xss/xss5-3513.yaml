id: xss5-3513
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<td%0abackground=data:text/html,nx53512>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53512'
