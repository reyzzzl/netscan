id: xss5-1077
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<applet%0acode=javascript:nx51076>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51076'
