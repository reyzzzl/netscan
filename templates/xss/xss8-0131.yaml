id: xss8-0131
name: 'Raw XSS8 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<svg onload=nx80130%0a>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx80130'
