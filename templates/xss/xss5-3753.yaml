id: xss5-3753
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '"><svg%0aonload=nx53752>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53752'
