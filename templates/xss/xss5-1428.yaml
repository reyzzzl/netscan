id: xss5-1428
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '<script>alert(String.fromCharCode(nx51427))</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51427'
