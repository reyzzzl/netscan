id: xss5-1174
name: 'Raw XSS5 in data'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in data'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      data:
        - '<bgsound%0asrc=javascript:nx51173>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51173'
