id: xss5-0319
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '"><svg%0aonload=nx50318>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50318'
