id: xss5-3228
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '<svg style="behavior:url(nx53227)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53227'
