id: xss5-1337
name: 'Raw XSS5 in lastname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in lastname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      lastname:
        - '<body%0d%0aonload=nx51336>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51336'
