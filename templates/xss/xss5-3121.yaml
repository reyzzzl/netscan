id: xss5-3121
name: 'Raw XSS5 in q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<a%0ahref=data:text/html,nx53120>click'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53120'
