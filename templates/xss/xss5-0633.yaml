id: xss5-0633
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<marquee%0aloop=1%0aonstart=nx50632>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50632'
