id: xss5-0939
name: 'Raw XSS5 in phone'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in phone'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      phone:
        - '<object%0adata=data:text/html,nx50938>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50938'
