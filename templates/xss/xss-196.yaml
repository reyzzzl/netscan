id: xss-196
name: 'Reflected XSS ctx-21 via message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '${nx195c}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx195c'
