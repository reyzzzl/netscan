id: xss5-2923
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<div style="width:expression(nx52922)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52922'
