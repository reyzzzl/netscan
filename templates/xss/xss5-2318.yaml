id: xss5-2318
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<div style="-moz-binding:url(''javascript:nx52317'')">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52317'
