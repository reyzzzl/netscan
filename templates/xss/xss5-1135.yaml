id: xss5-1135
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<body%0d%0aonload=nx51134>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51134'
