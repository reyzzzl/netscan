id: xss5-0648
name: 'Raw XSS5 in title'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in title'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      title:
        - '<xss%0astyle=x%0aonpointerover=nx50647>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50647'
