id: xss5-2804
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<details%0aontoggle=nx52803>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52803'
