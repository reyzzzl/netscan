id: xss5-3439
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<img%09src=x%09onerror=nx53438>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53438'
