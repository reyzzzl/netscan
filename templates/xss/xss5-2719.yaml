id: xss5-2719
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<map><area%0ahref=javascript:nx52718></map>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52718'
