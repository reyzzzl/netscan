id: xss6strict-1833
name: 'Strict raw XSS in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      caption:
        - '<script>sx61832>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx61832'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx61832'
