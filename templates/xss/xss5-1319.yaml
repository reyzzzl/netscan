id: xss5-1319
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<img%0asrc=x%0aonerror=nx51318>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51318'
