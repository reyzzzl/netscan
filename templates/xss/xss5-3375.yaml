id: xss5-3375
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<xss%0astyle=x%0aonpointerover=nx53374>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53374'
