id: xss5-1198
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - 'data%3atext/html,nx51197'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51197'
