id: xss5-3191
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<wbr%0aonmouseover=nx53190>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53190'
