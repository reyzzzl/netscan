id: xss5-3919
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<svg><animate%0aonbegin=nx53918 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53918'
