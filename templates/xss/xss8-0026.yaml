id: xss8-0026
name: 'Raw XSS8 in website'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in website'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      website:
        - '<video><source onerror=nx80025%09>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx80025'
