id: xss5-3751
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<script>alert(String.fromCharCode(nx53750))</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53750'
