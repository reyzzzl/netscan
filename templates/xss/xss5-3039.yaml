id: xss5-3039
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<script%09>alert(nx53038)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53038'
