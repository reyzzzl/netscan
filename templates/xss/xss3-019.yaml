id: xss3-019
name: 'Raw XSS3 #18 in phone'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in phone'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      phone:
        - '<xss%09style=x%09onauxclick=nx3018>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx3018'
