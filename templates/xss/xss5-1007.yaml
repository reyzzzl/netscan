id: xss5-1007
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<!--#exec cmd="echo nx51006"-->'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51006'
