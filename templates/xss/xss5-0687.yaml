id: xss5-0687
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<svg><animate%0aonbegin=nx50686 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50686'
