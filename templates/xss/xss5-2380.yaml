id: xss5-2380
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '#{nx52379}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52379'
