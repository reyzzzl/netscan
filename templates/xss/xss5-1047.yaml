id: xss5-1047
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<iframe%09src=javascript:nx51046>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51046'
