id: xss5-3455
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '</title><svg%09onload=nx53454>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53454'
