id: xss-076
name: 'Reflected XSS ctx-17 via message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<iframe src=javascript:nx075c>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx075c'
