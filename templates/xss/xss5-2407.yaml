id: xss5-2407
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - 'jaVasCript%3anx52406'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52406'
