id: xss5-1991
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<div%09onpointerenter=nx51990>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51990'
