id: xss5-0333
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<object%0adata=data:text/html,nx50332>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50332'
