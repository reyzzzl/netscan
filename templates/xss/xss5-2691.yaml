id: xss5-2691
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<meta%09http-equiv=refresh%09content="0;javascript:nx52690">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52690'
