id: xss5-3633
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<!--#exec cmd="echo nx53632"-->'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53632'
