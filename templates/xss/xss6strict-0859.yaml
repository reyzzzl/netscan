id: xss6strict-0859
name: 'Strict raw XSS in phone'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      phone:
        - '<select autofocus onfocus=sx60858>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx60858'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx60858'
