id: xss5-2837
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<script%09>alert(nx52836)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52836'
