id: xss5-0439
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<table%0abackground=javascript:nx50438>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50438'
