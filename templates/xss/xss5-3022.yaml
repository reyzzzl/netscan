id: xss5-3022
name: 'Raw XSS5 in country'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in country'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      country:
        - '<map><area%0ahref=javascript:nx53021></map>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53021'
