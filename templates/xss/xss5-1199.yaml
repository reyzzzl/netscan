id: xss5-1199
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - 'vbscript%3amsgbox(nx51198)'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51198'
