id: xss5-2806
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<td%0abackground=data:text/html,nx52805>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52805'
