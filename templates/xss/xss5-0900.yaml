id: xss5-0900
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<area%09href=javascript:nx50899>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50899'
