id: xss5-1598
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<mi%0ahref=javascript:nx51597>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51597'
