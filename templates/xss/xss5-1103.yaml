id: xss5-1103
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '<map><area%0ahref=javascript:nx51102></map>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51102'
