id: xss5-3834
name: 'Raw XSS5 in label'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in label'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      label:
        - '<svg style="behavior:url(nx53833)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53833'
