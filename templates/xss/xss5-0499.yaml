id: xss5-0499
name: 'Raw XSS5 in phone'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in phone'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      phone:
        - '<div style="width:expression(nx50498)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50498'
