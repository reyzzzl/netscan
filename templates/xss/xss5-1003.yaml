id: xss5-1003
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<style>@import ''javascript:nx51002'';</style>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51002'
