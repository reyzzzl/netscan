id: xss5-0089
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - 'mhtml%3ahttp://x!nx50088'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50088'
