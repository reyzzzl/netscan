id: xss5-2038
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '"><img%09src=x%09onerror=nx52037>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52037'
