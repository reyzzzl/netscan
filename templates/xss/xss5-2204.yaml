id: xss5-2204
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<mi%0ahref=javascript:nx52203>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52203'
