id: xss5-0770
name: 'Raw XSS5 in text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '<bgsound%0asrc=javascript:nx50769>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50769'
