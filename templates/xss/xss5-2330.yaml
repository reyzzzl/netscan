id: xss5-2330
name: 'Raw XSS5 in text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '<image src=x onerror=nx52329>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52329'
