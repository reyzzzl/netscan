id: xss5-0573
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<frame%09src=javascript:nx50572>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50572'
