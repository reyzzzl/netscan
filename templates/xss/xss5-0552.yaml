id: xss5-0552
name: 'Raw XSS5 in subtext'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in subtext'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      subtext:
        - '<audio%0asrc=x%0aonerror=nx50551>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50551'
