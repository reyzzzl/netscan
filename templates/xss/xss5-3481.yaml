id: xss5-3481
name: 'Raw XSS5 in q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<audio%0asrc=x%0aonerror=nx53480>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53480'
