id: xss5-0445
name: 'Raw XSS5 in name'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in name'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - '<xss%09style=x%09onauxclick=nx50444>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50444'
