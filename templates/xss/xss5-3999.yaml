id: xss5-3999
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<wbr%0aonmouseover=nx53998>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53998'
