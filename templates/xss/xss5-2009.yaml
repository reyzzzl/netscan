id: xss5-2009
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<a%09href=javascript:nx52008>click'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52008'
