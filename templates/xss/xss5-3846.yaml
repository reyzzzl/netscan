id: xss5-3846
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<script%0a>alert(nx53845)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53845'
