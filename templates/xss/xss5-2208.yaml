id: xss5-2208
name: 'Raw XSS5 in title'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in title'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      title:
        - 'data%3atext/html,nx52207'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52207'
