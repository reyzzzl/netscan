id: xss5-2793
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<base%09href=javascript:nx52792>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52792'
