id: xss5-0245
name: 'Raw XSS5 in name'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in name'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - '<xss%0d%0astyle=x%0d%0aonfocusin=nx50244 tabindex=1>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50244'
