id: xss5-1037
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<marquee%0aloop=1%0aonstart=nx51036>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51036'
