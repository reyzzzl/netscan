id: xss5-1001
name: 'Raw XSS5 in q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<area%09href=javascript:nx51000>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51000'
