id: xss5-3817
name: 'Raw XSS5 in lastname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in lastname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      lastname:
        - '<svg><animate%09onbegin=nx53816 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53816'
