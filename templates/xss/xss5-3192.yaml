id: xss5-3192
name: 'Raw XSS5 in subtext'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in subtext'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      subtext:
        - '<wbr%09onmouseover=nx53191>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53191'
