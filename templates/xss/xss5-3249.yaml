id: xss5-3249
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '''><svg%09onload=nx53248>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53248'
