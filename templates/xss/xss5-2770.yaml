id: xss5-2770
name: 'Raw XSS5 in text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '<xss%0d%0astyle=x%0d%0aonfocusin=nx52769 tabindex=1>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52769'
