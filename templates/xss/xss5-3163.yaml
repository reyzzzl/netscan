id: xss5-3163
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<embed%0asrc=data:text/html,nx53162>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53162'
