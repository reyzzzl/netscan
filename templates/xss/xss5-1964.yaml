id: xss5-1964
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<video%09><source%09onerror=nx51963>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51963'
