id: xss5-1446
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<embed%0asrc=data:text/html,nx51445>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51445'
