id: xss5-2129
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<script%0a>alert(nx52128)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52128'
