id: xss5-2347
name: 'Raw XSS5 in subject'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in subject'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      subject:
        - '<body%0d%0aonload=nx52346>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52346'
