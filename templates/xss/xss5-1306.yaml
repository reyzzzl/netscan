id: xss5-1306
name: 'Raw XSS5 in website'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in website'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      website:
        - '<style>@import ''javascript:nx51305'';</style>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51305'
