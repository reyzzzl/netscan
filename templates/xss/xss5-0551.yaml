id: xss5-0551
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<audio%09src=x%09onerror=nx50550>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50550'
