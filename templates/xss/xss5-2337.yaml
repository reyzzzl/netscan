id: xss5-2337
name: 'Raw XSS5 in lastname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in lastname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      lastname:
        - '<script>alert(String.fromCharCode(nx52336))</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52336'
