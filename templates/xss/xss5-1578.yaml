id: xss5-1578
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<bgsound%0asrc=javascript:nx51577>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51577'
