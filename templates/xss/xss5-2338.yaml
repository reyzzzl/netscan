id: xss5-2338
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<script> merely nx52337 </script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52337'
