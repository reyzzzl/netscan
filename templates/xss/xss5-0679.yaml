id: xss5-0679
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<div%0aonpointerleave=nx50678>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50678'
