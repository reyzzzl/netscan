id: xss5-3327
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<div style="width:expression(nx53326)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53326'
