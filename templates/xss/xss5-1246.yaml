id: xss5-1246
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<form%0aaction=javascript:nx51245><input type=submit>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51245'
