id: xss2-237
name: 'Reflected XSS2 ctx-26 via term'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in term'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      term:
        - '<wbr onmouseover=alert(nx2236)>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx2236'
