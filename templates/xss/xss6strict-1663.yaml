id: xss6strict-1663
name: 'Strict raw XSS in state'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      state:
        - '<script>sx61662>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx61662'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx61662'
