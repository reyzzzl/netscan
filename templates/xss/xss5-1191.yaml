id: xss5-1191
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<svg><animate%09onbegin=nx51190 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51190'
