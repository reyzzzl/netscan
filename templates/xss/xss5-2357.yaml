id: xss5-2357
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<form%0aaction=javascript:nx52356><input type=submit>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52356'
