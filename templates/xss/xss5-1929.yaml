id: xss5-1929
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<script%0d>alert(nx51928)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51928'
