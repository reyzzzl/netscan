id: xss5-2421
name: 'Raw XSS5 in city'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in city'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      city:
        - '<!--#exec cmd="echo nx52420"-->'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52420'
