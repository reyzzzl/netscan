id: xss5-0980
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<input%09type=image%09formaction=javascript:nx50979>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50979'
