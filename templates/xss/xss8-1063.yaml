id: xss8-1063
name: 'Raw XSS8 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '<body onload=nx81062%20>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx81062'
