id: xss7strict-1303
name: 'Strict breakout XSS in state'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      state:
        - '</div><svg onload=sx71302>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx71302'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx71302'
