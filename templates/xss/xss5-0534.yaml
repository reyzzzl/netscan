id: xss5-0534
name: 'Raw XSS5 in data'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in data'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      data:
        - '<object%09data=javascript:nx50533>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50533'
