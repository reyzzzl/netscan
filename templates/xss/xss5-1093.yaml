id: xss5-1093
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<mi%0ahref=javascript:nx51092>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51092'
