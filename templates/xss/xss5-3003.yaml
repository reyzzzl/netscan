id: xss5-3003
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<p%09oncopy=nx53002>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53002'
