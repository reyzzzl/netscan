id: xss5-1253
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<xss%09style=x%09onauxclick=nx51252>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51252'
