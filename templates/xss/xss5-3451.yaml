id: xss5-3451
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '''><svg%09onload=nx53450>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53450'
