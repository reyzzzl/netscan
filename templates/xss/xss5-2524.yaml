id: xss5-2524
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<esi:include%09src=nx52523>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52523'
