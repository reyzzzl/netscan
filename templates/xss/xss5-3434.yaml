id: xss5-3434
name: 'Raw XSS5 in label'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in label'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      label:
        - '<xsl:value-of%09select=nx53433>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53433'
