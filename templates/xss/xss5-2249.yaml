id: xss5-2249
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<marquee%0aloop=1%0aonstart=nx52248>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52248'
