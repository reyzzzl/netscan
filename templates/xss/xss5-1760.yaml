id: xss5-1760
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '<xss%0d%0astyle=x%0d%0aonfocusin=nx51759 tabindex=1>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51759'
