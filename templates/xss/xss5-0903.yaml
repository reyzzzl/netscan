id: xss5-0903
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '<div style="width:expression(nx50902)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50902'
