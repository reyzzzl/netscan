id: xss5-2924
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<div style="-moz-binding:url(''javascript:nx52923'')">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52923'
