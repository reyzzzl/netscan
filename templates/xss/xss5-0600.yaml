id: xss5-0600
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '<div style="width:expression(nx50599)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50599'
