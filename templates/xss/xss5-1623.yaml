id: xss5-1623
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '<image src=x onerror=nx51622>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51622'
