id: xss5-0005
name: 'Raw XSS5 in name'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in name'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - '<img%09src=x%09onerror=nx50004>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50004'
