id: xss5-3077
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<audio%0asrc=x%0aonerror=nx53076>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53076'
