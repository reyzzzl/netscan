id: xss5-2083
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<bgsound%0asrc=javascript:nx52082>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52082'
