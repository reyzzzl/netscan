id: xss5-2880
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '<input%09autofocus%09onfocus=nx52879>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52879'
