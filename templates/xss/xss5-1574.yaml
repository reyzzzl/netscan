id: xss5-1574
name: 'Raw XSS5 in data'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in data'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      data:
        - '{{{nx51573}}}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51573'
