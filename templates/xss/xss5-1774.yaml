id: xss5-1774
name: 'Raw XSS5 in data'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in data'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      data:
        - '#{nx51773}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51773'
