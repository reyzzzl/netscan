id: xss5-1999
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<svg><animate%09onbegin=nx51998 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51998'
