id: xss5-3849
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<ScRiPt%0a>alert(nx53848)</ScRiPt>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53848'
