id: xss5-1268
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '<%= nx51267 %>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51267'
