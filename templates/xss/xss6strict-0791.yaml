id: xss6strict-0791
name: 'Strict raw XSS in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      headline:
        - '<svg onload=sx60790>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx60790'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx60790'
