id: xss5-1276
name: 'Raw XSS5 in placeholder'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in placeholder'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      placeholder:
        - '<link%09rel=stylesheet%09href=javascript:nx51275>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51275'
