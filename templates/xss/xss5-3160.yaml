id: xss5-3160
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '<object%09data=javascript:nx53159>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53159'
