id: xss5-3703
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '<applet%0acode=javascript:nx53702>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53702'
