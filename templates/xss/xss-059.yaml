id: xss-059
name: 'Reflected XSS ctx-0 via query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<script>nx058c</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx058c'
