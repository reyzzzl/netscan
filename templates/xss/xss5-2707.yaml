id: xss5-2707
name: 'Raw XSS5 in subject'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in subject'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      subject:
        - '<svg><animate%0aonbegin=nx52706 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52706'
