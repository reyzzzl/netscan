id: xss5-0727
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '</textarea><svg%0aonload=nx50726>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50726'
