id: xss4-177
name: 'Raw XSS4 #16 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<marquee behavior=slide onstart=alert(nx4176)>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx4176'
