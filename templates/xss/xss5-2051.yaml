id: xss5-2051
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<embed%09src=javascript:nx52050>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52050'
