id: xss5-0152
name: 'Raw XSS5 in subtext'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in subtext'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      subtext:
        - '<textarea%0aautofocus%0aonfocus=nx50151>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50151'
