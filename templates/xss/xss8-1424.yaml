id: xss8-1424
name: 'Raw XSS8 in zip'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in zip'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      zip:
        - '<details open ontoggle=nx81423%09%09>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx81423'
