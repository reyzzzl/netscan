id: xss5-3376
name: 'Raw XSS5 in firstname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in firstname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      firstname:
        - '<xss%0d%0astyle=x%0d%0aonfocusin=nx53375 tabindex=1>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53375'
