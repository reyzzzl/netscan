id: xss8-0276
name: 'Raw XSS8 in placeholder'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in placeholder'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      placeholder:
        - '<video><source onerror=nx80275%0d%0a>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx80275'
