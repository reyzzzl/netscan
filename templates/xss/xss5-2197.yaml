id: xss5-2197
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<summary%09onfocus=nx52196>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52196'
