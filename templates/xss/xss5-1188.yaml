id: xss5-1188
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '<details%0aontoggle=nx51187>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51187'
