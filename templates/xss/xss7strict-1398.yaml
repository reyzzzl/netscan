id: xss7strict-1398
name: 'Strict breakout XSS in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      suffix:
        - '<object data=javascript:sx71397>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx71397'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx71397'
