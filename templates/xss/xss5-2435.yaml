id: xss5-2435
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<ScRiPt%0a>alert(nx52434)</ScRiPt>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52434'
