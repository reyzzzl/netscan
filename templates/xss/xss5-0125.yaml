id: xss5-0125
name: 'Raw XSS5 in name'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in name'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - '<body%0d%0aonload=nx50124>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50124'
