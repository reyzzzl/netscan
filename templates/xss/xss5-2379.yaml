id: xss5-2379
name: 'Raw XSS5 in phone'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in phone'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      phone:
        - '<%= nx52378 %>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52378'
