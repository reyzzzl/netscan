id: xss5-1613
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<!--#exec cmd="echo nx51612"-->'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51612'
