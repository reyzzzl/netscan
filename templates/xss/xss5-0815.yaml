id: xss5-0815
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<image src=x onerror=nx50814>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50814'
