id: xss5-3444
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<script%0d>alert(nx53443)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53443'
