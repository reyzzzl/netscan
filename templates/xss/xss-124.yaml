id: xss-124
name: 'Reflected XSS ctx-7 via keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '"-alert(nx123c)-"'
    matchers:
      - type: word
        part: body
        words:
          - 'nx123c'
