id: xss5-1814
name: 'Raw XSS5 in data'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in data'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      data:
        - '<svg style="behavior:url(nx51813)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51813'
