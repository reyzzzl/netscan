id: xss5-0471
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<applet%0acode=javascript:nx50470>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50470'
