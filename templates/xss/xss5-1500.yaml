id: xss5-1500
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - 'JaVaScRiPt%3anx51499'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51499'
