id: xss5-3531
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<svg style="behavior:url(nx53530)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53530'
