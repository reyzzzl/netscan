id: xss5-3213
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<math%09href=javascript:nx53212>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53212'
