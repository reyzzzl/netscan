id: xss5-1207
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<div style="-moz-binding:url(''javascript:nx51206'')">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51206'
