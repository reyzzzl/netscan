id: xss5-3980
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<xss%09style=x%09onauxclick=nx53979>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53979'
