id: xss5-1002
name: 'Raw XSS5 in s'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in s'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      s:
        - '<map><area%0ahref=javascript:nx51001></map>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51001'
