id: xss5-1700
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - 'jaVasCript%3anx51699'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51699'
