id: xss5-1970
name: 'Raw XSS5 in text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '<textarea%0aautofocus%0aonfocus=nx51969>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51969'
