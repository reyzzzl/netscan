id: xss5-0044
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<video%0a><source%0aonerror=nx50043>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50043'
