id: xss5-0565
name: 'Raw XSS5 in name'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in name'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - '<wbr%0aonmouseover=nx50564>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50564'
