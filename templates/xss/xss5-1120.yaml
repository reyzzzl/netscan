id: xss5-1120
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '<script%09>alert(nx51119)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51119'
