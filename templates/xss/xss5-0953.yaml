id: xss5-0953
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<video%0a><source%0aonerror=nx50952>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50952'
