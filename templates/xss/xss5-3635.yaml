id: xss5-3635
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<esi:include%09src=nx53634>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53634'
