id: xss5-0615
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<script%09>alert(nx50614)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50614'
