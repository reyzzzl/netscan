id: xss5-2738
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<ScRiPt%0a>alert(nx52737)</ScRiPt>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52737'
