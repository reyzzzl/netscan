id: xss5-1740
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<body%09onload=nx51739>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51739'
