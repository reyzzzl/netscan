id: xss5-0446
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<xss%0astyle=x%0aonpointerover=nx50445>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50445'
