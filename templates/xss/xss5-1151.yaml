id: xss5-1151
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<math><mtext%0ahref=javascript:nx51150>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51150'
