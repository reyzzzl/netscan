id: xss5-2778
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<textarea%0aautofocus%0aonfocus=nx52777>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52777'
