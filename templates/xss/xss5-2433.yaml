id: xss5-2433
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<script%09>alert(nx52432)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52432'
