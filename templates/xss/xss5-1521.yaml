id: xss5-1521
name: 'Raw XSS5 in q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<img%0asrc=x%0aonerror=nx51520>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51520'
