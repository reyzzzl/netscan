id: xss5-2568
name: 'Raw XSS5 in title'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in title'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      title:
        - '<xss%0d%0astyle=x%0d%0aonfocusin=nx52567 tabindex=1>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52567'
