id: xss5-0327
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<body%0d%0aonload=nx50326>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50326'
