id: xss5-1736
name: 'Raw XSS5 in firstname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in firstname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      firstname:
        - '''><img%0asrc=x%0aonerror=nx51735>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51735'
