id: xss5-2569
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<video%0a><source%0aonerror=nx52568>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52568'
