id: xss5-0392
name: 'Raw XSS5 in subtext'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in subtext'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      subtext:
        - 'mhtml%3ahttp://x!nx50391'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50391'
