id: xss5-2655
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<object%09data=javascript:nx52654>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52654'
