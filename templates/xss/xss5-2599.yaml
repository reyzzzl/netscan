id: xss5-2599
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<p%09oncopy=nx52598>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52598'
