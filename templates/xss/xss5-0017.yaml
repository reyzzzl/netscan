id: xss5-0017
name: 'Raw XSS5 in lastname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in lastname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      lastname:
        - '''><svg%09onload=nx50016>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50016'
