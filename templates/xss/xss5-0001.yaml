id: xss5-0001
name: 'Raw XSS5 in q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<svg%0aonload=nx50000>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50000'
