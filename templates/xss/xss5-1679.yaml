id: xss5-1679
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<bgsound%0asrc=javascript:nx51678>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51678'
