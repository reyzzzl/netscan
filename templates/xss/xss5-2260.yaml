id: xss5-2260
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<iframe%0asrcdoc=<script>nx52259</script>>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52259'
