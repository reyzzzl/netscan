id: xss5-2717
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<a%0ahref=data:text/html,nx52716>click'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52716'
