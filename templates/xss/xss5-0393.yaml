id: xss5-0393
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<a%09href=javascript:nx50392>click'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50392'
