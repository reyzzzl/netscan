id: xss5-1395
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<math%09href=javascript:nx51394>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51394'
