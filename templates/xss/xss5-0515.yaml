id: xss5-0515
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<script%0d>alert(nx50514)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50514'
