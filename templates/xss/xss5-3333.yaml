id: xss5-3333
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<xsl:value-of%09select=nx53332>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53332'
