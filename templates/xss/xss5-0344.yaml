id: xss5-0344
name: 'Raw XSS5 in zip'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in zip'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      zip:
        - '<xss%09style=x%09onauxclick=nx50343>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50343'
