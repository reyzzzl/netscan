id: xss5-1391
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<table%09background=data:text/html,nx51390>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51390'
