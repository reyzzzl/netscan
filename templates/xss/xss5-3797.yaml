id: xss5-3797
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<wbr%0aonmouseover=nx53796>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53796'
