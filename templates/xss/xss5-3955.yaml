id: xss5-3955
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '"><svg%0aonload=nx53954>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53954'
