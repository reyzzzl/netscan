id: xss6strict-0904
name: 'Strict raw XSS in zip'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      zip:
        - '<details open ontoggle=sx60903>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx60903'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx60903'
