id: xss5-1689
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<div%0aonpointerleave=nx51688>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51688'
