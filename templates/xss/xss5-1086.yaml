id: xss5-1086
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<summary%09onfocus=nx51085>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51085'
