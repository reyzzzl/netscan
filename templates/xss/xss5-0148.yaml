id: xss5-0148
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '<audio%0asrc=x%0aonerror=nx50147>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50147'
