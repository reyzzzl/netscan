id: xss2-017
name: 'Reflected XSS2 ctx-16 via s'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in s'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      s:
        - '<table background="javascript:alert(nx2016)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx2016'
