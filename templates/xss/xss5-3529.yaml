id: xss5-3529
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<div style="width:expression(nx53528)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53528'
