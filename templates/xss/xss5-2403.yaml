id: xss5-2403
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<svg><animate%09onbegin=nx52402 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52402'
