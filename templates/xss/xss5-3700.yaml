id: xss5-3700
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<link%09rel=stylesheet%09href=javascript:nx53699>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53699'
