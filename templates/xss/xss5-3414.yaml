id: xss5-3414
name: 'Raw XSS5 in data'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in data'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      data:
        - '<svg><animate%0aonbegin=nx53413 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53413'
