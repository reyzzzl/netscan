id: xss5-0312
name: 'Raw XSS5 in subtext'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in subtext'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      subtext:
        - '<script%09>alert(nx50311)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50311'
