id: xss5-1703
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - 'data%3atext/html,nx51702'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51702'
