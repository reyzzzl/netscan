id: xss5-3197
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<base%09href=javascript:nx53196>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53196'
