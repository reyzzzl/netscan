id: xss5-3929
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<a%0ahref=data:text/html,nx53928>click'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53928'
