id: xss5-2079
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '{{{nx52078}}}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52078'
