id: xss5-2537
name: 'Raw XSS5 in lastname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in lastname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      lastname:
        - '<sCrIpT%09>alert(nx52536)</sCrIpT>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52536'
