id: xss5-0401
name: 'Raw XSS5 in q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<!--#exec cmd="echo nx50400"-->'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50400'
