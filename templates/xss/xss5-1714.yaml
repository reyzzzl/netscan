id: xss5-1714
name: 'Raw XSS5 in label'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in label'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      label:
        - '<!--#exec cmd="echo nx51713"-->'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51713'
