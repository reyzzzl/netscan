id: xss5-3027
name: 'Raw XSS5 in subject'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in subject'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      subject:
        - '<!--#exec cmd="echo nx53026"-->'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53026'
