id: xss5-0592
name: 'Raw XSS5 in subtext'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in subtext'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      subtext:
        - 'data%3atext/html,nx50591'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50591'
