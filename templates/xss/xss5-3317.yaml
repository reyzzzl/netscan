id: xss5-3317
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - 'javascript%3anx53316'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53316'
