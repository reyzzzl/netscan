id: xss6strict-1559
name: 'Strict raw XSS in author'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      author:
        - '<select autofocus onfocus=sx61558>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx61558'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx61558'
