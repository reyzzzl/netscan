id: xss5-1301
name: 'Raw XSS5 in city'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in city'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      city:
        - 'mhtml%3ahttp://x!nx51300'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51300'
