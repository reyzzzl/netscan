id: xss5-0895
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - 'data%3atext/html,nx50894'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50894'
