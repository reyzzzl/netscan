id: xss5-2606
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<svg><animate%0aonbegin=nx52605 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52605'
