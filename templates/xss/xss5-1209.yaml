id: xss5-1209
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<!--#exec cmd="echo nx51208"-->'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51208'
