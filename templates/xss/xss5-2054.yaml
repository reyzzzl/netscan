id: xss5-2054
name: 'Raw XSS5 in data'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in data'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      data:
        - '<form%0aaction=javascript:nx52053><input type=submit>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52053'
