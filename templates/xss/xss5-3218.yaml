id: xss5-3218
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - 'data%3atext/html,nx53217'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53217'
