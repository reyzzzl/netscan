id: xss5-0094
name: 'Raw XSS5 in data'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in data'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      data:
        - '<style>@import ''javascript:nx50093'';</style>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50093'
