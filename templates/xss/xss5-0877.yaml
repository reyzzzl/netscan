id: xss5-0877
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<frameset%0aonload=nx50876>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50876'
