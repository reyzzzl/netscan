id: xss3-029
name: 'Raw XSS3 #28 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<wbr%0aonmouseover=nx3028>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx3028'
