id: xss5-0703
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '<svg style="behavior:url(nx50702)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50702'
