id: xss5-2135
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<script>alert(String.fromCharCode(nx52134))</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52134'
