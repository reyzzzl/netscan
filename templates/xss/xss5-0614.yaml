id: xss5-0614
name: 'Raw XSS5 in data'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in data'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      data:
        - '<script%0a>alert(nx50613)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50613'
