id: xss5-0430
name: 'Raw XSS5 in details'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in details'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      details:
        - '<details%0aopen%0aontoggle=nx50429>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50429'
