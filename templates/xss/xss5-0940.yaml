id: xss5-0940
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<embed%09src=javascript:nx50939>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50939'
