id: xss5-3158
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<marquee%0aloop=1%0aonstart=nx53157>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53157'
