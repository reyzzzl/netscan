id: xss5-0383
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '<svg><animate%09onbegin=nx50382 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50382'
