id: xss5-0108
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '<image src=x onerror=nx50107>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50107'
