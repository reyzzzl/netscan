id: xss5-3591
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<%= nx53590 %>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53590'
