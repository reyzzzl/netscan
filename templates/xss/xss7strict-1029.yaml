id: xss7strict-1029
name: 'Strict breakout XSS in summary'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      summary:
        - '<embed src=javascript:sx71028>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx71028'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx71028'
