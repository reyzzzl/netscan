id: xss5-3730
name: 'Raw XSS5 in text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '<style>@import ''javascript:nx53729'';</style>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53729'
