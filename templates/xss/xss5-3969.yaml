id: xss5-3969
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<object%0adata=data:text/html,nx53968>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53968'
