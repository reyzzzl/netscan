id: xss5-2193
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<div%09onpointerenter=nx52192>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52192'
