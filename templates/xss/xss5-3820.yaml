id: xss5-3820
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<mi%0ahref=javascript:nx53819>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53819'
