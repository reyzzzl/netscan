id: xss5-2040
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '</textarea><svg%0aonload=nx52039>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52039'
