id: xss5-2243
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '</title><svg%09onload=nx52242>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52242'
