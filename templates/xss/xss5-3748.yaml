id: xss5-3748
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '<ScRiPt%0a>alert(nx53747)</ScRiPt>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53747'
