id: xss5-2539
name: 'Raw XSS5 in phone'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in phone'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      phone:
        - '<script>alert(String.fromCharCode(nx52538))</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52538'
