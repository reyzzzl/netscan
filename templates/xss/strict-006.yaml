id: strict-006
name: 'Strict raw XSS via s'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      s:
        - '<svg onload=sx005>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx005'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx005'
