id: xss5-1111
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<xsl:value-of%09select=nx51110>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51110'
