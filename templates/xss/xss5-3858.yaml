id: xss5-3858
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '</textarea><svg%0aonload=nx53857>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53857'
