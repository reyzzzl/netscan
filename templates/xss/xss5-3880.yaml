id: xss5-3880
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '<xss%0astyle=x%0aonpointerover=nx53879>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53879'
