id: xss5-3489
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '${nx53488}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53488'
