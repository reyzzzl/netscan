id: xss5-2286
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<link%09rel=stylesheet%09href=javascript:nx52285>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52285'
