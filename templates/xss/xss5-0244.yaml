id: xss5-0244
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<xss%0astyle=x%0aonpointerover=nx50243>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50243'
