id: xss7strict-1465
name: 'Strict breakout XSS in company'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      company:
        - '<form action=javascript:sx71464>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx71464'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx71464'
