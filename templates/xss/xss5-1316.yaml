id: xss5-1316
name: 'Raw XSS5 in placeholder'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in placeholder'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      placeholder:
        - '<svg/onload=nx51315>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51315'
