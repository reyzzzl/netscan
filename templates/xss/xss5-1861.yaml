id: xss5-1861
name: 'Raw XSS5 in city'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in city'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      city:
        - '<xss%0d%0astyle=x%0d%0aonfocusin=nx51860 tabindex=1>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51860'
