id: xss5-2355
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<embed%0asrc=data:text/html,nx52354>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52354'
