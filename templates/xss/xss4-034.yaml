id: xss4-034
name: 'Raw XSS4 #33 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<div style="behavior:url(x.htc)">nx4033</div>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx4033'
