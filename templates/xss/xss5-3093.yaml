id: xss5-3093
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<bgsound%0asrc=javascript:nx53092>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53092'
