id: xss5-0726
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '''><img%0asrc=x%0aonerror=nx50725>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50725'
