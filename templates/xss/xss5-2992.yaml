id: xss5-2992
name: 'Raw XSS5 in subtext'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in subtext'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      subtext:
        - '<bgsound%0asrc=javascript:nx52991>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52991'
