id: xss5-2397
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<p%09oncopy=nx52396>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52396'
