id: xss5-0504
name: 'Raw XSS5 in zip'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in zip'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      zip:
        - '<esi:include%09src=nx50503>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50503'
