id: xss5-1308
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '<div style="-moz-binding:url(''javascript:nx51307'')">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51307'
