id: xss5-0197
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<div style="-moz-binding:url(''javascript:nx50196'')">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50196'
