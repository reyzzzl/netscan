id: xss5-0938
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<object%09data=javascript:nx50937>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50937'
