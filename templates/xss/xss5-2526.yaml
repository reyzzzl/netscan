id: xss5-2526
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<svg%0aonload=nx52525>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52525'
