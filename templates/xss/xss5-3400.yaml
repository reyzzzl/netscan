id: xss5-3400
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '<applet%0acode=javascript:nx53399>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53399'
