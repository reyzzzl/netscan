id: xss5-3278
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<audio%09src=x%09onerror=nx53277>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53277'
