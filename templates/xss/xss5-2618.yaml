id: xss5-2618
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<map><area%0ahref=javascript:nx52617></map>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52617'
