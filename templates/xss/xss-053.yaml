id: xss-053
name: 'Reflected XSS ctx-23 via search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '#{nx052c}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx052c'
