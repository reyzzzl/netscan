id: xss5-0653
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<audio%0asrc=x%0aonerror=nx50652>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50652'
