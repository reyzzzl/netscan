id: xss5-1853
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<table%0abackground=javascript:nx51852>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51852'
