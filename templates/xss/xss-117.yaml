id: xss-117
name: 'Reflected XSS ctx-0 via comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<script>nx116c</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx116c'
