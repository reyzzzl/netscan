id: xss5-2131
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<script%0d>alert(nx52130)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52130'
