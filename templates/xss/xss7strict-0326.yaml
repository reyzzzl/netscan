id: xss7strict-0326
name: 'Strict breakout XSS in message'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      message:
        - '<button formaction=javascript:sx70325>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx70325'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx70325'
