id: xss5-1236
name: 'Raw XSS5 in placeholder'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in placeholder'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      placeholder:
        - '<body%0d%0aonload=nx51235>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51235'
