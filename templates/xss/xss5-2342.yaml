id: xss5-2342
name: 'Raw XSS5 in country'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in country'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      country:
        - '''><img%0asrc=x%0aonerror=nx52341>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52341'
