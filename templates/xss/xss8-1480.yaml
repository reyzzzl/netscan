id: xss8-1480
name: 'Raw XSS8 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '<keygen autofocus onfocus=nx81479%09%09>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx81479'
