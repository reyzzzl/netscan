id: xss5-0567
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<bgsound%09src=javascript:nx50566>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50566'
