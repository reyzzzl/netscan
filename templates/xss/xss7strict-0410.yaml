id: xss7strict-0410
name: 'Strict breakout XSS in text'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      text:
        - '<table background=javascript:sx70409>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx70409'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx70409'
