id: xss5-0904
name: 'Raw XSS5 in zip'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in zip'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      zip:
        - '<div style="-moz-binding:url(''javascript:nx50903'')">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50903'
