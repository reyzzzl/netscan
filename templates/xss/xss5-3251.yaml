id: xss5-3251
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '''><img%0asrc=x%0aonerror=nx53250>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53250'
