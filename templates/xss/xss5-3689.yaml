id: xss5-3689
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<button%0aautofocus%0aonfocus=nx53688>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53688'
