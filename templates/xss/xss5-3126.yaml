id: xss5-3126
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<div style="-moz-binding:url(''javascript:nx53125'')">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53125'
