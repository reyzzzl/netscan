id: xss5-0112
name: 'Raw XSS5 in subtext'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in subtext'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      subtext:
        - '<ScRiPt%0a>alert(nx50111)</ScRiPt>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50111'
