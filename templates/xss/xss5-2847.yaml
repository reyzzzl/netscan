id: xss5-2847
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '''><img%0asrc=x%0aonerror=nx52846>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52846'
