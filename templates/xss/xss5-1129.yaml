id: xss5-1129
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '"><img%09src=x%09onerror=nx51128>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51128'
