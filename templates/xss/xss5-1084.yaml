id: xss5-1084
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<p%09oncopy=nx51083>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51083'
