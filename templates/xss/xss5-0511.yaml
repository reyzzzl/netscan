id: xss5-0511
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<img%0asrc=x%0aonerror=nx50510>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50510'
