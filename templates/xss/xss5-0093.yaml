id: xss5-0093
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<map><area%0ahref=javascript:nx50092></map>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50092'
