id: xss5-3091
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<wbr%09onmouseover=nx53090>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53090'
