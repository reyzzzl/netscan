id: xss5-3207
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<summary%09onfocus=nx53206>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53206'
