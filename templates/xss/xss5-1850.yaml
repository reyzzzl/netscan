id: xss5-1850
name: 'Raw XSS5 in text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '<embed%0asrc=data:text/html,nx51849>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51849'
