id: xss5-0104
name: 'Raw XSS5 in zip'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in zip'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      zip:
        - '<svg/onload=nx50103>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50103'
