id: xss5-0192
name: 'Raw XSS5 in subtext'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in subtext'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      subtext:
        - '<a%0ahref=data:text/html,nx50191>click'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50191'
