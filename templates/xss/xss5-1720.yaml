id: xss5-1720
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '<svg/onload=nx51719>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51719'
