id: xss5-0671
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<meta%09http-equiv=refresh%09content="0;javascript:nx50670">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50670'
