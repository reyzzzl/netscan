id: xss5-3940
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<svg%0aonload=nx53939>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53939'
