id: xss5-1134
name: 'Raw XSS5 in data'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in data'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      data:
        - '<body%09onload=nx51133>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51133'
