id: xss2-101
name: 'Reflected XSS2 ctx-10 via input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<audio src=x onerror=alert(nx2100)>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx2100'
