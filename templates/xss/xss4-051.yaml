id: xss4-051
name: 'Raw XSS4 #10 in q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<body onload=alert(nx4050)>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx4050'
