id: xss5-0929
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '</textarea><svg%0aonload=nx50928>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50928'
