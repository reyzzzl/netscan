id: xss5-3407
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<p%09oncopy=nx53406>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53406'
