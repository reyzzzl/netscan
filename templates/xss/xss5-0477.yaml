id: xss5-0477
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<div%0aonpointerleave=nx50476>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50476'
