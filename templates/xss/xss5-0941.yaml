id: xss5-0941
name: 'Raw XSS5 in city'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in city'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      city:
        - '<embed%0asrc=data:text/html,nx50940>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50940'
