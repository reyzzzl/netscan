id: xss5-0087
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - 'data%3atext/html,nx50086'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50086'
