id: xss5-0599
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<style>@import ''javascript:nx50598'';</style>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50598'
