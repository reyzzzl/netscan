id: xss5-2103
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '<mi%0ahref=javascript:nx52102>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52102'
