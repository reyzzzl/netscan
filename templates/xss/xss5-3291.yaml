id: xss5-3291
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '{{{nx53290}}}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53290'
