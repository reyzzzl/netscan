id: xss5-2114
name: 'Raw XSS5 in label'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in label'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      label:
        - '<style>@import ''javascript:nx52113'';</style>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52113'
