id: xss5-1957
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<iframe%0asrcdoc=<script>nx51956</script>>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51956'
