id: xss5-2091
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<input%09type=image%09formaction=javascript:nx52090>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52090'
