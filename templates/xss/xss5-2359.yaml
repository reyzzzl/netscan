id: xss5-2359
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<td%09background=javascript:nx52358>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52358'
