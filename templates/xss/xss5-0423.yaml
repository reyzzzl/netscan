id: xss5-0423
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '''><img%0asrc=x%0aonerror=nx50422>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50422'
