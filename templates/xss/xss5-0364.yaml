id: xss5-0364
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<wbr%09onmouseover=nx50363>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50363'
