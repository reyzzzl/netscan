id: xss5-1057
name: 'Raw XSS5 in lastname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in lastname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      lastname:
        - '<audio%0asrc=x%0aonerror=nx51056>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51056'
