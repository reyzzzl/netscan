id: xss5-3001
name: 'Raw XSS5 in q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<div%09onpointerenter=nx53000>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53000'
