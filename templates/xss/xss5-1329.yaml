id: xss5-1329
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '"><svg%0aonload=nx51328>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51328'
