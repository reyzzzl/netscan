id: xss5-0823
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '<script> merely nx50822 </script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50822'
