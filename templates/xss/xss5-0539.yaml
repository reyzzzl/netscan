id: xss5-0539
name: 'Raw XSS5 in phone'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in phone'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      phone:
        - '<form%0aaction=javascript:nx50538><input type=submit>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50538'
