id: xss5-0055
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '${nx50054}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50054'
