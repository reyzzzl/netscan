id: xss7strict-0094
name: 'Strict breakout XSS in data'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      data:
        - '<a href=javascript:sx70093>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx70093'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx70093'
