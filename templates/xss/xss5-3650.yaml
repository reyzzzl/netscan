id: xss5-3650
name: 'Raw XSS5 in text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '<script>alert(String.fromCharCode(nx53649))</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53649'
