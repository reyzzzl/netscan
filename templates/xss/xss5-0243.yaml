id: xss5-0243
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<xss%09style=x%09onauxclick=nx50242>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50242'
