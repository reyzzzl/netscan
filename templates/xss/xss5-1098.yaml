id: xss5-1098
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - 'vbscript%3amsgbox(nx51097)'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51097'
