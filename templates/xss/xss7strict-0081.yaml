id: xss7strict-0081
name: 'Strict breakout XSS in q'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      q:
        - '"><svg onload=sx70080>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx70080'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx70080'
