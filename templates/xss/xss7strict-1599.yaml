id: xss7strict-1599
name: 'Strict breakout XSS in author'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      author:
        - '<embed src=javascript:sx71598>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx71598'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx71598'
