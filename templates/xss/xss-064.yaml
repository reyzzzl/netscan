id: xss-064
name: 'Reflected XSS ctx-5 via keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '"><img src=x onerror=alert(1)>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx063c'
