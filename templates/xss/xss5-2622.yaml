id: xss5-2622
name: 'Raw XSS5 in country'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in country'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      country:
        - '<svg style="behavior:url(nx52621)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52621'
