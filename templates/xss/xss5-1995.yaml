id: xss5-1995
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<summary%09onfocus=nx51994>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51994'
