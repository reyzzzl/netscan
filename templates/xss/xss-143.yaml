id: xss-143
name: 'Reflected XSS ctx-26 via search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '</textarea><script>nx142c</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx142c'
