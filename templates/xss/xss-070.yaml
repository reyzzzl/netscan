id: xss-070
name: 'Reflected XSS ctx-11 via text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '<marquee onstart=nx069c>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx069c'
