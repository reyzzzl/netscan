id: xss5-3286
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '{{nx53285}}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53285'
