id: xss5-0847
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<math><mi%09xlink:href=javascript:nx50846>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50846'
