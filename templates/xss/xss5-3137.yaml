id: xss5-3137
name: 'Raw XSS5 in lastname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in lastname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      lastname:
        - '<img%0asrc=x%0aonerror=nx53136>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53136'
