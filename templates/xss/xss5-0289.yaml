id: xss5-0289
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - 'data%3atext/html,nx50288'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50288'
