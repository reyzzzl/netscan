id: xss5-0969
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<wbr%0aonmouseover=nx50968>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50968'
