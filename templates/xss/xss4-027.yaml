id: xss4-027
name: 'Raw XSS4 #26 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<html:script>alert(nx4026)</html:script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx4026'
