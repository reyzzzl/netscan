id: xss5-0797
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<a%09href=javascript:nx50796>click'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50796'
