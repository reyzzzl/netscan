id: xss5-0249
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<audio%0asrc=x%0aonerror=nx50248>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50248'
