id: xss5-1158
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<audio%0asrc=x%0aonerror=nx51157>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51157'
