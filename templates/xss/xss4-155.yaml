id: xss4-155
name: 'Raw XSS4 #34 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - 'vbscript:msgbox(nx4154)'
    matchers:
      - type: word
        part: body
        words:
          - 'nx4154'
