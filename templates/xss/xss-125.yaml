id: xss-125
name: 'Reflected XSS ctx-8 via name'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in name'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - '</script><script>nx124c</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx124c'
