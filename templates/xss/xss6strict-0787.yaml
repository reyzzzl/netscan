id: xss6strict-0787
name: 'Strict raw XSS in subject'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      subject:
        - '<video><source onerror=sx60786>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx60786'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx60786'
