id: xss5-1091
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<svg><animate%0aonbegin=nx51090 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51090'
