id: xss5-2607
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<math%09href=javascript:nx52606>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52606'
