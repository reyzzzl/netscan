id: xss5-2888
name: 'Raw XSS5 in title'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in title'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      title:
        - '<wbr%0aonmouseover=nx52887>x'
