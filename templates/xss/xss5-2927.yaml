id: xss5-2927
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<!--#include virtual="nx52926"-->'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52926'
