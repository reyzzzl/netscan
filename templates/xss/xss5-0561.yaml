id: xss5-0561
name: 'Raw XSS5 in q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<%= nx50560 %>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50560'
