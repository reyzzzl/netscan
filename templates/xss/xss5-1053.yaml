id: xss5-1053
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<xss%0d%0astyle=x%0d%0aonfocusin=nx51052 tabindex=1>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51052'
