id: xss5-2518
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<style>@import ''javascript:nx52517'';</style>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52517'
