id: xss5-3023
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '<style>@import ''javascript:nx53022'';</style>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53022'
