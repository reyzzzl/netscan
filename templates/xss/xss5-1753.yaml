id: xss5-1753
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<td%09background=javascript:nx51752>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51752'
