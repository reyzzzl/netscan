id: xss5-2873
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<video%09><source%09onerror=nx52872>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52872'
