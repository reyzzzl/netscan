id: xss2-009
name: 'Reflected XSS2 ctx-8 via query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<textarea onfocus=alert(nx2008) autofocus>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx2008'
