id: xss5-2234
name: 'Raw XSS5 in label'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in label'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      label:
        - '<sCrIpT%09>alert(nx52233)</sCrIpT>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52233'
