id: xss5-3873
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<table%0abackground=javascript:nx53872>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53872'
