id: xss5-3050
name: 'Raw XSS5 in text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '</textarea><svg%0aonload=nx53049>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53049'
