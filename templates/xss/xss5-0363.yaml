id: xss5-0363
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<wbr%0aonmouseover=nx50362>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50362'
