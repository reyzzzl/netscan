id: xss5-2908
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '<svg><animate%09onbegin=nx52907 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52907'
