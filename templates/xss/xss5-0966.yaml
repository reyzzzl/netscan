id: xss5-0966
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '#{nx50965}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50965'
