id: xss5-0757
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<keygen%09autofocus%09onfocus=nx50756>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50756'
