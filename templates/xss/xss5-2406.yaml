id: xss5-2406
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<mi%0ahref=javascript:nx52405>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52405'
