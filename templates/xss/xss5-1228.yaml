id: xss5-1228
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '"><svg%0aonload=nx51227>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51227'
