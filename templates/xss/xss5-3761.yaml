id: xss5-3761
name: 'Raw XSS5 in q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<body%0d%0aonload=nx53760>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53760'
