id: xss5-1967
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<select%0aautofocus%0aonfocus=nx51966>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51966'
