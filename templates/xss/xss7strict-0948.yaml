id: xss7strict-0948
name: 'Strict breakout XSS in about'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      about:
        - '<object data=javascript:sx70947>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx70947'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx70947'
