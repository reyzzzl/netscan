id: xss5-1512
name: 'Raw XSS5 in subtext'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in subtext'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      subtext:
        - '<!--#exec cmd="echo nx51511"-->'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51511'
