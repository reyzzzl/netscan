id: xss5-1609
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<style>@import ''javascript:nx51608'';</style>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51608'
