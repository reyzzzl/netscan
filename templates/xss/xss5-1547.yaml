id: xss5-1547
name: 'Raw XSS5 in subject'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in subject'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      subject:
        - '<embed%0asrc=data:text/html,nx51546>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51546'
