id: xss5-2039
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '''><img%0asrc=x%0aonerror=nx52038>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52038'
