id: xss6strict-0676
name: 'Strict raw XSS in placeholder'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      placeholder:
        - '<marquee onstart=sx60675>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx60675'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx60675'
