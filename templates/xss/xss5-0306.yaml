id: xss5-0306
name: 'Raw XSS5 in website'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in website'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      website:
        - '<svg/onload=nx50305>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50305'
