id: xss5-0158
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '#{nx50157}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50157'
