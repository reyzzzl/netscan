id: xss5-2839
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<ScRiPt%0a>alert(nx52838)</ScRiPt>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52838'
