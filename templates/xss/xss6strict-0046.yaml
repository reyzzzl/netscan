id: xss6strict-0046
name: 'Strict raw XSS in message'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      message:
        - '<marquee onstart=sx60045>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx60045'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx60045'
