id: xss5-1353
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<math><mtext%0ahref=javascript:nx51352>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51352'
