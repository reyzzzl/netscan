id: xss5-0047
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<audio%0asrc=x%0aonerror=nx50046>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50046'
