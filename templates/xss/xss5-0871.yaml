id: xss5-0871
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<bgsound%0asrc=javascript:nx50870>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50870'
