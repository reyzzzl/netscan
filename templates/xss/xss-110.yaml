id: xss-110
name: 'Reflected XSS ctx-22 via text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '<%= nx109c %>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx109c'
