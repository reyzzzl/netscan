id: xss-006
name: 'Reflected XSS ctx-5 via message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '"><img src=x onerror=alert(1)>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx005c'
