id: xss5-0538
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<form><button%09formaction=javascript:nx50537>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50537'
