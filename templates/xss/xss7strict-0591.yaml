id: xss7strict-0591
name: 'Strict breakout XSS in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      headline:
        - '"><svg onload=sx70590>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx70590'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx70590'
