id: xss5-2903
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '<p%0aoncut=nx52902>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52902'
