id: xss-077
name: 'Reflected XSS ctx-18 via comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<object data=javascript:nx076c>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx076c'
