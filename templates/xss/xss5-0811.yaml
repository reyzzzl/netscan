id: xss5-0811
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<svg/onload=nx50810>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50810'
