id: xss5-0407
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<svg/onload=nx50406>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50406'
