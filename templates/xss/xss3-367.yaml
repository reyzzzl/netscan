id: xss3-367
name: 'Raw XSS3 #6 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '"><svg%0aonload=nx3366>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx3366'
