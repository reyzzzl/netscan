id: xss5-1155
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<video%0a><source%0aonerror=nx51154>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51154'
