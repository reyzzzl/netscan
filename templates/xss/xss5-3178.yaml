id: xss5-3178
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<audio%0asrc=x%0aonerror=nx53177>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53177'
