id: xss7strict-1178
name: 'Strict breakout XSS in email'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      email:
        - '<object data=javascript:sx71177>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx71177'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx71177'
