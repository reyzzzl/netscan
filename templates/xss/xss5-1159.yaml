id: xss5-1159
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<select%0aautofocus%0aonfocus=nx51158>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51158'
