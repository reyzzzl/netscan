id: xss5-0805
name: 'Raw XSS5 in name'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in name'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - '<!--#exec cmd="echo nx50804"-->'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50804'
