id: xss5-0275
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<div%0aonpointerleave=nx50274>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50274'
