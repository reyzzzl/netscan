id: xss5-1927
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<script%0a>alert(nx51926)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51926'
