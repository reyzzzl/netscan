id: xss5-1235
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<body%09onload=nx51234>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51234'
