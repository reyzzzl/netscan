id: xss5-2557
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<embed%0asrc=data:text/html,nx52556>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52556'
