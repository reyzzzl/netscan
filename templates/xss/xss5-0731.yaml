id: xss5-0731
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<body%0d%0aonload=nx50730>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50730'
