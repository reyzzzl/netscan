id: xss5-1089
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<td%0abackground=data:text/html,nx51088>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51088'
