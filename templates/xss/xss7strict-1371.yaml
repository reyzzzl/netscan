id: xss7strict-1371
name: 'Strict breakout XSS in input'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      input:
        - '"><svg onload=sx71370>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx71370'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx71370'
