id: xss8-0933
name: 'Raw XSS8 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<body onload=nx80932/>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx80932'
