id: xss5-0902
name: 'Raw XSS5 in country'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in country'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      country:
        - '<style>@import ''javascript:nx50901'';</style>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50901'
