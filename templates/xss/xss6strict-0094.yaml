id: xss6strict-0094
name: 'Strict raw XSS in data'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      data:
        - '<details open ontoggle=sx60093>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx60093'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx60093'
