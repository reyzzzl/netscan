id: xss5-2164
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<xss%0d%0astyle=x%0d%0aonfocusin=nx52163 tabindex=1>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52163'
