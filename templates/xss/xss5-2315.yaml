id: xss5-2315
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<map><area%0ahref=javascript:nx52314></map>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52314'
