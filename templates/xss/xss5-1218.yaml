id: xss5-1218
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<img%0asrc=x%0aonerror=nx51217>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51217'
