id: xss5-2277
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '${nx52276}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52276'
