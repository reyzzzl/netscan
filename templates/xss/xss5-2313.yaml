id: xss5-2313
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<a%0ahref=data:text/html,nx52312>click'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52312'
