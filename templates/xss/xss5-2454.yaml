id: xss5-2454
name: 'Raw XSS5 in data'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in data'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      data:
        - '<object%0adata=data:text/html,nx52453>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52453'
