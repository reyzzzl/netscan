id: xss5-0710
name: 'Raw XSS5 in details'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in details'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      details:
        - '<svg/onload=nx50709>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50709'
