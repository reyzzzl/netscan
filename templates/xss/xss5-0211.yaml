id: xss5-0211
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<script%09>alert(nx50210)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50210'
