id: xss5-1697
name: 'Raw XSS5 in lastname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in lastname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      lastname:
        - '<svg><animate%0aonbegin=nx51696 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51696'
