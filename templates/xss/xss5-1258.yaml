id: xss5-1258
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<audio%09src=x%09onerror=nx51257>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51257'
