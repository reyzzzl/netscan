id: xss5-1040
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '<object%0adata=data:text/html,nx51039>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51039'
