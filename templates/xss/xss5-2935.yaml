id: xss5-2935
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<img%0asrc=x%0aonerror=nx52934>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52934'
