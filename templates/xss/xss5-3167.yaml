id: xss5-3167
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<td%09background=javascript:nx53166>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53166'
