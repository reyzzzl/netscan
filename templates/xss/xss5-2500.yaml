id: xss5-2500
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<summary%09onfocus=nx52499>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52499'
