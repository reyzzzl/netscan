id: xss5-3279
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<audio%0asrc=x%0aonerror=nx53278>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53278'
