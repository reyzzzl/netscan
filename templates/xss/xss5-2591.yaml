id: xss5-2591
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<base%09href=javascript:nx52590>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52590'
