id: xss4-009
name: 'Raw XSS4 #8 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<image src=x onerror=alert(nx4008)>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx4008'
