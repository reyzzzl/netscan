id: xss-139
name: 'Reflected XSS ctx-22 via query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<%= nx138c %>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx138c'
