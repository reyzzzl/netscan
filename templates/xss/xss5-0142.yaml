id: xss5-0142
name: 'Raw XSS5 in country'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in country'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      country:
        - '<xss%09style=x%09onauxclick=nx50141>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50141'
