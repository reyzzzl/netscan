id: xss5-2199
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<table%09background=data:text/html,nx52198>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52198'
