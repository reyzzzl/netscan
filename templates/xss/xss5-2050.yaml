id: xss5-2050
name: 'Raw XSS5 in text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '<object%0adata=data:text/html,nx52049>'
