id: xss5-2095
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<p%0aoncut=nx52094>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52094'
