id: xss-157
name: 'Reflected XSS ctx-11 via comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<marquee onstart=nx156c>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx156c'
