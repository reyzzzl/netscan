id: xss5-0031
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<embed%09src=javascript:nx50030>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50030'
