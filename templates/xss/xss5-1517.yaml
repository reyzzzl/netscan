id: xss5-1517
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<svg%09onload=nx51516>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51516'
