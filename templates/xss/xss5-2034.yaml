id: xss5-2034
name: 'Raw XSS5 in label'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in label'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      label:
        - '<script>alert(String.fromCharCode(nx52033))</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52033'
