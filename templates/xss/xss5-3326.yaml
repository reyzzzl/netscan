id: xss5-3326
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<style>@import ''javascript:nx53325'';</style>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53325'
