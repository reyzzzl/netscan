id: xss4-162
name: 'Raw XSS4 #1 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<script%0a%0a>alert(nx4161)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx4161'
