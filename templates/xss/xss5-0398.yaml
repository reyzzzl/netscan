id: xss5-0398
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<div style="width:expression(nx50397)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50397'
