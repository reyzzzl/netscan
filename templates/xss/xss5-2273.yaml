id: xss5-2273
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<textarea%0aautofocus%0aonfocus=nx52272>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52272'
