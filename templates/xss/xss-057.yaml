id: xss-057
name: 'Reflected XSS ctx-27 via comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<select onfocus=nx056c autofocus>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx056c'
