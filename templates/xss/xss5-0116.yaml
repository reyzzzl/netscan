id: xss5-0116
name: 'Raw XSS5 in placeholder'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in placeholder'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      placeholder:
        - '<script> merely nx50115 </script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50115'
