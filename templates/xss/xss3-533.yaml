id: xss3-533
name: 'Raw XSS3 #22 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<select%0aautofocus%0aonfocus=nx3532>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx3532'
