id: xss5-3881
name: 'Raw XSS5 in q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<xss%0d%0astyle=x%0d%0aonfocusin=nx53880 tabindex=1>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53880'
