id: xss5-3289
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '#{nx53288}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53288'
