id: xss5-3036
name: 'Raw XSS5 in placeholder'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in placeholder'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      placeholder:
        - '<img%0asrc=x%0aonerror=nx53035>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53035'
