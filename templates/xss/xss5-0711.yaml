id: xss5-0711
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<svg%0d%0aonload=nx50710>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50710'
