id: xss-034
name: 'Reflected XSS ctx-4 via keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<svg onload=alert(nx033c)>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx033c'
