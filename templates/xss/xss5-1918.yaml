id: xss5-1918
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<esi:include%09src=nx51917>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51917'
