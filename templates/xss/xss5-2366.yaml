id: xss5-2366
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<xss%0d%0astyle=x%0d%0aonfocusin=nx52365 tabindex=1>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52365'
