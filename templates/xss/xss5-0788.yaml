id: xss5-0788
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '<svg><animate%0aonbegin=nx50787 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50787'
