id: xss5-1114
name: 'Raw XSS5 in label'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in label'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      label:
        - '<svg/onload=nx51113>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51113'
