id: xss5-0329
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<details%0aopen%0aontoggle=nx50328>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50328'
