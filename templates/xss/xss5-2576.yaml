id: xss5-2576
name: 'Raw XSS5 in firstname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in firstname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      firstname:
        - '<textarea%0aautofocus%0aonfocus=nx52575>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52575'
