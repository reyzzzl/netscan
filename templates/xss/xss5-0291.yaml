id: xss5-0291
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - 'mhtml%3ahttp://x!nx50290'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50290'
