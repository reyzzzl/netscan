id: xss5-2086
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<base%09href=javascript:nx52085>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52085'
