id: xss5-1798
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<svg><animate%0aonbegin=nx51797 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51797'
