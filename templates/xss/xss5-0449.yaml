id: xss5-0449
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<video%09><source%09onerror=nx50448>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50448'
