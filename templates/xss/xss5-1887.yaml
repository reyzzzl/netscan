id: xss5-1887
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<frameset%0aonload=nx51886>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51886'
