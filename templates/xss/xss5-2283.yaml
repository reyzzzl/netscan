id: xss5-2283
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<wbr%09onmouseover=nx52282>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52282'
