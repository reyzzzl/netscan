id: xss5-2157
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<td%09background=javascript:nx52156>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52156'
