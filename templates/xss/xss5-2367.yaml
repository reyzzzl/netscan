id: xss5-2367
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<video%0a><source%0aonerror=nx52366>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52366'
