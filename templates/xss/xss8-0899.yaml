id: xss8-0899
name: 'Raw XSS8 in phone'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in phone'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      phone:
        - '<input autofocus onfocus=nx80898%0a>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx80898'
