id: xss5-1201
name: 'Raw XSS5 in q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<a%09href=javascript:nx51200>click'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51200'
