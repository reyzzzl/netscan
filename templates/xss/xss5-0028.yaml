id: xss5-0028
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '<marquee%09behavior=slide%09onstart=nx50027>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50027'
