id: xss5-1948
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '<object%09data=javascript:nx51947>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51947'
