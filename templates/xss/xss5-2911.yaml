id: xss5-2911
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<mi%0ahref=javascript:nx52910>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52910'
