id: xss7strict-0066
name: 'Strict breakout XSS in website'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      website:
        - '<button formaction=javascript:sx70065>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx70065'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx70065'
