id: xss5-1389
name: 'Raw XSS5 in summary'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in summary'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      summary:
        - '<summary%09onfocus=nx51388>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51388'
