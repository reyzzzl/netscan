id: xss5-3806
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<frameset%0aonload=nx53805>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53805'
