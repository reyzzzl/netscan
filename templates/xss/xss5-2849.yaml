id: xss5-2849
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '</title><svg%09onload=nx52848>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52848'
