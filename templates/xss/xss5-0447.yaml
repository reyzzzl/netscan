id: xss5-0447
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<xss%0d%0astyle=x%0d%0aonfocusin=nx50446 tabindex=1>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50446'
