id: xss5-2151
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<object%0adata=data:text/html,nx52150>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52150'
