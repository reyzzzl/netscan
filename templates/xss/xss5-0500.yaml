id: xss5-0500
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<div style="-moz-binding:url(''javascript:nx50499'')">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50499'
