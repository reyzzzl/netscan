id: xss5-2540
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<script> merely nx52539 </script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52539'
