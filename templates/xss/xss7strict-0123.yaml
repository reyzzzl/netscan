id: xss7strict-0123
name: 'Strict breakout XSS in search'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      search:
        - '</div><svg onload=sx70122>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx70122'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx70122'
