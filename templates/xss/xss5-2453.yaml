id: xss5-2453
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<object%09data=javascript:nx52452>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52452'
