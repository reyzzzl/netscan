id: xss5-0486
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<math%09href=javascript:nx50485>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50485'
