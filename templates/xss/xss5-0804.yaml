id: xss5-0804
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<svg style="behavior:url(nx50803)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50803'
