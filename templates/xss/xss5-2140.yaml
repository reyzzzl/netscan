id: xss5-2140
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '''><img%0asrc=x%0aonerror=nx52139>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52139'
