id: xss5-1454
name: 'Raw XSS5 in data'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in data'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      data:
        - '<math><mtext%0ahref=javascript:nx51453>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51453'
