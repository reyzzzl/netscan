id: xss5-1606
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<a%0ahref=data:text/html,nx51605>click'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51605'
