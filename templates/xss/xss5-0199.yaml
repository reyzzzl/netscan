id: xss5-0199
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<!--#exec cmd="echo nx50198"-->'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50198'
