id: xss5-3138
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<image src=x onerror=nx53137>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53137'
