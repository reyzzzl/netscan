id: xss5-2363
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<math><mtext%0ahref=javascript:nx52362>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52362'
