id: xss5-1237
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<details%09open%09ontoggle=nx51236>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51236'
