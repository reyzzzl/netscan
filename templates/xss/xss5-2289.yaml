id: xss5-2289
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<applet%0acode=javascript:nx52288>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52288'
