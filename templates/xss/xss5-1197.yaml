id: xss5-1197
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - 'JaVaScRiPt%3anx51196'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51196'
