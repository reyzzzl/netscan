id: xss5-0039
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<math><mi%09xlink:href=javascript:nx50038>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50038'
