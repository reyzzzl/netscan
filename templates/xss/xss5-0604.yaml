id: xss5-0604
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<!--#include virtual="nx50603"-->'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50603'
