id: xss5-0463
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '{{{nx50462}}}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50462'
