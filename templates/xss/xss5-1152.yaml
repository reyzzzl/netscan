id: xss5-1152
name: 'Raw XSS5 in subtext'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in subtext'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      subtext:
        - '<xss%09style=x%09onauxclick=nx51151>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51151'
