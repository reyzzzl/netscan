id: xss5-1133
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<body%0aonload=nx51132>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51132'
