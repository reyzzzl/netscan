id: xss5-0313
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<script%0d>alert(nx50312)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50312'
