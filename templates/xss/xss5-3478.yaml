id: xss5-3478
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<video%0a><source%0aonerror=nx53477>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53477'
