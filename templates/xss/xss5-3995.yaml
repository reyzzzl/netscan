id: xss5-3995
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<%= nx53994 %>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53994'
