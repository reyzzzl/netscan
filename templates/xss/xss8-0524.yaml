id: xss8-0524
name: 'Raw XSS8 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<details open ontoggle=nx80523%0d%0a>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx80523'
