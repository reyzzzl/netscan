id: xss5-0695
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - 'mhtml%3ahttp://x!nx50694'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50694'
