id: xss5-0535
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<object%0adata=data:text/html,nx50534>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50534'
