id: xss5-1657
name: 'Raw XSS5 in lastname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in lastname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      lastname:
        - '<xss%09style=x%09onauxclick=nx51656>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51656'
