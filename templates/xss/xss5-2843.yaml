id: xss5-2843
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<script> merely nx52842 </script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52842'
