id: xss5-0295
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<map><area%0ahref=javascript:nx50294></map>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50294'
