id: xss5-0124
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<body%09onload=nx50123>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50123'
