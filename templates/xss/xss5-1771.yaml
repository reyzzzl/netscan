id: xss5-1771
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '{{nx51770}}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51770'
