id: xss2-015
name: 'Reflected XSS2 ctx-14 via word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<form><button formaction="javascript:alert(nx2014)">x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx2014'
