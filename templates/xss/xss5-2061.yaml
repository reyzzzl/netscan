id: xss5-2061
name: 'Raw XSS5 in city'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in city'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      city:
        - '<xss%09style=x%09onauxclick=nx52060>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52060'
