id: xss6strict-1133
name: 'Strict raw XSS in value'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      value:
        - '<script>sx61132>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx61132'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx61132'
