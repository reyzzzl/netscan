id: xss5-2138
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '''><svg%09onload=nx52137>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52137'
