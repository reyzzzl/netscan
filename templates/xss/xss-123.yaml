id: xss-123
name: 'Reflected XSS ctx-6 via search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '''-alert(nx122c)-'''
    matchers:
      - type: word
        part: body
        words:
          - 'nx122c'
