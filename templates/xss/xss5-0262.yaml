id: xss5-0262
name: 'Raw XSS5 in country'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in country'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      country:
        - '<wbr%0aonmouseover=nx50261>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50261'
