id: xss5-0608
name: 'Raw XSS5 in title'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in title'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      title:
        - '<svg%09onload=nx50607>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50607'
