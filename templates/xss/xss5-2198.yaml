id: xss5-2198
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<details%0aontoggle=nx52197>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52197'
