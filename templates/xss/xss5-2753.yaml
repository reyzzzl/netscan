id: xss5-2753
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<details%0aopen%0aontoggle=nx52752>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52752'
