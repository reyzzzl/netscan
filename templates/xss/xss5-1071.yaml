id: xss5-1071
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<wbr%09onmouseover=nx51070>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51070'
