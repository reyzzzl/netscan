id: xss7strict-1473
name: 'Strict breakout XSS in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      caption:
        - '</div><svg onload=sx71472>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx71472'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx71472'
