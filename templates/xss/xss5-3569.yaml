id: xss5-3569
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<form%0aaction=javascript:nx53568><input type=submit>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53568'
