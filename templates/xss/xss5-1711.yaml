id: xss5-1711
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<div style="width:expression(nx51710)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51710'
