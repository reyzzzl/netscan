id: xss5-0851
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<xss%0d%0astyle=x%0d%0aonfocusin=nx50850 tabindex=1>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50850'
