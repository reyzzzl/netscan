id: xss-009
name: 'Reflected XSS ctx-8 via query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '</script><script>nx008c</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx008c'
