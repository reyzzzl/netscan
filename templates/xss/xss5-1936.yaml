id: xss5-1936
name: 'Raw XSS5 in firstname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in firstname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      firstname:
        - '''><svg%09onload=nx51935>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51935'
