id: xss5-0394
name: 'Raw XSS5 in label'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in label'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      label:
        - '<a%0ahref=data:text/html,nx50393>click'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50393'
