id: xss5-3599
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<link%09rel=stylesheet%09href=javascript:nx53598>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53598'
