id: xss5-2605
name: 'Raw XSS5 in name'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in name'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - '<svg><animate%09onbegin=nx52604 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52604'
