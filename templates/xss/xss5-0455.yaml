id: xss5-0455
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<textarea%0aautofocus%0aonfocus=nx50454>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50454'
