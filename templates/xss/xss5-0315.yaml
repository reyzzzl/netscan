id: xss5-0315
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<sCrIpT%09>alert(nx50314)</sCrIpT>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50314'
