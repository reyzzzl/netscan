id: xss5-2687
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<wbr%09onmouseover=nx52686>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52686'
