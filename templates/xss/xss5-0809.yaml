id: xss5-0809
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<svg%0aonload=nx50808>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50808'
