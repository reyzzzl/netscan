id: xss5-3129
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<!--#include virtual="nx53128"-->'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53128'
