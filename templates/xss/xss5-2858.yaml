id: xss5-2858
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<object%0adata=data:text/html,nx52857>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52857'
