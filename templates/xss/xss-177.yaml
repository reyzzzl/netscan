id: xss-177
name: 'Reflected XSS ctx-2 via comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '''"><svg onload=nx176c>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx176c'
