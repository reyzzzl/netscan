id: xss5-2757
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<object%0adata=data:text/html,nx52756>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52756'
