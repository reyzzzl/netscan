id: xss5-0855
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<audio%0asrc=x%0aonerror=nx50854>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50854'
