id: xss-171
name: 'Reflected XSS ctx-25 via q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - ''';alert(nx170c);//'
    matchers:
      - type: word
        part: body
        words:
          - 'nx170c'
