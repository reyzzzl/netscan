id: xss5-0640
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '<form%0aaction=javascript:nx50639><input type=submit>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50639'
