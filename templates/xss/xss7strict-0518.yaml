id: xss7strict-0518
name: 'Strict breakout XSS in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      suffix:
        - '<object data=javascript:sx70517>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx70517'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx70517'
