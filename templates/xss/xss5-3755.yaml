id: xss5-3755
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '"><img%09src=x%09onerror=nx53754>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53754'
