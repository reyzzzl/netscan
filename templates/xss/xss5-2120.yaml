id: xss5-2120
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '<esi:include%09src=nx52119>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52119'
