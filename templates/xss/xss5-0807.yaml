id: xss5-0807
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<esi:include%09src=nx50806>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50806'
