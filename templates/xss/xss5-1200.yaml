id: xss5-1200
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - 'mhtml%3ahttp://x!nx51199'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51199'
