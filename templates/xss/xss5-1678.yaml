id: xss5-1678
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<bgsound%09src=javascript:nx51677>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51677'
