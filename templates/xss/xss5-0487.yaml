id: xss5-0487
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<mi%0ahref=javascript:nx50486>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50486'
