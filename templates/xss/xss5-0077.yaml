id: xss5-0077
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<details%0aontoggle=nx50076>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50076'
