id: xss5-2588
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '<bgsound%0asrc=javascript:nx52587>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52587'
