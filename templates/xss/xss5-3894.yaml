id: xss5-3894
name: 'Raw XSS5 in data'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in data'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      data:
        - '<%= nx53893 %>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53893'
