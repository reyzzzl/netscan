id: xss5-3328
name: 'Raw XSS5 in title'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in title'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      title:
        - '<div style="-moz-binding:url(''javascript:nx53327'')">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53327'
