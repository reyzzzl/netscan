id: xss5-1049
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<math><mi%09xlink:href=javascript:nx51048>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51048'
