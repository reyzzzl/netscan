id: xss5-2862
name: 'Raw XSS5 in country'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in country'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      country:
        - '<form%0aaction=javascript:nx52861><input type=submit>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52861'
