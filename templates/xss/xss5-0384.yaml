id: xss5-0384
name: 'Raw XSS5 in zip'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in zip'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      zip:
        - '<svg><animate%0aonbegin=nx50383 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50383'
