id: xss7strict-1336
name: 'Strict breakout XSS in firstname'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      firstname:
        - '<button formaction=javascript:sx71335>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx71335'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx71335'
