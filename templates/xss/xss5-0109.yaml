id: xss5-0109
name: 'Raw XSS5 in summary'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in summary'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      summary:
        - '<script%0a>alert(nx50108)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50108'
