id: xss5-0035
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<table%0abackground=javascript:nx50034>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50034'
