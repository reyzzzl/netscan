id: xss3-420
name: 'Raw XSS3 #29 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<bgsound%09src=javascript:nx3419>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx3419'
