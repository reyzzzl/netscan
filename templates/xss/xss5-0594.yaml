id: xss5-0594
name: 'Raw XSS5 in label'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in label'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      label:
        - 'mhtml%3ahttp://x!nx50593'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50593'
