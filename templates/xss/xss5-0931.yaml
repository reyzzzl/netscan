id: xss5-0931
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<body%0aonload=nx50930>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50930'
