id: xss5-0144
name: 'Raw XSS5 in zip'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in zip'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      zip:
        - '<xss%0d%0astyle=x%0d%0aonfocusin=nx50143 tabindex=1>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50143'
