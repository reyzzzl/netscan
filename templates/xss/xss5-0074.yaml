id: xss5-0074
name: 'Raw XSS5 in label'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in label'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      label:
        - '<p%09oncopy=nx50073>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50073'
