id: xss5-2919
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<a%0ahref=data:text/html,nx52918>click'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52918'
