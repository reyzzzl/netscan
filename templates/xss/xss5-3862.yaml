id: xss5-3862
name: 'Raw XSS5 in country'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in country'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      country:
        - '<body%0d%0aonload=nx53861>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53861'
