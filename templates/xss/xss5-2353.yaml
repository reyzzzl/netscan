id: xss5-2353
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<object%0adata=data:text/html,nx52352>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52352'
