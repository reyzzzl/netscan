id: xss5-2609
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - 'jaVasCript%3anx52608'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52608'
