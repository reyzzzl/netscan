id: xss5-1696
name: 'Raw XSS5 in firstname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in firstname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      firstname:
        - '<svg><animate%09onbegin=nx51695 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51695'
