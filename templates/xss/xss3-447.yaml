id: xss3-447
name: 'Raw XSS3 #26 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<%= nx3446 %>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx3446'
