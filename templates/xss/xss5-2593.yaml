id: xss5-2593
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<frame%09src=javascript:nx52592>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52592'
