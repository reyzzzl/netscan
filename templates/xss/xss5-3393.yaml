id: xss5-3393
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<wbr%0aonmouseover=nx53392>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53392'
