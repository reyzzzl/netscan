id: xss5-1759
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<xss%0astyle=x%0aonpointerover=nx51758>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51758'
