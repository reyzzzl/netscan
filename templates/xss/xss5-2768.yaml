id: xss5-2768
name: 'Raw XSS5 in title'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in title'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      title:
        - '<xss%09style=x%09onauxclick=nx52767>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52767'
