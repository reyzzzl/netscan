id: xss5-1447
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<form><button%09formaction=javascript:nx51446>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51446'
