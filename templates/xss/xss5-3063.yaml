id: xss5-3063
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '<form><button%09formaction=javascript:nx53062>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53062'
