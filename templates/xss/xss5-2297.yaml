id: xss5-2297
name: 'Raw XSS5 in lastname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in lastname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      lastname:
        - '<p%0aoncut=nx52296>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52296'
