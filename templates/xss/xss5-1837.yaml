id: xss5-1837
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '''><img%0asrc=x%0aonerror=nx51836>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51836'
