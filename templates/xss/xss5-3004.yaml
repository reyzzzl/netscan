id: xss5-3004
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<p%0aoncut=nx53003>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53003'
