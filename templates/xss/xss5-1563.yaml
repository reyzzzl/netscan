id: xss5-1563
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<select%0aautofocus%0aonfocus=nx51562>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51562'
