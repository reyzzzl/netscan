id: xss5-0730
name: 'Raw XSS5 in text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '<body%09onload=nx50729>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50729'
