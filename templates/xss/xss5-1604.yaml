id: xss5-1604
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - 'mhtml%3ahttp://x!nx51603'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51603'
