id: xss5-2320
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '<!--#exec cmd="echo nx52319"-->'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52319'
