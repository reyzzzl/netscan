id: xss5-3480
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '<audio%09src=x%09onerror=nx53479>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53479'
