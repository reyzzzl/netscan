id: xss5-1773
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<%= nx51772 %>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51772'
