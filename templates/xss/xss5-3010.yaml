id: xss5-3010
name: 'Raw XSS5 in text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '<svg><animate%0aonbegin=nx53009 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53009'
