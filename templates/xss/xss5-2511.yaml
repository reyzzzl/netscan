id: xss5-2511
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - 'data%3atext/html,nx52510'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52510'
