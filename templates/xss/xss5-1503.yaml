id: xss5-1503
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - 'mhtml%3ahttp://x!nx51502'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51502'
