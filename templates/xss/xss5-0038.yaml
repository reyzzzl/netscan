id: xss5-0038
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<iframe%0asrcdoc=<script>nx50037</script>>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50037'
