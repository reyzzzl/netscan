id: xss5-1169
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '{{&nx51168}}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51168'
