id: xss5-0924
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<script> merely nx50923 </script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50923'
