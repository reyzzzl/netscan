id: xss5-1723
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<img%0asrc=x%0aonerror=nx51722>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51722'
