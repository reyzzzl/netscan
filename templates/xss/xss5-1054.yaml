id: xss5-1054
name: 'Raw XSS5 in data'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in data'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      data:
        - '<video%0a><source%0aonerror=nx51053>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51053'
