id: xss5-1295
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<mi%0ahref=javascript:nx51294>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51294'
