id: xss5-3161
name: 'Raw XSS5 in q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<object%0adata=data:text/html,nx53160>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53160'
