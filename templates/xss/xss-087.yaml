id: xss-087
name: 'Reflected XSS ctx-28 via comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<video><source onerror=nx086c>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx086c'
