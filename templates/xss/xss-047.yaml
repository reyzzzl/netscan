id: xss-047
name: 'Reflected XSS ctx-17 via comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<iframe src=javascript:nx046c>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx046c'
