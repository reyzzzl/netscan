id: xss5-0833
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<details%09open%09ontoggle=nx50832>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50832'
