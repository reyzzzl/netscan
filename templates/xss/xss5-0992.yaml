id: xss5-0992
name: 'Raw XSS5 in subtext'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in subtext'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      subtext:
        - '<mi%0ahref=javascript:nx50991>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50991'
