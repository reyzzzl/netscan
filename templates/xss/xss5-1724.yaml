id: xss5-1724
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<image src=x onerror=nx51723>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51723'
