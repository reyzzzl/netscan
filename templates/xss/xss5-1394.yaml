id: xss5-1394
name: 'Raw XSS5 in label'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in label'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      label:
        - '<svg><animate%0aonbegin=nx51393 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51393'
