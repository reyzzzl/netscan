id: xss-065
name: 'Reflected XSS ctx-6 via name'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in name'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - '''-alert(nx064c)-'''
    matchers:
      - type: word
        part: body
        words:
          - 'nx064c'
