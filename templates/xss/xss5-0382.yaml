id: xss5-0382
name: 'Raw XSS5 in country'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in country'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      country:
        - '<td%0abackground=data:text/html,nx50381>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50381'
