id: xss5-2887
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '{{{nx52886}}}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52886'
