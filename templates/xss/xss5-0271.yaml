id: xss5-0271
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<frameset%0aonload=nx50270>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50270'
