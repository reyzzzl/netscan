id: xss5-0935
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<details%0aopen%0aontoggle=nx50934>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50934'
