id: xss5-0990
name: 'Raw XSS5 in details'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in details'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      details:
        - '<svg><animate%0aonbegin=nx50989 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50989'
