id: xss5-3793
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<%= nx53792 %>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53792'
