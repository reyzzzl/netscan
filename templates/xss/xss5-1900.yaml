id: xss5-1900
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<math%09href=javascript:nx51899>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51899'
