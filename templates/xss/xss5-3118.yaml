id: xss5-3118
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - 'vbscript%3amsgbox(nx53117)'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53117'
