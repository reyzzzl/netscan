id: xss-007
name: 'Reflected XSS ctx-6 via comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '''-alert(nx006c)-'''
    matchers:
      - type: word
        part: body
        words:
          - 'nx006c'
