id: xss5-0395
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<area%09href=javascript:nx50394>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50394'
