id: xss5-0161
name: 'Raw XSS5 in q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<wbr%0aonmouseover=nx50160>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50160'
