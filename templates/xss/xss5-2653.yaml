id: xss5-2653
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<marquee%0aloop=1%0aonstart=nx52652>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52652'
