id: xss6strict-0995
name: 'Strict raw XSS in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      hint:
        - '<body onload=sx60994>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx60994'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx60994'
