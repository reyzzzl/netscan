id: xss5-0400
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '<svg style="behavior:url(nx50399)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50399'
