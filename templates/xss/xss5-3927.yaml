id: xss5-3927
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - 'mhtml%3ahttp://x!nx53926'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53926'
