id: xss-118
name: 'Reflected XSS ctx-1 via title'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in title'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      title:
        - '"><script>nx117c</script>'
    matchers:
