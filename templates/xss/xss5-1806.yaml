id: xss5-1806
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - 'mhtml%3ahttp://x!nx51805'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51805'
