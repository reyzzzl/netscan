id: xss5-1879
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<wbr%09onmouseover=nx51878>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51878'
