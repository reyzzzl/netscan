id: xss5-3559
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<body%0d%0aonload=nx53558>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53558'
