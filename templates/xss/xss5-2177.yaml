id: xss5-2177
name: 'Raw XSS5 in lastname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in lastname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      lastname:
        - '<%= nx52176 %>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52176'
