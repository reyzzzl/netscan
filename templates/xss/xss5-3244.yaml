id: xss5-3244
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<sCrIpT%09>alert(nx53243)</sCrIpT>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53243'
