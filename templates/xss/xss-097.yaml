id: xss-097
name: 'Reflected XSS ctx-9 via comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<body onload=nx096c>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx096c'
