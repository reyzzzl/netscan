id: xss5-3971
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<embed%0asrc=data:text/html,nx53970>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53970'
