id: xss5-0878
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<isindex%09formaction=javascript:nx50877>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50877'
