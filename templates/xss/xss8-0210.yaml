id: xss8-0210
name: 'Raw XSS8 in text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '<keygen autofocus onfocus=nx80209%09>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx80209'
