id: xss5-1180
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<frameset%0aonload=nx51179>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51179'
