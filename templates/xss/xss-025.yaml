id: xss-025
name: 'Reflected XSS ctx-24 via name'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in name'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - '\";alert(nx024c);//'
    matchers:
      - type: word
        part: body
        words:
          - 'nx024c'
