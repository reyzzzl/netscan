id: xss5-0380
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<details%0aontoggle=nx50379>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50379'
