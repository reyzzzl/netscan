id: xss5-0637
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<embed%09src=javascript:nx50636>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50636'
