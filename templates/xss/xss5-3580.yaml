id: xss5-3580
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<video%09><source%09onerror=nx53579>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53579'
