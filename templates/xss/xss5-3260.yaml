id: xss5-3260
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<marquee%09behavior=slide%09onstart=nx53259>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53259'
