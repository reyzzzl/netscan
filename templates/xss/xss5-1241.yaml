id: xss5-1241
name: 'Raw XSS5 in q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<object%09data=javascript:nx51240>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51240'
