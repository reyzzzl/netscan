id: xss-163
name: 'Reflected XSS ctx-17 via search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<iframe src=javascript:nx162c>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx162c'
