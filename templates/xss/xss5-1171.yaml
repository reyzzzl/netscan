id: xss5-1171
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<wbr%0aonmouseover=nx51170>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51170'
