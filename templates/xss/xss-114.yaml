id: xss-114
name: 'Reflected XSS ctx-26 via keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '</textarea><script>nx113c</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx113c'
