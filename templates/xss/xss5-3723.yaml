id: xss5-3723
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - 'data%3atext/html,nx53722'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53722'
