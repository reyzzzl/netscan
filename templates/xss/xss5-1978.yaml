id: xss5-1978
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '{{{nx51977}}}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51977'
