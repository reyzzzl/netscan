id: xss5-1455
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<xss%09style=x%09onauxclick=nx51454>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51454'
