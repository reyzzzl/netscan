id: xss5-0501
name: 'Raw XSS5 in city'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in city'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      city:
        - '<svg style="behavior:url(nx50500)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50500'
