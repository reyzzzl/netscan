id: xss5-3471
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<iframe%09src=javascript:nx53470>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53470'
