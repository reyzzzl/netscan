id: xss7strict-1089
name: 'Strict breakout XSS in query'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      query:
        - '<embed src=javascript:sx71088>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx71088'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx71088'
