id: xss5-3729
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<map><area%0ahref=javascript:nx53728></map>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53728'
