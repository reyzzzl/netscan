id: xss5-2879
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<textarea%0aautofocus%0aonfocus=nx52878>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52878'
