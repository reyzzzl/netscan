id: xss-017
name: 'Reflected XSS ctx-16 via comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '"><ScRiPt>nx016c</ScRiPt>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx016c'
