id: xss5-3271
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<math><mi%09xlink:href=javascript:nx53270>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53270'
