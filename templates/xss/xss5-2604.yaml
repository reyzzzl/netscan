id: xss5-2604
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<td%0abackground=data:text/html,nx52603>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52603'
