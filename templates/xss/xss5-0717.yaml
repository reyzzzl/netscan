id: xss5-0717
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<script%0d>alert(nx50716)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50716'
