id: xss5-3447
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<script%00>alert(nx53446)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53446'
