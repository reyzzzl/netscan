id: xss5-3853
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<script> merely nx53852 </script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53852'
