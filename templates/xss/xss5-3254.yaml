id: xss5-3254
name: 'Raw XSS5 in data'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in data'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      data:
        - '<body%0aonload=nx53253>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53253'
