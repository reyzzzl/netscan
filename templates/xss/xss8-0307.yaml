id: xss8-0307
name: 'Raw XSS8 in subject'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in subject'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      subject:
        - '<audio src=x onerror=nx80306%0a>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx80306'
