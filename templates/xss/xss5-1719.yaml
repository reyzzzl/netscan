id: xss5-1719
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<svg%09onload=nx51718>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51718'
