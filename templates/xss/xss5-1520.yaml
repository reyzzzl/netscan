id: xss5-1520
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '<img%09src=x%09onerror=nx51519>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51519'
