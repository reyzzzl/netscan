id: xss5-1275
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<bgsound%0asrc=javascript:nx51274>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51274'
