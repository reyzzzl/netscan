id: xss5-3229
name: 'Raw XSS5 in summary'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in summary'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      summary:
        - '<!--#exec cmd="echo nx53228"-->'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53228'
