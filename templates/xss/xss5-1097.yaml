id: xss5-1097
name: 'Raw XSS5 in lastname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in lastname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      lastname:
        - 'data%3atext/html,nx51096'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51096'
