id: xss5-0215
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<script%00>alert(nx50214)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50214'
