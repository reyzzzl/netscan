id: xss5-2027
name: 'Raw XSS5 in subject'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in subject'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      subject:
        - '<image src=x onerror=nx52026>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52026'
