id: xss5-1239
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<marquee%0aloop=1%0aonstart=nx51238>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51238'
