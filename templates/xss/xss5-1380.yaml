id: xss5-1380
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<applet%0acode=javascript:nx51379>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51379'
