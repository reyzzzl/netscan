id: xss5-2553
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<marquee%09behavior=slide%09onstart=nx52552>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52552'
