id: xss5-1457
name: 'Raw XSS5 in lastname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in lastname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      lastname:
        - '<xss%0d%0astyle=x%0d%0aonfocusin=nx51456 tabindex=1>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51456'
