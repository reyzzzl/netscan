id: xss5-3200
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '<frameset%0aonload=nx53199>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53199'
