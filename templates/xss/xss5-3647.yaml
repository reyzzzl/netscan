id: xss5-3647
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<ScRiPt%0a>alert(nx53646)</ScRiPt>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53646'
