id: xss5-1518
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<svg/onload=nx51517>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51517'
