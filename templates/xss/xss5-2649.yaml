id: xss5-2649
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<body%09onload=nx52648>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52648'
