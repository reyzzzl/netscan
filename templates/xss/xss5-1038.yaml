id: xss5-1038
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<marquee%09behavior=slide%09onstart=nx51037>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51037'
