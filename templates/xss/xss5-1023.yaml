id: xss5-1023
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '<script%00>alert(nx51022)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51022'
