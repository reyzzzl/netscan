id: xss3-430
name: 'Raw XSS3 #9 in text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '<body%0aonload=nx3429>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx3429'
