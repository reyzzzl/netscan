id: xss-180
name: 'Reflected XSS ctx-5 via text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '"><img src=x onerror=alert(1)>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx179c'
