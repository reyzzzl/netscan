id: xss5-3811
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<p%09oncopy=nx53810>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53810'
