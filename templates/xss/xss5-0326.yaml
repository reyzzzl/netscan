id: xss5-0326
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<body%09onload=nx50325>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50325'
