id: xss5-2969
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<math><mtext%0ahref=javascript:nx52968>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52968'
