id: xss5-3857
name: 'Raw XSS5 in lastname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in lastname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      lastname:
        - '''><img%0asrc=x%0aonerror=nx53856>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53856'
