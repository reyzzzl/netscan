id: xss5-2715
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - 'mhtml%3ahttp://x!nx52714'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52714'
