id: xss5-2253
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<embed%09src=javascript:nx52252>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52252'
