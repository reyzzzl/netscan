id: xss5-0978
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<frameset%0aonload=nx50977>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50977'
