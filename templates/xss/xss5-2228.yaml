id: xss5-2228
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '<img%0asrc=x%0aonerror=nx52227>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52227'
