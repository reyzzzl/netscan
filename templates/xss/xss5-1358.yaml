id: xss5-1358
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<video%09><source%09onerror=nx51357>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51357'
