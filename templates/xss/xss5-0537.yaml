id: xss5-0537
name: 'Raw XSS5 in lastname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in lastname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      lastname:
        - '<embed%0asrc=data:text/html,nx50536>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50536'
