id: xss5-0440
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '<td%09background=javascript:nx50439>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50439'
