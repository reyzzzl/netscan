id: xss5-3198
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<applet%0acode=javascript:nx53197>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53197'
