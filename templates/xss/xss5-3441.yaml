id: xss5-3441
name: 'Raw XSS5 in q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<image src=x onerror=nx53440>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53440'
