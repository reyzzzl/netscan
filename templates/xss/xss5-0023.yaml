id: xss5-0023
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '<body%09onload=nx50022>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50022'
