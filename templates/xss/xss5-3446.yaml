id: xss5-3446
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<sCrIpT%09>alert(nx53445)</sCrIpT>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53445'
