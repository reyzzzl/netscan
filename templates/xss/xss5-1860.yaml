id: xss5-1860
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<xss%0astyle=x%0aonpointerover=nx51859>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51859'
