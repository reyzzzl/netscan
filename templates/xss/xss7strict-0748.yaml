id: xss7strict-0748
name: 'Strict breakout XSS in about'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      about:
        - '<object data=javascript:sx70747>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx70747'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx70747'
