id: xss5-1039
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<object%09data=javascript:nx51038>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51038'
