id: xss5-3238
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<img%0asrc=x%0aonerror=nx53237>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53237'
