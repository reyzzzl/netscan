id: xss5-3047
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '''><svg%09onload=nx53046>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53046'
