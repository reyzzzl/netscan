id: xss5-0107
name: 'Raw XSS5 in subject'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in subject'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      subject:
        - '<img%0asrc=x%0aonerror=nx50106>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50106'
