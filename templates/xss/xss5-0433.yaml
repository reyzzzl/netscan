id: xss5-0433
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<object%09data=javascript:nx50432>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50432'
