id: xss5-1066
name: 'Raw XSS5 in website'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in website'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      website:
        - '<%= nx51065 %>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51065'
