id: xss5-1663
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '<audio%0asrc=x%0aonerror=nx51662>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51662'
