id: xss5-0620
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<script>alert(String.fromCharCode(nx50619))</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50619'
