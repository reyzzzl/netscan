id: xss5-1287
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<p%0aoncut=nx51286>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51286'
