id: xss5-3551
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '"><svg%0aonload=nx53550>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53550'
