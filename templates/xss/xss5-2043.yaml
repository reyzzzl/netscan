id: xss5-2043
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<body%09onload=nx52042>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52042'
