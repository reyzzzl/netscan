id: xss5-3518
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - 'jaVasCript%3anx53517'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53517'
