id: xss5-0354
name: 'Raw XSS5 in label'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in label'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      label:
        - '<textarea%0aautofocus%0aonfocus=nx50353>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50353'
