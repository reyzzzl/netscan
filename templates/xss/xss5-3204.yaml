id: xss5-3204
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<div%0aonpointerleave=nx53203>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53203'
