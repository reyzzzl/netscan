id: xss5-3057
name: 'Raw XSS5 in lastname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in lastname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      lastname:
        - '<marquee%0aloop=1%0aonstart=nx53056>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53056'
