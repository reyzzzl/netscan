id: xss5-1527
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<sCrIpT%09>alert(nx51526)</sCrIpT>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51526'
