id: xss5-1078
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<frame%09src=javascript:nx51077>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51077'
