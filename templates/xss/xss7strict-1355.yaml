id: xss7strict-1355
name: 'Strict breakout XSS in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      hint:
        - '<form action=javascript:sx71354>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx71354'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx71354'
