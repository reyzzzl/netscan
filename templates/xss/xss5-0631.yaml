id: xss5-0631
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<details%09open%09ontoggle=nx50630>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50630'
