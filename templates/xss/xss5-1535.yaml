id: xss5-1535
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '</textarea><svg%0aonload=nx51534>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51534'
