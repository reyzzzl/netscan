id: xss5-2801
name: 'Raw XSS5 in q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<p%09oncopy=nx52800>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52800'
