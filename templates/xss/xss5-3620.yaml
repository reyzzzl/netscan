id: xss5-3620
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - 'javascript%3anx53619'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53619'
