id: xss3-349
name: 'Raw XSS3 #18 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<xss%09style=x%09onauxclick=nx3348>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx3348'
