id: xss5-1495
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<svg><animate%0aonbegin=nx51494 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51494'
