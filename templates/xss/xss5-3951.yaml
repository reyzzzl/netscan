id: xss5-3951
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<sCrIpT%09>alert(nx53950)</sCrIpT>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53950'
