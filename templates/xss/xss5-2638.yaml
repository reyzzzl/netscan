id: xss5-2638
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<sCrIpT%09>alert(nx52637)</sCrIpT>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52637'
