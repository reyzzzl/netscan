id: xss8-0398
name: 'Raw XSS8 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<select autofocus onfocus=nx80397%09/>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx80397'
