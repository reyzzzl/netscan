id: xss5-1933
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<script>alert(String.fromCharCode(nx51932))</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51932'
