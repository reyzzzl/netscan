id: xss5-0411
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<image src=x onerror=nx50410>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50410'
