id: xss5-0301
name: 'Raw XSS5 in city'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in city'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      city:
        - '<!--#include virtual="nx50300"-->'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50300'
