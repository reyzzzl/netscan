id: xss5-1648
name: 'Raw XSS5 in title'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in title'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      title:
        - '<embed%0asrc=data:text/html,nx51647>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51647'
