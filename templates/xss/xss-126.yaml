id: xss-126
name: 'Reflected XSS ctx-9 via message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<body onload=nx125c>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx125c'
