id: xss5-3007
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<table%09background=data:text/html,nx53006>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53006'
