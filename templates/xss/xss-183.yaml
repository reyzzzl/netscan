id: xss-183
name: 'Reflected XSS ctx-8 via search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '</script><script>nx182c</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx182c'
