id: xss5-0007
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<image src=x onerror=nx50006>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50006'
