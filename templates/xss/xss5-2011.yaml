id: xss5-2011
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<area%09href=javascript:nx52010>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52010'
