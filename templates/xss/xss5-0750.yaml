id: xss5-0750
name: 'Raw XSS5 in details'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in details'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      details:
        - '<xss%0d%0astyle=x%0d%0aonfocusin=nx50749 tabindex=1>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50749'
