id: xss6strict-1657
name: 'Strict raw XSS in lastname'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      lastname:
        - '<video><source onerror=sx61656>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx61656'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx61656'
