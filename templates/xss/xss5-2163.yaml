id: xss5-2163
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<xss%0astyle=x%0aonpointerover=nx52162>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52162'
