id: xss5-1165
name: 'Raw XSS5 in name'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in name'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - '{{nx51164}}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51164'
