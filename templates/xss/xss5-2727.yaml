id: xss5-2727
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<xsl:value-of%09select=nx52726>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52726'
