id: xss5-2915
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - 'data%3atext/html,nx52914'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52914'
