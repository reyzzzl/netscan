id: xss5-0368
name: 'Raw XSS5 in title'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in title'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      title:
        - '<meta%09http-equiv=refresh%09content="0;javascript:nx50367">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50367'
