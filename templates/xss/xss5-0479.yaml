id: xss5-0479
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<p%0aoncut=nx50478>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50478'
