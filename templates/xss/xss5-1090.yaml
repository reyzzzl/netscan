id: xss5-1090
name: 'Raw XSS5 in text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '<svg><animate%09onbegin=nx51089 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51089'
