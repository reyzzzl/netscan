id: xss5-0034
name: 'Raw XSS5 in label'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in label'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      label:
        - '<form%0aaction=javascript:nx50033><input type=submit>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50033'
