id: xss5-3081
name: 'Raw XSS5 in q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<textarea%0aautofocus%0aonfocus=nx53080>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53080'
