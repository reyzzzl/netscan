id: xss-049
name: 'Reflected XSS ctx-19 via query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<form><button formaction=javascript:nx048c>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx048c'
