id: xss5-1551
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<td%09background=javascript:nx51550>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51550'
