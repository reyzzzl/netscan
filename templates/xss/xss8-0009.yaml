id: xss8-0009
name: 'Raw XSS8 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<input autofocus onfocus=nx80008>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx80008'
