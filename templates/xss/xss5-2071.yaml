id: xss5-2071
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<textarea%0aautofocus%0aonfocus=nx52070>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52070'
