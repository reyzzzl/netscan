id: xss5-0688
name: 'Raw XSS5 in title'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in title'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      title:
        - '<math%09href=javascript:nx50687>x'
