id: xss5-3715
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<td%0abackground=data:text/html,nx53714>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53714'
