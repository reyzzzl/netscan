id: xss5-2158
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<iframe%09src=javascript:nx52157>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52157'
