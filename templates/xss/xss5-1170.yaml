id: xss5-1170
name: 'Raw XSS5 in text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '{{{nx51169}}}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51169'
