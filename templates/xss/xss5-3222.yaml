id: xss5-3222
name: 'Raw XSS5 in country'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in country'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      country:
        - '<a%0ahref=data:text/html,nx53221>click'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53221'
