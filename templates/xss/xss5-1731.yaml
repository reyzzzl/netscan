id: xss5-1731
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<script>alert(String.fromCharCode(nx51730))</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51730'
