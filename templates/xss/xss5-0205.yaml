id: xss5-0205
name: 'Raw XSS5 in name'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in name'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - '<svg/onload=nx50204>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50204'
