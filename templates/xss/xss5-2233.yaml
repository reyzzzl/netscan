id: xss5-2233
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<ScRiPt%0a>alert(nx52232)</ScRiPt>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52232'
