id: xss5-0335
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<embed%0asrc=data:text/html,nx50334>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50334'
