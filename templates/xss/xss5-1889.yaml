id: xss5-1889
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<input%09type=image%09formaction=javascript:nx51888>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51888'
