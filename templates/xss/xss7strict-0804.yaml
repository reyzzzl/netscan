id: xss7strict-0804
name: 'Strict breakout XSS in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      keyword:
        - '<a href=javascript:sx70803>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx70803'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx70803'
