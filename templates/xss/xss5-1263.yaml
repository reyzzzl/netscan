id: xss5-1263
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '<textarea%0aautofocus%0aonfocus=nx51262>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51262'
