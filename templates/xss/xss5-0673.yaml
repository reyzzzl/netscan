id: xss5-0673
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<applet%0acode=javascript:nx50672>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50672'
