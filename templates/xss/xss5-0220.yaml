id: xss5-0220
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '"><img%09src=x%09onerror=nx50219>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50219'
