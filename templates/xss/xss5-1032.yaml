id: xss5-1032
name: 'Raw XSS5 in subtext'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in subtext'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      subtext:
        - '<body%0aonload=nx51031>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51031'
