id: xss5-1583
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '<frame%09src=javascript:nx51582>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51582'
