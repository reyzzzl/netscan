id: xss5-2358
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<table%0abackground=javascript:nx52357>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52357'
