id: xss5-3935
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<svg style="behavior:url(nx53934)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53934'
