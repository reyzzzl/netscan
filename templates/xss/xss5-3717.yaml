id: xss5-3717
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<svg><animate%0aonbegin=nx53716 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53716'
