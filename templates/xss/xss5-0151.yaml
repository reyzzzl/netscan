id: xss5-0151
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<keygen%09autofocus%09onfocus=nx50150>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50150'
