id: xss5-1327
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<script>alert(String.fromCharCode(nx51326))</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51326'
