id: xss-099
name: 'Reflected XSS ctx-11 via query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<marquee onstart=nx098c>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx098c'
