id: xss5-1073
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<bgsound%0asrc=javascript:nx51072>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51072'
