id: xss5-3020
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<a%0ahref=data:text/html,nx53019>click'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53019'
