id: xss5-0635
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<object%09data=javascript:nx50634>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50634'
