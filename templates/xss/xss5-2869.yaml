id: xss5-2869
name: 'Raw XSS5 in summary'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in summary'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      summary:
        - '<xss%09style=x%09onauxclick=nx52868>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52868'
