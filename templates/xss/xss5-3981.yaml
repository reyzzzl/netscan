id: xss5-3981
name: 'Raw XSS5 in city'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in city'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      city:
        - '<xss%0astyle=x%0aonpointerover=nx53980>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53980'
