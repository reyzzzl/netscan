id: xss5-1940
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '</title><svg%09onload=nx51939>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51939'
