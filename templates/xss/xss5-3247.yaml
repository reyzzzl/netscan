id: xss5-3247
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<script> merely nx53246 </script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53246'
