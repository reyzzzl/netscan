id: xss5-0234
name: 'Raw XSS5 in label'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in label'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      label:
        - '<embed%0asrc=data:text/html,nx50233>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50233'
