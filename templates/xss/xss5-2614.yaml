id: xss5-2614
name: 'Raw XSS5 in data'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in data'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      data:
        - 'mhtml%3ahttp://x!nx52613'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52613'
