id: xss5-2439
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<script> merely nx52438 </script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52438'
