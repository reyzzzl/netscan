id: xss5-0523
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '"><img%09src=x%09onerror=nx50522>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50522'
