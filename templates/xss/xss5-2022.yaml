id: xss5-2022
name: 'Raw XSS5 in country'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in country'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      country:
        - '<svg%09onload=nx52021>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52021'
