id: xss5-0153
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<input%09autofocus%09onfocus=nx50152>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50152'
