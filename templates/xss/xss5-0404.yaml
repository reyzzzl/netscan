id: xss5-0404
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<xsl:value-of%09select=nx50403>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50403'
