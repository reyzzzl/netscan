id: xss3-086
name: 'Raw XSS3 #25 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '${nx3085}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx3085'
