id: xss5-0033
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<form><button%09formaction=javascript:nx50032>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50032'
