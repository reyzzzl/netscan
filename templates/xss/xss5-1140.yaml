id: xss5-1140
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<object%09data=javascript:nx51139>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51139'
