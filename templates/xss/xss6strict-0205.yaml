id: xss6strict-0205
name: 'Strict raw XSS in name'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      name:
        - '<body onload=sx60204>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx60204'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx60204'
