id: xss5-0277
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<p%0aoncut=nx50276>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50276'
