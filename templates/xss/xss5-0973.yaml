id: xss5-0973
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<link%09rel=stylesheet%09href=javascript:nx50972>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50972'
