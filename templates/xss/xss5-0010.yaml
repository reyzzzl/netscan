id: xss5-0010
name: 'Raw XSS5 in text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '<script%0d>alert(nx50009)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50009'
