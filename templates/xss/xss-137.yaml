id: xss-137
name: 'Reflected XSS ctx-20 via comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '{{nx136c}}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx136c'
