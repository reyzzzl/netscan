id: xss5-2087
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<applet%0acode=javascript:nx52086>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52086'
