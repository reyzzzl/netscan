id: xss5-0820
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<sCrIpT%09>alert(nx50819)</sCrIpT>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50819'
