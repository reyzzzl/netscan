id: xss5-3151
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '</textarea><svg%0aonload=nx53150>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53150'
