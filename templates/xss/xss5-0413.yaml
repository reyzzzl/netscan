id: xss5-0413
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<script%09>alert(nx50412)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50412'
