id: xss5-1582
name: 'Raw XSS5 in country'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in country'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      country:
        - '<applet%0acode=javascript:nx51581>'
