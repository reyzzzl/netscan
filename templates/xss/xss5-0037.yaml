id: xss5-0037
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<iframe%09src=javascript:nx50036>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50036'
