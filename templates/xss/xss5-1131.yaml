id: xss5-1131
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '</textarea><svg%0aonload=nx51130>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51130'
