id: xss5-3514
name: 'Raw XSS5 in label'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in label'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      label:
        - '<svg><animate%09onbegin=nx53513 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53513'
