id: xss5-1958
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<math><mi%09xlink:href=javascript:nx51957>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51957'
