id: xss8-1473
name: 'Raw XSS8 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<body onload=nx81472>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx81472'
