id: xss5-0253
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<textarea%0aautofocus%0aonfocus=nx50252>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50252'
