id: xss5-0217
name: 'Raw XSS5 in lastname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in lastname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      lastname:
        - '<script> merely nx50216 </script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50216'
