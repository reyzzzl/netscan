id: xss5-2891
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<bgsound%0asrc=javascript:nx52890>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52890'
