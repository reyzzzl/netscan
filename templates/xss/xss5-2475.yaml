id: xss5-2475
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<textarea%0aautofocus%0aonfocus=nx52474>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52474'
