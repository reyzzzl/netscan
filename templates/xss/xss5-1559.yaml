id: xss5-1559
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<video%0a><source%0aonerror=nx51558>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51558'
