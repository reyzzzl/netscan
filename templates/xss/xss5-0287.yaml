id: xss5-0287
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - 'javascript%3anx50286'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50286'
