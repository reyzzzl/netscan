id: xss5-0875
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<applet%0acode=javascript:nx50874>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50874'
