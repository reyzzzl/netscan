id: xss5-0998
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - 'mhtml%3ahttp://x!nx50997'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50997'
