id: xss5-2487
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<bgsound%0asrc=javascript:nx52486>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52486'
