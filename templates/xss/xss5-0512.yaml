id: xss5-0512
name: 'Raw XSS5 in subtext'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in subtext'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      subtext:
        - '<image src=x onerror=nx50511>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50511'
