id: xss5-3564
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<object%09data=javascript:nx53563>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53563'
