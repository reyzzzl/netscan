id: xss5-2053
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<form><button%09formaction=javascript:nx52052>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52052'
