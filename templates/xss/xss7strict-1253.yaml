id: xss7strict-1253
name: 'Strict breakout XSS in value'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      value:
        - '</div><svg onload=sx71252>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx71252'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx71252'
