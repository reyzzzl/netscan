id: xss5-2007
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - 'vbscript%3amsgbox(nx52006)'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52006'
