id: xss5-0119
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '"><img%09src=x%09onerror=nx50118>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50118'
