id: xss5-1524
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<script%09>alert(nx51523)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51523'
