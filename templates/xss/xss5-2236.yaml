id: xss5-2236
name: 'Raw XSS5 in placeholder'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in placeholder'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      placeholder:
        - '<script>alert(String.fromCharCode(nx52235))</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52235'
