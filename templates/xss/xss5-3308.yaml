id: xss5-3308
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '<summary%09onfocus=nx53307>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53307'
