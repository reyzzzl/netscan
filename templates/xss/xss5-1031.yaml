id: xss5-1031
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '</title><svg%09onload=nx51030>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51030'
