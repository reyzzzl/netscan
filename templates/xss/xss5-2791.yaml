id: xss5-2791
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<link%09rel=stylesheet%09href=javascript:nx52790>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52790'
