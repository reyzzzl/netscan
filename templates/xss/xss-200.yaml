id: xss-200
name: 'Reflected XSS ctx-25 via text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - ''';alert(nx199c);//'
    matchers:
      - type: word
        part: body
        words:
          - 'nx199c'
