id: xss5-0974
name: 'Raw XSS5 in data'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in data'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      data:
        - '<meta%09http-equiv=refresh%09content="0;javascript:nx50973">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50973'
