id: xss5-2047
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<marquee%0aloop=1%0aonstart=nx52046>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52046'
