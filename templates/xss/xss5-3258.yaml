id: xss5-3258
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<details%0aopen%0aontoggle=nx53257>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53257'
