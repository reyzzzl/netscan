id: xss5-0019
name: 'Raw XSS5 in phone'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in phone'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      phone:
        - '''><img%0asrc=x%0aonerror=nx50018>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50018'
