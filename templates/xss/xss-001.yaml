id: xss-001
name: 'Reflected XSS ctx-0 via q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<script>nx000c</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx000c'
