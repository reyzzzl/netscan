id: xss5-4000
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '<wbr%09onmouseover=nx53999>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53999'
