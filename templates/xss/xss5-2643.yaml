id: xss5-2643
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '''><svg%09onload=nx52642>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52642'
