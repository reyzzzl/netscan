id: xss5-0281
name: 'Raw XSS5 in q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<td%0abackground=data:text/html,nx50280>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50280'
