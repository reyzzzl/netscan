id: xss5-2301
name: 'Raw XSS5 in city'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in city'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      city:
        - '<td%0abackground=data:text/html,nx52300>'
