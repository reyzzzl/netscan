id: xss5-2078
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '{{&nx52077}}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52077'
