id: xss5-2182
name: 'Raw XSS5 in country'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in country'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      country:
        - '<wbr%09onmouseover=nx52181>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52181'
