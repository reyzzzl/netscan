id: xss-193
name: 'Reflected XSS ctx-18 via search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<object data=javascript:nx192c>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx192c'
