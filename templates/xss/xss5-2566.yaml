id: xss5-2566
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<xss%09style=x%09onauxclick=nx52565>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52565'
