id: xss5-3153
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<body%0aonload=nx53152>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53152'
