id: xss5-0367
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<link%09rel=stylesheet%09href=javascript:nx50366>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50366'
