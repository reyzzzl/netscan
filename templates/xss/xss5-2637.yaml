id: xss5-2637
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<ScRiPt%0a>alert(nx52636)</ScRiPt>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52636'
