id: xss-033
name: 'Reflected XSS ctx-3 via search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<img src=x onerror=nx032c>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx032c'
