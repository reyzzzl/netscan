id: xss5-0775
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<frame%09src=javascript:nx50774>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50774'
