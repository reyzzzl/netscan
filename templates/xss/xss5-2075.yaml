id: xss5-2075
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '${nx52074}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52074'
