id: xss5-3125
name: 'Raw XSS5 in name'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in name'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - '<div style="width:expression(nx53124)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53124'
