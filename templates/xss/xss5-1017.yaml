id: xss5-1017
name: 'Raw XSS5 in lastname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in lastname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      lastname:
        - '<image src=x onerror=nx51016>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51016'
