id: xss5-2740
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<script%00>alert(nx52739)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52739'
