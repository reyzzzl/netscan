id: xss5-1941
name: 'Raw XSS5 in city'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in city'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      city:
        - '<body%0aonload=nx51940>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51940'
