id: xss5-2988
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '{{{nx52987}}}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52987'
