id: xss5-0702
name: 'Raw XSS5 in country'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in country'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      country:
        - '<div style="-moz-binding:url(''javascript:nx50701'')">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50701'
