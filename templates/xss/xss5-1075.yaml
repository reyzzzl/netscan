id: xss5-1075
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<meta%09http-equiv=refresh%09content="0;javascript:nx51074">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51074'
