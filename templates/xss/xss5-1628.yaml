id: xss5-1628
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '<sCrIpT%09>alert(nx51627)</sCrIpT>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51627'
