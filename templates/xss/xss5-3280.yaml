id: xss5-3280
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '<select%0aautofocus%0aonfocus=nx53279>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53279'
