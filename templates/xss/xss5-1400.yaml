id: xss5-1400
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - 'data%3atext/html,nx51399'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51399'
