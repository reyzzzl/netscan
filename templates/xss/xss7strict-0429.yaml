id: xss7strict-0429
name: 'Strict breakout XSS in summary'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      summary:
        - '<embed src=javascript:sx70428>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx70428'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx70428'
