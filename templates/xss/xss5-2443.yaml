id: xss5-2443
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '''><img%0asrc=x%0aonerror=nx52442>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52442'
