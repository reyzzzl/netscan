id: xss5-2239
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '''><svg%09onload=nx52238>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52238'
