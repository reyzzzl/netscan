id: xss5-3060
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<object%0adata=data:text/html,nx53059>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53059'
