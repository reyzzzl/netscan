id: xss8-1435
name: 'Raw XSS8 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<marquee onstart=nx81434%0a>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx81434'
