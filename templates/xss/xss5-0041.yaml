id: xss5-0041
name: 'Raw XSS5 in q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<xss%09style=x%09onauxclick=nx50040>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50040'
