id: xss5-2142
name: 'Raw XSS5 in country'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in country'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      country:
        - '</title><svg%09onload=nx52141>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52141'
