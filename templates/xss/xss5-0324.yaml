id: xss5-0324
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '</title><svg%09onload=nx50323>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50323'
