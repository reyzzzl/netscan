id: xss7strict-1375
name: 'Strict breakout XSS in word'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      word:
        - '<form action=javascript:sx71374>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx71374'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx71374'
