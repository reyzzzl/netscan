id: xss5-3780
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<xss%0d%0astyle=x%0d%0aonfocusin=nx53779 tabindex=1>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53779'
