id: xss5-2300
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<table%09background=data:text/html,nx52299>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52299'
