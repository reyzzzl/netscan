id: xss5-0689
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<mi%0ahref=javascript:nx50688>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50688'
