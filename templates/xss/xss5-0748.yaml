id: xss5-0748
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '<xss%09style=x%09onauxclick=nx50747>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50747'
