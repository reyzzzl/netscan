id: xss5-0378
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<p%0aoncut=nx50377>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50377'
