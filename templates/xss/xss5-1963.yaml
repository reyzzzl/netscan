id: xss5-1963
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<video%0a><source%0aonerror=nx51962>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51962'
