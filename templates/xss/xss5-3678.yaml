id: xss5-3678
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<xss%0astyle=x%0aonpointerover=nx53677>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53677'
