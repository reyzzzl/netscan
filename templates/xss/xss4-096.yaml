id: xss4-096
name: 'Raw XSS4 #15 in title'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in title'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      title:
        - '<p oncopy=alert(nx4095)>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx4095'
