id: xss5-0967
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '{{&nx50966}}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50966'
