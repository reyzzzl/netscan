id: xss5-0180
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<td%0abackground=data:text/html,nx50179>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50179'
