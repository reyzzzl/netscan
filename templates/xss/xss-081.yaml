id: xss-081
name: 'Reflected XSS ctx-22 via q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<%= nx080c %>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx080c'
