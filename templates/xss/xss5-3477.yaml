id: xss5-3477
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<xss%0d%0astyle=x%0d%0aonfocusin=nx53476 tabindex=1>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53476'
