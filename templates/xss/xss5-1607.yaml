id: xss5-1607
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<area%09href=javascript:nx51606>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51606'
