id: xss5-3239
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<image src=x onerror=nx53238>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53238'
