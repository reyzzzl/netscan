id: xss5-1009
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<esi:include%09src=nx51008>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51008'
