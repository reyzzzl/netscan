id: xss5-1076
name: 'Raw XSS5 in placeholder'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in placeholder'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      placeholder:
        - '<base%09href=javascript:nx51075>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51075'
