id: xss5-2831
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<svg/onload=nx52830>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52830'
