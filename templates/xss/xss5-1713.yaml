id: xss5-1713
name: 'Raw XSS5 in caption'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in caption'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      caption:
        - '<svg style="behavior:url(nx51712)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51712'
