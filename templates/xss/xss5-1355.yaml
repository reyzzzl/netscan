id: xss5-1355
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<xss%0astyle=x%0aonpointerover=nx51354>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51354'
