id: xss5-3211
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<svg><animate%09onbegin=nx53210 attributeName=x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53210'
