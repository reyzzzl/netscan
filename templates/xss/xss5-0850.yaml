id: xss5-0850
name: 'Raw XSS5 in text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '<xss%0astyle=x%0aonpointerover=nx50849>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50849'
