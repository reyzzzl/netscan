id: xss5-2019
name: 'Raw XSS5 in phone'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in phone'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      phone:
        - '<esi:include%09src=nx52018>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52018'
