id: xss8-1591
name: 'Raw XSS8 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<svg onload=nx81590%20>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx81590'
