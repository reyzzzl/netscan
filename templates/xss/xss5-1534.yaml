id: xss5-1534
name: 'Raw XSS5 in data'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in data'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      data:
        - '''><img%0asrc=x%0aonerror=nx51533>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51533'
