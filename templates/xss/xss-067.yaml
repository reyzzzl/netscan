id: xss-067
name: 'Reflected XSS ctx-8 via comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '</script><script>nx066c</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx066c'
