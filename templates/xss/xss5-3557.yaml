id: xss5-3557
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<body%0aonload=nx53556>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53556'
