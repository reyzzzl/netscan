id: xss5-2458
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<form%0aaction=javascript:nx52457><input type=submit>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52457'
