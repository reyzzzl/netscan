id: xss-164
name: 'Reflected XSS ctx-18 via keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<object data=javascript:nx163c>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx163c'
