id: xss5-2581
name: 'Raw XSS5 in city'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in city'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      city:
        - '<%= nx52580 %>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52580'
