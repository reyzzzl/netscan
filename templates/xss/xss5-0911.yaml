id: xss5-0911
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<svg%09onload=nx50910>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50910'
