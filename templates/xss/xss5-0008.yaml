id: xss5-0008
name: 'Raw XSS5 in title'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in title'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      title:
        - '<script%0a>alert(nx50007)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50007'
