id: xss5-1560
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '<video%09><source%09onerror=nx51559>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51559'
