id: xss-018
name: 'Reflected XSS ctx-17 via title'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in title'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      title:
        - '<iframe src=javascript:nx017c>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx017c'
