id: xss3-304
name: 'Raw XSS3 #3 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<script%0a>alert(nx3303)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx3303'
