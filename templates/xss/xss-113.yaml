id: xss-113
name: 'Reflected XSS ctx-25 via search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - ''';alert(nx112c);//'
    matchers:
      - type: word
        part: body
        words:
          - 'nx112c'
