id: xss5-2420
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<svg style="behavior:url(nx52419)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52419'
