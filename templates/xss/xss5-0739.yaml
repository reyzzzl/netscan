id: xss5-0739
name: 'Raw XSS5 in phone'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in phone'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      phone:
        - '<embed%0asrc=data:text/html,nx50738>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50738'
