id: xss5-3086
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<%= nx53085 %>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53085'
