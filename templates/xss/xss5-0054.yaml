id: xss5-0054
name: 'Raw XSS5 in data'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in data'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      data:
        - '{{nx50053}}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50053'
