id: xss-104
name: 'Reflected XSS ctx-16 via keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '"><ScRiPt>nx103c</ScRiPt>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx103c'
