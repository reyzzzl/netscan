id: xss5-3598
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<bgsound%0asrc=javascript:nx53597>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53597'
