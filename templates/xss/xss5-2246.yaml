id: xss5-2246
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<body%0d%0aonload=nx52245>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52245'
