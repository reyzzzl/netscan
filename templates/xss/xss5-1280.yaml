id: xss5-1280
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '<frame%09src=javascript:nx51279>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51279'
