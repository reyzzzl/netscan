id: xss5-0366
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<bgsound%0asrc=javascript:nx50365>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50365'
