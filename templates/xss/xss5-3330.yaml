id: xss5-3330
name: 'Raw XSS5 in text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '<!--#exec cmd="echo nx53329"-->'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53329'
