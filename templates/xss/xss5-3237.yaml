id: xss5-3237
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<img%09src=x%09onerror=nx53236>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53236'
