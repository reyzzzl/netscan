id: xss5-1359
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<audio%09src=x%09onerror=nx51358>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51358'
