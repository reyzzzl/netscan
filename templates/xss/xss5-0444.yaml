id: xss5-0444
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<math><mtext%0ahref=javascript:nx50443>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50443'
