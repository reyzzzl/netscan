id: xss-134
name: 'Reflected XSS ctx-17 via keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<iframe src=javascript:nx133c>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx133c'
