id: xss5-1839
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '</title><svg%09onload=nx51838>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51838'
