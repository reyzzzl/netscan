id: xss5-2822
name: 'Raw XSS5 in country'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in country'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      country:
        - '<div style="width:expression(nx52821)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52821'
