id: xss5-0618
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<sCrIpT%09>alert(nx50617)</sCrIpT>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50617'
