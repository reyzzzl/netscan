id: xss5-0840
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '<embed%0asrc=data:text/html,nx50839>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50839'
