id: xss5-1751
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<form%0aaction=javascript:nx51750><input type=submit>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51750'
