id: xss5-1411
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<!--#exec cmd="echo nx51410"-->'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51410'
