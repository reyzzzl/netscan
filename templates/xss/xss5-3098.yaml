id: xss5-3098
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<frame%09src=javascript:nx53097>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53097'
