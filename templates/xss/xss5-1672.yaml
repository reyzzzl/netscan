id: xss5-1672
name: 'Raw XSS5 in subtext'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in subtext'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      subtext:
        - '<%= nx51671 %>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51671'
