id: xss5-0206
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<svg%0d%0aonload=nx50205>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50205'
