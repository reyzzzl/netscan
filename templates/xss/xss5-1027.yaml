id: xss5-1027
name: 'Raw XSS5 in subject'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in subject'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      subject:
        - '''><svg%09onload=nx51026>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51026'
