id: xss5-0891
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<mi%0ahref=javascript:nx50890>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50890'
