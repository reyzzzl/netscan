id: xss5-1917
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<!--#include virtual="nx51916"-->'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51916'
