id: xss5-2809
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<math%09href=javascript:nx52808>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52808'
