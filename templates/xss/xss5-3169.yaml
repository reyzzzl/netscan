id: xss5-3169
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<iframe%0asrcdoc=<script>nx53168</script>>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53168'
