id: xss5-3457
name: 'Raw XSS5 in lastname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in lastname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      lastname:
        - '<body%09onload=nx53456>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53456'
