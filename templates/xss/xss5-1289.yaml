id: xss5-1289
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<details%0aontoggle=nx51288>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51288'
