id: xss5-3295
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<bgsound%0asrc=javascript:nx53294>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53294'
