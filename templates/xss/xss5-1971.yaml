id: xss5-1971
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<input%09autofocus%09onfocus=nx51970>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51970'
