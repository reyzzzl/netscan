id: xss5-1677
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<wbr%09onmouseover=nx51676>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51676'
