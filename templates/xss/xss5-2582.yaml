id: xss5-2582
name: 'Raw XSS5 in country'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in country'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      country:
        - '#{nx52581}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52581'
