id: xss5-0919
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<script%0d>alert(nx50918)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50918'
