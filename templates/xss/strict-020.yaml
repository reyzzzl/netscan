id: strict-020
name: 'Strict raw XSS via query'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      query:
        - '<details open ontoggle=sx019>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx019'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx019'
