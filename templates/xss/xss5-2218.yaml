id: xss5-2218
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<svg style="behavior:url(nx52217)">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52217'
