id: xss5-2517
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<map><area%0ahref=javascript:nx52516></map>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52516'
