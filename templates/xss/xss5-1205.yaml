id: xss5-1205
name: 'Raw XSS5 in name'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in name'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - '<style>@import ''javascript:nx51204'';</style>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51204'
