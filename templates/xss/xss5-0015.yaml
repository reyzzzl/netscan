id: xss5-0015
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<script> merely nx50014 </script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50014'
