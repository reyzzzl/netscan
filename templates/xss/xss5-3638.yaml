id: xss5-3638
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<svg%09onload=nx53637>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53637'
