id: xss5-2203
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<math%09href=javascript:nx52202>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52202'
