id: xss5-0140
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<math><mi%09xlink:href=javascript:nx50139>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50139'
