id: xss-119
name: 'Reflected XSS ctx-2 via query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '''"><svg onload=nx118c>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx118c'
