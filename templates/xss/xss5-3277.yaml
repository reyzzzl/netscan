id: xss5-3277
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<video%09><source%09onerror=nx53276>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53276'
