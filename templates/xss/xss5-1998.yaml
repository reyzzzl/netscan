id: xss5-1998
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<td%0abackground=data:text/html,nx51997>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51997'
