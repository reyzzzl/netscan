id: xss8-1180
name: 'Raw XSS8 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<keygen autofocus onfocus=nx81179%0d%0a>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx81179'
