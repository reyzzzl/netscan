id: xss5-1729
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<sCrIpT%09>alert(nx51728)</sCrIpT>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51728'
