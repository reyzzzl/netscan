id: strict-004
name: 'Strict raw XSS via query'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      query:
        - '"><script>sx003</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx003'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx003'
