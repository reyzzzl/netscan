id: xss5-0868
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '<wbr%0aonmouseover=nx50867>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50867'
