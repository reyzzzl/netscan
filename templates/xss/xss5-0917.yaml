id: xss5-0917
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<script%0a>alert(nx50916)</script>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50916'
