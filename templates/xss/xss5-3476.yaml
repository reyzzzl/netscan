id: xss5-3476
name: 'Raw XSS5 in placeholder'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in placeholder'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      placeholder:
        - '<xss%0astyle=x%0aonpointerover=nx53475>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53475'
