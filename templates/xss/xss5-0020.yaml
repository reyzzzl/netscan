id: xss5-0020
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '</textarea><svg%0aonload=nx50019>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50019'
