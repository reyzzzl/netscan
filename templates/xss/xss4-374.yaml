id: xss4-374
name: 'Raw XSS4 #13 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<details ontoggle=alert(nx4373)>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx4373'
