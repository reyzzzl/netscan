id: xss7strict-0744
name: 'Strict breakout XSS in zip'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      zip:
        - '<a href=javascript:sx70743>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx70743'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx70743'
