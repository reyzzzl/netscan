id: xss8-0815
name: 'Raw XSS8 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<marquee onstart=nx80814%20>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx80814'
