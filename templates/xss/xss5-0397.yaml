id: xss5-0397
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<style>@import ''javascript:nx50396'';</style>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50396'
