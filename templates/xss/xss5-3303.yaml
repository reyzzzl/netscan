id: xss5-3303
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '<input%09type=image%09formaction=javascript:nx53302>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53302'
