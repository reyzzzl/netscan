id: xss5-3668
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '<embed%0asrc=data:text/html,nx53667>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53667'
