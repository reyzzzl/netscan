id: xss5-0498
name: 'Raw XSS5 in email'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in email'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      email:
        - '<style>@import ''javascript:nx50497'';</style>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50497'
