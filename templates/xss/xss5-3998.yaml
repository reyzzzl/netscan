id: xss5-3998
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '{{{nx53997}}}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53997'
