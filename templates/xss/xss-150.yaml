id: xss-150
name: 'Reflected XSS ctx-4 via text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '<svg onload=alert(nx149c)>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx149c'
