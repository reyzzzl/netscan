id: xss5-3194
name: 'Raw XSS5 in label'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in label'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      label:
        - '<bgsound%0asrc=javascript:nx53193>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53193'
