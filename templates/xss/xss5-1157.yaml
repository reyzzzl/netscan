id: xss5-1157
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<audio%09src=x%09onerror=nx51156>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51156'
