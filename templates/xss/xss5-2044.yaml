id: xss5-2044
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<body%0d%0aonload=nx52043>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52043'
