id: xss5-3016
name: 'Raw XSS5 in firstname'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in firstname'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      firstname:
        - 'data%3atext/html,nx53015'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53015'
