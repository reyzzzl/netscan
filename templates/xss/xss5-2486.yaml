id: xss5-2486
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<bgsound%09src=javascript:nx52485>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52485'
