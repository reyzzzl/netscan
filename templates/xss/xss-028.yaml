id: xss-028
name: 'Reflected XSS ctx-27 via title'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in title'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      title:
        - '<select onfocus=nx027c autofocus>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx027c'
