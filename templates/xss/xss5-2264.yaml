id: xss5-2264
name: 'Raw XSS5 in zip'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in zip'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      zip:
        - '<xss%0astyle=x%0aonpointerover=nx52263>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52263'
