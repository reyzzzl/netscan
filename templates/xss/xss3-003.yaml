id: xss3-003
name: 'Raw XSS3 #2 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<img%09src=x%09onerror=nx3002>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx3002'
