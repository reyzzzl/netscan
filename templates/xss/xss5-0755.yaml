id: xss5-0755
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<select%0aautofocus%0aonfocus=nx50754>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50754'
