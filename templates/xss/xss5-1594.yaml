id: xss5-1594
name: 'Raw XSS5 in label'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in label'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      label:
        - '<td%0abackground=data:text/html,nx51593>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51593'
