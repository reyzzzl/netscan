id: xss5-0955
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<audio%09src=x%09onerror=nx50954>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50954'
