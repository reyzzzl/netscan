id: xss5-3054
name: 'Raw XSS5 in data'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in data'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      data:
        - '<body%0d%0aonload=nx53053>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53053'
