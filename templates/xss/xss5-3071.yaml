id: xss5-3071
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<xss%09style=x%09onauxclick=nx53070>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53070'
