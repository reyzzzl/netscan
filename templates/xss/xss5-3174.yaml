id: xss5-3174
name: 'Raw XSS5 in data'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in data'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      data:
        - '<xss%0d%0astyle=x%0d%0aonfocusin=nx53173 tabindex=1>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53173'
