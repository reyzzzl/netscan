id: xss5-3917
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '<td%0abackground=data:text/html,nx53916>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53916'
