id: xss5-2603
name: 'Raw XSS5 in search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<table%09background=data:text/html,nx52602>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52602'
