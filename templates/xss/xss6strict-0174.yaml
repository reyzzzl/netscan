id: xss6strict-0174
name: 'Strict raw XSS in data'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      data:
        - '<details open ontoggle=sx60173>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx60173'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx60173'
