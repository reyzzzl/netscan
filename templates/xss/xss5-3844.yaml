id: xss5-3844
name: 'Raw XSS5 in keyword'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in keyword'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      keyword:
        - '<img%0asrc=x%0aonerror=nx53843>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53843'
