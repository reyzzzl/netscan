id: xss5-1051
name: 'Raw XSS5 in input'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in input'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      input:
        - '<xss%09style=x%09onauxclick=nx51050>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51050'
