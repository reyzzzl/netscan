id: xss8-1367
name: 'Raw XSS8 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<audio src=x onerror=nx81366%20>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx81366'
