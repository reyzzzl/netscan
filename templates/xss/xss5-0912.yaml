id: xss5-0912
name: 'Raw XSS5 in subtext'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in subtext'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      subtext:
        - '<svg/onload=nx50911>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50911'
