id: xss5-0117
name: 'Raw XSS5 in prefix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in prefix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      prefix:
        - '"><svg%0aonload=nx50116>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50116'
