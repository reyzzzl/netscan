id: xss5-0758
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<textarea%0aautofocus%0aonfocus=nx50757>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50757'
