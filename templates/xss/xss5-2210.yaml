id: xss5-2210
name: 'Raw XSS5 in text'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - 'mhtml%3ahttp://x!nx52209'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52209'
