id: xss-063
name: 'Reflected XSS ctx-4 via search'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in search'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<svg onload=alert(nx062c)>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx062c'
