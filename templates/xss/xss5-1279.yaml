id: xss5-1279
name: 'Raw XSS5 in author'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in author'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      author:
        - '<applet%0acode=javascript:nx51278>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51278'
