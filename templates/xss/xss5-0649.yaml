id: xss5-0649
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<xss%0d%0astyle=x%0d%0aonfocusin=nx50648 tabindex=1>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50648'
