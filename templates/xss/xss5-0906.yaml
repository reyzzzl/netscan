id: xss5-0906
name: 'Raw XSS5 in website'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in website'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      website:
        - '<!--#exec cmd="echo nx50905"-->'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50905'
