id: xss5-0685
name: 'Raw XSS5 in name'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in name'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - '<td%0abackground=data:text/html,nx50684>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50684'
