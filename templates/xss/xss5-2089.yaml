id: xss5-2089
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<frameset%0aonload=nx52088>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52088'
