id: xss5-1926
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<image src=x onerror=nx51925>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51925'
