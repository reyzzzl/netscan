id: xss5-2551
name: 'Raw XSS5 in headline'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in headline'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      headline:
        - '<details%0aopen%0aontoggle=nx52550>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52550'
