id: xss5-0718
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<ScRiPt%0a>alert(nx50717)</ScRiPt>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50717'
