id: xss-051
name: 'Reflected XSS ctx-21 via q'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '${nx050c}'
    matchers:
      - type: word
        part: body
        words:
          - 'nx050c'
