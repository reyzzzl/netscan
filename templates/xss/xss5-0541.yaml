id: xss5-0541
name: 'Raw XSS5 in city'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in city'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      city:
        - '<td%09background=javascript:nx50540>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50540'
