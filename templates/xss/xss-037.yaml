id: xss-037
name: 'Reflected XSS ctx-7 via comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '"-alert(nx036c)-"'
    matchers:
      - type: word
        part: body
        words:
          - 'nx036c'
