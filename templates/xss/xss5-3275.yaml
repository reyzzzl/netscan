id: xss5-3275
name: 'Raw XSS5 in hint'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in hint'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      hint:
        - '<xss%0d%0astyle=x%0d%0aonfocusin=nx53274 tabindex=1>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53274'
