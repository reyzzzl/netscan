id: xss5-2608
name: 'Raw XSS5 in title'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in title'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      title:
        - '<mi%0ahref=javascript:nx52607>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52607'
