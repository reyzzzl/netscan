id: xss6strict-0265
name: 'Strict raw XSS in company'
severity: high
type: active
tags:
  - xss
  - injection
  - strict
description: 'Fires only on raw brackets, not encoded'
requests:
  - method: GET
    path: '{{BaseURL}}'
    match-all: true
    payloads:
      company:
        - '<body onload=sx60264>'
    matchers:
      - type: word
        part: body
        words:
          - 'sx60264'
      - type: regex
        part: body
        regex:
          - '<[a-zA-Z/!][^<>]{0,40}sx60264'
