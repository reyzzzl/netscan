id: xss5-0263
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '<wbr%09onmouseover=nx50262>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50262'
