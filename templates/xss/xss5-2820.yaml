id: xss5-2820
name: 'Raw XSS5 in address'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in address'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      address:
        - '<map><area%0ahref=javascript:nx52819></map>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52819'
