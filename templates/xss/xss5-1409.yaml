id: xss5-1409
name: 'Raw XSS5 in query'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '<div style="-moz-binding:url(''javascript:nx51408'')">'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51408'
