id: xss5-2718
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<area%09href=javascript:nx52717>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52717'
