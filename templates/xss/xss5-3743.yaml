id: xss5-3743
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '<img%0asrc=x%0aonerror=nx53742>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53742'
