id: xss5-3206
name: 'Raw XSS5 in message'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in message'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<p%0aoncut=nx53205>x'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53205'
