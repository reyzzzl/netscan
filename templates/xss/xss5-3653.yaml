id: xss5-3653
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '''><svg%09onload=nx53652>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53652'
