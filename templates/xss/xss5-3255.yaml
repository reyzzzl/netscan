id: xss5-3255
name: 'Raw XSS5 in word'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in word'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      word:
        - '<body%09onload=nx53254>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53254'
