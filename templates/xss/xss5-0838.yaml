id: xss5-0838
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<object%0adata=data:text/html,nx50837>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50837'
