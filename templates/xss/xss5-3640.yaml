id: xss5-3640
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '<svg%0d%0aonload=nx53639>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx53639'
