id: xss5-2013
name: 'Raw XSS5 in value'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in value'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      value:
        - '<style>@import ''javascript:nx52012'';</style>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52012'
