id: xss5-0834
name: 'Raw XSS5 in label'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in label'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      label:
        - '<details%0aopen%0aontoggle=nx50833>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50833'
