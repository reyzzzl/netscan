id: xss5-1318
name: 'Raw XSS5 in suffix'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in suffix'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      suffix:
        - '<img%09src=x%09onerror=nx51317>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx51317'
