id: xss5-0200
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '<!--#include virtual="nx50199"-->'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50199'
