id: xss5-0508
name: 'Raw XSS5 in about'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in about'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      about:
        - '<svg/onload=nx50507>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50507'
