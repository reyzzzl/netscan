id: xss5-0280
name: 'Raw XSS5 in nick'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in nick'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nick:
        - '<table%09background=data:text/html,nx50279>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50279'
