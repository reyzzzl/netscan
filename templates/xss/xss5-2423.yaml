id: xss5-2423
name: 'Raw XSS5 in state'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in state'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      state:
        - '<esi:include%09src=nx52422>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx52422'
