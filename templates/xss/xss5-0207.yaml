id: xss5-0207
name: 'Raw XSS5 in comment'
severity: high
type: active
tags:
  - xss
  - injection
  - client
description: 'Unencoded reflection in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '<img%09src=x%09onerror=nx50206>'
    matchers:
      - type: word
        part: body
        words:
          - 'nx50206'
