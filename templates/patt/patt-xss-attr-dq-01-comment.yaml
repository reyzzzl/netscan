id: patt-xss-attr-dq-01-comment
name: 'PATT xss patt-xss-attr-dq-01 via comment'
severity: high
type: active
tags:
  - xss
  - patt
description: 'PATT breakout attribute double-quote generic. [patt:patt-xss-attr-dq-01] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/XSS%20Injection/README.md]'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '"><svg onload=nxp0011>'
    matchers:
      - type: word
        part: body
        words:
          - 'nxp0011'
