id: patt-xss-marquee-01-message
name: 'PATT xss patt-xss-marquee-01 via message'
severity: high
type: active
tags:
  - xss
  - patt
description: 'PATT marquee onstart. [patt:patt-xss-marquee-01] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/XSS%20Injection/README.md]'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      message:
        - '<marquee loop=1 behavior=slide width=1 onstart=nxp0023>'
    matchers:
      - type: word
        part: body
        words:
          - 'nxp0023'
