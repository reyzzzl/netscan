id: patt-sqli-mysql-bool-01-user
name: 'PATT sqli patt-sqli-mysql-bool-01 via user'
severity: high
type: active
tags:
  - sqli
  - patt
requires:
  - php
description: 'PATT MySQL boolean: '' OR ''1 (True/False split). [patt:patt-sqli-mysql-bool-01] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/SQL%20Injection/MySQL%20Injection.md]'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      user:
        - ''' OR ''1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
          - 'You have an error in your SQL syntax'
