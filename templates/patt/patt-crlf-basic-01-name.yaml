id: patt-crlf-basic-01-name
name: 'PATT crlf patt-crlf-basic-01 via name'
severity: medium
type: active
tags:
  - crlf
  - patt
description: 'PATT CRLF %0d%0a injection header. [patt:patt-crlf-basic-01] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/CRLF%20Injection/README.md]'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - 'x%0d%0aX-Test: patt'
    matchers:
      - type: word
        part: headers
        words:
          - 'x-test'
