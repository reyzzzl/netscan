id: patt-gql-batch-01-q
name: 'PATT GraphQL patt-gql-batch-01 via q'
severity: medium
type: active
tags:
  - graphql
  - patt
  - api
  - introspection
requires:
  - graphql
description: 'PATT GraphQL batching/alias probe. [patt:patt-gql-batch-01] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/GraphQL%20Injection/README.md]'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '{a:__typename,b:__typename}'
    matchers:
      - type: word
        part: body
        words:
          - '__typename'
