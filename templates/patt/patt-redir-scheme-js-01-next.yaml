id: patt-redir-scheme-js-01-next
name: 'PATT redirect patt-redir-scheme-js-01 via next'
severity: medium
type: active
tags:
  - redirect
  - patt
  - schemejs
description: 'PATT dangerous scheme javascript:. [patt:patt-redir-scheme-js-01] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/Open%20Redirect/README.md]'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      next:
        - 'javascript:alert(1)'
    matchers:
      - type: word
        part: headers
        words:
          - 'javascript:'
