id: patt-sqli-pg-time-01-page
name: 'PATT sqli patt-sqli-pg-time-01 via page'
severity: high
type: active
tags:
  - sqli
  - patt
requires:
  - python
  - django
description: 'PATT PG time-based pg_sleep(3) stacked. [patt:patt-sqli-pg-time-01] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/SQL%20Injection/PostgreSQL%20Injection.md]'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - '''; SELECT pg_sleep(3)-- -'
    matchers:
      - type: time
        ms: 2500
