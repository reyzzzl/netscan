id: patt-crlf-cookie-01-q
name: 'PATT crlf patt-crlf-cookie-01 via q'
severity: medium
type: active
tags:
  - crlf
  - patt
description: 'PATT CRLF ke Set-Cookie (response splitting). [patt:patt-crlf-cookie-01] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/CRLF%20Injection/README.md]'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - 'x%0d%0aSet-Cookie: patt=1'
    matchers:
      - type: word
        part: headers
        words:
          - 'patt=1'
