id: patt-ssti-poly-02-template
name: 'PATT ssti patt-ssti-poly-02 via template'
severity: critical
type: active
tags:
  - ssti
  - patt
description: 'PATT universal detection: Freemarker/Mako/Thymeleaf/JSP render 49. [patt:patt-ssti-poly-02] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/Server%20Side%20Template%20Injection/README.md]'
requests:
