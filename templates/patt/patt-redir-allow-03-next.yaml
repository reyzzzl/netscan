id: patt-redir-allow-03-next
name: 'PATT redirect patt-redir-allow-03 via next'
severity: high
type: active
tags:
  - redirect
  - patt
  - allowlistuserinfo
description: 'PATT allowlist bypass: userinfo @. [patt:patt-redir-allow-03] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/Open%20Redirect/README.md]'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      next:
        - 'https://trusted.com@evil.example/'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil.example'
