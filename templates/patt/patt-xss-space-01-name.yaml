id: patt-xss-space-01-name
name: 'PATT xss patt-xss-space-01 via name'
severity: high
type: active
tags:
  - xss
  - patt
  - filterspace
description: 'PATT space bypass: slash as attribute separator (spaceless). [patt:patt-xss-space-01] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/XSS%20Injection/README.md]'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - '<svg/onload=nxp0007>'
    matchers:
      - type: word
        part: body
        words:
          - 'nxp0007'
