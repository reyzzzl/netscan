id: patt-xss-attr-sq-01-name
name: 'PATT xss patt-xss-attr-sq-01 via name'
severity: high
type: active
tags:
  - xss
  - patt
description: 'PATT breakout attribute single-quote generic. [patt:patt-xss-attr-sq-01] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/XSS%20Injection/README.md]'
requests:
