id: patt-xss-js-str-01-comment
name: 'PATT xss patt-xss-js-str-01 via comment'
severity: high
type: active
tags:
  - xss
  - patt
  - filterquote
description: 'PATT breakout JS string double-quote. [patt:patt-xss-js-str-01] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/XSS%20Injection/README.md]'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '";alert(nxp0014);//'
    matchers:
      - type: word
        part: body
        words:
          - 'nxp0014'
