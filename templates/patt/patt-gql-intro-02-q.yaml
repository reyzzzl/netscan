id: patt-gql-intro-02-q
name: 'PATT GraphQL patt-gql-intro-02 via q'
severity: medium
type: active
tags:
  - graphql
  - patt
  - api
  - introspection
requires:
  - graphql
description: 'PATT GraphQL minimal probe (passes when __schema dimatikan). [patt:patt-gql-intro-02] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/GraphQL%20Injection/README.md]'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '{__typename}'
    matchers:
      - type: word
        part: body
        words:
          - '__typename'
