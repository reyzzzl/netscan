id: patt-cmdi-chain-04-cmd
name: 'PATT cmdi patt-cmdi-chain-04 via cmd'
severity: critical
type: active
tags:
  - cmdi
  - patt
description: 'PATT command substitution $(). [patt:patt-cmdi-chain-04] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/Command%20Injection/README.md]'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cmd:
        - '$(id)'
    matchers:
      - type: word
        part: body
        words:
          - 'uid='
          - 'gid='
