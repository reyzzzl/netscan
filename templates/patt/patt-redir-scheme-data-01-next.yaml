  - patt
  - schemedata
description: 'PATT dangerous scheme data:. [patt:patt-redir-scheme-data-01] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/Open%20Redirect/README.md]'
requests:
