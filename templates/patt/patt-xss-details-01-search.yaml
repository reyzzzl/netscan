id: patt-xss-details-01-search
name: 'PATT xss patt-xss-details-01 via search'
severity: high
type: active
tags:
  - xss
  - patt
description: 'PATT details ontoggle no interaction. [patt:patt-xss-details-01] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/XSS%20Injection/README.md]'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      search:
        - '<details open ontoggle=nxp0022>'
    matchers:
      - type: word
        part: body
        words:
          - 'nxp0022'
