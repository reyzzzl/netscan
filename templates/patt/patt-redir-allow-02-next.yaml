id: patt-redir-allow-02-next
name: 'PATT redirect patt-redir-allow-02 via next'
severity: high
type: active
tags:
  - redirect
  - patt
  - allowlistencode
description: 'PATT allowlist bypass: %2e as dot. [patt:patt-redir-allow-02] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/Open%20Redirect/README.md]'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      next:
        - 'https://trusted.com%2eevil.example/'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil.example'
