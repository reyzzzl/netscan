id: patt-ssti-smarty-01-name
name: 'PATT ssti patt-ssti-smarty-01 via name'
severity: critical
type: active
tags:
  - ssti
  - patt
requires:
  - php
description: 'PATT Smarty detection. [patt:patt-ssti-smarty-01] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/Server%20Side%20Template%20Injection/PHP.md]'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - '{7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
