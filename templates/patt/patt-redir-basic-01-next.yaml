id: patt-redir-basic-01-next
name: 'PATT redirect patt-redir-basic-01 via next'
severity: medium
type: active
tags:
  - redirect
  - patt
description: 'PATT baseline redirect (compare with allowlist bypasses below). [patt:patt-redir-basic-01] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/Open%20Redirect/README.md]'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      next:
        - 'https://evil.example/'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil.example'
