id: patt-sqli-mssql-err-01-id
name: 'PATT sqli patt-sqli-mssql-err-01 via id'
severity: high
type: active
tags:
  - sqli
  - patt
requires:
  - dotnet
description: 'PATT MSSQL error-based. [patt:patt-sqli-mssql-err-01] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/SQL%20Injection/MSSQL%20Injection.md]'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      id:
        - ''' OR ''1''=''1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'ODBC'
          - 'SQL Server'
          - 'Unclosed quotation mark'
