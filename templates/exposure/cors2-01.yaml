id: cors2-01
name: 'CORS origin null'
severity: medium
type: active
tags:
  - cors
  - headers
  - api
description: 'Origin reflected on /api/data'
requests:
  - method: GET
    path: '{{BaseURL}}/api/data'
    sendHeaders:
      Origin: 'null'
    matchers:
      - type: word
        part: headers
        words:
          - 'null'
