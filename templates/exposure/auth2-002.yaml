id: auth2-002
name: 'Admin API v2 at /api/v2/admin'
severity: low
type: active
tags:
  - auth
  - exposure
  - discovery
description: 'Admin API v2 returns 200 — check auth manually'
requests:
  - method: GET
    path: '{{BaseURL}}/api/v2/admin'
    matchers:
      - type: status
        status: [200]
