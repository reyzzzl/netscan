id: graphql-18
name: 'GraphQL introspection via q'
severity: medium
type: active
tags:
  - graphql
  - api
  - introspection
description: 'GraphQL schema exposed via q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '{__schema{types{fields{name}}}}'
    matchers:
      - type: word
        part: body
        words:
          - '__schema'
          - '__typename'
