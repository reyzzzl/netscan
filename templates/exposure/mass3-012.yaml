id: mass3-012
name: 'Mass field superadmin'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered superadmin on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"a1","superadmin":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
