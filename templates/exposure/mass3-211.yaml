id: mass3-211
name: 'Mass field share'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered share on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"t","share":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
