id: nosql2-226
name: 'NoSQL $mod in user'
severity: high
type: active
tags:
  - nosql
  - injection
  - api
description: 'NoSQL operator $mod accepted on /api/login'
requests:
  - method: POST
    path: '{{BaseURL}}/api/login'
    body: '{"user":{"$mod":""},"extra":"x"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
          - 'token'
