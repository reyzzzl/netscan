id: cors3-072
name: 'CORS origin https://e271.example'
severity: medium
type: active
tags:
  - cors
  - headers
  - api
description: 'Origin reflected on /api/data'
requests:
  - method: GET
    path: '{{BaseURL}}/api/data'
    sendHeaders:
      Origin: 'https://e271.example'
    matchers:
      - type: word
        part: headers
        words:
          - 'e271.example'
