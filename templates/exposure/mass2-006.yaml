id: mass2-006
name: 'Mass field admin_group'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered admin_group on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"a1","admin_group":"admin"}'
    match-all: true
    matchers:
      - type: status
        status: [200]
      - type: regex
        part: body
        regex:
          - '"admin"\s*:\s*true'
