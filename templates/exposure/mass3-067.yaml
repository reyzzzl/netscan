id: mass3-067
name: 'Mass field replica'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered replica on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"t","replica":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
