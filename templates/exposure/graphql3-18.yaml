id: graphql3-18
name: 'Mutation probe in q'
severity: medium
type: active
tags:
  - graphql
  - api
  - mutation
description: 'GraphQL mutation reachable via q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - 'mutation{createUser{__typename}}'
    matchers:
      - type: word
        part: body
        words:
          - '__schema'
          - '__typename'
          - 'data'
