id: mass3-138
name: 'Mass field transaction'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered transaction on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"a1","transaction":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
