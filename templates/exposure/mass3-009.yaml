id: mass3-009
name: 'Mass field root2'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered root2 on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"a1","root2":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
