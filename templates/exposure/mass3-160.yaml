id: mass3-160
name: 'Mass field discount'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered discount on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"t","discount":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
