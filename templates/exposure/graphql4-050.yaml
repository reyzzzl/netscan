id: graphql4-050
name: 'GQL probe in q'
severity: medium
type: active
tags:
  - graphql
  - api
  - introspection
description: 'GraphQL schema exposed via q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - '{__type(name:"User"){fields{name}}} #c'
    matchers:
      - type: word
        part: body
        words:
          - '__schema'
          - '__typename'
          - 'data'
