id: graphql4-060
name: 'GQL probe in operation'
severity: medium
type: active
tags:
  - graphql
  - api
  - introspection
description: 'GraphQL schema exposed via operation'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      operation:
        - '{node(id:1){__typename}} #c'
    matchers:
      - type: word
        part: body
        words:
          - '__schema'
          - '__typename'
          - 'data'
