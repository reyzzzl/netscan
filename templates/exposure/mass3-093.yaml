id: mass3-093
name: 'Mass field bot2'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered bot2 on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"a1","bot2":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
