id: mass3-259
name: 'Mass field voucher'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered voucher on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"t","voucher":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
