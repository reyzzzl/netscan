id: cors-02
name: 'CORS reflect https://attacker.com'
severity: medium
type: active
tags:
  - cors
  - headers
  - api
description: 'Origin https://attacker.com reflected on /api/data'
requests:
  - method: GET
    path: '{{BaseURL}}/api/data'
    sendHeaders:
      Origin: 'https://attacker.com'
    matchers:
      - type: word
        part: headers
        words:
          - 'attacker.com'
