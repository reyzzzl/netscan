id: mass2-011
name: 'Mass field user_level'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered user_level on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"u1","user_level":"admin"}'
    match-all: true
    matchers:
      - type: status
        status: [200]
      - type: regex
        part: body
        regex:
          - '"admin"\s*:\s*true'
