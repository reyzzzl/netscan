id: mass3-076
name: 'Mass field coordinator'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered coordinator on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"t","coordinator":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
