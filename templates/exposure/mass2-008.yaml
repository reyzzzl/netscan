id: mass2-008
name: 'Mass field role_id'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered role_id on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"u1","role_id":"admin"}'
    match-all: true
    matchers:
      - type: status
        status: [200]
      - type: regex
        part: body
        regex:
          - '"admin"\s*:\s*true'
