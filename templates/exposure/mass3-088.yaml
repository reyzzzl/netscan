id: mass3-088
name: 'Mass field agent2'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered agent2 on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"t","agent2":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
