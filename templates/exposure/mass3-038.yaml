id: mass3-038
name: 'Mass field viewer'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered viewer on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"u1","viewer":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
