id: mass3-099
name: 'Mass field integration'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered integration on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"a1","integration":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
