id: mass2-065
name: 'Mass field bucket'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered bucket on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"u1","bucket":"admin"}'
    match-all: true
    matchers:
      - type: status
        status: [200]
      - type: regex
        part: body
        regex:
          - '"admin"\s*:\s*true'
