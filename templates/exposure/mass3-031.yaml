id: mass3-031
name: 'Mass field author2'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered author2 on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"t","author2":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
