id: mass-023
name: 'Mass assignment field type'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered type on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"test","type":"admin"}'
    match-all: true
    matchers:
      - type: status
        status: [200]
      - type: regex
        part: body
        regex:
          - '"admin"\s*:\s*true'
