id: nosql2-107
name: 'NoSQL $where in account'
severity: high
type: active
tags:
  - nosql
  - injection
  - api
description: 'NoSQL operator $where accepted on /api/login'
requests:
  - method: POST
    path: '{{BaseURL}}/api/login'
    body: '{"account":{"$where":""},"extra":"x"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
          - 'token'
