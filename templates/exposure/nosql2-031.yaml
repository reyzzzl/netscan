id: nosql2-031
name: 'NoSQL $lt in session'
severity: high
type: active
tags:
  - nosql
  - injection
  - api
description: 'NoSQL operator $lt accepted on /api/login'
requests:
  - method: POST
    path: '{{BaseURL}}/api/login'
    body: '{"session":{"$lt":""},"extra":"x"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
          - 'token'
