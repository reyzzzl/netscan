id: mass3-203
name: 'Mass field heart'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered heart on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"u1","heart":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
