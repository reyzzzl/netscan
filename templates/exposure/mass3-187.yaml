id: mass3-187
name: 'Mass field badge'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered badge on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"t","badge":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
