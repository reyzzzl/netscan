id: mass3-269
name: 'Mass field iban'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered iban on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"u1","iban":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
