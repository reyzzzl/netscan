id: mass3-049
name: 'Mass field daemon'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered daemon on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"t","daemon":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
