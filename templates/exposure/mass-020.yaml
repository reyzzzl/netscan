id: mass-020
name: 'Mass assignment field group'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered group on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"demo","group":"admin"}'
    match-all: true
    matchers:
      - type: status
        status: [200]
      - type: regex
        part: body
        regex:
          - '"admin"\s*:\s*true'
