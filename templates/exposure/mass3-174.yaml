id: mass3-174
name: 'Mass field reward'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered reward on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"a1","reward":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
