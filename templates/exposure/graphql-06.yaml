id: graphql-06
name: 'GraphQL introspection via query'
severity: medium
type: active
tags:
  - graphql
  - api
  - introspection
description: 'GraphQL schema exposed via query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '{__schema{mutationType{name}}}'
    matchers:
      - type: word
        part: body
        words:
          - '__schema'
          - '__typename'
