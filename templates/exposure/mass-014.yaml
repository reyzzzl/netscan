id: mass-014
name: 'Mass assignment field balance'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered balance on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"user1","balance":99999}'
    match-all: true
    matchers:
      - type: status
        status: [200]
      - type: regex
        part: body
        regex:
          - '"admin"\s*:\s*true'
