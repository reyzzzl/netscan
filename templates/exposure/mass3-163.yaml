id: mass3-163
name: 'Mass field coupon'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered coupon on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"t","coupon":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
