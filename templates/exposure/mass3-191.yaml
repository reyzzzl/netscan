id: mass3-191
name: 'Mass field trophy'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered trophy on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"u1","trophy":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
