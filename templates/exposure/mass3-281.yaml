id: mass3-281
name: 'Mass field micr'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered micr on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"u1","micr":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
