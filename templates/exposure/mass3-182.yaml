id: mass3-182
name: 'Mass field rank'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered rank on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"u1","rank":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
