id: nosql2-138
name: 'NoSQL $size in token'
severity: high
type: active
tags:
  - nosql
  - injection
  - api
description: 'NoSQL operator $size accepted on /api/login'
requests:
  - method: POST
    path: '{{BaseURL}}/api/login'
    body: '{"token":{"$size":""},"extra":"x"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
          - 'token'
