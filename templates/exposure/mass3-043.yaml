id: mass3-043
name: 'Mass field anonymous2'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered anonymous2 on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"t","anonymous2":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
