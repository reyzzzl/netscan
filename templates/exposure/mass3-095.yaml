id: mass3-095
name: 'Mass field webhook2'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered webhook2 on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"u1","webhook2":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
