id: mass3-104
name: 'Mass field vendor2'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered vendor2 on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"u1","vendor2":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
