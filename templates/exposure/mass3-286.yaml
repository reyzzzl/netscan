id: mass3-286
name: 'Mass field draft'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered draft on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"t","draft":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
