id: mass3-247
name: 'Mass field passport'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered passport on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"t","passport":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
