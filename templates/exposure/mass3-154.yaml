id: mass3-154
name: 'Mass field interest'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered interest on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"t","interest":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
