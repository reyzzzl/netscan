id: nosql2-068
name: 'NoSQL $in in uid'
severity: high
type: active
tags:
  - nosql
  - injection
  - api
description: 'NoSQL operator $in accepted on /api/login'
requests:
  - method: POST
    path: '{{BaseURL}}/api/login'
    body: '{"uid":{"$in":""},"extra":"x"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
          - 'token'
