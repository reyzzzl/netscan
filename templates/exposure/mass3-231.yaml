id: mass3-231
name: 'Mass field grade'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered grade on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"a1","grade":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
