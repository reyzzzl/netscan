id: graphql4-108
name: 'GQL probe in operation'
severity: medium
type: active
tags:
  - graphql
  - api
  - introspection
description: 'GraphQL schema exposed via operation'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      operation:
        - 'mutation {__schema{types{fields{name}}}}'
    matchers:
      - type: word
        part: body
        words:
          - '__schema'
          - '__typename'
          - 'data'
