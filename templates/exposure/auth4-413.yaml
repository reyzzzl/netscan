id: auth4-413
name: 'Panel at /oauth/login'
severity: low
type: active
tags:
  - auth
  - exposure
  - discovery
description: 'Panel at /oauth/login returns 200 — check auth manually'
requests:
  - method: GET
    path: '{{BaseURL}}/oauth/login'
    matchers:
      - type: status
        status: [200]
