id: auth4-382
name: 'Panel at /login/status'
severity: low
type: active
tags:
  - auth
  - exposure
  - discovery
description: 'Panel at /login/status returns 200 — check auth manually'
requests:
  - method: GET
    path: '{{BaseURL}}/login/status'
    matchers:
      - type: status
        status: [200]
