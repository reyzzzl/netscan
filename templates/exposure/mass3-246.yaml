id: mass3-246
name: 'Mass field visa'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered visa on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"a1","visa":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
