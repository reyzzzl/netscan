id: mass3-107
name: 'Mass field client2'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered client2 on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"u1","client2":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
