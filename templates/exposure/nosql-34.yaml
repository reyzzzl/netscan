id: nosql-34
name: 'NoSQL $where in password'
severity: high
type: active
tags:
  - nosql
  - injection
  - api
description: 'NoSQL operator $where accepted on /api/login'
requests:
  - method: POST
    path: '{{BaseURL}}/api/login'
    body: '{"password":{"$where":""},"extra":"x"}'
    match-all: true
    matchers:
      - type: status
        status: [200]
      - type: regex
        part: body
        regex:
          - '"token"\s*:'
