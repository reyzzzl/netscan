id: mass3-242
name: 'Mass field permit'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered permit on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"u1","permit":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
