id: mass2-035
name: 'Mass field team'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered team on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"u1","team":"admin"}'
    match-all: true
    matchers:
      - type: status
        status: [200]
      - type: regex
        part: body
        regex:
          - '"admin"\s*:\s*true'
