id: nosql2-190
name: 'NoSQL $comment in user'
severity: high
type: active
tags:
  - nosql
  - injection
  - api
description: 'NoSQL operator $comment accepted on /api/login'
requests:
  - method: POST
    path: '{{BaseURL}}/api/login'
    body: '{"user":{"$comment":""},"extra":"x"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
          - 'token'
