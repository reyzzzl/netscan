id: mass3-019
name: 'Mass field devops'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered devops on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"t","devops":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
