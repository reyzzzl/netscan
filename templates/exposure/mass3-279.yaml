id: mass3-279
name: 'Mass field aba'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered aba on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"a1","aba":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
