id: mass3-116
name: 'Mass field member2'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered member2 on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"u1","member2":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
