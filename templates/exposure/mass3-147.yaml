id: mass3-147
name: 'Mass field credit'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered credit on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"a1","credit":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
