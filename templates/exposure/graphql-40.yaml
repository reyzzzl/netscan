id: graphql-40
name: 'GraphQL introspection via operation'
severity: medium
type: active
tags:
  - graphql
  - api
  - introspection
description: 'GraphQL schema exposed via operation'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      operation:
        - '{_service{sdl}}'
    matchers:
      - type: word
        part: body
        words:
          - '__schema'
          - '__typename'
