id: mass3-175
name: 'Mass field point'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered point on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"t","point":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
