id: mass3-026
name: 'Mass field moderator'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered moderator on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"u1","moderator":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
