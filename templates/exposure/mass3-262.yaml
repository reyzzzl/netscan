id: mass3-262
name: 'Mass field card'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered card on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"t","card":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
