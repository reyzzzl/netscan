id: mass3-299
name: 'Mass field customs'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered customs on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"u1","customs":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
