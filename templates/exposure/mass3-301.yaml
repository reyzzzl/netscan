id: mass3-301
name: 'Mass field duty'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered duty on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"t","duty":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
