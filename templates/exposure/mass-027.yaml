id: mass-027
name: 'Mass assignment field level'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered level on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"test","level":10}'
    match-all: true
    matchers:
      - type: status
        status: [200]
      - type: regex
        part: body
        regex:
          - '"admin"\s*:\s*true'
