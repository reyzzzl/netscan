id: mass3-029
name: 'Mass field editor'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered editor on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"u1","editor":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
