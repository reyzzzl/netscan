id: graphql3-28
name: 'Mutation probe in operation'
severity: medium
type: active
tags:
  - graphql
  - api
  - mutation
description: 'GraphQL mutation reachable via operation'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      operation:
        - 'query{node(id:1){__typename}}'
    matchers:
      - type: word
        part: body
        words:
          - '__schema'
          - '__typename'
          - 'data'
