id: mass3-133
name: 'Mass field receipt'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered receipt on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"t","receipt":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
