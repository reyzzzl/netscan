id: mass3-036
name: 'Mass field contributor'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered contributor on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"a1","contributor":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
