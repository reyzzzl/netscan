id: graphql4-022
name: 'GQL probe in q'
severity: medium
type: active
tags:
  - graphql
  - api
  - introspection
description: 'GraphQL schema exposed via q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - 'query {__schema{mutationType{name}}}'
    matchers:
      - type: word
        part: body
        words:
          - '__schema'
          - '__typename'
          - 'data'
