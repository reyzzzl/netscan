id: mass3-080
name: 'Mass field scheduler'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered scheduler on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"u1","scheduler":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
