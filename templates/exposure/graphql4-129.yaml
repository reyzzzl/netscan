id: graphql4-129
name: 'GQL probe in query'
severity: medium
type: active
tags:
  - graphql
  - api
  - introspection
description: 'GraphQL schema exposed via query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '{"query":"{_service{sdl}}"}'
    matchers:
      - type: word
        part: body
        words:
          - '__schema'
          - '__typename'
          - 'data'
