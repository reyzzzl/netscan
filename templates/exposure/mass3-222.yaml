id: mass3-222
name: 'Mass field survey'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered survey on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"a1","survey":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
