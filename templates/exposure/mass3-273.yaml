id: mass3-273
name: 'Mass field swift'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered swift on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"a1","swift":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
