id: mass3-159
name: 'Mass field tax'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered tax on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"a1","tax":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
