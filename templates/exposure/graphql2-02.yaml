id: graphql2-02
name: 'Introspection probe in query'
severity: medium
type: active
tags:
  - graphql
  - api
  - introspection
description: 'GraphQL schema exposed via query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '{__typename}'
    matchers:
      - type: word
        part: body
        words:
          - '__schema'
          - '__typename'
