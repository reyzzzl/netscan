id: graphql3-41
name: 'Mutation probe in query'
severity: medium
type: active
tags:
  - graphql
  - api
  - mutation
description: 'GraphQL mutation reachable via query'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      query:
        - '{__schema{types{name,fields{name}}}}'
    matchers:
      - type: word
        part: body
        words:
          - '__schema'
          - '__typename'
          - 'data'
