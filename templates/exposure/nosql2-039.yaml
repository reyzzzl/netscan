id: nosql2-039
name: 'NoSQL $lte in email'
severity: high
type: active
tags:
  - nosql
  - injection
  - api
description: 'NoSQL operator $lte accepted on /api/login'
requests:
  - method: POST
    path: '{{BaseURL}}/api/login'
    body: '{"email":{"$lte":""},"extra":"x"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
          - 'token'
