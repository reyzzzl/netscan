id: graphql-26
name: 'GraphQL introspection via graphql'
severity: medium
type: active
tags:
  - graphql
  - api
  - introspection
description: 'GraphQL schema exposed via graphql'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      graphql:
        - '{__schema{mutationType{name}}}'
    matchers:
      - type: word
        part: body
        words:
          - '__schema'
          - '__typename'
