id: mass3-311
name: 'Mass field allocation'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered allocation on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"u1","allocation":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
