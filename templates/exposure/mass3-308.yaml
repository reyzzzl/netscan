id: mass3-308
name: 'Mass field quota2'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered quota2 on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"u1","quota2":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
