id: graphql4-235
name: 'GQL probe in graphql'
severity: medium
type: active
tags:
  - graphql
  - api
  - introspection
description: 'GraphQL schema exposed via graphql'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      graphql:
        - '{__typename} #c'
    matchers:
      - type: word
        part: body
        words:
          - '__schema'
          - '__typename'
          - 'data'
