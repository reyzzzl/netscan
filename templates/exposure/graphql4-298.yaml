id: graphql4-298
name: 'GQL probe in q'
severity: medium
type: active
tags:
  - graphql
  - api
  - introspection
description: 'GraphQL schema exposed via q'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      q:
        - 'mutation {a:__typename,b:__typename}'
    matchers:
      - type: word
        part: body
        words:
          - '__schema'
          - '__typename'
          - 'data'
