id: mass3-113
name: 'Mass field subscriber'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered subscriber on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"u1","subscriber":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
