id: mass3-040
name: 'Mass field guest2'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered guest2 on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"t","guest2":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
