id: mass3-142
name: 'Mass field refund'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered refund on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"t","refund":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
