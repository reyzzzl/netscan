id: mass3-148
name: 'Mass field debit'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered debit on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"t","debit":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
