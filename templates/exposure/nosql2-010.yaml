id: nosql2-010
name: 'NoSQL $gt in user'
severity: high
type: active
tags:
  - nosql
  - injection
  - api
description: 'NoSQL operator $gt accepted on /api/login'
requests:
  - method: POST
    path: '{{BaseURL}}/api/login'
    body: '{"user":{"$gt":""},"extra":"x"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
          - 'token'
