id: mass3-063
name: 'Mass field primary'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered primary on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"a1","primary":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
