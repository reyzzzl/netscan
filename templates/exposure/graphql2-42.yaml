id: graphql2-42
name: 'Introspection probe in graphql'
severity: medium
type: active
tags:
  - graphql
  - api
  - introspection
description: 'GraphQL schema exposed via graphql'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      graphql:
        - '{__type(name:"Query"){name}}'
    matchers:
      - type: word
        part: body
        words:
          - '__schema'
          - '__typename'
