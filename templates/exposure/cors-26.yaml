id: cors-26
name: 'CORS reflect https://evil25.example'
severity: medium
type: active
tags:
  - cors
  - headers
  - api
description: 'Origin https://evil25.example reflected on /api/data'
requests:
  - method: GET
    path: '{{BaseURL}}/api/data'
    sendHeaders:
      Origin: 'https://evil25.example'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil25.example'
