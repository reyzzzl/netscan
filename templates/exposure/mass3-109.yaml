id: mass3-109
name: 'Mass field customer2'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered customer2 on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"t","customer2":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
