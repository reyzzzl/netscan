id: mass3-297
name: 'Mass field tracking'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered tracking on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"a1","tracking":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
