id: cors-25
name: 'CORS reflect https://evil24.example'
severity: medium
type: active
tags:
  - cors
  - headers
  - api
description: 'Origin https://evil24.example reflected on /api/data'
requests:
  - method: GET
    path: '{{BaseURL}}/api/data'
    sendHeaders:
      Origin: 'https://evil24.example'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil24.example'
