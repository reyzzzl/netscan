id: mass3-210
name: 'Mass field follow'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered follow on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"a1","follow":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
