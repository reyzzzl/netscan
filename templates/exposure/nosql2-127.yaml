id: nosql2-127
name: 'NoSQL $type in session'
severity: high
type: active
tags:
  - nosql
  - injection
  - api
description: 'NoSQL operator $type accepted on /api/login'
requests:
  - method: POST
    path: '{{BaseURL}}/api/login'
    body: '{"session":{"$type":""},"extra":"x"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
          - 'token'
