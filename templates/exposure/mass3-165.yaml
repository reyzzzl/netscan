id: mass3-165
name: 'Mass field coupon'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered coupon on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"a1","coupon":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
