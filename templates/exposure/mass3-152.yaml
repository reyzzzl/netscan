id: mass3-152
name: 'Mass field loan'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered loan on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"u1","loan":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
