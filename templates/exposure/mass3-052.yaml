id: mass3-052
name: 'Mass field system2'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered system2 on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"t","system2":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
