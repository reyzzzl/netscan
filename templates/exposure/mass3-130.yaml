id: mass3-130
name: 'Mass field invoice'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered invoice on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"t","invoice":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
