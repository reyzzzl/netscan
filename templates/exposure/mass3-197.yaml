id: mass3-197
name: 'Mass field crown'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered crown on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"u1","crown":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
