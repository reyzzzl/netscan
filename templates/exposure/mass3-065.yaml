id: mass3-065
name: 'Mass field secondary'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered secondary on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"u1","secondary":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
