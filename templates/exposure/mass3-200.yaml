id: mass3-200
name: 'Mass field star'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered star on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"u1","star":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
