id: auth-006
name: 'Admin users API at /api/admin/users'
severity: low
type: active
tags:
  - auth
  - exposure
  - discovery
description: 'Admin users API returns 200 — check auth manually'
requests:
  - method: GET
    path: '{{BaseURL}}/api/admin/users'
    matchers:
      - type: status
        status: [200]
