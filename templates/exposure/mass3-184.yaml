id: mass3-184
name: 'Mass field level2'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered level2 on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"t","level2":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
