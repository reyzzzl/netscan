id: mass3-118
name: 'Mass field user2'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered user2 on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"t","user2":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
