id: mass3-170
name: 'Mass field gift'
severity: high
type: active
tags:
  - mass-assignment
  - auth
  - api
description: 'Unfiltered gift on /api/user'
requests:
  - method: POST
    path: '{{BaseURL}}/api/user'
    body: '{"name":"u1","gift":"admin"}'
    matchers:
      - type: word
        part: body
        words:
          - 'admin'
