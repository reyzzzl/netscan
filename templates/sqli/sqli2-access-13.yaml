id: sqli2-access-13
name: 'SQLi error access via vid'
severity: high
type: active
tags:
  - sqli
  - injection
  - access
description: 'Triggers access error via vid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      vid:
        - ''''
        - ''' UNION SELECT NULL,NULL--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Microsoft JET'
          - 'ODBC Microsoft Access'
