id: sqli6-pg-27
name: 'SQLi pg probe in page'
severity: high
type: active
tags:
  - sqli
  - injection
  - pg
description: 'Triggers pg error via page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - '''||''1''=''1'
        - ''' OR ''1''=''1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'PostgreSQL'
          - 'pg_query'
