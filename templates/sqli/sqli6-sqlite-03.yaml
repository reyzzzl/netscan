id: sqli6-sqlite-03
name: 'SQLi sqlite probe in product'
severity: high
type: active
tags:
  - sqli
  - injection
  - sqlite
description: 'Triggers sqlite error via product'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      product:
        - '`'
        - '" OR 1=1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLite'
          - 'sqlite3'
