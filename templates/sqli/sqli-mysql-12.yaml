id: sqli-mysql-12
name: 'SQLi error mysql via cat'
severity: high
type: active
tags:
  - sqli
  - injection
  - mysql
description: 'Triggers mysql error via cat'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cat:
        - ''' AND SLEEP(5)--'
        - '"'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
          - 'You have an error in your SQL syntax'
