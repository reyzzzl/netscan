id: sqli6-generic-11
name: 'SQLi generic probe in vid'
severity: high
type: active
tags:
  - sqli
  - injection
  - generic
description: 'Triggers generic error via vid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      vid:
        - ''' UNION SELECT NULL--'
        - 'admin"--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'JDBC'
          - 'Warning: mysql'
