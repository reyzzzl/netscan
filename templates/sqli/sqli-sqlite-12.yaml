id: sqli-sqlite-12
name: 'SQLi error sqlite via cat'
severity: high
type: active
tags:
  - sqli
  - injection
  - sqlite
description: 'Triggers sqlite error via cat'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cat:
        - ''' AND SLEEP(5)--'
        - '"'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLite'
          - 'sqlite3::'
