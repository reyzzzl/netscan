id: sqli3-db2-13
name: 'SQLi db2 prefix #12 in vid'
severity: high
type: active
tags:
  - sqli
  - injection
  - db2
description: 'Triggers db2 error via vid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      vid:
        - 'admin'')--'
        - ')'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLCODE'
          - 'DB2'
