id: sqli-time3-405
name: 'Delay probe in product'
severity: high
type: active
tags:
  - sqli
  - injection
  - blind
  - time
description: '3-second delay via product'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      product:
        - ''' UNION SELECT SLEEP(3)--'
    matchers:
      - type: time
        ms: 2500
