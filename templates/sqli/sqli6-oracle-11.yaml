id: sqli6-oracle-11
name: 'SQLi oracle probe in vid'
severity: high
type: active
tags:
  - sqli
  - injection
  - oracle
description: 'Triggers oracle error via vid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      vid:
        - ''' UNION SELECT NULL--'
        - 'admin"--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'ORA-'
          - 'Oracle error'
