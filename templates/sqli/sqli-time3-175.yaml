id: sqli-time3-175
name: 'Delay probe in filter'
severity: high
type: active
tags:
  - sqli
  - injection
  - blind
  - time
description: '3-second delay via filter'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      filter:
        - '''%09AND%09SLEEP(3)--'
    matchers:
      - type: time
        ms: 2500
