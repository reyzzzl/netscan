id: sqli2-hsqldb-07
name: 'SQLi error hsqldb via sid'
severity: high
type: active
tags:
  - sqli
  - injection
  - hsqldb
description: 'Triggers hsqldb error via sid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      sid:
        - ''''
        - ''' UNION SELECT NULL,NULL--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'HSQLDB'
          - 'org.hsqldb'
