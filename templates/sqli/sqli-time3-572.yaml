id: sqli-time3-572
name: 'Delay probe in nid'
severity: high
type: active
tags:
  - sqli
  - injection
  - blind
  - time
description: '3-second delay via nid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nid:
        - '''; SELECT SLEEP(3)--'
    matchers:
      - type: time
        ms: 2500
