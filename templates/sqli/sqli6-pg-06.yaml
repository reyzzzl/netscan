id: sqli6-pg-06
name: 'SQLi pg probe in id'
severity: high
type: active
tags:
  - sqli
  - injection
  - pg
description: 'Triggers pg error via id'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      id:
        - '` OR `1`=`1'
        - ''' UNION SELECT NULL,NULL,NULL--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'PostgreSQL'
          - 'pg_query'
