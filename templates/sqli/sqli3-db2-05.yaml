id: sqli3-db2-05
name: 'SQLi db2 prefix #4 in filter'
severity: high
type: active
tags:
  - sqli
  - injection
  - db2
description: 'Triggers db2 error via filter'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      filter:
        - 'admin'')--'
        - ')'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLCODE'
          - 'DB2'
