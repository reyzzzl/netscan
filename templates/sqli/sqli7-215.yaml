id: sqli7-215
name: 'UNION probe in filter'
severity: high
type: active
tags:
  - sqli
  - injection
  - union
description: 'Triggers DB error via filter'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      filter:
        - ''') UNION SELECT NULL,NULL#'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
          - 'PostgreSQL'
          - 'ODBC'
          - 'ORA-'
          - 'SQLite'
