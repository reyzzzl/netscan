id: sqli6-db2-16
name: 'SQLi db2 probe in id'
severity: high
type: active
tags:
  - sqli
  - injection
  - db2
description: 'Triggers db2 error via id'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      id:
        - '1" AND "1"="1'
        - '''))--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLCODE'
          - 'DB2'
