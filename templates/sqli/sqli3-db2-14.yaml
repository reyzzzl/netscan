id: sqli3-db2-14
name: 'SQLi db2 prefix #13 in aid'
severity: high
type: active
tags:
  - sqli
  - injection
  - db2
description: 'Triggers db2 error via aid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      aid:
        - '1" OR "1"="1'
        - '''))'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLCODE'
          - 'DB2'
