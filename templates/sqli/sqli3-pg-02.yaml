id: sqli3-pg-02
name: 'SQLi pg prefix #1 in sid'
severity: high
type: active
tags:
  - sqli
  - injection
  - pg
description: 'Triggers pg error via sid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      sid:
        - '''))'
        - '1" OR "1"="1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'PostgreSQL'
          - 'pg_query'
