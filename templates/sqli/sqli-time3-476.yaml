id: sqli-time3-476
name: 'Delay probe in dir'
severity: high
type: active
tags:
  - sqli
  - injection
  - blind
  - time
description: '3-second delay via dir'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      dir:
        - '''%0aAND%0aSLEEP(3)--'
    matchers:
      - type: time
        ms: 2500
