id: sqli3-generic-01
name: 'SQLi generic prefix #0 in cat2'
severity: high
type: active
tags:
  - sqli
  - injection
  - generic
description: 'Triggers generic error via cat2'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cat2:
        - ')'
        - 'admin'')--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'JDBC'
          - 'Warning: mysql'
