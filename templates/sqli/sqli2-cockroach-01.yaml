id: sqli2-cockroach-01
name: 'SQLi error cockroach via cat2'
severity: high
type: active
tags:
  - sqli
  - injection
  - cockroach
description: 'Triggers cockroach error via cat2'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cat2:
        - ''''
        - ''' UNION SELECT NULL,NULL--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'CockroachDB'
