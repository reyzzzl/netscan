id: sqli3-pg-13
name: 'SQLi pg prefix #12 in vid'
severity: high
type: active
tags:
  - sqli
  - injection
  - pg
description: 'Triggers pg error via vid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      vid:
        - 'admin'')--'
        - ')'
    matchers:
      - type: regex
        part: body
        regex:
          - 'PostgreSQL'
          - 'pg_query'
