id: sqli6-access-25
name: 'SQLi access probe in pid'
severity: high
type: active
tags:
  - sqli
  - injection
  - access
description: 'Triggers access error via pid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      pid:
        - '''%09OR%091=1--'
        - '"'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Microsoft JET'
          - 'ODBC Microsoft Access'
