id: sqli2-informix-10
name: 'SQLi error informix via tid'
severity: high
type: active
tags:
  - sqli
  - injection
  - informix
description: 'Triggers informix error via tid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      tid:
        - ''' UNION SELECT NULL,NULL--'
        - ''''
    matchers:
      - type: regex
        part: body
        regex:
          - 'Informix'
          - 'ISAM error'
