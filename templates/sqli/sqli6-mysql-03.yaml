id: sqli6-mysql-03
name: 'SQLi mysql probe in product'
severity: high
type: active
tags:
  - sqli
  - injection
  - mysql
description: 'Triggers mysql error via product'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      product:
        - '`'
        - '" OR 1=1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
