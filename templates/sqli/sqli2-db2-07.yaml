id: sqli2-db2-07
name: 'SQLi error db2 via sort'
severity: high
type: active
tags:
  - sqli
  - injection
  - db2
description: 'Triggers db2 error via sort'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      sort:
        - ''''
        - ''' UNION SELECT NULL,NULL--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLCODE'
          - 'DB2 SQL error'
