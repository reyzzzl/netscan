id: sqli-time3-198
name: 'Delay probe in mid'
severity: high
type: active
tags:
  - sqli
  - injection
  - blind
  - time
description: '3-second delay via mid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      mid:
        - ''' OR SLEEP(3)=''3'
    matchers:
      - type: time
        ms: 2500
