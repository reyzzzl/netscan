id: sqli6-mysql-26
name: 'SQLi mysql probe in vid'
severity: high
type: active
tags:
  - sqli
  - injection
  - mysql
description: 'Triggers mysql error via vid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      vid:
        - '''%0aOR%091=1--'
        - '`'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
