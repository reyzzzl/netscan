id: sqli6-pg-05
name: 'SQLi pg probe in sid'
severity: high
type: active
tags:
  - sqli
  - injection
  - pg
description: 'Triggers pg error via sid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      sid:
        - '" OR "1"="1'
        - ''' UNION SELECT NULL,NULL--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'PostgreSQL'
          - 'pg_query'
