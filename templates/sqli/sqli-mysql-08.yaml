id: sqli-mysql-08
name: 'SQLi error mysql via item'
severity: high
type: active
tags:
  - sqli
  - injection
  - mysql
description: 'Triggers mysql error via item'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      item:
        - '"'
        - '" OR "1"="1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
          - 'You have an error in your SQL syntax'
