id: sqli6-sqlite-24
name: 'SQLi sqlite probe in order'
severity: high
type: active
tags:
  - sqli
  - injection
  - sqlite
description: 'Triggers sqlite error via order'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      order:
        - '''/**/OR/**/1=1--'
        - ''''
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLite'
          - 'sqlite3'
