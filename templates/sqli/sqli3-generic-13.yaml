id: sqli3-generic-13
name: 'SQLi generic prefix #12 in vid'
severity: high
type: active
tags:
  - sqli
  - injection
  - generic
description: 'Triggers generic error via vid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      vid:
        - 'admin'')--'
        - ')'
    matchers:
      - type: regex
        part: body
        regex:
          - 'JDBC'
          - 'Warning: mysql'
