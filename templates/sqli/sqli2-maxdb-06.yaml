id: sqli2-maxdb-06
name: 'SQLi error maxdb via nid'
severity: high
type: active
tags:
  - sqli
  - injection
  - maxdb
description: 'Triggers maxdb error via nid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nid:
        - '''; SELECT 1--'
        - ''' OR ''1''=''1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'MaxDB'
