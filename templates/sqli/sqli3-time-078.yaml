id: sqli3-time-078
name: 'Time-blind delay in mid'
severity: high
type: active
tags:
  - sqli
  - injection
  - blind
  - time
description: '3-second delay via mid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      mid:
        - ''' OR pg_sleep(3)--'
    matchers:
      - type: time
        ms: 2500
