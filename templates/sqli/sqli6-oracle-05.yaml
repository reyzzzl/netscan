id: sqli6-oracle-05
name: 'SQLi oracle probe in sid'
severity: high
type: active
tags:
  - sqli
  - injection
  - oracle
description: 'Triggers oracle error via sid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      sid:
        - '" OR "1"="1'
        - ''' UNION SELECT NULL,NULL--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'ORA-'
          - 'Oracle error'
