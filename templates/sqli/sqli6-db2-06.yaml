id: sqli6-db2-06
name: 'SQLi db2 probe in id'
severity: high
type: active
tags:
  - sqli
  - injection
  - db2
description: 'Triggers db2 error via id'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      id:
        - '` OR `1`=`1'
        - ''' UNION SELECT NULL,NULL,NULL--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLCODE'
          - 'DB2'
