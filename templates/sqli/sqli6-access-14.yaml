id: sqli6-access-14
name: 'SQLi access probe in order'
severity: high
type: active
tags:
  - sqli
  - injection
  - access
description: 'Triggers access error via order'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      order:
        - ''') UNION SELECT 1,2--'
        - ''' HAVING 1=1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Microsoft JET'
          - 'ODBC Microsoft Access'
