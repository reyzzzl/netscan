id: sqli-time3-079
name: 'Delay probe in sid'
severity: high
type: active
tags:
  - sqli
  - injection
  - blind
  - time
description: '3-second delay via sid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      sid:
        - '1 AND SLEEP(3)--'
    matchers:
      - type: time
        ms: 2500
