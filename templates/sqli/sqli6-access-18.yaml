id: sqli6-access-18
name: 'SQLi access probe in filter'
severity: high
type: active
tags:
  - sqli
  - injection
  - access
description: 'Triggers access error via filter'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      filter:
        - 'admin"--'
        - '''%09OR%091=1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Microsoft JET'
          - 'ODBC Microsoft Access'
