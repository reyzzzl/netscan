id: sqli6-db2-19
name: 'SQLi db2 probe in order'
severity: high
type: active
tags:
  - sqli
  - injection
  - db2
description: 'Triggers db2 error via order'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      order:
        - ''' AND SLEEP(0)--'
        - '''%0aOR%091=1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLCODE'
          - 'DB2'
