id: sqli6-pg-12
name: 'SQLi pg probe in aid'
severity: high
type: active
tags:
  - sqli
  - injection
  - pg
description: 'Triggers pg error via aid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      aid:
        - ''' UNION SELECT NULL,NULL--'
        - ''' AND SLEEP(0)--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'PostgreSQL'
          - 'pg_query'
