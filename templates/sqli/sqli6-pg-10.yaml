id: sqli6-pg-10
name: 'SQLi pg probe in pid'
severity: high
type: active
tags:
  - sqli
  - injection
  - pg
description: 'Triggers pg error via pid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      pid:
        - '" OR 1=1--'
        - 'admin''--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'PostgreSQL'
          - 'pg_query'
