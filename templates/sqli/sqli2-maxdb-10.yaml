id: sqli2-maxdb-10
name: 'SQLi error maxdb via tid'
severity: high
type: active
tags:
  - sqli
  - injection
  - maxdb
description: 'Triggers maxdb error via tid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      tid:
        - ''' UNION SELECT NULL,NULL--'
        - ''''
    matchers:
      - type: regex
        part: body
        regex:
          - 'MaxDB'
