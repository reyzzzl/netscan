id: sqli6-pg-19
name: 'SQLi pg probe in order'
severity: high
type: active
tags:
  - sqli
  - injection
  - pg
description: 'Triggers pg error via order'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      order:
        - ''' AND SLEEP(0)--'
        - '''%0aOR%091=1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'PostgreSQL'
          - 'pg_query'
