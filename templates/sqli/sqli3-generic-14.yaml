id: sqli3-generic-14
name: 'SQLi generic prefix #13 in aid'
severity: high
type: active
tags:
  - sqli
  - injection
  - generic
description: 'Triggers generic error via aid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      aid:
        - '1" OR "1"="1'
        - '''))'
    matchers:
      - type: regex
        part: body
        regex:
          - 'JDBC'
          - 'Warning: mysql'
