id: sqli-time-05
name: 'SQLi time-based via user'
severity: high
type: active
tags:
  - sqli
  - injection
  - blind
  - time
description: '3-second delay via user'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      user:
        - ''' AND SLEEP(3)--'
    matchers:
      - type: time
        ms: 2500
