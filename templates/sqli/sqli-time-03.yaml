id: sqli-time-03
name: 'SQLi time-based via id'
severity: high
type: active
tags:
  - sqli
  - injection
  - blind
  - time
description: '3-second delay via id'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      id:
        - ''' WAITFOR DELAY ''0:0:3''--'
    matchers:
      - type: time
        ms: 2500
