id: sqli-time-07
name: 'SQLi time-based via user'
severity: high
type: active
tags:
  - sqli
  - injection
  - blind
  - time
description: '3-second delay via user'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      user:
        - ''' WAITFOR DELAY ''0:0:3''--'
    matchers:
      - type: time
        ms: 2500
