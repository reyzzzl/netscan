id: sqli3-generic-06
name: 'SQLi generic prefix #5 in cat2'
severity: high
type: active
tags:
  - sqli
  - injection
  - generic
description: 'Triggers generic error via cat2'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cat2:
        - '1" OR "1"="1'
        - '''))'
    matchers:
      - type: regex
        part: body
        regex:
          - 'JDBC'
          - 'Warning: mysql'
