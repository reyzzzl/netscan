id: sqli3-generic-09
name: 'SQLi generic prefix #8 in aid'
severity: high
type: active
tags:
  - sqli
  - injection
  - generic
description: 'Triggers generic error via aid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      aid:
        - ')'
        - 'admin'')--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'JDBC'
          - 'Warning: mysql'
