id: sqli2-cockroach-12
name: 'SQLi error cockroach via sid'
severity: high
type: active
tags:
  - sqli
  - injection
  - cockroach
description: 'Triggers cockroach error via sid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      sid:
        - '''; SELECT 1--'
        - ''' OR ''1''=''1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'CockroachDB'
