id: sqli-mysql-01
name: 'SQLi error mysql via user'
severity: high
type: active
tags:
  - sqli
  - injection
  - mysql
description: 'Triggers mysql error via user'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      user:
        - ''''
        - ''' OR ''1''=''1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
          - 'You have an error in your SQL syntax'
