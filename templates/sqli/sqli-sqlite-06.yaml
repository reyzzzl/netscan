id: sqli-sqlite-06
name: 'SQLi error sqlite via user'
severity: high
type: active
tags:
  - sqli
  - injection
  - sqlite
description: 'Triggers sqlite error via user'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      user:
        - ''' AND SLEEP(5)--'
        - '"'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLite'
          - 'sqlite3::'
