id: sqli3-generic-03
name: 'SQLi generic prefix #2 in vid'
severity: high
type: active
tags:
  - sqli
  - injection
  - generic
description: 'Triggers generic error via vid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      vid:
        - '''))) OR (((''1''=''1'
        - ''') UNION SELECT 1,2--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'JDBC'
          - 'Warning: mysql'
