id: sqli-sqlite-15
name: 'SQLi error sqlite via uid'
severity: high
type: active
tags:
  - sqli
  - injection
  - sqlite
description: 'Triggers sqlite error via uid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      uid:
        - ''' OR ''1''=''1'
        - ''' UNION SELECT NULL--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLite'
          - 'sqlite3::'
