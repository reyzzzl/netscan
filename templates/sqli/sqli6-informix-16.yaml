id: sqli6-informix-16
name: 'SQLi informix probe in id'
severity: high
type: active
tags:
  - sqli
  - injection
  - informix
description: 'Triggers informix error via id'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      id:
        - '1" AND "1"="1'
        - '''))--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Informix'
          - 'ISAM error'
