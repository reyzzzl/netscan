id: sqli-pg-14
name: 'SQLi error pg via page'
severity: high
type: active
tags:
  - sqli
  - injection
  - pg
description: 'Triggers pg error via page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - '"'
        - '" OR "1"="1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'PostgreSQL'
          - 'pg_query'
          - 'ERROR: syntax error'
