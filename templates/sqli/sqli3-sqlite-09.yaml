id: sqli3-sqlite-09
name: 'SQLi sqlite prefix #8 in mid'
severity: high
type: active
tags:
  - sqli
  - injection
  - sqlite
description: 'Triggers sqlite error via mid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      mid:
        - ')'
        - 'admin'')--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLite'
          - 'sqlite3'
