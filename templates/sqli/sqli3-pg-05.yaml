id: sqli3-pg-05
name: 'SQLi pg prefix #4 in filter'
severity: high
type: active
tags:
  - sqli
  - injection
  - pg
description: 'Triggers pg error via filter'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      filter:
        - 'admin'')--'
        - ')'
    matchers:
      - type: regex
        part: body
        regex:
          - 'PostgreSQL'
          - 'pg_query'
