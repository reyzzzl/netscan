id: sqli6-pg-13
name: 'SQLi pg probe in filter'
severity: high
type: active
tags:
  - sqli
  - injection
  - pg
description: 'Triggers pg error via filter'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      filter:
        - ''' UNION SELECT NULL,NULL,NULL--'
        - '1'' ORDER BY 1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'PostgreSQL'
          - 'pg_query'
