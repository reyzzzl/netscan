id: sqli3-pg-01
name: 'SQLi pg prefix #0 in cat2'
severity: high
type: active
tags:
  - sqli
  - injection
  - pg
description: 'Triggers pg error via cat2'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cat2:
        - ')'
        - 'admin'')--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'PostgreSQL'
          - 'pg_query'
