id: sqli6-informix-23
name: 'SQLi informix probe in filter'
severity: high
type: active
tags:
  - sqli
  - injection
  - informix
description: 'Triggers informix error via filter'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      filter:
        - '''))--'
        - ''') OR ''a''=''a'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Informix'
          - 'ISAM error'
