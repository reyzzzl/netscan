id: sqli3-mysql-08
name: 'SQLi mysql prefix #7 in dir'
severity: high
type: active
tags:
  - sqli
  - injection
  - mysql
description: 'Triggers mysql error via dir'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      dir:
        - '1''; SELECT 1--'
        - '1'' OR ''1''=''1'' /*'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
