id: sqli6-mysql-21
name: 'SQLi mysql probe in id'
severity: high
type: active
tags:
  - sqli
  - injection
  - mysql
description: 'Triggers mysql error via id'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      id:
        - ''' HAVING 1=1--'
        - '1''||''1''=''1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
