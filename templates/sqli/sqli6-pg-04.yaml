id: sqli6-pg-04
name: 'SQLi pg probe in cat2'
severity: high
type: active
tags:
  - sqli
  - injection
  - pg
description: 'Triggers pg error via cat2'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cat2:
        - ''' OR ''1''=''1'
        - ''' UNION SELECT NULL--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'PostgreSQL'
          - 'pg_query'
