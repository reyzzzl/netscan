id: sqli6-access-16
name: 'SQLi access probe in vid'
severity: high
type: active
tags:
  - sqli
  - injection
  - access
description: 'Triggers access error via vid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      vid:
        - '1" AND "1"="1'
        - '''))--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Microsoft JET'
          - 'ODBC Microsoft Access'
