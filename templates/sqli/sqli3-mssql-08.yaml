id: sqli3-mssql-08
name: 'SQLi mssql prefix #7 in dir'
severity: high
type: active
tags:
  - sqli
  - injection
  - mssql
description: 'Triggers mssql error via dir'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      dir:
        - '1''; SELECT 1--'
        - '1'' OR ''1''=''1'' /*'
    matchers:
      - type: regex
        part: body
        regex:
          - 'ODBC'
          - 'SQL Server'
