id: sqli-generic-10
name: 'SQLi error generic via product'
severity: high
type: active
tags:
  - sqli
  - injection
  - generic
description: 'Triggers generic error via product'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      product:
        - '" OR "1"="1'
        - ''' AND SLEEP(5)--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'JDBC'
          - 'DB2 SQL error'
          - 'Warning: mysql'
