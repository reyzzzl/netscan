id: sqli6-generic-12
name: 'SQLi generic probe in aid'
severity: high
type: active
tags:
  - sqli
  - injection
  - generic
description: 'Triggers generic error via aid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      aid:
        - ''' UNION SELECT NULL,NULL--'
        - ''' AND SLEEP(0)--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'JDBC'
          - 'Warning: mysql'
