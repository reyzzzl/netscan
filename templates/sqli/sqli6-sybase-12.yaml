id: sqli6-sybase-12
name: 'SQLi sybase probe in page'
severity: high
type: active
tags:
  - sqli
  - injection
  - sybase
description: 'Triggers sybase error via page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - ''' UNION SELECT NULL,NULL--'
        - ''' AND SLEEP(0)--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Sybase'
          - 'Adaptive Server'
