id: sqli3-pg-06
name: 'SQLi pg prefix #5 in cat2'
severity: high
type: active
tags:
  - sqli
  - injection
  - pg
description: 'Triggers pg error via cat2'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cat2:
        - '1" OR "1"="1'
        - '''))'
    matchers:
      - type: regex
        part: body
        regex:
          - 'PostgreSQL'
          - 'pg_query'
