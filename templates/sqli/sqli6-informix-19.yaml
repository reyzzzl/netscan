id: sqli6-informix-19
name: 'SQLi informix probe in order'
severity: high
type: active
tags:
  - sqli
  - injection
  - informix
description: 'Triggers informix error via order'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      order:
        - ''' AND SLEEP(0)--'
        - '''%0aOR%091=1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Informix'
          - 'ISAM error'
