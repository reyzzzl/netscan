id: sqli-mysql-15
name: 'SQLi error mysql via uid'
severity: high
type: active
tags:
  - sqli
  - injection
  - mysql
description: 'Triggers mysql error via uid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      uid:
        - ''' OR ''1''=''1'
        - ''' UNION SELECT NULL--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
          - 'You have an error in your SQL syntax'
