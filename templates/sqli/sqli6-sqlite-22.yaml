id: sqli6-sqlite-22
name: 'SQLi sqlite probe in page'
severity: high
type: active
tags:
  - sqli
  - injection
  - sqlite
description: 'Triggers sqlite error via page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - '1'')--'
        - ''' OR ''a''=''a'' /*'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLite'
          - 'sqlite3'
