id: sqli2-informix-02
name: 'SQLi error informix via sort'
severity: high
type: active
tags:
  - sqli
  - injection
  - informix
description: 'Triggers informix error via sort'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      sort:
        - '"'
        - ''') OR (''1''=''1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Informix'
          - 'ISAM error'
