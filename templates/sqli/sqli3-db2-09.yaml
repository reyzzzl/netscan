id: sqli3-db2-09
name: 'SQLi db2 prefix #8 in aid'
severity: high
type: active
tags:
  - sqli
  - injection
  - db2
description: 'Triggers db2 error via aid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      aid:
        - ')'
        - 'admin'')--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLCODE'
          - 'DB2'
