id: sqli-time3-549
name: 'Delay probe in pid'
severity: high
type: active
tags:
  - sqli
  - injection
  - blind
  - time
description: '3-second delay via pid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      pid:
        - ''' WAITFOR DELAY ''0:0:3''--'
    matchers:
      - type: time
        ms: 2500
