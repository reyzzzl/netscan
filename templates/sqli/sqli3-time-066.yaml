id: sqli3-time-066
name: 'Time-blind delay in dir'
severity: high
type: active
tags:
  - sqli
  - injection
  - blind
  - time
description: '3-second delay via dir'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      dir:
        - ''' OR BENCHMARK(1000000,SHA1(1))--'
    matchers:
      - type: time
        ms: 2500
