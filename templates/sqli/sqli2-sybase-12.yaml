id: sqli2-sybase-12
name: 'SQLi error sybase via sid'
severity: high
type: active
tags:
  - sqli
  - injection
  - sybase
description: 'Triggers sybase error via sid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      sid:
        - '''; SELECT 1--'
        - ''' OR ''1''=''1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Sybase'
          - 'Adaptive Server'
