id: sqli6-mssql-09
name: 'SQLi mssql probe in cat2'
severity: high
type: active
tags:
  - sqli
  - injection
  - mssql
description: 'Triggers mssql error via cat2'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cat2:
        - ''' OR 1=1--'
        - '1" AND "1"="1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'ODBC'
          - 'SQL Server'
