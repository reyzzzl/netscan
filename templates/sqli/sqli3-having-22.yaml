id: sqli3-having-22
name: 'HAVING/GROUP injection in nid'
severity: high
type: active
tags:
  - sqli
  - injection
description: 'Triggers DB error via nid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nid:
        - '" GROUP BY 1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
          - 'PostgreSQL'
