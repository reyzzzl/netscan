id: sqli6-sqlite-20
name: 'SQLi sqlite probe in sid'
severity: high
type: active
tags:
  - sqli
  - injection
  - sqlite
description: 'Triggers sqlite error via sid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      sid:
        - '1'' ORDER BY 1--'
        - '''||''1''=''1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLite'
          - 'sqlite3'
