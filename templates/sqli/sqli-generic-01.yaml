id: sqli-generic-01
name: 'SQLi error generic via order'
severity: high
type: active
tags:
  - sqli
  - injection
  - generic
description: 'Triggers generic error via order'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      order:
        - ''''
        - ''' OR ''1''=''1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'JDBC'
          - 'DB2 SQL error'
          - 'Warning: mysql'
