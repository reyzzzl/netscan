id: sqli6-oracle-06
name: 'SQLi oracle probe in id'
severity: high
type: active
tags:
  - sqli
  - injection
  - oracle
description: 'Triggers oracle error via id'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      id:
        - '` OR `1`=`1'
        - ''' UNION SELECT NULL,NULL,NULL--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'ORA-'
          - 'Oracle error'
