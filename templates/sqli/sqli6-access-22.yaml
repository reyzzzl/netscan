id: sqli6-access-22
name: 'SQLi access probe in page'
severity: high
type: active
tags:
  - sqli
  - injection
  - access
description: 'Triggers access error via page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - '1'')--'
        - ''' OR ''a''=''a'' /*'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Microsoft JET'
          - 'ODBC Microsoft Access'
