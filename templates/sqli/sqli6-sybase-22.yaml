id: sqli6-sybase-22
name: 'SQLi sybase probe in page'
severity: high
type: active
tags:
  - sqli
  - injection
  - sybase
description: 'Triggers sybase error via page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - '1'')--'
        - ''' OR ''a''=''a'' /*'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Sybase'
          - 'Adaptive Server'
