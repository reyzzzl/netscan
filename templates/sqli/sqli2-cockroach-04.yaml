id: sqli2-cockroach-04
name: 'SQLi error cockroach via aid'
severity: high
type: active
tags:
  - sqli
  - injection
  - cockroach
description: 'Triggers cockroach error via aid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      aid:
        - ''' UNION SELECT NULL,NULL--'
        - ''''
    matchers:
      - type: regex
        part: body
        regex:
          - 'CockroachDB'
