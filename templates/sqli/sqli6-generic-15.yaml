id: sqli6-generic-15
name: 'SQLi generic probe in sid'
severity: high
type: active
tags:
  - sqli
  - injection
  - generic
description: 'Triggers generic error via sid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      sid:
        - '1'' AND ''1''=''1'
        - '1'')--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'JDBC'
          - 'Warning: mysql'
