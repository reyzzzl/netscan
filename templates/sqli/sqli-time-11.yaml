id: sqli-time-11
name: 'SQLi time-based via page'
severity: high
type: active
tags:
  - sqli
  - injection
  - blind
  - time
description: '3-second delay via page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - ''' WAITFOR DELAY ''0:0:3''--'
    matchers:
      - type: time
        ms: 2500
