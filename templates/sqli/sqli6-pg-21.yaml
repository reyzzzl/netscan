id: sqli6-pg-21
name: 'SQLi pg probe in vid'
severity: high
type: active
tags:
  - sqli
  - injection
  - pg
description: 'Triggers pg error via vid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      vid:
        - ''' HAVING 1=1--'
        - '1''||''1''=''1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'PostgreSQL'
          - 'pg_query'
