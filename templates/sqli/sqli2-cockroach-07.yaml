id: sqli2-cockroach-07
name: 'SQLi error cockroach via sid'
severity: high
type: active
tags:
  - sqli
  - injection
  - cockroach
description: 'Triggers cockroach error via sid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      sid:
        - ''''
        - ''' UNION SELECT NULL,NULL--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'CockroachDB'
