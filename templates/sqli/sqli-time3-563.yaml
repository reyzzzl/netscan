id: sqli-time3-563
name: 'Delay probe in page'
severity: high
type: active
tags:
  - sqli
  - injection
  - blind
  - time
description: '3-second delay via page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - 'admin'' AND SLEEP(3)--'
    matchers:
      - type: time
        ms: 2500
