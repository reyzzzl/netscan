id: sqli6-access-03
name: 'SQLi access probe in product'
severity: high
type: active
tags:
  - sqli
  - injection
  - access
description: 'Triggers access error via product'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      product:
        - '`'
        - '" OR 1=1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Microsoft JET'
          - 'ODBC Microsoft Access'
