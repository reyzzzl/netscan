id: sqli6-informix-18
name: 'SQLi informix probe in product'
severity: high
type: active
tags:
  - sqli
  - injection
  - informix
description: 'Triggers informix error via product'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      product:
        - 'admin"--'
        - '''%09OR%091=1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Informix'
          - 'ISAM error'
