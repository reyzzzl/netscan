id: sqli3-generic-08
name: 'SQLi generic prefix #7 in vid'
severity: high
type: active
tags:
  - sqli
  - injection
  - generic
description: 'Triggers generic error via vid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      vid:
        - '1''; SELECT 1--'
        - '1'' OR ''1''=''1'' /*'
    matchers:
      - type: regex
        part: body
        regex:
          - 'JDBC'
          - 'Warning: mysql'
