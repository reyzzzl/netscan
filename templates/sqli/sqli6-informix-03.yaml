id: sqli6-informix-03
name: 'SQLi informix probe in filter'
severity: high
type: active
tags:
  - sqli
  - injection
  - informix
description: 'Triggers informix error via filter'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      filter:
        - '`'
        - '" OR 1=1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Informix'
          - 'ISAM error'
