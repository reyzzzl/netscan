id: sqli-sqlite-08
name: 'SQLi error sqlite via item'
severity: high
type: active
tags:
  - sqli
  - injection
  - sqlite
description: 'Triggers sqlite error via item'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      item:
        - '"'
        - '" OR "1"="1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLite'
          - 'sqlite3::'
