id: sqli2-hsqldb-14
name: 'SQLi error hsqldb via aid'
severity: high
type: active
tags:
  - sqli
  - injection
  - hsqldb
description: 'Triggers hsqldb error via aid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      aid:
        - '"'
        - ''') OR (''1''=''1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'HSQLDB'
          - 'org.hsqldb'
