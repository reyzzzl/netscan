id: sqli2-informix-09
name: 'SQLi error informix via mid'
severity: high
type: active
tags:
  - sqli
  - injection
  - informix
description: 'Triggers informix error via mid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      mid:
        - ''' OR ''1''=''1'
        - '''; SELECT 1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Informix'
          - 'ISAM error'
