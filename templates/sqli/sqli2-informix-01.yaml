id: sqli2-informix-01
name: 'SQLi error informix via nid'
severity: high
type: active
tags:
  - sqli
  - injection
  - informix
description: 'Triggers informix error via nid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nid:
        - ''''
        - ''' UNION SELECT NULL,NULL--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Informix'
          - 'ISAM error'
