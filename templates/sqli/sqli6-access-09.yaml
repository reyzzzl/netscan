id: sqli6-access-09
name: 'SQLi access probe in cat2'
severity: high
type: active
tags:
  - sqli
  - injection
  - access
description: 'Triggers access error via cat2'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cat2:
        - ''' OR 1=1--'
        - '1" AND "1"="1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Microsoft JET'
          - 'ODBC Microsoft Access'
