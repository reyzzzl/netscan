id: sqli6-sqlite-01
name: 'SQLi sqlite probe in id'
severity: high
type: active
tags:
  - sqli
  - injection
  - sqlite
description: 'Triggers sqlite error via id'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      id:
        - ''''
        - '") OR ("1"="1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLite'
          - 'sqlite3'
