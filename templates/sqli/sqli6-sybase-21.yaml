id: sqli6-sybase-21
name: 'SQLi sybase probe in id'
severity: high
type: active
tags:
  - sqli
  - injection
  - sybase
description: 'Triggers sybase error via id'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      id:
        - ''' HAVING 1=1--'
        - '1''||''1''=''1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Sybase'
          - 'Adaptive Server'
