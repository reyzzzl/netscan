id: sqli6-db2-17
name: 'SQLi db2 probe in page'
severity: high
type: active
tags:
  - sqli
  - injection
  - db2
description: 'Triggers db2 error via page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - 'admin''--'
        - '''/**/OR/**/1=1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLCODE'
          - 'DB2'
