id: sqli6-generic-25
name: 'SQLi generic probe in sid'
severity: high
type: active
tags:
  - sqli
  - injection
  - generic
description: 'Triggers generic error via sid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      sid:
        - '''%09OR%091=1--'
        - '"'
    matchers:
      - type: regex
        part: body
        regex:
          - 'JDBC'
          - 'Warning: mysql'
