id: sqli6-generic-22
name: 'SQLi generic probe in aid'
severity: high
type: active
tags:
  - sqli
  - injection
  - generic
description: 'Triggers generic error via aid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      aid:
        - '1'')--'
        - ''' OR ''a''=''a'' /*'
    matchers:
      - type: regex
        part: body
        regex:
          - 'JDBC'
          - 'Warning: mysql'
