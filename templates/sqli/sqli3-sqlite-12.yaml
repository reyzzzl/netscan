id: sqli3-sqlite-12
name: 'SQLi sqlite prefix #11 in sort'
severity: high
type: active
tags:
  - sqli
  - injection
  - sqlite
description: 'Triggers sqlite error via sort'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      sort:
        - '1'' OR ''1''=''1'' /*'
        - '1''; SELECT 1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLite'
          - 'sqlite3'
