id: sqli-oracle-08
name: 'SQLi error oracle via id'
severity: high
type: active
tags:
  - sqli
  - injection
  - oracle
description: 'Triggers oracle error via id'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      id:
        - '"'
        - '" OR "1"="1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'ORA-'
          - 'Oracle error'
