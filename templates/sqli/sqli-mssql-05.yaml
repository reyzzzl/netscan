id: sqli-mssql-05
name: 'SQLi error mssql via uid'
severity: high
type: active
tags:
  - sqli
  - injection
  - mssql
description: 'Triggers mssql error via uid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      uid:
        - ''' UNION SELECT NULL--'
        - ''''
    matchers:
      - type: regex
        part: body
        regex:
          - 'ODBC'
          - 'SQL Server'
          - 'Unclosed quotation mark'
