id: sqli3-sqlite-01
name: 'SQLi sqlite prefix #0 in nid'
severity: high
type: active
tags:
  - sqli
  - injection
  - sqlite
description: 'Triggers sqlite error via nid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nid:
        - ')'
        - 'admin'')--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLite'
          - 'sqlite3'
