id: sqli6-pg-22
name: 'SQLi pg probe in aid'
severity: high
type: active
tags:
  - sqli
  - injection
  - pg
description: 'Triggers pg error via aid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      aid:
        - '1'')--'
        - ''' OR ''a''=''a'' /*'
    matchers:
      - type: regex
        part: body
        regex:
          - 'PostgreSQL'
          - 'pg_query'
