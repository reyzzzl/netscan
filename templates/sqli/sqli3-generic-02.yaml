id: sqli3-generic-02
name: 'SQLi generic prefix #1 in sid'
severity: high
type: active
tags:
  - sqli
  - injection
  - generic
description: 'Triggers generic error via sid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      sid:
        - '''))'
        - '1" OR "1"="1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'JDBC'
          - 'Warning: mysql'
