id: sqli-time3-044
name: 'Delay probe in cat'
severity: high
type: active
tags:
  - sqli
  - injection
  - blind
  - time
description: '3-second delay via cat'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cat:
        - ''';DO SLEEP(3)--'
    matchers:
      - type: time
        ms: 2500
