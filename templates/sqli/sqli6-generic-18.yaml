id: sqli6-generic-18
name: 'SQLi generic probe in product'
severity: high
type: active
tags:
  - sqli
  - injection
  - generic
description: 'Triggers generic error via product'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      product:
        - 'admin"--'
        - '''%09OR%091=1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'JDBC'
          - 'Warning: mysql'
