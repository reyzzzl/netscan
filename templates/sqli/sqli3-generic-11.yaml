id: sqli3-generic-11
name: 'SQLi generic prefix #10 in cat2'
severity: high
type: active
tags:
  - sqli
  - injection
  - generic
description: 'Triggers generic error via cat2'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cat2:
        - '''))) OR (((''1''=''1'
        - ''') UNION SELECT 1,2--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'JDBC'
          - 'Warning: mysql'
