id: sqli6-mssql-26
name: 'SQLi mssql probe in vid'
severity: high
type: active
tags:
  - sqli
  - injection
  - mssql
description: 'Triggers mssql error via vid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      vid:
        - '''%0aOR%091=1--'
        - '`'
    matchers:
      - type: regex
        part: body
        regex:
          - 'ODBC'
          - 'SQL Server'
