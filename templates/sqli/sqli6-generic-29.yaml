id: sqli6-generic-29
name: 'SQLi generic probe in order'
severity: high
type: active
tags:
  - sqli
  - injection
  - generic
description: 'Triggers generic error via order'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      order:
        - ''' OR ''a''=''a'' /*'
        - '` OR `1`=`1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'JDBC'
          - 'Warning: mysql'
