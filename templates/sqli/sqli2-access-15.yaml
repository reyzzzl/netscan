id: sqli2-access-15
name: 'SQLi error access via filter'
severity: high
type: active
tags:
  - sqli
  - injection
  - access
description: 'Triggers access error via filter'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      filter:
        - ''' OR ''1''=''1'
        - '''; SELECT 1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Microsoft JET'
          - 'ODBC Microsoft Access'
