id: sqli6-mysql-15
name: 'SQLi mysql probe in pid'
severity: high
type: active
tags:
  - sqli
  - injection
  - mysql
description: 'Triggers mysql error via pid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      pid:
        - '1'' AND ''1''=''1'
        - '1'')--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
