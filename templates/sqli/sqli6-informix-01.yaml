id: sqli6-informix-01
name: 'SQLi informix probe in vid'
severity: high
type: active
tags:
  - sqli
  - injection
  - informix
description: 'Triggers informix error via vid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      vid:
        - ''''
        - '") OR ("1"="1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Informix'
          - 'ISAM error'
