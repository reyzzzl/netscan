id: sqli2-access-06
name: 'SQLi error access via cat2'
severity: high
type: active
tags:
  - sqli
  - injection
  - access
description: 'Triggers access error via cat2'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cat2:
        - '''; SELECT 1--'
        - ''' OR ''1''=''1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Microsoft JET'
          - 'ODBC Microsoft Access'
