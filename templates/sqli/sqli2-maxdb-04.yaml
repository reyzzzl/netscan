id: sqli2-maxdb-04
name: 'SQLi error maxdb via mid'
severity: high
type: active
tags:
  - sqli
  - injection
  - maxdb
description: 'Triggers maxdb error via mid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      mid:
        - ''' UNION SELECT NULL,NULL--'
        - ''''
    matchers:
      - type: regex
        part: body
        regex:
          - 'MaxDB'
