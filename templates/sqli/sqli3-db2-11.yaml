id: sqli3-db2-11
name: 'SQLi db2 prefix #10 in cat2'
severity: high
type: active
tags:
  - sqli
  - injection
  - db2
description: 'Triggers db2 error via cat2'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cat2:
        - '''))) OR (((''1''=''1'
        - ''') UNION SELECT 1,2--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLCODE'
          - 'DB2'
