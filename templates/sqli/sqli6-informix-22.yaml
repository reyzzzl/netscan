id: sqli6-informix-22
name: 'SQLi informix probe in aid'
severity: high
type: active
tags:
  - sqli
  - injection
  - informix
description: 'Triggers informix error via aid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      aid:
        - '1'')--'
        - ''' OR ''a''=''a'' /*'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Informix'
          - 'ISAM error'
