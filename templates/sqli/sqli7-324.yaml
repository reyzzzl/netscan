id: sqli7-324
name: 'UNION probe in cat'
severity: high
type: active
tags:
  - sqli
  - injection
  - union
description: 'Triggers DB error via cat'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cat:
        - ''' UNION SELECT 1,2,3--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
          - 'PostgreSQL'
          - 'ODBC'
          - 'ORA-'
          - 'SQLite'
