id: sqli5-022
name: 'Oracle SQLi in nid'
severity: high
type: active
tags:
  - sqli
  - injection
  - oracle
description: 'Triggers oracle error via nid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nid:
        - '1'' UNION SELECT NULL FROM dual--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'ORA-'
          - 'Oracle error'
