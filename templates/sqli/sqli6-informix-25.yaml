id: sqli6-informix-25
name: 'SQLi informix probe in sid'
severity: high
type: active
tags:
  - sqli
  - injection
  - informix
description: 'Triggers informix error via sid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      sid:
        - '''%09OR%091=1--'
        - '"'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Informix'
          - 'ISAM error'
