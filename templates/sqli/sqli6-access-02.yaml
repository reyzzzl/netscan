id: sqli6-access-02
name: 'SQLi access probe in page'
severity: high
type: active
tags:
  - sqli
  - injection
  - access
description: 'Triggers access error via page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - '"'
        - ''' OR 1=1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Microsoft JET'
          - 'ODBC Microsoft Access'
