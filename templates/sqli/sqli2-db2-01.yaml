id: sqli2-db2-01
name: 'SQLi error db2 via nid'
severity: high
type: active
tags:
  - sqli
  - injection
  - db2
description: 'Triggers db2 error via nid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nid:
        - ''''
        - ''' UNION SELECT NULL,NULL--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLCODE'
          - 'DB2 SQL error'
