id: sqli6-access-20
name: 'SQLi access probe in sid'
severity: high
type: active
tags:
  - sqli
  - injection
  - access
description: 'Triggers access error via sid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      sid:
        - '1'' ORDER BY 1--'
        - '''||''1''=''1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Microsoft JET'
          - 'ODBC Microsoft Access'
