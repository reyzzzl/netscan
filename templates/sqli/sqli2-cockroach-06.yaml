id: sqli2-cockroach-06
name: 'SQLi error cockroach via cat2'
severity: high
type: active
tags:
  - sqli
  - injection
  - cockroach
description: 'Triggers cockroach error via cat2'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cat2:
        - '''; SELECT 1--'
        - ''' OR ''1''=''1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'CockroachDB'
