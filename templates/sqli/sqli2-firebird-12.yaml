id: sqli2-firebird-12
name: 'SQLi error firebird via sort'
severity: high
type: active
tags:
  - sqli
  - injection
  - firebird
description: 'Triggers firebird error via sort'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      sort:
        - '''; SELECT 1--'
        - ''' OR ''1''=''1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Firebird'
          - 'Dynamic SQL Error'
