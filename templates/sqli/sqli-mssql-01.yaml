id: sqli-mssql-01
name: 'SQLi error mssql via user'
severity: high
type: active
tags:
  - sqli
  - injection
  - mssql
description: 'Triggers mssql error via user'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      user:
        - ''''
        - ''' OR ''1''=''1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'ODBC'
          - 'SQL Server'
          - 'Unclosed quotation mark'
