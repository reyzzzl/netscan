id: sqli-oracle-05
name: 'SQLi error oracle via product'
severity: high
type: active
tags:
  - sqli
  - injection
  - oracle
description: 'Triggers oracle error via product'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      product:
        - ''' UNION SELECT NULL--'
        - ''''
    matchers:
      - type: regex
        part: body
        regex:
          - 'ORA-'
          - 'Oracle error'
