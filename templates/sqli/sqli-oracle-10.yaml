id: sqli-oracle-10
name: 'SQLi error oracle via product'
severity: high
type: active
tags:
  - sqli
  - injection
  - oracle
description: 'Triggers oracle error via product'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      product:
        - '" OR "1"="1'
        - ''' AND SLEEP(5)--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'ORA-'
          - 'Oracle error'
