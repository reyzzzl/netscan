id: sqli6-access-10
name: 'SQLi access probe in sid'
severity: high
type: active
tags:
  - sqli
  - injection
  - access
description: 'Triggers access error via sid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      sid:
        - '" OR 1=1--'
        - 'admin''--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Microsoft JET'
          - 'ODBC Microsoft Access'
