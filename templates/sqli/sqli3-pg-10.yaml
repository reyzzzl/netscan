id: sqli3-pg-10
name: 'SQLi pg prefix #9 in filter'
severity: high
type: active
tags:
  - sqli
  - injection
  - pg
description: 'Triggers pg error via filter'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      filter:
        - '''))'
        - '1" OR "1"="1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'PostgreSQL'
          - 'pg_query'
