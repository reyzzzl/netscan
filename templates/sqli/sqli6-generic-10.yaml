id: sqli6-generic-10
name: 'SQLi generic probe in pid'
severity: high
type: active
tags:
  - sqli
  - injection
  - generic
description: 'Triggers generic error via pid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      pid:
        - '" OR 1=1--'
        - 'admin''--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'JDBC'
          - 'Warning: mysql'
