id: sqli6-generic-05
name: 'SQLi generic probe in sid'
severity: high
type: active
tags:
  - sqli
  - injection
  - generic
description: 'Triggers generic error via sid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      sid:
        - '" OR "1"="1'
        - ''' UNION SELECT NULL,NULL--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'JDBC'
          - 'Warning: mysql'
