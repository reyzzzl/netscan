id: sqli6-oracle-15
name: 'SQLi oracle probe in sid'
severity: high
type: active
tags:
  - sqli
  - injection
  - oracle
description: 'Triggers oracle error via sid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      sid:
        - '1'' AND ''1''=''1'
        - '1'')--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'ORA-'
          - 'Oracle error'
