id: sqli6-mssql-22
name: 'SQLi mssql probe in page'
severity: high
type: active
tags:
  - sqli
  - injection
  - mssql
description: 'Triggers mssql error via page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - '1'')--'
        - ''' OR ''a''=''a'' /*'
    matchers:
      - type: regex
        part: body
        regex:
          - 'ODBC'
          - 'SQL Server'
