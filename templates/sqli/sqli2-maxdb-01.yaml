id: sqli2-maxdb-01
name: 'SQLi error maxdb via nid'
severity: high
type: active
tags:
  - sqli
  - injection
  - maxdb
description: 'Triggers maxdb error via nid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nid:
        - ''''
        - ''' UNION SELECT NULL,NULL--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'MaxDB'
