id: sqli6-generic-23
name: 'SQLi generic probe in filter'
severity: high
type: active
tags:
  - sqli
  - injection
  - generic
description: 'Triggers generic error via filter'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      filter:
        - '''))--'
        - ''') OR ''a''=''a'
    matchers:
      - type: regex
        part: body
        regex:
          - 'JDBC'
          - 'Warning: mysql'
