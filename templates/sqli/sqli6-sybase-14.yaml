id: sqli6-sybase-14
name: 'SQLi sybase probe in order'
severity: high
type: active
tags:
  - sqli
  - injection
  - sybase
description: 'Triggers sybase error via order'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      order:
        - ''') UNION SELECT 1,2--'
        - ''' HAVING 1=1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Sybase'
          - 'Adaptive Server'
