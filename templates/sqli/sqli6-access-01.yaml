id: sqli6-access-01
name: 'SQLi access probe in id'
severity: high
type: active
tags:
  - sqli
  - injection
  - access
description: 'Triggers access error via id'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      id:
        - ''''
        - '") OR ("1"="1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Microsoft JET'
          - 'ODBC Microsoft Access'
