id: sqli3-db2-01
name: 'SQLi db2 prefix #0 in cat2'
severity: high
type: active
tags:
  - sqli
  - injection
  - db2
description: 'Triggers db2 error via cat2'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cat2:
        - ')'
        - 'admin'')--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLCODE'
          - 'DB2'
