id: sqli3-time-034
name: 'Time-blind delay in sort'
severity: high
type: active
tags:
  - sqli
  - injection
  - blind
  - time
description: '3-second delay via sort'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      sort:
        - '" AND SLEEP(3)--'
    matchers:
      - type: time
        ms: 2500
