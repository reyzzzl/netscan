id: sqli-pg-15
name: 'SQLi error pg via product'
severity: high
type: active
tags:
  - sqli
  - injection
  - pg
description: 'Triggers pg error via product'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      product:
        - ''' OR ''1''=''1'
        - ''' UNION SELECT NULL--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'PostgreSQL'
          - 'pg_query'
          - 'ERROR: syntax error'
