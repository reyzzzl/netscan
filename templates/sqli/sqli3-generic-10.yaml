id: sqli3-generic-10
name: 'SQLi generic prefix #9 in filter'
severity: high
type: active
tags:
  - sqli
  - injection
  - generic
description: 'Triggers generic error via filter'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      filter:
        - '''))'
        - '1" OR "1"="1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'JDBC'
          - 'Warning: mysql'
