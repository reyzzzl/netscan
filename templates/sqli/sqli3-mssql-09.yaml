id: sqli3-mssql-09
name: 'SQLi mssql prefix #8 in mid'
severity: high
type: active
tags:
  - sqli
  - injection
  - mssql
description: 'Triggers mssql error via mid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      mid:
        - ')'
        - 'admin'')--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'ODBC'
          - 'SQL Server'
