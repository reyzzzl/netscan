id: sqli6-access-19
name: 'SQLi access probe in cat2'
severity: high
type: active
tags:
  - sqli
  - injection
  - access
description: 'Triggers access error via cat2'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cat2:
        - ''' AND SLEEP(0)--'
        - '''%0aOR%091=1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Microsoft JET'
          - 'ODBC Microsoft Access'
