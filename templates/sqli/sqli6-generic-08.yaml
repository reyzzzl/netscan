id: sqli6-generic-08
name: 'SQLi generic probe in product'
severity: high
type: active
tags:
  - sqli
  - injection
  - generic
description: 'Triggers generic error via product'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      product:
        - '") OR ("1"="1'
        - '1'' AND ''1''=''1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'JDBC'
          - 'Warning: mysql'
