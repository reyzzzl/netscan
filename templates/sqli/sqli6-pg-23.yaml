id: sqli6-pg-23
name: 'SQLi pg probe in filter'
severity: high
type: active
tags:
  - sqli
  - injection
  - pg
description: 'Triggers pg error via filter'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      filter:
        - '''))--'
        - ''') OR ''a''=''a'
    matchers:
      - type: regex
        part: body
        regex:
          - 'PostgreSQL'
          - 'pg_query'
