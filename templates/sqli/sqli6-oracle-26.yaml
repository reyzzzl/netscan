id: sqli6-oracle-26
name: 'SQLi oracle probe in id'
severity: high
type: active
tags:
  - sqli
  - injection
  - oracle
description: 'Triggers oracle error via id'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      id:
        - '''%0aOR%091=1--'
        - '`'
    matchers:
      - type: regex
        part: body
        regex:
          - 'ORA-'
          - 'Oracle error'
