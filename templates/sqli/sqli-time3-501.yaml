id: sqli-time3-501
name: 'Delay probe in id'
severity: high
type: active
tags:
  - sqli
  - injection
  - blind
  - time
description: '3-second delay via id'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      id:
        - ''' AND (SELECT SLEEP(3))--'
    matchers:
      - type: time
        ms: 2500
