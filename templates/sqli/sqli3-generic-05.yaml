id: sqli3-generic-05
name: 'SQLi generic prefix #4 in filter'
severity: high
type: active
tags:
  - sqli
  - injection
  - generic
description: 'Triggers generic error via filter'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      filter:
        - 'admin'')--'
        - ')'
    matchers:
      - type: regex
        part: body
        regex:
          - 'JDBC'
          - 'Warning: mysql'
