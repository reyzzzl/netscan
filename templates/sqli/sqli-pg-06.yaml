id: sqli-pg-06
name: 'SQLi error pg via order'
severity: high
type: active
tags:
  - sqli
  - injection
  - pg
description: 'Triggers pg error via order'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      order:
        - ''' AND SLEEP(5)--'
        - '"'
    matchers:
      - type: regex
        part: body
        regex:
          - 'PostgreSQL'
          - 'pg_query'
          - 'ERROR: syntax error'
