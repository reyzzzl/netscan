id: sqli3-sqlite-05
name: 'SQLi sqlite prefix #4 in tid'
severity: high
type: active
tags:
  - sqli
  - injection
  - sqlite
description: 'Triggers sqlite error via tid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      tid:
        - 'admin'')--'
        - ')'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLite'
          - 'sqlite3'
