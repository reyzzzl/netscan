id: sqli6-pg-15
name: 'SQLi pg probe in sid'
severity: high
type: active
tags:
  - sqli
  - injection
  - pg
description: 'Triggers pg error via sid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      sid:
        - '1'' AND ''1''=''1'
        - '1'')--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'PostgreSQL'
          - 'pg_query'
