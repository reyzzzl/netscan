id: sqli6-pg-29
name: 'SQLi pg probe in order'
severity: high
type: active
tags:
  - sqli
  - injection
  - pg
description: 'Triggers pg error via order'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      order:
        - ''' OR ''a''=''a'' /*'
        - '` OR `1`=`1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'PostgreSQL'
          - 'pg_query'
