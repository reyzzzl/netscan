id: sqli6-mysql-02
name: 'SQLi mysql probe in page'
severity: high
type: active
tags:
  - sqli
  - injection
  - mysql
description: 'Triggers mysql error via page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - '"'
        - ''' OR 1=1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
