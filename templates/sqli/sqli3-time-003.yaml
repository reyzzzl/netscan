id: sqli3-time-003
name: 'Time-blind delay in aid'
severity: high
type: active
tags:
  - sqli
  - injection
  - blind
  - time
description: '3-second delay via aid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      aid:
        - ''' OR SLEEP(3)--'
    matchers:
      - type: time
        ms: 2500
