id: sqli6-sqlite-25
name: 'SQLi sqlite probe in pid'
severity: high
type: active
tags:
  - sqli
  - injection
  - sqlite
description: 'Triggers sqlite error via pid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      pid:
        - '''%09OR%091=1--'
        - '"'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLite'
          - 'sqlite3'
