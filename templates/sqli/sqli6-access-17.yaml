id: sqli6-access-17
name: 'SQLi access probe in aid'
severity: high
type: active
tags:
  - sqli
  - injection
  - access
description: 'Triggers access error via aid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      aid:
        - 'admin''--'
        - '''/**/OR/**/1=1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Microsoft JET'
          - 'ODBC Microsoft Access'
