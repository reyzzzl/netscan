id: sqli-time3-067
name: 'Delay probe in order'
severity: high
type: active
tags:
  - sqli
  - injection
  - blind
  - time
description: '3-second delay via order'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      order:
        - '''; SELECT pg_sleep(3)--'
    matchers:
      - type: time
        ms: 2500
