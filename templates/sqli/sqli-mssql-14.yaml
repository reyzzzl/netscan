id: sqli-mssql-14
name: 'SQLi error mssql via cid'
severity: high
type: active
tags:
  - sqli
  - injection
  - mssql
description: 'Triggers mssql error via cid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cid:
        - '"'
        - '" OR "1"="1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'ODBC'
          - 'SQL Server'
          - 'Unclosed quotation mark'
