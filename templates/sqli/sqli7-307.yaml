id: sqli7-307
name: 'UNION probe in order'
severity: high
type: active
tags:
  - sqli
  - injection
  - union
description: 'Triggers DB error via order'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      order:
        - '" UNION SELECT NULL--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
          - 'PostgreSQL'
          - 'ODBC'
          - 'ORA-'
          - 'SQLite'
