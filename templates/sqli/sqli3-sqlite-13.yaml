id: sqli3-sqlite-13
name: 'SQLi sqlite prefix #12 in dir'
severity: high
type: active
tags:
  - sqli
  - injection
  - sqlite
description: 'Triggers sqlite error via dir'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      dir:
        - 'admin'')--'
        - ')'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLite'
          - 'sqlite3'
