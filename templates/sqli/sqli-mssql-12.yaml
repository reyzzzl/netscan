id: sqli-mssql-12
name: 'SQLi error mssql via cat'
severity: high
type: active
tags:
  - sqli
  - injection
  - mssql
description: 'Triggers mssql error via cat'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      cat:
        - ''' AND SLEEP(5)--'
        - '"'
    matchers:
      - type: regex
        part: body
        regex:
          - 'ODBC'
          - 'SQL Server'
          - 'Unclosed quotation mark'
