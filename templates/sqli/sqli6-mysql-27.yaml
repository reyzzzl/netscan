id: sqli6-mysql-27
name: 'SQLi mysql probe in aid'
severity: high
type: active
tags:
  - sqli
  - injection
  - mysql
description: 'Triggers mysql error via aid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      aid:
        - '''||''1''=''1'
        - ''' OR ''1''=''1'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
