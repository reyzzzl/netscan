id: sqli6-pg-26
name: 'SQLi pg probe in id'
severity: high
type: active
tags:
  - sqli
  - injection
  - pg
description: 'Triggers pg error via id'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      id:
        - '''%0aOR%091=1--'
        - '`'
    matchers:
      - type: regex
        part: body
        regex:
          - 'PostgreSQL'
          - 'pg_query'
