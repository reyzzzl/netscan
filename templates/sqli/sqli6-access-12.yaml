id: sqli6-access-12
name: 'SQLi access probe in page'
severity: high
type: active
tags:
  - sqli
  - injection
  - access
description: 'Triggers access error via page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - ''' UNION SELECT NULL,NULL--'
        - ''' AND SLEEP(0)--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Microsoft JET'
          - 'ODBC Microsoft Access'
