id: sqli2-informix-03
name: 'SQLi error informix via dir'
severity: high
type: active
tags:
  - sqli
  - injection
  - informix
description: 'Triggers informix error via dir'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      dir:
        - ''' OR ''1''=''1'
        - '''; SELECT 1--'
    matchers:
      - type: regex
        part: body
        regex:
          - 'Informix'
          - 'ISAM error'
