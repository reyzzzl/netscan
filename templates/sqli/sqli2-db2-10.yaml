id: sqli2-db2-10
name: 'SQLi error db2 via tid'
severity: high
type: active
tags:
  - sqli
  - injection
  - db2
description: 'Triggers db2 error via tid'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      tid:
        - ''' UNION SELECT NULL,NULL--'
        - ''''
    matchers:
      - type: regex
        part: body
        regex:
          - 'SQLCODE'
          - 'DB2 SQL error'
