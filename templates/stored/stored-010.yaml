id: stored-010
name: 'Stored XSS via notes.content'
severity: high
type: active
tags:
  - xss
  - stored
description: 'Stores canary, reads it back on /notes'
requests:
  - method: POST
    path: '{{BaseURL}}/notes'
    body: 'content=<script>store010</script>'
    sendHeaders:
      Content-Type: 'application/x-www-form-urlencoded'
  - method: GET
    path: '{{BaseURL}}/notes'
    matchers:
      - type: word
        part: body
        words:
          - 'store010'
