id: stored-009
name: 'Stored XSS via notes.body'
severity: high
type: active
tags:
  - xss
  - stored
description: 'Stores canary, reads it back on /notes'
requests:
  - method: POST
    path: '{{BaseURL}}/notes'
    body: '{"body":"<script>store009</script>"}'
    sendHeaders:
      Content-Type: 'application/json'
  - method: GET
    path: '{{BaseURL}}/notes'
    matchers:
      - type: word
        part: body
        words:
          - 'store009'
