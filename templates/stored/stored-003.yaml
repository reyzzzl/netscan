id: stored-003
name: 'Stored XSS via notes.message'
severity: high
type: active
tags:
  - xss
  - stored
description: 'Stores canary, reads it back on /notes'
requests:
  - method: POST
    path: '{{BaseURL}}/notes'
    body: '{"message":"<script>store003</script>"}'
    sendHeaders:
      Content-Type: 'application/json'
  - method: GET
    path: '{{BaseURL}}/notes'
    matchers:
      - type: word
        part: body
        words:
          - 'store003'
