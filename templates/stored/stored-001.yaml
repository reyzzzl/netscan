id: stored-001
name: 'Stored XSS via notes.text'
severity: high
type: active
tags:
  - xss
  - stored
description: 'Stores canary, reads it back on /notes'
requests:
  - method: POST
    path: '{{BaseURL}}/notes'
    body: '{"text":"<script>store001</script>"}'
    sendHeaders:
      Content-Type: 'application/json'
  - method: GET
    path: '{{BaseURL}}/notes'
    matchers:
      - type: word
        part: body
        words:
          - 'store001'
