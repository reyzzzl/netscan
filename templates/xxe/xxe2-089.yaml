id: xxe2-089
name: 'XXE file read in payload'
severity: critical
type: active
tags:
  - xxe
  - injection
  - xml
description: 'XXE entity via payload'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      payload:
        - '<?xml version="1.0"?><r>&xxe;&xxe;</r>'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
          - 'XXE_OK'
          - 'localhost'
          - 'uid='
