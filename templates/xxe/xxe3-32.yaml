id: xxe3-32
name: 'XXE DoS/entity in data'
severity: high
type: active
tags:
  - xxe
  - injection
  - xml
  - dos
description: 'XXE entity via data'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      data:
        - '<?xml version="1.0"?><r xmlns:xi="http://www.w3.org/2003/XInclude">x</r>'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
          - 'XXE_OK'
