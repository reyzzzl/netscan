id: xxe-055
name: 'XXE via content'
severity: critical
type: active
tags:
  - xxe
  - injection
  - xml
description: 'XXE entity via content'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      content:
        - '<?xml version="1.0"?><!DOCTYPE lolz [<!ENTITY lol "lollollol">]><r>&lol;</r>'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
          - 'XXE_OK'
