id: xxe3-35
name: 'XXE DoS/entity in content'
severity: high
type: active
tags:
  - xxe
  - injection
  - xml
  - dos
description: 'XXE entity via content'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      content:
        - '<?xml version="1.0"?><!DOCTYPE lolz [<!ENTITY lol1 "looooooooool">]><r>&lol1;</r>'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
          - 'XXE_OK'
