id: xxe3-25
name: 'XXE DoS/entity in content'
severity: high
type: active
tags:
  - xxe
  - injection
  - xml
  - dos
description: 'XXE entity via content'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      content:
        - '<!DOCTYPE lolz [<!ENTITY lol "lollollollollollollollol">]><r>&lol;</r>'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
          - 'XXE_OK'
