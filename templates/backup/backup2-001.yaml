id: backup2-001
name: 'Exposed2 /actuator/metrics'
severity: medium
type: active
tags:
  - exposure
  - backup
  - config
description: 'Sensitive file /actuator/metrics is exposed'
requests:
  - method: GET
    path: '{{BaseURL}}/actuator/metrics'
    match-all: true
    matchers:
      - type: status
        status: [200]
      - type: word
        part: body
        words:
          - 'names'
