id: backup5-0103
name: 'Exposed /config.php.orig'
severity: medium
type: active
tags:
  - exposure
  - backup
  - config
description: 'Sensitive file /config.php.orig is exposed'
requests:
  - method: GET
    path: '{{BaseURL}}/config.php.orig'
    matchers:
      - type: status
        status: [200]
