id: lfi2-015
name: 'Path traversal2 via template'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via template'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      template:
        - 'zip://archive.zip#file'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
