id: lfi6-0823
name: 'Traversal in config'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via config'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      config:
        - '..\..\windows\win.ini'
    matchers:
      - type: word
        part: body
        words:
          - '[extensions]'
