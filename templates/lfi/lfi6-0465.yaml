id: lfi6-0465
name: 'Traversal in root'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via root'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      root:
        - '/etc/shells'
    matchers:
      - type: word
        part: body
        words:
          - '/bin/bash'
