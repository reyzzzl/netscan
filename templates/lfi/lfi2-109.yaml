id: lfi2-109
name: 'Path traversal2 via theme'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via theme'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      theme:
        - 'C:\Windows\win.ini'
    matchers:
      - type: word
        part: body
        words:
          - '[extensions]'
