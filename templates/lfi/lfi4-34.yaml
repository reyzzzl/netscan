id: lfi4-34
name: 'System file /proc/self/mounts via include'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads /proc/self/mounts via include'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      include:
        - '/proc/self/mounts'
    matchers:
      - type: word
        part: body
        words:
          - '/proc'
