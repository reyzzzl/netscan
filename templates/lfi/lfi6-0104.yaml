id: lfi6-0104
name: 'Traversal in include'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via include'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      include:
        - '/etc/fstab'
    matchers:
      - type: word
        part: body
        words:
          - '/etc/fstab'
