id: lfi4-03
name: 'System file /etc/hostname via page'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads /etc/hostname via page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - '/etc/hostname'
    matchers:
      - type: word
        part: body
        words:
          - 'labhost'
