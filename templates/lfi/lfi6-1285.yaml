id: lfi6-1285
name: 'Traversal in asset'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via asset'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      asset:
        - '/etc/crontab'
    matchers:
      - type: word
        part: body
        words:
          - 'SHELL='
