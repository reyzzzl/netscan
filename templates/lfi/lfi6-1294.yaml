id: lfi6-1294
name: 'Traversal in download'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via download'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      download:
        - '/windows/win.ini'
    matchers:
      - type: word
        part: body
        words:
          - '[extensions]'
