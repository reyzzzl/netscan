id: lfi5-012
name: 'Wrapper file via path'
severity: high
type: active
tags:
  - lfi
  - traversal
  - wrapper
description: 'Reads file via file wrapper'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      path:
        - 'file:///etc/hosts'
    matchers:
      - type: word
        part: body
        words:
          - 'localhost'
