id: lfi4-25
name: 'System file /etc/group via view'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads /etc/group via view'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      view:
        - '/etc/group'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:'
