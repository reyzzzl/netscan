id: lfi6-0988
name: 'Traversal in folder'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via folder'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      folder:
        - '/etc/resolv.conf'
    matchers:
      - type: word
        part: body
        words:
          - 'nameserver'
