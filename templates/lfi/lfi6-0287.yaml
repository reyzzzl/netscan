id: lfi6-0287
name: 'Traversal in resource'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via resource'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      resource:
        - '/etc/motd'
    matchers:
      - type: word
        part: body
        words:
          - 'motd'
