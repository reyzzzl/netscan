id: lfi6-0634
name: 'Traversal in theme'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via theme'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      theme:
        - '/etc/resolv.conf'
    matchers:
      - type: word
        part: body
        words:
          - 'nameserver'
