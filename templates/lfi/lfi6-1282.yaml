id: lfi6-1282
name: 'Traversal in doc'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via doc'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      doc:
        - '/etc/hostname'
    matchers:
      - type: word
        part: body
        words:
          - 'labhost'
