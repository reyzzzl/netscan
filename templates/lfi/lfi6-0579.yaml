id: lfi6-0579
name: 'Traversal in include'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via include'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      include:
        - '/proc/version'
    matchers:
      - type: word
        part: body
        words:
          - 'Linux version'
