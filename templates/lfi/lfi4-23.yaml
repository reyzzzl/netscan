id: lfi4-23
name: 'System file /etc/motd via page'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads /etc/motd via page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - '/etc/motd'
    matchers:
      - type: word
        part: body
        words:
          - 'motd'
