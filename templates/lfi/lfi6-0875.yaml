id: lfi6-0875
name: 'Traversal in profile'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via profile'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      profile:
        - '/proc/cmdline'
    matchers:
      - type: word
        part: body
        words:
          - 'node'
