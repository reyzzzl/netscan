id: lfi6-0819
name: 'Traversal in download'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via download'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      download:
        - '/etc/shells'
    matchers:
      - type: word
        part: body
        words:
          - '/bin/bash'
