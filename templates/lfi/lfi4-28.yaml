id: lfi4-28
name: 'System file /etc/resolv.conf via page'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads /etc/resolv.conf via page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - '/etc/resolv.conf'
    matchers:
      - type: word
        part: body
        words:
          - 'nameserver'
