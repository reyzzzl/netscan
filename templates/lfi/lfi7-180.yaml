id: lfi7-180
name: 'Deep traversal in template'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via template'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      template:
        - '/proc/self/environ'
    matchers:
      - type: word
        part: body
        words:
          - 'GATEWAY_INTERFACE'
