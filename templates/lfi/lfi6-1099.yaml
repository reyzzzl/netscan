id: lfi6-1099
name: 'Traversal in settings'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via settings'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      settings:
        - '/proc/self/environ'
    matchers:
      - type: word
        part: body
        words:
          - 'GATEWAY_INTERFACE'
