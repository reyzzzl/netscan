id: lfi6-0996
name: 'Traversal in document'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via document'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      document:
        - '/etc/shells'
    matchers:
      - type: word
        part: body
        words:
          - '/bin/bash'
