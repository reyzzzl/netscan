id: lfi6-0463
name: 'Traversal in folder'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via folder'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      folder:
        - '/proc/self/mounts'
    matchers:
      - type: word
        part: body
        words:
          - '/proc'
