id: lfi7-459
name: 'Deep traversal in theme'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via theme'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      theme:
        - 'C:Windowswin.ini'
    matchers:
      - type: word
        part: body
        words:
          - '[extensions]'
