id: lfi6-0929
name: 'Traversal in include'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via include'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      include:
        - '/etc/resolv.conf'
    matchers:
      - type: word
        part: body
        words:
          - 'nameserver'
