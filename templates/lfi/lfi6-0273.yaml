id: lfi6-0273
name: 'Traversal in config'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via config'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      config:
        - '/proc/self/environ'
    matchers:
      - type: word
        part: body
        words:
          - 'GATEWAY_INTERFACE'
