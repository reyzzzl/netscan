id: lfi6-1224
name: 'Traversal in settings'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via settings'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      settings:
        - '/etc/resolv.conf'
    matchers:
      - type: word
        part: body
        words:
          - 'nameserver'
