id: lfi4-42
name: 'System file /etc/crontab via path'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads /etc/crontab via path'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      path:
        - '/etc/crontab'
    matchers:
      - type: word
        part: body
        words:
          - 'SHELL='
