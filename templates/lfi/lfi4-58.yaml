id: lfi4-58
name: 'System file /proc/self/mounts via page'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads /proc/self/mounts via page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - '/proc/self/mounts'
    matchers:
      - type: word
        part: body
        words:
          - '/proc'
