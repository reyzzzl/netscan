id: lfi5-096
name: 'Wrapper file via view'
severity: high
type: active
tags:
  - lfi
  - traversal
  - wrapper
description: 'Reads file via file wrapper'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      view:
        - 'file:///etc/hosts'
    matchers:
      - type: word
        part: body
        words:
          - 'localhost'
