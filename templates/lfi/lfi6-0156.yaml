id: lfi6-0156
name: 'Traversal in view'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via view'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      view:
        - '/etc/hosts'
    matchers:
      - type: word
        part: body
        words:
          - 'localhost'
