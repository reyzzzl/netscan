id: lfi2-081
name: 'Path traversal2 via file'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via file'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      file:
        - '/proc/self/environ'
    matchers:
      - type: word
        part: body
        words:
          - 'GATEWAY_INTERFACE'
