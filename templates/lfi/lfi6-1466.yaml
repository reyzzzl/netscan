id: lfi6-1466
name: 'Traversal in home'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via home'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      home:
        - '/proc/self/mounts'
    matchers:
      - type: word
        part: body
        words:
          - '/proc'
