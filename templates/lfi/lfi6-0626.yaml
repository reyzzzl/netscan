id: lfi6-0626
name: 'Traversal in file'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via file'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      file:
        - 'C:\Windows\win.ini'
    matchers:
      - type: word
        part: body
        words:
          - '[extensions]'
