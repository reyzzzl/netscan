id: lfi6-1216
name: 'Traversal in home'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via home'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      home:
        - 'C:\Windows\win.ini'
    matchers:
      - type: word
        part: body
        words:
          - '[extensions]'
