id: lfi6-0044
name: 'Traversal in download'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via download'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      download:
        - '/etc/resolv.conf'
    matchers:
      - type: word
        part: body
        words:
          - 'nameserver'
