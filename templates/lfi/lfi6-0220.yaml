id: lfi6-0220
name: 'Traversal in upload'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via upload'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      upload:
        - '/etc/hostname'
    matchers:
      - type: word
        part: body
        words:
          - 'labhost'
