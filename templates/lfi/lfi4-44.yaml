id: lfi4-44
name: 'System file /proc/version via include'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads /proc/version via include'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      include:
        - '/proc/version'
    matchers:
      - type: word
        part: body
        words:
          - 'Linux version'
