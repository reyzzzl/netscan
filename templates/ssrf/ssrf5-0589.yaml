id: ssrf5-0589
name: 'SSRF probe in target'
severity: high
type: active
tags:
  - ssrf
  - oob
  - cloud
description: 'Fetches internal URL via target (verify manually)'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      target:
        - 'http://localhost.nip.io/'
    matchers:
      - type: word
        part: body
        words:
          - 'ami-id'
          - 'instance-id'
          - 'metadata'
          - 'root:x:0:0'
          - 'PONG'
