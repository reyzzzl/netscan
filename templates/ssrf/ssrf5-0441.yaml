id: ssrf5-0441
name: 'SSRF probe in resource'
severity: high
type: active
tags:
  - ssrf
  - oob
  - cloud
description: 'Fetches internal URL via resource (verify manually)'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      resource:
        - 'http://127.0.0.1/'
    matchers:
      - type: word
        part: body
        words:
          - 'ami-id'
          - 'instance-id'
          - 'metadata'
          - 'root:x:0:0'
          - 'PONG'
