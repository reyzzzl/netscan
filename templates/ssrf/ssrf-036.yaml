id: ssrf-036
name: 'SSRF via fetch'
severity: high
type: active
tags:
  - ssrf
  - oob
  - cloud
description: 'Fetches internal URL via fetch (verify manually)'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      fetch:
        - 'http://0.0.0.0/'
    matchers:
      - type: word
        part: body
        words:
          - 'ami-id'
          - 'instance-id'
          - 'metadata'
          - 'root:x:0:0'
          - 'PONG'
