id: ssrf5-0776
name: 'SSRF probe in url'
severity: high
type: active
tags:
  - ssrf
  - oob
  - cloud
description: 'Fetches internal URL via url (verify manually)'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      url:
        - 'http://0xA9.0xFE.0xA9.0xFE/'
    matchers:
      - type: word
        part: body
        words:
          - 'ami-id'
          - 'instance-id'
          - 'metadata'
          - 'root:x:0:0'
          - 'PONG'
