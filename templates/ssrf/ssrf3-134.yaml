id: ssrf3-134
name: 'SSRF encoded IP via fetch'
severity: high
type: active
tags:
  - ssrf
  - oob
  - cloud
description: 'Fetches internal URL via fetch (verify manually)'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      fetch:
        - 'http://0177.00.00.01/'
    matchers:
      - type: word
        part: body
        words:
          - 'ami-id'
          - 'instance-id'
          - 'metadata'
          - 'root:x:0:0'
          - 'PONG'
