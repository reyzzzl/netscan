id: ssrf5-0263
name: 'SSRF probe in dest'
severity: high
type: active
tags:
  - ssrf
  - oob
  - cloud
description: 'Fetches internal URL via dest (verify manually)'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      dest:
        - 'http://127.0.0.1%2eexample/'
    matchers:
      - type: word
        part: body
        words:
          - 'ami-id'
          - 'instance-id'
          - 'metadata'
          - 'root:x:0:0'
          - 'PONG'
