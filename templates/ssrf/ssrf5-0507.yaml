id: ssrf5-0507
name: 'SSRF probe in redirect_url'
severity: high
type: active
tags:
  - ssrf
  - oob
  - cloud
description: 'Fetches internal URL via redirect_url (verify manually)'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      redirect_url:
        - 'http://spoofed.127.0.0.1.nip.io/'
    matchers:
      - type: word
        part: body
        words:
          - 'ami-id'
          - 'instance-id'
          - 'metadata'
          - 'root:x:0:0'
          - 'PONG'
