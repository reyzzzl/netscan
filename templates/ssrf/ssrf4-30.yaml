id: ssrf4-30
name: 'SSRF scheme tftp via src'
severity: high
type: active
tags:
  - ssrf
  - oob
  - scheme
description: 'Fetches tftp URL via src (verify manually)'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      src:
        - 'tftp://127.0.0.1/file'
    matchers:
      - type: word
        part: body
        words:
          - 'TFTP'
