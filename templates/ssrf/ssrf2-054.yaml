id: ssrf2-054
name: 'SSRF2 bypass via target'
severity: high
type: active
tags:
  - ssrf
  - oob
  - cloud
  - bypass
description: 'SSRF filter bypass via target'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      target:
        - 'http://0/'
    matchers:
      - type: word
        part: body
        words:
          - 'ami-id'
          - 'instance-id'
          - 'metadata'
          - 'root:x:0:0'
          - 'PONG'
