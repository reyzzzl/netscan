id: ssrf4-12
name: 'SSRF scheme file via link'
severity: high
type: active
tags:
  - ssrf
  - oob
  - scheme
description: 'Fetches file URL via link (verify manually)'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      link:
        - 'file:///C:/Windows/win.ini'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
