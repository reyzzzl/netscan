id: ssrf5-0386
name: 'SSRF probe in link'
severity: high
type: active
tags:
  - ssrf
  - oob
  - cloud
description: 'Fetches internal URL via link (verify manually)'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      link:
        - 'http://0x7f.00.00.01/'
    matchers:
      - type: word
        part: body
        words:
          - 'ami-id'
          - 'instance-id'
          - 'metadata'
          - 'root:x:0:0'
          - 'PONG'
