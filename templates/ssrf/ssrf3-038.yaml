id: ssrf3-038
name: 'SSRF encoded IP via callback'
severity: high
type: active
tags:
  - ssrf
  - oob
  - cloud
description: 'Fetches internal URL via callback (verify manually)'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      callback:
        - 'http://127.1.nip.io/'
    matchers:
      - type: word
        part: body
        words:
          - 'ami-id'
          - 'instance-id'
          - 'metadata'
          - 'root:x:0:0'
          - 'PONG'
