id: ssrf5-0358
name: 'SSRF probe in callback'
severity: high
type: active
tags:
  - ssrf
  - oob
  - cloud
description: 'Fetches internal URL via callback (verify manually)'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      callback:
        - 'gopher://127.0.0.1:6379/_INFO'
    matchers:
      - type: word
        part: body
        words:
          - 'ami-id'
          - 'instance-id'
          - 'metadata'
          - 'root:x:0:0'
          - 'PONG'
