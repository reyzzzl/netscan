id: ssrf5-0784
name: 'SSRF probe in src'
severity: high
type: active
tags:
  - ssrf
  - oob
  - cloud
description: 'Fetches internal URL via src (verify manually)'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      src:
        - 'http://[0:0:0:0:0:ffff:127.0.0.1]/'
    matchers:
      - type: word
        part: body
        words:
          - 'ami-id'
          - 'instance-id'
          - 'metadata'
          - 'root:x:0:0'
          - 'PONG'
