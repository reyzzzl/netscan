id: ssrf5-0643
name: 'SSRF probe in feed'
severity: high
type: active
tags:
  - ssrf
  - oob
  - cloud
description: 'Fetches internal URL via feed (verify manually)'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      feed:
        - 'http://0.0.0.0/'
    matchers:
      - type: word
        part: body
        words:
          - 'ami-id'
          - 'instance-id'
          - 'metadata'
          - 'root:x:0:0'
          - 'PONG'
