id: redirect5-35
name: 'Scheme redirect in to'
severity: medium
type: active
tags:
  - redirect
  - open-redirect
  - scheme
description: 'Dangerous scheme via to'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      to:
        - 'data:text/html,<script>alert(1)</script>'
    matchers:
      - type: word
        part: headers
        words:
          - 'data:'
