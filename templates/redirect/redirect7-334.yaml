id: redirect7-334
name: 'Trusted bypass in page'
severity: high
type: active
tags:
  - redirect
  - open-redirect
  - bypass
description: 'Bypasses trusted.com allowlist via page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - 'https://trusted.com%23@evil.example/'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil.example'
