id: redirect7-100
name: 'Trusted bypass in ret'
severity: high
type: active
tags:
  - redirect
  - open-redirect
  - bypass
description: 'Bypasses trusted.com allowlist via ret'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      ret:
        - 'https://trusted.com/%09/evil.example/'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil.example'
