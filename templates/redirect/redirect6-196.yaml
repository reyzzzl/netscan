id: redirect6-196
name: 'Redirect sink in file'
severity: medium
type: active
tags:
  - redirect
  - open-redirect
description: 'Redirects to evil.example via file'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      file:
        - '//evil.example%2f%2e'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil.example'
