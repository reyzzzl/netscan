id: redirect5-22
name: 'Scheme redirect in return'
severity: medium
type: active
tags:
  - redirect
  - open-redirect
  - scheme
description: 'Dangerous scheme via return'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      return:
        - 'javascript:alert(document.cookie)'
    matchers:
      - type: word
        part: headers
        words:
          - 'javascript:'
