id: redirect6-360
name: 'Redirect sink in ret'
severity: medium
type: active
tags:
  - redirect
  - open-redirect
description: 'Redirects to evil.example via ret'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      ret:
        - 'https://Evil.Example/'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil.example'
