id: redirect2-039
name: 'Open redirect2 via returnTo'
severity: medium
type: active
tags:
  - redirect
  - open-redirect
description: 'Unsafe redirect via returnTo'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      returnTo:
        - 'javascript:alert(1)'
    matchers:
      - type: word
        part: headers
        words:
          - 'javascript:'
