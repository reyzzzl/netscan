id: redirect2-033
name: 'Open redirect2 via page'
severity: medium
type: active
tags:
  - redirect
  - open-redirect
description: 'Unsafe redirect via page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - 'javascript:alert(1)'
    matchers:
      - type: word
        part: headers
        words:
          - 'javascript:'
