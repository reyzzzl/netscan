id: redirect6-333
name: 'Redirect sink in site'
severity: medium
type: active
tags:
  - redirect
  - open-redirect
description: 'Redirects to evil.example via site'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      site:
        - 'https://evil.example/%2f'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil.example'
