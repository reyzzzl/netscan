id: redirect5-49
name: 'Scheme redirect in next'
severity: medium
type: active
tags:
  - redirect
  - open-redirect
  - scheme
description: 'Dangerous scheme via next'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      next:
        - 'data:,alert(1)'
    matchers:
      - type: word
        part: headers
        words:
          - 'data:'
