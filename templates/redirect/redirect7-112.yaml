id: redirect7-112
name: 'Trusted bypass in ref'
severity: high
type: active
tags:
  - redirect
  - open-redirect
  - bypass
description: 'Bypasses trusted.com allowlist via ref'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      ref:
        - 'https://trusted.com#@evil.example/'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil.example'
