id: redirect-032
name: 'Open redirect via url'
severity: medium
type: active
tags:
  - redirect
  - open-redirect
description: 'Redirects to evil.example via url'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      url:
        - 'https://evil.example/'
        - '//evil.example/'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil.example'
