id: redirect2-062
name: 'Open redirect2 via view'
severity: medium
type: active
tags:
  - redirect
  - open-redirect
description: 'Unsafe redirect via view'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      view:
        - 'https://evil.example/%2e'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil.example'
