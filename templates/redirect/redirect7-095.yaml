id: redirect7-095
name: 'Trusted bypass in view'
severity: high
type: active
tags:
  - redirect
  - open-redirect
  - bypass
description: 'Bypasses trusted.com allowlist via view'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      view:
        - 'https://TRUSTED.COM.evil.example/'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil.example'
