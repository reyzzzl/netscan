id: redirect3-004
name: 'Allowlist bypass via url'
severity: high
type: active
tags:
  - redirect
  - open-redirect
  - bypass
description: 'Bypasses trusted.com allowlist via url'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      url:
        - '//trusted.com.evil.example/'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil.example'
