id: redirect6-490
name: 'Redirect sink in goto'
severity: medium
type: active
tags:
  - redirect
  - open-redirect
description: 'Redirects to evil.example via goto'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      goto:
        - 'https://evil.example#x'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil.example'
