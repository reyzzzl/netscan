id: redirect2-083
name: 'Open redirect2 via next_url'
severity: medium
type: active
tags:
  - redirect
  - open-redirect
description: 'Unsafe redirect via next_url'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      next_url:
        - '/%09/evil.example'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil.example'
