id: redirect6-247
name: 'Redirect sink in dest'
severity: medium
type: active
tags:
  - redirect
  - open-redirect
description: 'Redirects to evil.example via dest'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      dest:
        - 'https://evil.example:443/'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil.example'
