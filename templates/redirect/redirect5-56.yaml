id: redirect5-56
name: 'Scheme redirect in url'
severity: medium
type: active
tags:
  - redirect
  - open-redirect
  - scheme
description: 'Dangerous scheme via url'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      url:
        - 'data:text/html;base64,PHNjcmlwdD5hbGVydCgxKTwvc2NyaXB0Pg=='
    matchers:
      - type: word
        part: headers
        words:
          - 'data:'
