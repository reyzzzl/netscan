id: redirect2-096
name: 'Open redirect2 via redirect_to'
severity: medium
type: active
tags:
  - redirect
  - open-redirect
description: 'Unsafe redirect via redirect_to'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      redirect_to:
        - 'https://evil.example%2f..'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil.example'
