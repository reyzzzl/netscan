id: redirect6-114
name: 'Redirect sink in page'
severity: medium
type: active
tags:
  - redirect
  - open-redirect
description: 'Redirects to evil.example via page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - 'https://evil.example%252e/'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil.example'
