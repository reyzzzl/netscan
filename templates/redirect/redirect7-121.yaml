id: redirect7-121
name: 'Trusted bypass in next'
severity: high
type: active
tags:
  - redirect
  - open-redirect
  - bypass
description: 'Bypasses trusted.com allowlist via next'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      next:
        - 'https://trusted.com.evil.example/'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil.example'
