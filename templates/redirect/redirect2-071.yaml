id: redirect2-071
name: 'Open redirect2 via to'
severity: medium
type: active
tags:
  - redirect
  - open-redirect
description: 'Unsafe redirect via to'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      to:
        - '/%09/evil.example'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil.example'
