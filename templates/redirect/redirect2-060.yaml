id: redirect2-060
name: 'Open redirect2 via site'
severity: medium
type: active
tags:
  - redirect
  - open-redirect
description: 'Unsafe redirect via site'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      site:
        - 'https://evil.example%2f..'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil.example'
