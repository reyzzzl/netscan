id: redirect6-358
name: 'Redirect sink in href'
severity: medium
type: active
tags:
  - redirect
  - open-redirect
description: 'Redirects to evil.example via href'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      href:
        - 'https://evil.example:80/'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil.example'
