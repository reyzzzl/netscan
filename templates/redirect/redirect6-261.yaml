id: redirect6-261
name: 'Redirect sink in next'
severity: medium
type: active
tags:
  - redirect
  - open-redirect
description: 'Redirects to evil.example via next'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      next:
        - 'https://evilexample.com/'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil.example'
