id: redirect7-028
name: 'Trusted bypass in r'
severity: high
type: active
tags:
  - redirect
  - open-redirect
  - bypass
description: 'Bypasses trusted.com allowlist via r'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      r:
        - 'https://trusted.com%09.evil.example/'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil.example'
