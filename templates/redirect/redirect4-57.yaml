id: redirect4-57
name: 'Allowlist trick in redirect'
severity: high
type: active
tags:
  - redirect
  - open-redirect
  - bypass
description: 'Bypasses trusted.com allowlist via redirect'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      redirect:
        - '//trusted.com.evil.example/%2f'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil.example'
