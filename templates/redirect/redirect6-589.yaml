id: redirect6-589
name: 'Redirect sink in forward'
severity: medium
type: active
tags:
  - redirect
  - open-redirect
description: 'Redirects to evil.example via forward'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      forward:
        - 'http://evil.example/'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil.example'
