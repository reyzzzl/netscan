id: redirect2-067
name: 'Open redirect2 via returnTo'
severity: medium
type: active
tags:
  - redirect
  - open-redirect
description: 'Unsafe redirect via returnTo'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      returnTo:
        - '//evil.example/%2f..'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil.example'
