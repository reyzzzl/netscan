id: redirect2-059
name: 'Open redirect2 via ref'
severity: medium
type: active
tags:
  - redirect
  - open-redirect
description: 'Unsafe redirect via ref'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      ref:
        - '/%09/evil.example'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil.example'
