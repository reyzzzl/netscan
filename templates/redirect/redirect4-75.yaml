id: redirect4-75
name: 'Allowlist trick in redirect'
severity: high
type: active
tags:
  - redirect
  - open-redirect
  - bypass
description: 'Bypasses trusted.com allowlist via redirect'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      redirect:
        - 'https://trusted.com%2e%2e/evil.example'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil.example'
