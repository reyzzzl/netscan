id: redirect6-523
name: 'Redirect sink in redirect'
severity: medium
type: active
tags:
  - redirect
  - open-redirect
description: 'Redirects to evil.example via redirect'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      redirect:
        - '/%0a/evil.example'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil.example'
