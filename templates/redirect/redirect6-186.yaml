id: redirect6-186
name: 'Redirect sink in from'
severity: medium
type: active
tags:
  - redirect
  - open-redirect
description: 'Redirects to evil.example via from'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      from:
        - 'https://evil.example./'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil.example'
