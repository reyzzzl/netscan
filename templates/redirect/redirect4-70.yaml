id: redirect4-70
name: 'Allowlist trick in return'
severity: high
type: active
tags:
  - redirect
  - open-redirect
  - bypass
description: 'Bypasses trusted.com allowlist via return'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      return:
        - 'https://trusted.com/?x=evil.example'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil.example'
