id: redirect3-006
name: 'Allowlist bypass via url'
severity: high
type: active
tags:
  - redirect
  - open-redirect
  - bypass
description: 'Bypasses trusted.com allowlist via url'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      url:
        - 'https://trusted.com%2f%2e%2e/evil.example'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil.example'
