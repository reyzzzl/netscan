id: redirect5-08
name: 'Scheme redirect in url'
severity: medium
type: active
tags:
  - redirect
  - open-redirect
  - scheme
description: 'Dangerous scheme via url'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      url:
        - 'javascript:void(alert(1))'
    matchers:
      - type: word
        part: headers
        words:
          - 'javascript:'
