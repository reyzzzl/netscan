id: redirect4-05
name: 'Allowlist trick in to'
severity: high
type: active
tags:
  - redirect
  - open-redirect
  - bypass
description: 'Bypasses trusted.com allowlist via to'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      to:
        - 'https://trusted.com%252f.evil.example/'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil.example'
