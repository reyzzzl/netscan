id: redirect4-45
name: 'Allowlist trick in redirect'
severity: high
type: active
tags:
  - redirect
  - open-redirect
  - bypass
description: 'Bypasses trusted.com allowlist via redirect'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      redirect:
        - 'https://trusted.com/%09/evil.example'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil.example'
