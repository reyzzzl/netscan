id: redirect6-351
name: 'Redirect sink in target'
severity: medium
type: active
tags:
  - redirect
  - open-redirect
description: 'Redirects to evil.example via target'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      target:
        - 'https://evilexample.com/'
    matchers:
      - type: word
        part: headers
        words:
          - 'evil.example'
