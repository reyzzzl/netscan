id: ssti4-handlebars-05
name: 'SSTI handlebars in v'
severity: critical
type: active
tags:
  - ssti
  - injection
  - handlebars
description: 'handlebars evaluates payload in v'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      v:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
