id: ssti4-smarty-10
name: 'SSTI smarty in text'
severity: critical
type: active
tags:
  - ssti
  - injection
  - smarty
description: 'smarty evaluates payload in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
