id: ssti3-cheetah-03
name: 'SSTI cheetah in comment'
severity: critical
type: active
tags:
  - ssti
  - injection
  - cheetah
description: 'cheetah evaluates payload in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '#echo 7*7'
    matchers:
      - type: word
        part: body
        words:
          - '49'
