id: ssti4-perl-23
name: 'SSTI perl in v'
severity: critical
type: active
tags:
  - ssti
  - injection
  - perl
description: 'perl evaluates payload in v'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      v:
        - '<% 7*7 %>'
    matchers:
      - type: word
        part: body
        words:
          - '49'
