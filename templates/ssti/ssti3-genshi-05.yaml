id: ssti3-genshi-05
name: 'SSTI genshi in desc'
severity: critical
type: active
tags:
  - ssti
  - injection
  - genshi
description: 'genshi evaluates payload in desc'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      desc:
        - '${7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
