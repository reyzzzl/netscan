id: ssti3-cheetah-06
name: 'SSTI cheetah in desc'
severity: critical
type: active
tags:
  - ssti
  - injection
  - cheetah
description: 'cheetah evaluates payload in desc'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      desc:
        - '#echo 7*7'
    matchers:
      - type: word
        part: body
        words:
          - '49'
