id: ssti2-erb-05
name: 'SSTI2 erb via body'
severity: critical
type: active
tags:
  - ssti
  - injection
  - erb
description: 'erb evaluates payload in body'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      body:
        - '<%= 7*7 %>'
    matchers:
      - type: word
        part: body
        words:
          - '49'
