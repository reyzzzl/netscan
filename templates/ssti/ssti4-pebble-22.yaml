id: ssti4-pebble-22
name: 'SSTI pebble in name'
severity: critical
type: active
tags:
  - ssti
  - injection
  - pebble
description: 'pebble evaluates payload in name'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
