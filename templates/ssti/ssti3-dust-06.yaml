id: ssti3-dust-06
name: 'SSTI dust in body'
severity: critical
type: active
tags:
  - ssti
  - injection
  - dust
description: 'dust evaluates payload in body'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      body:
        - '{7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
