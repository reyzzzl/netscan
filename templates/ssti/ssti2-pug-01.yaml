id: ssti2-pug-01
name: 'SSTI2 pug via body'
severity: critical
type: active
tags:
  - ssti
  - injection
  - pug
description: 'pug evaluates payload in body'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      body:
        - '#{7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
