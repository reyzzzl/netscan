id: ssti3-twig-02
name: 'SSTI twig in desc'
severity: critical
type: active
tags:
  - ssti
  - injection
  - twig
description: 'twig evaluates payload in desc'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      desc:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
