id: ssti4-razor-13
name: 'SSTI razor in p'
severity: critical
type: active
tags:
  - ssti
  - injection
  - razor
description: 'razor evaluates payload in p'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      p:
        - '@(7*7)'
    matchers:
      - type: word
        part: body
        words:
          - '49'
