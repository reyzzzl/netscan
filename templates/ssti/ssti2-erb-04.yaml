id: ssti2-erb-04
name: 'SSTI2 erb via bio'
severity: critical
type: active
tags:
  - ssti
  - injection
  - erb
description: 'erb evaluates payload in bio'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      bio:
        - '<%= 7*7 %>'
    matchers:
      - type: word
        part: body
        words:
          - '49'
