id: ssti-velocity-01
name: 'SSTI velocity via msg'
severity: critical
type: active
tags:
  - ssti
  - injection
  - velocity
description: 'velocity evaluates payload in msg'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      msg:
        - '#set($x=7*7)$x'
    matchers:
      - type: word
        part: body
        words:
          - '49'
