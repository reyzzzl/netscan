id: ssti2-pug-02
name: 'SSTI2 pug via text'
severity: critical
type: active
tags:
  - ssti
  - injection
  - pug
description: 'pug evaluates payload in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '#{7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
