id: ssti3-vue-05
name: 'SSTI vue in text'
severity: critical
type: active
tags:
  - ssti
  - injection
  - vue
description: 'vue evaluates payload in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
