id: ssti-post2-042
name: 'POST SSTI tornado in view'
severity: critical
type: active
tags:
  - ssti
  - injection
  - post
  - tornado
description: 'tornado evaluates POST body on /render'
requests:
  - method: POST
    path: '{{BaseURL}}/render'
    body: '{"view":"{{7*7}}"}'
    sendHeaders:
      Content-Type: 'application/json'
    matchers:
      - type: word
        part: body
        words:
          - '49'
