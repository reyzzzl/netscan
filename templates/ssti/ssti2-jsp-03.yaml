id: ssti2-jsp-03
name: 'SSTI2 jsp via desc'
severity: critical
type: active
tags:
  - ssti
  - injection
  - jsp
description: 'jsp evaluates payload in desc'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      desc:
        - '${7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
