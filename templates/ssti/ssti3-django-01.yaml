id: ssti3-django-01
name: 'SSTI django in body'
severity: critical
type: active
tags:
  - ssti
  - injection
  - django
description: 'django evaluates payload in body'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      body:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
