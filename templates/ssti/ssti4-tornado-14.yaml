id: ssti4-tornado-14
name: 'SSTI tornado in out'
severity: critical
type: active
tags:
  - ssti
  - injection
  - tornado
description: 'tornado evaluates payload in out'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      out:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
