id: ssti4-jsp-23
name: 'SSTI jsp in t'
severity: critical
type: active
tags:
  - ssti
  - injection
  - jsp
description: 'jsp evaluates payload in t'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      t:
        - '${7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
