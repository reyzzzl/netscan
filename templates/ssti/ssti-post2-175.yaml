id: ssti-post2-175
name: 'POST SSTI thymeleaf in text'
severity: critical
type: active
tags:
  - ssti
  - injection
  - post
  - thymeleaf
description: 'thymeleaf evaluates POST body on /render'
requests:
  - method: POST
    path: '{{BaseURL}}/render'
    body: '{"text":"{{7*7}}"}'
    sendHeaders:
      Content-Type: 'application/json'
    matchers:
      - type: word
        part: body
        words:
          - '49'
