id: ssti3-dust-05
name: 'SSTI dust in content'
severity: critical
type: active
tags:
  - ssti
  - injection
  - dust
description: 'dust evaluates payload in content'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      content:
        - '{7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
