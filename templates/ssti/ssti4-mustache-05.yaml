id: ssti4-mustache-05
name: 'SSTI mustache in y'
severity: critical
type: active
tags:
  - ssti
  - injection
  - mustache
description: 'mustache evaluates payload in y'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      y:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
