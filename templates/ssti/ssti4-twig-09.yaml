id: ssti4-twig-09
name: 'SSTI twig in d'
severity: critical
type: active
tags:
  - ssti
  - injection
  - twig
description: 'twig evaluates payload in d'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      d:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
