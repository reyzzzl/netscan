id: ssti4-handlebars-07
name: 'SSTI handlebars in partial'
severity: critical
type: active
tags:
  - ssti
  - injection
  - handlebars
description: 'handlebars evaluates payload in partial'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      partial:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
