id: ssti4-vue-03
name: 'SSTI vue in render'
severity: critical
type: active
tags:
  - ssti
  - injection
  - vue
description: 'vue evaluates payload in render'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      render:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
