id: ssti3-ejs-01
name: 'SSTI ejs in comment'
severity: critical
type: active
tags:
  - ssti
  - injection
  - ejs
description: 'ejs evaluates payload in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
