id: ssti4-django-06
name: 'SSTI django in z'
severity: critical
type: active
tags:
  - ssti
  - injection
  - django
description: 'django evaluates payload in z'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      z:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
