id: ssti4-velocity-10
name: 'SSTI velocity in p'
severity: critical
type: active
tags:
  - ssti
  - injection
  - velocity
description: 'velocity evaluates payload in p'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      p:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
