id: ssti3-marko-05
name: 'SSTI marko in body'
severity: critical
type: active
tags:
  - ssti
  - injection
  - marko
description: 'marko evaluates payload in body'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      body:
        - '${7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
