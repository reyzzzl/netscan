id: ssti3-mako-06
name: 'SSTI mako in body'
severity: critical
type: active
tags:
  - ssti
  - injection
  - mako
description: 'mako evaluates payload in body'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      body:
        - '${7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
