id: ssti3-jinja2-06
name: 'SSTI jinja2 in comment'
severity: critical
type: active
tags:
  - ssti
  - injection
  - jinja2
description: 'jinja2 evaluates payload in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
