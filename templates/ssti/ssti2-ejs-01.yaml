id: ssti2-ejs-01
name: 'SSTI2 ejs via content'
severity: critical
type: active
tags:
  - ssti
  - injection
  - ejs
description: 'ejs evaluates payload in content'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      content:
        - '<%= 7*7 %>'
    matchers:
      - type: word
        part: body
        words:
          - '49'
