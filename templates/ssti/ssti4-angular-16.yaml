id: ssti4-angular-16
name: 'SSTI angular in p'
severity: critical
type: active
tags:
  - ssti
  - injection
  - angular
description: 'angular evaluates payload in p'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      p:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
