id: ssti-post2-037
name: 'POST SSTI genshi in content'
severity: critical
type: active
tags:
  - ssti
  - injection
  - post
  - genshi
description: 'genshi evaluates POST body on /render'
requests:
  - method: POST
    path: '{{BaseURL}}/render'
    body: '{"content":"${7*7}"}'
    sendHeaders:
      Content-Type: 'application/json'
    matchers:
      - type: word
        part: body
        words:
          - '49'
