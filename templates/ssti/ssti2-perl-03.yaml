id: ssti2-perl-03
name: 'SSTI2 perl via msg2'
severity: critical
type: active
tags:
  - ssti
  - injection
  - perl
description: 'perl evaluates payload in msg2'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      msg2:
        - '<% 7*7 %>'
    matchers:
      - type: word
        part: body
        words:
          - '49'
