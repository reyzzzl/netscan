id: ssti-smarty-02
name: 'SSTI smarty via view'
severity: critical
type: active
tags:
  - ssti
  - injection
  - smarty
description: 'smarty evaluates payload in view'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      view:
        - '{7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
