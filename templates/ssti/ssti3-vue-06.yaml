id: ssti3-vue-06
name: 'SSTI vue in bio'
severity: critical
type: active
tags:
  - ssti
  - injection
  - vue
description: 'vue evaluates payload in bio'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      bio:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
