id: ssti2-jinja2-03
name: 'SSTI2 jinja2 via msg2'
severity: critical
type: active
tags:
  - ssti
  - injection
  - jinja2
description: 'jinja2 evaluates payload in msg2'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      msg2:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
