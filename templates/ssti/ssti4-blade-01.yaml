id: ssti4-blade-01
name: 'SSTI blade in layout'
severity: critical
type: active
tags:
  - ssti
  - injection
  - blade
description: 'blade evaluates payload in layout'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      layout:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
