id: ssti-post-037
name: 'POST SSTI perl in template'
severity: critical
type: active
tags:
  - ssti
  - injection
  - post
  - perl
description: 'perl evaluates POST body on /render'
requests:
  - method: POST
    path: '{{BaseURL}}/render'
    body: '{"template":"<% 7*7 %>"}'
    sendHeaders:
      Content-Type: 'application/json'
    matchers:
      - type: word
        part: body
        words:
          - '49'
