id: ssti-pug-01
name: 'SSTI pug via page'
severity: critical
type: active
tags:
  - ssti
  - injection
  - pug
description: 'pug evaluates payload in page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - '#{7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
