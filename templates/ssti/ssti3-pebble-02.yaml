id: ssti3-pebble-02
name: 'SSTI pebble in comment'
severity: critical
type: active
tags:
  - ssti
  - injection
  - pebble
description: 'pebble evaluates payload in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
