id: ssti4-cheetah-13
name: 'SSTI cheetah in v'
severity: critical
type: active
tags:
  - ssti
  - injection
  - cheetah
description: 'cheetah evaluates payload in v'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      v:
        - '#echo 7*7'
    matchers:
      - type: word
        part: body
        words:
          - '49'
