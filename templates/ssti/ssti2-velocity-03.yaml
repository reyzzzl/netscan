id: ssti2-velocity-03
name: 'SSTI2 velocity via desc'
severity: critical
type: active
tags:
  - ssti
  - injection
  - velocity
description: 'velocity evaluates payload in desc'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      desc:
        - '#set($x=7*7)$x'
    matchers:
      - type: word
        part: body
        words:
          - '49'
