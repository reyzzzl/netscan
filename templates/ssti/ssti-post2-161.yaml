id: ssti-post2-161
name: 'POST SSTI flask in template'
severity: critical
type: active
tags:
  - ssti
  - injection
  - post
  - flask
description: 'flask evaluates POST body on /render'
requests:
  - method: POST
    path: '{{BaseURL}}/render'
    body: '{"template":"{{7*7}}"}'
    sendHeaders:
      Content-Type: 'application/json'
    matchers:
      - type: word
        part: body
        words:
          - '49'
