id: ssti4-perl-06
name: 'SSTI perl in msg'
severity: critical
type: active
tags:
  - ssti
  - injection
  - perl
description: 'perl evaluates payload in msg'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      msg:
        - '<% 7*7 %>'
    matchers:
      - type: word
        part: body
        words:
          - '49'
