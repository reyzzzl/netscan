id: ssti3-dust-04
name: 'SSTI dust in comment'
severity: critical
type: active
tags:
  - ssti
  - injection
  - dust
description: 'dust evaluates payload in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '{7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
