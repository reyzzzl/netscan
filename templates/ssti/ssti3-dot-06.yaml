id: ssti3-dot-06
name: 'SSTI dot in content'
severity: critical
type: active
tags:
  - ssti
  - injection
  - dot
description: 'dot evaluates payload in content'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      content:
        - '{{=7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
