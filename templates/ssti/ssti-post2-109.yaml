id: ssti-post2-109
name: 'POST SSTI smarty in content'
severity: critical
type: active
tags:
  - ssti
  - injection
  - post
  - smarty
description: 'smarty evaluates POST body on /render'
requests:
  - method: POST
    path: '{{BaseURL}}/render'
    body: '{"content":"{{7*7}}"}'
    sendHeaders:
      Content-Type: 'application/json'
    matchers:
      - type: word
        part: body
        words:
          - '49'
