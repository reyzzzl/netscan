id: ssti3-dot-01
name: 'SSTI dot in body'
severity: critical
type: active
tags:
  - ssti
  - injection
  - dot
description: 'dot evaluates payload in body'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      body:
        - '{{=7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
