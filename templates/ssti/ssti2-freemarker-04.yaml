id: ssti2-freemarker-04
name: 'SSTI2 freemarker via text'
severity: critical
type: active
tags:
  - ssti
  - injection
  - freemarker
description: 'freemarker evaluates payload in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '${7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
