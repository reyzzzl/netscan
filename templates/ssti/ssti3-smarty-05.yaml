id: ssti3-smarty-05
name: 'SSTI smarty in comment'
severity: critical
type: active
tags:
  - ssti
  - injection
  - smarty
description: 'smarty evaluates payload in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
