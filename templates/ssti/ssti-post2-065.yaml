id: ssti-post2-065
name: 'POST SSTI dust in template'
severity: critical
type: active
tags:
  - ssti
  - injection
  - post
  - dust
description: 'dust evaluates POST body on /render'
requests:
  - method: POST
    path: '{{BaseURL}}/render'
    body: '{"template":"{7*7}"}'
    sendHeaders:
      Content-Type: 'application/json'
    matchers:
      - type: word
        part: body
        words:
          - '49'
