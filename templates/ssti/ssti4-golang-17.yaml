id: ssti4-golang-17
name: 'SSTI golang in desc'
severity: critical
type: active
tags:
  - ssti
  - injection
  - golang
description: 'golang evaluates payload in desc'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      desc:
        - '{{.7}}'
    matchers:
      - type: word
        part: body
        words:
          - '7'
