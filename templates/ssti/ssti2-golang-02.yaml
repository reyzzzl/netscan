id: ssti2-golang-02
name: 'SSTI2 golang via body'
severity: critical
type: active
tags:
  - ssti
  - injection
  - golang
description: 'golang evaluates payload in body'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      body:
        - '{{.7}}'
    matchers:
      - type: word
        part: body
        words:
          - '7'
