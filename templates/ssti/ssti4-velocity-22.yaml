id: ssti4-velocity-22
name: 'SSTI velocity in out'
severity: critical
type: active
tags:
  - ssti
  - injection
  - velocity
description: 'velocity evaluates payload in out'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      out:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
