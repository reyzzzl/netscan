id: ssti2-handlebars-01
name: 'SSTI2 handlebars via body'
severity: critical
type: active
tags:
  - ssti
  - injection
  - handlebars
description: 'handlebars evaluates payload in body'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      body:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
