id: ssti3-blade-06
name: 'SSTI blade in comment'
severity: critical
type: active
tags:
  - ssti
  - injection
  - blade
description: 'blade evaluates payload in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
