id: ssti4-dot-18
name: 'SSTI dot in x'
severity: critical
type: active
tags:
  - ssti
  - injection
  - dot
description: 'dot evaluates payload in x'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      x:
        - '{{=7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
