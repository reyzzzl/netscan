id: ssti4-jsp-24
name: 'SSTI jsp in d'
severity: critical
type: active
tags:
  - ssti
  - injection
  - jsp
description: 'jsp evaluates payload in d'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      d:
        - '${7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
