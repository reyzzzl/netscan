id: ssti4-jsp-12
name: 'SSTI jsp in body'
severity: critical
type: active
tags:
  - ssti
  - injection
  - jsp
description: 'jsp evaluates payload in body'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      body:
        - '${7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
