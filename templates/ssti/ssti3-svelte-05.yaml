id: ssti3-svelte-05
name: 'SSTI svelte in bio'
severity: critical
type: active
tags:
  - ssti
  - injection
  - svelte
description: 'svelte evaluates payload in bio'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      bio:
        - '{7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
