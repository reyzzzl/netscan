id: ssti4-freemarker-03
name: 'SSTI freemarker in layout'
severity: critical
type: active
tags:
  - ssti
  - injection
  - freemarker
description: 'freemarker evaluates payload in layout'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      layout:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
