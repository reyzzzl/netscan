id: ssti4-blade-17
name: 'SSTI blade in page'
severity: critical
type: active
tags:
  - ssti
  - injection
  - blade
description: 'blade evaluates payload in page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
