id: ssti4-flask-06
name: 'SSTI flask in out'
severity: critical
type: active
tags:
  - ssti
  - injection
  - flask
description: 'flask evaluates payload in out'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      out:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
