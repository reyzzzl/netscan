id: ssti3-marko-04
name: 'SSTI marko in content'
severity: critical
type: active
tags:
  - ssti
  - injection
  - marko
description: 'marko evaluates payload in content'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      content:
        - '${7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
