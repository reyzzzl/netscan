id: ssti4-nunjucks-03
name: 'SSTI nunjucks in d'
severity: critical
type: active
tags:
  - ssti
  - injection
  - nunjucks
description: 'nunjucks evaluates payload in d'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      d:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
