id: ssti4-marko-06
name: 'SSTI marko in bio'
severity: critical
type: active
tags:
  - ssti
  - injection
  - marko
description: 'marko evaluates payload in bio'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      bio:
        - '${7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
