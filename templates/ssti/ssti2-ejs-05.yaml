id: ssti2-ejs-05
name: 'SSTI2 ejs via desc'
severity: critical
type: active
tags:
  - ssti
  - injection
  - ejs
description: 'ejs evaluates payload in desc'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      desc:
        - '<%= 7*7 %>'
    matchers:
      - type: word
        part: body
        words:
          - '49'
