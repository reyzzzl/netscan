id: ssti4-dust-17
name: 'SSTI dust in v'
severity: critical
type: active
tags:
  - ssti
  - injection
  - dust
description: 'dust evaluates payload in v'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      v:
        - '{7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
