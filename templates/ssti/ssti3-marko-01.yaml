id: ssti3-marko-01
name: 'SSTI marko in text'
severity: critical
type: active
tags:
  - ssti
  - injection
  - marko
description: 'marko evaluates payload in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '${7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
