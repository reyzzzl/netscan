id: ssti-post2-100
name: 'POST SSTI svelte in msg'
severity: critical
type: active
tags:
  - ssti
  - injection
  - post
  - svelte
description: 'svelte evaluates POST body on /render'
requests:
  - method: POST
    path: '{{BaseURL}}/render'
    body: '{"msg":"{7*7}"}'
    sendHeaders:
      Content-Type: 'application/json'
    matchers:
      - type: word
        part: body
        words:
          - '49'
