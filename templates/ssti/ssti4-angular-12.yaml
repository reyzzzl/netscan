id: ssti4-angular-12
name: 'SSTI angular in c'
severity: critical
type: active
tags:
  - ssti
  - injection
  - angular
description: 'angular evaluates payload in c'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      c:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
