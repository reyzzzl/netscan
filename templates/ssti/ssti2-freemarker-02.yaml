id: ssti2-freemarker-02
name: 'SSTI2 freemarker via bio'
severity: critical
type: active
tags:
  - ssti
  - injection
  - freemarker
description: 'freemarker evaluates payload in bio'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      bio:
        - '${7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
