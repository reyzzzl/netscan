id: ssti4-pebble-15
name: 'SSTI pebble in x'
severity: critical
type: active
tags:
  - ssti
  - injection
  - pebble
description: 'pebble evaluates payload in x'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      x:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
