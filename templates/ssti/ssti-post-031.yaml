id: ssti-post-031
name: 'POST SSTI razor in template'
severity: critical
type: active
tags:
  - ssti
  - injection
  - post
  - razor
description: 'razor evaluates POST body on /render'
requests:
  - method: POST
    path: '{{BaseURL}}/render'
    body: '{"template":"@(7*7)"}'
    sendHeaders:
      Content-Type: 'application/json'
    matchers:
      - type: word
        part: body
        words:
          - '49'
