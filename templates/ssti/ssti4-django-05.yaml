id: ssti4-django-05
name: 'SSTI django in b'
severity: critical
type: active
tags:
  - ssti
  - injection
  - django
description: 'django evaluates payload in b'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      b:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
