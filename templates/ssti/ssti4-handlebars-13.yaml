id: ssti4-handlebars-13
name: 'SSTI handlebars in msg'
severity: critical
type: active
tags:
  - ssti
  - injection
  - handlebars
description: 'handlebars evaluates payload in msg'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      msg:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
