id: ssti4-genshi-25
name: 'SSTI genshi in layout'
severity: critical
type: active
tags:
  - ssti
  - injection
  - genshi
description: 'genshi evaluates payload in layout'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      layout:
        - '${7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
