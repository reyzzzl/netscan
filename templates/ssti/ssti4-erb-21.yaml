id: ssti4-erb-21
name: 'SSTI erb in d'
severity: critical
type: active
tags:
  - ssti
  - injection
  - erb
description: 'erb evaluates payload in d'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      d:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
