id: ssti3-pebble-01
name: 'SSTI pebble in bio'
severity: critical
type: active
tags:
  - ssti
  - injection
  - pebble
description: 'pebble evaluates payload in bio'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      bio:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
