id: ssti2-smarty-01
name: 'SSTI2 smarty via desc'
severity: critical
type: active
tags:
  - ssti
  - injection
  - smarty
description: 'smarty evaluates payload in desc'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      desc:
        - '{7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
