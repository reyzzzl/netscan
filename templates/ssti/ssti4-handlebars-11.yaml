id: ssti4-handlebars-11
name: 'SSTI handlebars in y'
severity: critical
type: active
tags:
  - ssti
  - injection
  - handlebars
description: 'handlebars evaluates payload in y'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      y:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
