id: ssti3-handlebars-06
name: 'SSTI handlebars in comment'
severity: critical
type: active
tags:
  - ssti
  - injection
  - handlebars
description: 'handlebars evaluates payload in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
