id: ssti4-thymeleaf-16
name: 'SSTI thymeleaf in render'
severity: critical
type: active
tags:
  - ssti
  - injection
  - thymeleaf
description: 'thymeleaf evaluates payload in render'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      render:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
