id: ssti3-flask-06
name: 'SSTI flask in body'
severity: critical
type: active
tags:
  - ssti
  - injection
  - flask
description: 'flask evaluates payload in body'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      body:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
