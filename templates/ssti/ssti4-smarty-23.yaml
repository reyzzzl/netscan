id: ssti4-smarty-23
name: 'SSTI smarty in partial'
severity: critical
type: active
tags:
  - ssti
  - injection
  - smarty
description: 'smarty evaluates payload in partial'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      partial:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
