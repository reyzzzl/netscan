id: ssti-post-039
name: 'POST SSTI cheetah in template'
severity: critical
type: active
tags:
  - ssti
  - injection
  - post
  - cheetah
description: 'cheetah evaluates POST body on /render'
requests:
  - method: POST
    path: '{{BaseURL}}/render'
    body: '{"template":"#echo 7*7"}'
    sendHeaders:
      Content-Type: 'application/json'
    matchers:
      - type: word
        part: body
        words:
          - '49'
