id: ssti4-tornado-12
name: 'SSTI tornado in p'
severity: critical
type: active
tags:
  - ssti
  - injection
  - tornado
description: 'tornado evaluates payload in p'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      p:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
