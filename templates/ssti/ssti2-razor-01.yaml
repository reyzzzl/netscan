id: ssti2-razor-01
name: 'SSTI2 razor via text'
severity: critical
type: active
tags:
  - ssti
  - injection
  - razor
description: 'razor evaluates payload in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '@(7*7)'
    matchers:
      - type: word
        part: body
        words:
          - '49'
