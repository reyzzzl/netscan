id: ssti-django-02
name: 'SSTI django via page'
severity: critical
type: active
tags:
  - ssti
  - injection
  - django
description: 'django evaluates payload in page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
