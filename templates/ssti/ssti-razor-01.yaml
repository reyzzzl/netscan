id: ssti-razor-01
name: 'SSTI razor via template'
severity: critical
type: active
tags:
  - ssti
  - injection
  - razor
description: 'razor evaluates payload in template'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      template:
        - '@(7*7)'
    matchers:
      - type: word
        part: body
        words:
          - '49'
