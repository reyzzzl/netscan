id: ssti4-marko-25
name: 'SSTI marko in page'
severity: critical
type: active
tags:
  - ssti
  - injection
  - marko
description: 'marko evaluates payload in page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - '${7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
