id: ssti3-erb-05
name: 'SSTI erb in desc'
severity: critical
type: active
tags:
  - ssti
  - injection
  - erb
description: 'erb evaluates payload in desc'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      desc:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
