id: ssti3-velocity-06
name: 'SSTI velocity in desc'
severity: critical
type: active
tags:
  - ssti
  - injection
  - velocity
description: 'velocity evaluates payload in desc'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      desc:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
