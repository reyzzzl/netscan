id: ssti3-freemarker-06
name: 'SSTI freemarker in body'
severity: critical
type: active
tags:
  - ssti
  - injection
  - freemarker
description: 'freemarker evaluates payload in body'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      body:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
