id: ssti-post2-149
name: 'POST SSTI handlebars in content'
severity: critical
type: active
tags:
  - ssti
  - injection
  - post
  - handlebars
description: 'handlebars evaluates POST body on /render'
requests:
  - method: POST
    path: '{{BaseURL}}/render'
    body: '{"content":"{{7*7}}"}'
    sendHeaders:
      Content-Type: 'application/json'
    matchers:
      - type: word
        part: body
        words:
          - '49'
