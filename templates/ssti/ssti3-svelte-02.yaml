id: ssti3-svelte-02
name: 'SSTI svelte in body'
severity: critical
type: active
tags:
  - ssti
  - injection
  - svelte
description: 'svelte evaluates payload in body'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      body:
        - '{7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
