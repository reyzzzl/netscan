id: ssti4-mako-04
name: 'SSTI mako in x'
severity: critical
type: active
tags:
  - ssti
  - injection
  - mako
description: 'mako evaluates payload in x'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      x:
        - '${7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
