id: ssti2-mustache-03
name: 'SSTI2 mustache via msg2'
severity: critical
type: active
tags:
  - ssti
  - injection
  - mustache
description: 'mustache evaluates payload in msg2'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      msg2:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
