id: ssti3-dot-05
name: 'SSTI dot in comment'
severity: critical
type: active
tags:
  - ssti
  - injection
  - dot
description: 'dot evaluates payload in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '{{=7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
