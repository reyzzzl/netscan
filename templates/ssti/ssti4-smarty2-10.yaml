id: ssti4-smarty2-10
name: 'SSTI smarty2 in layout'
severity: critical
type: active
tags:
  - ssti
  - injection
  - smarty2
description: 'smarty2 evaluates payload in layout'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      layout:
        - '{$x=7*7}{$x}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
