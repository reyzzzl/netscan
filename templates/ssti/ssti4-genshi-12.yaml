id: ssti4-genshi-12
name: 'SSTI genshi in bio'
severity: critical
type: active
tags:
  - ssti
  - injection
  - genshi
description: 'genshi evaluates payload in bio'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      bio:
        - '${7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
