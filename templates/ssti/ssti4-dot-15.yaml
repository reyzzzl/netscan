id: ssti4-dot-15
name: 'SSTI dot in name'
severity: critical
type: active
tags:
  - ssti
  - injection
  - dot
description: 'dot evaluates payload in name'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - '{{=7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
