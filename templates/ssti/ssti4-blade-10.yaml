id: ssti4-blade-10
name: 'SSTI blade in z'
severity: critical
type: active
tags:
  - ssti
  - injection
  - blade
description: 'blade evaluates payload in z'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      z:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
