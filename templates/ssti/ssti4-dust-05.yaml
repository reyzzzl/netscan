id: ssti4-dust-05
name: 'SSTI dust in msg'
severity: critical
type: active
tags:
  - ssti
  - injection
  - dust
description: 'dust evaluates payload in msg'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      msg:
        - '{7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
