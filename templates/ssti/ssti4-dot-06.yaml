id: ssti4-dot-06
name: 'SSTI dot in desc'
severity: critical
type: active
tags:
  - ssti
  - injection
  - dot
description: 'dot evaluates payload in desc'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      desc:
        - '{{=7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
