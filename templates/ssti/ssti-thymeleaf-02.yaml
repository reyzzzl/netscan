id: ssti-thymeleaf-02
name: 'SSTI thymeleaf via name'
severity: critical
type: active
tags:
  - ssti
  - injection
  - thymeleaf
description: 'thymeleaf evaluates payload in name'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - '${7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
