id: ssti2-erb-03
name: 'SSTI2 erb via text'
severity: critical
type: active
tags:
  - ssti
  - injection
  - erb
description: 'erb evaluates payload in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '<%= 7*7 %>'
    matchers:
      - type: word
        part: body
        words:
          - '49'
