id: ssti2-blade-03
name: 'SSTI2 blade via content'
severity: critical
type: active
tags:
  - ssti
  - injection
  - blade
description: 'blade evaluates payload in content'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      content:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
