id: ssti3-mako-02
name: 'SSTI mako in text'
severity: critical
type: active
tags:
  - ssti
  - injection
  - mako
description: 'mako evaluates payload in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '${7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
