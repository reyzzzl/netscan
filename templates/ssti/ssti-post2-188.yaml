id: ssti-post2-188
name: 'POST SSTI mustache in msg'
severity: critical
type: active
tags:
  - ssti
  - injection
  - post
  - mustache
description: 'mustache evaluates POST body on /render'
requests:
  - method: POST
    path: '{{BaseURL}}/render'
    body: '{"msg":"{{7*7}}"}'
    sendHeaders:
      Content-Type: 'application/json'
    matchers:
      - type: word
        part: body
        words:
          - '49'
