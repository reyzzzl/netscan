id: ssti4-tornado-03
name: 'SSTI tornado in c'
severity: critical
type: active
tags:
  - ssti
  - injection
  - tornado
description: 'tornado evaluates payload in c'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      c:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
