id: ssti4-angular-10
name: 'SSTI angular in content'
severity: critical
type: active
tags:
  - ssti
  - injection
  - angular
description: 'angular evaluates payload in content'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      content:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
