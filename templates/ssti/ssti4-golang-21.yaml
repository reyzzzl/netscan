id: ssti4-golang-21
name: 'SSTI golang in name'
severity: critical
type: active
tags:
  - ssti
  - injection
  - golang
description: 'golang evaluates payload in name'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - '{{.7}}'
    matchers:
      - type: word
        part: body
        words:
          - '7'
