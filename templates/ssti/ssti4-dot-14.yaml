id: ssti4-dot-14
name: 'SSTI dot in tpl'
severity: critical
type: active
tags:
  - ssti
  - injection
  - dot
description: 'dot evaluates payload in tpl'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      tpl:
        - '{{=7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
