id: ssti3-genshi-04
name: 'SSTI genshi in body'
severity: critical
type: active
tags:
  - ssti
  - injection
  - genshi
description: 'genshi evaluates payload in body'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      body:
        - '${7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
