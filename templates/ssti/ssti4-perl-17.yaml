id: ssti4-perl-17
name: 'SSTI perl in text'
severity: critical
type: active
tags:
  - ssti
  - injection
  - perl
description: 'perl evaluates payload in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '<% 7*7 %>'
    matchers:
      - type: word
        part: body
        words:
          - '49'
