id: ssti2-thymeleaf-02
name: 'SSTI2 thymeleaf via content'
severity: critical
type: active
tags:
  - ssti
  - injection
  - thymeleaf
description: 'thymeleaf evaluates payload in content'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      content:
        - '${7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
