id: ssti3-dust-03
name: 'SSTI dust in bio'
severity: critical
type: active
tags:
  - ssti
  - injection
  - dust
description: 'dust evaluates payload in bio'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      bio:
        - '{7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
