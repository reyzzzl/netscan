id: ssti4-mustache-04
name: 'SSTI mustache in v'
severity: critical
type: active
tags:
  - ssti
  - injection
  - mustache
description: 'mustache evaluates payload in v'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      v:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
