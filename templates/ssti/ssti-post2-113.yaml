id: ssti-post2-113
name: 'POST SSTI freemarker in template'
severity: critical
type: active
tags:
  - ssti
  - injection
  - post
  - freemarker
description: 'freemarker evaluates POST body on /render'
requests:
  - method: POST
    path: '{{BaseURL}}/render'
    body: '{"template":"{{7*7}}"}'
    sendHeaders:
      Content-Type: 'application/json'
    matchers:
      - type: word
        part: body
        words:
          - '49'
