id: ssti4-twig-11
name: 'SSTI twig in view'
severity: critical
type: active
tags:
  - ssti
  - injection
  - twig
description: 'twig evaluates payload in view'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      view:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
