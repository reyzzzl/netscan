id: ssti-post2-073
name: 'POST SSTI marko in template'
severity: critical
type: active
tags:
  - ssti
  - injection
  - post
  - marko
description: 'marko evaluates POST body on /render'
requests:
  - method: POST
    path: '{{BaseURL}}/render'
    body: '{"template":"${7*7}"}'
    sendHeaders:
      Content-Type: 'application/json'
    matchers:
      - type: word
        part: body
        words:
          - '49'
