id: ssti4-twig-10
name: 'SSTI twig in render'
severity: critical
type: active
tags:
  - ssti
  - injection
  - twig
description: 'twig evaluates payload in render'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      render:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
