id: ssti4-cheetah-15
name: 'SSTI cheetah in partial'
severity: critical
type: active
tags:
  - ssti
  - injection
  - cheetah
description: 'cheetah evaluates payload in partial'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      partial:
        - '#echo 7*7'
    matchers:
      - type: word
        part: body
        words:
          - '49'
