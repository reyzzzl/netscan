id: ssti3-nunjucks-04
name: 'SSTI nunjucks in text'
severity: critical
type: active
tags:
  - ssti
  - injection
  - nunjucks
description: 'nunjucks evaluates payload in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
