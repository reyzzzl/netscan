id: ssti2-twig-03
name: 'SSTI2 twig via bio'
severity: critical
type: active
tags:
  - ssti
  - injection
  - twig
description: 'twig evaluates payload in bio'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      bio:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
