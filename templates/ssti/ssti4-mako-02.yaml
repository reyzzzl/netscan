id: ssti4-mako-02
name: 'SSTI mako in desc'
severity: critical
type: active
tags:
  - ssti
  - injection
  - mako
description: 'mako evaluates payload in desc'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      desc:
        - '${7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
