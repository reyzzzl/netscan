id: ssti4-smarty-24
name: 'SSTI smarty in msg'
severity: critical
type: active
tags:
  - ssti
  - injection
  - smarty
description: 'smarty evaluates payload in msg'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      msg:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
