id: ssti2-thymeleaf-01
name: 'SSTI2 thymeleaf via msg2'
severity: critical
type: active
tags:
  - ssti
  - injection
  - thymeleaf
description: 'thymeleaf evaluates payload in msg2'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      msg2:
        - '${7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
