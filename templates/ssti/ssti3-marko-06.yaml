id: ssti3-marko-06
name: 'SSTI marko in desc'
severity: critical
type: active
tags:
  - ssti
  - injection
  - marko
description: 'marko evaluates payload in desc'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      desc:
        - '${7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
