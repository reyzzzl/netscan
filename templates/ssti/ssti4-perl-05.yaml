id: ssti4-perl-05
name: 'SSTI perl in partial'
severity: critical
type: active
tags:
  - ssti
  - injection
  - perl
description: 'perl evaluates payload in partial'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      partial:
        - '<% 7*7 %>'
    matchers:
      - type: word
        part: body
        words:
          - '49'
