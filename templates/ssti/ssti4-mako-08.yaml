id: ssti4-mako-08
name: 'SSTI mako in m'
severity: critical
type: active
tags:
  - ssti
  - injection
  - mako
description: 'mako evaluates payload in m'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      m:
        - '${7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
