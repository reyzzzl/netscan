id: ssti4-mako-05
name: 'SSTI mako in tpl'
severity: critical
type: active
tags:
  - ssti
  - injection
  - mako
description: 'mako evaluates payload in tpl'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      tpl:
        - '${7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
