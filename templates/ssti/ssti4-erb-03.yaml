id: ssti4-erb-03
name: 'SSTI erb in view'
severity: critical
type: active
tags:
  - ssti
  - injection
  - erb
description: 'erb evaluates payload in view'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      view:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
