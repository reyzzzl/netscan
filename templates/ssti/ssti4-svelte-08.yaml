id: ssti4-svelte-08
name: 'SSTI svelte in tpl'
severity: critical
type: active
tags:
  - ssti
  - injection
  - svelte
description: 'svelte evaluates payload in tpl'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      tpl:
        - '{7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
