id: ssti3-tornado-06
name: 'SSTI tornado in bio'
severity: critical
type: active
tags:
  - ssti
  - injection
  - tornado
description: 'tornado evaluates payload in bio'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      bio:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
