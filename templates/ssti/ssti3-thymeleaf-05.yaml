id: ssti3-thymeleaf-05
name: 'SSTI thymeleaf in body'
severity: critical
type: active
tags:
  - ssti
  - injection
  - thymeleaf
description: 'thymeleaf evaluates payload in body'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      body:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
