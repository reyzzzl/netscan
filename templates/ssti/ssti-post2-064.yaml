id: ssti-post2-064
name: 'POST SSTI dot in data'
severity: critical
type: active
tags:
  - ssti
  - injection
  - post
  - dot
description: 'dot evaluates POST body on /render'
requests:
  - method: POST
    path: '{{BaseURL}}/render'
    body: '{"data":"{{=7*7}}"}'
    sendHeaders:
      Content-Type: 'application/json'
    matchers:
      - type: word
        part: body
        words:
          - '49'
