id: ssti4-genshi-11
name: 'SSTI genshi in page'
severity: critical
type: active
tags:
  - ssti
  - injection
  - genshi
description: 'genshi evaluates payload in page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - '${7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
