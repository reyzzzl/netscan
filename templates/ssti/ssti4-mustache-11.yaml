id: ssti4-mustache-11
name: 'SSTI mustache in partial'
severity: critical
type: active
tags:
  - ssti
  - injection
  - mustache
description: 'mustache evaluates payload in partial'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      partial:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
