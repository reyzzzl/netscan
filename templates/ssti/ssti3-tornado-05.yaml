id: ssti3-tornado-05
name: 'SSTI tornado in text'
severity: critical
type: active
tags:
  - ssti
  - injection
  - tornado
description: 'tornado evaluates payload in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
