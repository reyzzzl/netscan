id: ssti-post2-049
name: 'POST SSTI nunjucks in template'
severity: critical
type: active
tags:
  - ssti
  - injection
  - post
  - nunjucks
description: 'nunjucks evaluates POST body on /render'
requests:
  - method: POST
    path: '{{BaseURL}}/render'
    body: '{"template":"{{7*7}}"}'
    sendHeaders:
      Content-Type: 'application/json'
    matchers:
      - type: word
        part: body
        words:
          - '49'
