id: ssti4-marko-13
name: 'SSTI marko in z'
severity: critical
type: active
tags:
  - ssti
  - injection
  - marko
description: 'marko evaluates payload in z'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      z:
        - '${7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
