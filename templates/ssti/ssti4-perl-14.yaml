id: ssti4-perl-14
name: 'SSTI perl in y'
severity: critical
type: active
tags:
  - ssti
  - injection
  - perl
description: 'perl evaluates payload in y'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      y:
        - '<% 7*7 %>'
    matchers:
      - type: word
        part: body
        words:
          - '49'
