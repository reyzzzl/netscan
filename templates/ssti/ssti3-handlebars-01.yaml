id: ssti3-handlebars-01
name: 'SSTI handlebars in content'
severity: critical
type: active
tags:
  - ssti
  - injection
  - handlebars
description: 'handlebars evaluates payload in content'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      content:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
