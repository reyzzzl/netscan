id: ssti4-erb-25
name: 'SSTI erb in t'
severity: critical
type: active
tags:
  - ssti
  - injection
  - erb
description: 'erb evaluates payload in t'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      t:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
