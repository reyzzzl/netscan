id: ssti2-jsp-04
name: 'SSTI2 jsp via msg2'
severity: critical
type: active
tags:
  - ssti
  - injection
  - jsp
description: 'jsp evaluates payload in msg2'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      msg2:
        - '${7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
