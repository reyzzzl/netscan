id: ssti3-nunjucks-01
name: 'SSTI nunjucks in content'
severity: critical
type: active
tags:
  - ssti
  - injection
  - nunjucks
description: 'nunjucks evaluates payload in content'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      content:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
