id: ssti-erb-03
name: 'SSTI erb via name'
severity: critical
type: active
tags:
  - ssti
  - injection
  - erb
description: 'erb evaluates payload in name'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - '<%= 7*7 %>'
    matchers:
      - type: word
        part: body
        words:
          - '49'
