id: ssti3-angular-02
name: 'SSTI angular in comment'
severity: critical
type: active
tags:
  - ssti
  - injection
  - angular
description: 'angular evaluates payload in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
