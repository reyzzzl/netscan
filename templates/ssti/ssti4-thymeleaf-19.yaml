id: ssti4-thymeleaf-19
name: 'SSTI thymeleaf in t'
severity: critical
type: active
tags:
  - ssti
  - injection
  - thymeleaf
description: 'thymeleaf evaluates payload in t'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      t:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
