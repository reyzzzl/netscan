id: ssti3-svelte-01
name: 'SSTI svelte in content'
severity: critical
type: active
tags:
  - ssti
  - injection
  - svelte
description: 'svelte evaluates payload in content'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      content:
        - '{7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
