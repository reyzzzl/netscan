id: ssti4-ejs-22
name: 'SSTI ejs in tpl'
severity: critical
type: active
tags:
  - ssti
  - injection
  - ejs
description: 'ejs evaluates payload in tpl'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      tpl:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
