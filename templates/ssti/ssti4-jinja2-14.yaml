id: ssti4-jinja2-14
name: 'SSTI jinja2 in c'
severity: critical
type: active
tags:
  - ssti
  - injection
  - jinja2
description: 'jinja2 evaluates payload in c'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      c:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
