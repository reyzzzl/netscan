id: ssti-post-036
name: 'POST SSTI golang in view'
severity: critical
type: active
tags:
  - ssti
  - injection
  - post
  - golang
description: 'golang evaluates POST body on /render'
requests:
  - method: POST
    path: '{{BaseURL}}/render'
    body: '{"view":"{{.7}}"}'
    sendHeaders:
      Content-Type: 'application/json'
    matchers:
      - type: word
        part: body
        words:
          - '7'
