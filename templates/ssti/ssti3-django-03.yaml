id: ssti3-django-03
name: 'SSTI django in text'
severity: critical
type: active
tags:
  - ssti
  - injection
  - django
description: 'django evaluates payload in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
