id: ssti4-flask-20
name: 'SSTI flask in c'
severity: critical
type: active
tags:
  - ssti
  - injection
  - flask
description: 'flask evaluates payload in c'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      c:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
