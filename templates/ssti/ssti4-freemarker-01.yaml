id: ssti4-freemarker-01
name: 'SSTI freemarker in b'
severity: critical
type: active
tags:
  - ssti
  - injection
  - freemarker
description: 'freemarker evaluates payload in b'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      b:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
