id: ssti2-smarty2-03
name: 'SSTI2 smarty2 via bio'
severity: critical
type: active
tags:
  - ssti
  - injection
  - smarty2
description: 'smarty2 evaluates payload in bio'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      bio:
        - '{$x=7*7}{$x}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
