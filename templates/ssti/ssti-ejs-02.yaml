id: ssti-ejs-02
name: 'SSTI ejs via template'
severity: critical
type: active
tags:
  - ssti
  - injection
  - ejs
description: 'ejs evaluates payload in template'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      template:
        - '<%= 7*7 %>'
    matchers:
      - type: word
        part: body
        words:
          - '49'
