id: ssti4-jsp-25
name: 'SSTI jsp in render'
severity: critical
type: active
tags:
  - ssti
  - injection
  - jsp
description: 'jsp evaluates payload in render'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      render:
        - '${7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
