id: ssti3-mako-05
name: 'SSTI mako in content'
severity: critical
type: active
tags:
  - ssti
  - injection
  - mako
description: 'mako evaluates payload in content'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      content:
        - '${7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
