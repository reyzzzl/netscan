id: ssti3-cheetah-01
name: 'SSTI cheetah in text'
severity: critical
type: active
tags:
  - ssti
  - injection
  - cheetah
description: 'cheetah evaluates payload in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '#echo 7*7'
    matchers:
      - type: word
        part: body
        words:
          - '49'
