id: ssti3-django-05
name: 'SSTI django in comment'
severity: critical
type: active
tags:
  - ssti
  - injection
  - django
description: 'django evaluates payload in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
