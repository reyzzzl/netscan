id: ssti2-smarty-03
name: 'SSTI2 smarty via content'
severity: critical
type: active
tags:
  - ssti
  - injection
  - smarty
description: 'smarty evaluates payload in content'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      content:
        - '{7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
