id: ssti3-smarty-04
name: 'SSTI smarty in bio'
severity: critical
type: active
tags:
  - ssti
  - injection
  - smarty
description: 'smarty evaluates payload in bio'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      bio:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
