id: ssti-post2-085
name: 'POST SSTI angular in content'
severity: critical
type: active
tags:
  - ssti
  - injection
  - post
  - angular
description: 'angular evaluates POST body on /render'
requests:
  - method: POST
    path: '{{BaseURL}}/render'
    body: '{"content":"{{7*7}}"}'
    sendHeaders:
      Content-Type: 'application/json'
    matchers:
      - type: word
        part: body
        words:
          - '49'
