id: ssti4-ejs-23
name: 'SSTI ejs in name'
severity: critical
type: active
tags:
  - ssti
  - injection
  - ejs
description: 'ejs evaluates payload in name'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      name:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
