id: ssti4-freemarker-07
name: 'SSTI freemarker in z'
severity: critical
type: active
tags:
  - ssti
  - injection
  - freemarker
description: 'freemarker evaluates payload in z'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      z:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
