id: ssti-golang-01
name: 'SSTI golang via page'
severity: critical
type: active
tags:
  - ssti
  - injection
  - golang
description: 'golang evaluates payload in page'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      page:
        - '{{.7}}'
    matchers:
      - type: word
        part: body
        words:
          - '7'
