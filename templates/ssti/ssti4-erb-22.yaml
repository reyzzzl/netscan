id: ssti4-erb-22
name: 'SSTI erb in render'
severity: critical
type: active
tags:
  - ssti
  - injection
  - erb
description: 'erb evaluates payload in render'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      render:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
