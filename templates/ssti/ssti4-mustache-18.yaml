id: ssti4-mustache-18
name: 'SSTI mustache in text'
severity: critical
type: active
tags:
  - ssti
  - injection
  - mustache
description: 'mustache evaluates payload in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
