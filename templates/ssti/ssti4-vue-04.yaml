id: ssti4-vue-04
name: 'SSTI vue in view'
severity: critical
type: active
tags:
  - ssti
  - injection
  - vue
description: 'vue evaluates payload in view'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      view:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
