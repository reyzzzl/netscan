id: ssti4-django-17
name: 'SSTI django in layout'
severity: critical
type: active
tags:
  - ssti
  - injection
  - django
description: 'django evaluates payload in layout'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      layout:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
