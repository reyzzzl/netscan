id: ssti4-razor-02
name: 'SSTI razor in content'
severity: critical
type: active
tags:
  - ssti
  - injection
  - razor
description: 'razor evaluates payload in content'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      content:
        - '@(7*7)'
    matchers:
      - type: word
        part: body
        words:
          - '49'
