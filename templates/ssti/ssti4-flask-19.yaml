id: ssti4-flask-19
name: 'SSTI flask in p'
severity: critical
type: active
tags:
  - ssti
  - injection
  - flask
description: 'flask evaluates payload in p'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      p:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
