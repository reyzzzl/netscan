id: ssti4-twig-23
name: 'SSTI twig in t'
severity: critical
type: active
tags:
  - ssti
  - injection
  - twig
description: 'twig evaluates payload in t'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      t:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
