id: ssti3-dot-03
name: 'SSTI dot in text'
severity: critical
type: active
tags:
  - ssti
  - injection
  - dot
description: 'dot evaluates payload in text'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      text:
        - '{{=7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
