id: ssti4-smarty-21
name: 'SSTI smarty in v'
severity: critical
type: active
tags:
  - ssti
  - injection
  - smarty
description: 'smarty evaluates payload in v'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      v:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
