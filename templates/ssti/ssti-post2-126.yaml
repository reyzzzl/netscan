id: ssti-post2-126
name: 'POST SSTI velocity in body'
severity: critical
type: active
tags:
  - ssti
  - injection
  - post
  - velocity
description: 'velocity evaluates POST body on /render'
requests:
  - method: POST
    path: '{{BaseURL}}/render'
    body: '{"body":"{{7*7}}"}'
    sendHeaders:
      Content-Type: 'application/json'
    matchers:
      - type: word
        part: body
        words:
          - '49'
