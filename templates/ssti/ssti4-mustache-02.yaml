id: ssti4-mustache-02
name: 'SSTI mustache in msg'
severity: critical
type: active
tags:
  - ssti
  - injection
  - mustache
description: 'mustache evaluates payload in msg'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      msg:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
