id: ssti4-angular-18
name: 'SSTI angular in out'
severity: critical
type: active
tags:
  - ssti
  - injection
  - angular
description: 'angular evaluates payload in out'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      out:
        - '{{7*7}}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
