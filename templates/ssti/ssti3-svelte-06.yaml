id: ssti3-svelte-06
name: 'SSTI svelte in comment'
severity: critical
type: active
tags:
  - ssti
  - injection
  - svelte
description: 'svelte evaluates payload in comment'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      comment:
        - '{7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
