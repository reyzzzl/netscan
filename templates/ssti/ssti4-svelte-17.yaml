id: ssti4-svelte-17
name: 'SSTI svelte in x'
severity: critical
type: active
tags:
  - ssti
  - injection
  - svelte
description: 'svelte evaluates payload in x'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      x:
        - '{7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
