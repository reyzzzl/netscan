id: ssti2-razor-03
name: 'SSTI2 razor via body'
severity: critical
type: active
tags:
  - ssti
  - injection
  - razor
description: 'razor evaluates payload in body'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      body:
        - '@(7*7)'
    matchers:
      - type: word
        part: body
        words:
          - '49'
