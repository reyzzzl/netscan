id: ssti4-genshi-08
name: 'SSTI genshi in b'
severity: critical
type: active
tags:
  - ssti
  - injection
  - genshi
description: 'genshi evaluates payload in b'
requests:
  - method: GET
    path: '{{BaseURL}}'
    payloads:
      b:
        - '${7*7}'
    matchers:
      - type: word
        part: body
        words:
          - '49'
